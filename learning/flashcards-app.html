<title>Charlie's Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one card at a time, like a paint chip pulled from a fan deck; topic = chip colour. */
:root {
  --bg: #f3f2ee; --surface: #ffffff; --fg: #1d2326; --muted: #5d676c; --line: #dcdcd4;
  --accent: #2f6f62; --accent-fg: #ffffff; --good: #2f7a3d; --bad: #b0412e;
  --chip-skills: #c7832f; --chip-git: #3d6fa3; --chip-ai-os: #2f6f62; --chip-environment: #8a5a9e; --chip-words: #8a7f2a;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --body: "Atkinson Hyperlegible", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15191b; --surface: #1f2528; --fg: #ecefef; --muted: #9aa5aa; --line: #333c40;
  --accent: #5fb3a1; --accent-fg: #0f1a17; --good: #6cc27b; --bad: #ef8a75;
  --chip-skills: #e0a259; --chip-git: #7aa7d8; --chip-ai-os: #5fb3a1; --chip-environment: #c099d3; --chip-words: #cbbd55;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #15191b; --surface: #1f2528; --fg: #ecefef; --muted: #9aa5aa; --line: #333c40;
  --accent: #5fb3a1; --accent-fg: #0f1a17; --good: #6cc27b; --bad: #ef8a75;
  --chip-skills: #e0a259; --chip-git: #7aa7d8; --chip-ai-os: #5fb3a1; --chip-environment: #c099d3; --chip-words: #cbbd55;
  color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font: 17px/1.5 var(--body); padding-inline: 16px; padding-block: 20px 40px }
main { max-width: 560px; margin: 0 auto; display: grid; gap: 20px }
header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap }
h1 { font: 800 1.6rem/1.1 var(--display); margin: 0; text-wrap: balance }
.count { font: 500 .8rem var(--mono); color: var(--muted); letter-spacing: .02em }
.tabs { display: flex; gap: 8px }
.tabs button { font: 700 .9rem var(--body); padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer }
.tabs button[aria-selected="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg) }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: grid; min-height: 300px; grid-template-rows: auto 1fr auto }
.chip { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 16px; color: #fff; font: 500 .75rem var(--mono); letter-spacing: .06em; text-transform: uppercase }
.face { padding: 22px 20px; display: grid; gap: 14px; align-content: center; min-width: 0 }
.q { font: 600 1.35rem/1.3 var(--display); margin: 0; text-wrap: balance }
.a { font-size: 1.05rem; border-top: 1px dashed var(--line); padding-top: 14px; margin: 0 }
.hint { color: var(--muted); font-size: .9rem; margin: 0 }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 16px 16px }
.actions button, .reveal { font: 700 1rem var(--body); padding: 14px; border-radius: 10px; border: 0; cursor: pointer }
.reveal { grid-column: 1 / -1; background: var(--accent); color: var(--accent-fg) }
.miss { background: transparent; color: var(--bad); border: 2px solid var(--bad) !important }
.got { background: var(--good); color: var(--surface) }
.choices { display: grid; gap: 8px }
.choice { text-align: left; font: 400 1rem/1.35 var(--body); padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer }
.choice:disabled { cursor: default; opacity: .7 }
.choice.right { border: 2px solid var(--good); opacity: 1 }
.choice.wrong { border: 2px solid var(--bad); opacity: 1 }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.done, .empty, .note { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px 20px; display: grid; gap: 8px }
.done h2, .empty h2 { font: 800 1.3rem var(--display); margin: 0 }
.done p, .empty p, .note p { margin: 0; color: var(--muted) }
.list { display: grid; gap: 8px }
.row { display: grid; grid-template-columns: 10px 1fr auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px }
.swatch { width: 10px; height: 100%; min-height: 28px; border-radius: 3px }
.row p { margin: 0; min-width: 0 }
.meta { font: 500 .72rem var(--mono); color: var(--muted); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums }
.boxes { display: inline-flex; gap: 3px; vertical-align: middle }
.boxes i { width: 7px; height: 7px; border-radius: 2px; background: var(--line) }
.boxes i.on { background: currentColor }
@media (prefers-reduced-motion: no-preference) { .card { animation: rise .25s ease-out } @keyframes rise { from { transform: translateY(6px) } to { transform: none } } }
</style>

<main>
  <header>
    <h1>Charlie's Flashcards</h1>
    <span class="count" id="count">Loading…</span>
  </header>
  <nav class="tabs" role="tablist">
    <button id="tab-review" role="tab" aria-selected="true">New</button>
    <button id="tab-practice" role="tab" aria-selected="false">Practise all</button>
    <button id="tab-all" role="tab" aria-selected="false">All cards</button>
  </nav>
  <section id="view"></section>
  <div class="note"><p>Pick an answer and see straight away if it's right. Nothing is scored and no card is held back: New shows cards you haven't tried, Practise all goes through every card in a shuffled order.</p></div>
</main>

<script>
const TOPIC_LABEL = { skills: "Skills & plugins", git: "Git & GitHub", "ai-os": "AI OS", environment: "Cloud setup", words: "Words" };
const today = () => new Date().toISOString().slice(0, 10);
const chipColor = (t) => `var(--chip-${TOPIC_LABEL[t] ? t : "ai-os"})`;
const el = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) k === "class" ? e.className = v : k === "style" ? e.style.cssText = v : e.setAttribute(k, v); for (const k of kids) e.append(k); return e; };

let db = null, cards = [], tab = "review", revealed = false, sessionDone = 0, busy = false;
// Multiple-choice state: choices[0] is always the correct answer in the data.
let order = [], shuffledFor = null, picked = null;
let practiceOrder = [], practiceIdx = 0;
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const view = document.getElementById("view"), count = document.getElementById("count");

// A card counts as tried once it has any recorded answer (older cards kept right/wrong counts).
const tried = (c) => c.seen || (c.right || 0) + (c.wrong || 0) > 0;
const lastResult = (c) => c.lastResult || ((c.wrong || 0) > 0 && !(c.right || 0) ? "wrong" : tried(c) ? "right" : null);
function fresh() { return cards.filter(c => !tried(c)).sort((a, b) => a.n - b.n); }
function queue() {
  if (tab !== "practice") return fresh();
  if (practiceOrder.length !== cards.length) { practiceOrder = shuffle(cards.map(c => c.id)); practiceIdx = 0; }
  const c = cards.find(x => x.id === practiceOrder[practiceIdx]);
  return c ? [c] : [];
}

function render() {
  const d = queue();
  count.textContent = cards.length ? `${fresh().length} new · ${cards.length} cards` : "";
  view.replaceChildren();
  if (!db) {
    view.append(el("div", { class: "empty" }, el("h2", {}, "Open this inside Claude"), el("p", {}, "Your cards and progress are stored with this page on claude.ai. Sign in and open the link Claude gave you to start reviewing.")));
    return;
  }
  if (!cards.length) {
    view.append(el("div", { class: "empty" }, el("h2", {}, "No cards yet"), el("p", {}, "Claude adds cards here as you learn. Ask Claude to sync your flashcards.")));
    return;
  }
  if (tab === "all") {
    const list = el("div", { class: "list" });
    for (const c of [...cards].sort((a, b) => a.n - b.n)) {
      const r = lastResult(c);
      list.append(el("div", { class: "row" },
        el("span", { class: "swatch", style: `background:${chipColor(c.topic)}` }),
        el("p", {}, c.q),
        el("span", { class: "meta", style: `color:${r === "right" ? "var(--good)" : r === "wrong" ? "var(--bad)" : "var(--muted)"}` }, r === "right" ? "✓ Right" : r === "wrong" ? "✗ Wrong" : "Not tried")));
    }
    view.append(list);
    return;
  }
  if (!d.length) {
    const msg = tab === "practice" ? "You've been through every card." : "No new cards.";
    view.append(el("div", { class: "done" }, el("h2", {}, sessionDone ? `${msg} ${sessionDone} answered.` : msg),
      el("p", {}, tab === "practice" ? "Tap Practise all again for a fresh shuffle." : "Tap Practise all to go through everything again, any time.")));
    return;
  }
  const c = d[0];
  const card = el("article", { class: "card", "aria-live": "polite" },
    el("div", { class: "chip", style: `background:${chipColor(c.topic)}` }, el("span", {}, TOPIC_LABEL[c.topic] || c.topic || "Card"), el("span", {}, `#${c.n}`)),
    el("div", { class: "face" }, el("p", { class: "q" }, c.q),
      revealed ? el("p", { class: "a" }, c.a) : el("p", { class: "hint" }, "Say the answer out loud first, then check.")),
    el("div", { class: "actions" }));
  const actions = card.querySelector(".actions");
  if (Array.isArray(c.choices) && c.choices.length) {
    // Multiple choice: options are shuffled once per showing of the card.
    if (shuffledFor !== c.id) { order = shuffle(c.choices.map((_, i) => i)); shuffledFor = c.id; picked = null; }
    const face = card.querySelector(".face");
    face.lastChild.remove();
    const list = el("div", { class: "choices" });
    order.forEach((i, k) => {
      const b = el("button", { class: "choice", id: `choice-${k}` }, c.choices[i]);
      if (picked !== null) { b.disabled = true; if (i === 0) b.classList.add("right"); else if (i === picked) b.classList.add("wrong"); }
      b.onclick = () => { picked = i; render(); };
      list.append(b);
    });
    face.append(list);
    if (picked !== null) {
      face.append(el("p", { class: "a" }, (picked === 0 ? "Right. " : "Not quite. ") + c.a));
      const next = el("button", { class: "reveal", id: "next" }, "Next card");
      next.onclick = () => { const ok = picked === 0; picked = null; shuffledFor = null; grade(c, ok); };
      actions.append(next);
    }
  } else if (!revealed) {
    const r = el("button", { class: "reveal", id: "reveal" }, "Show answer");
    r.onclick = () => { revealed = true; render(); };
    actions.append(r);
  } else {
    const miss = el("button", { class: "miss", id: "miss" }, "Missed it");
    const got = el("button", { class: "got", id: "got" }, "Got it");
    miss.onclick = () => grade(c, false); got.onclick = () => grade(c, true);
    actions.append(miss, got);
  }
  view.append(card);
}

// No scoring or penalties (Charlie's choice): an answer only records whether
// the last pick was right, so the All cards list can show it.
async function grade(c, ok) {
  if (busy) return; busy = true;
  const patch = { seen: true, lastResult: ok ? "right" : "wrong", last: today() };
  if (tab === "practice") { practiceIdx++; }
  try { await db.doc("cards/" + c.id).update(patch); Object.assign(c, patch); sessionDone++; }
  catch (e) { count.textContent = "Couldn't save that answer. Check you're signed in, then try again."; }
  revealed = false; busy = false; render();
}

for (const [id, name] of [["tab-review", "review"], ["tab-practice", "practice"], ["tab-all", "all"]]) {
  document.getElementById(id).onclick = () => { tab = name; if (name === "practice") practiceOrder = []; sessionDone = 0; picked = null; shuffledFor = null; revealed = false; document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.id === id))); render(); };
}

render();
(async () => {
  db = await window.claude?.use?.("db") ?? null;
  if (!db) { render(); return; }
  db.collection("cards").onSnapshot(snap => {
    cards = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, () => { db = null; render(); });
})();
</script>
