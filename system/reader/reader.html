<style>
/* Layout: the Hands Brain's dark glass look. A row of document chips, then one
   readable column: "in short" box, the document, and a sticky answer button. */
:root{
  --bg:#05070d; --panel:rgba(12,17,28,.86); --solid:#0d1320; --text:#e8ecf4; --soft:#c9d2e3; --muted:#8b94a8;
  --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.16); --accent:#38bdf8; --gold:#fbbf24; --good:#34d399;
  --display:'Archivo','DM Sans',system-ui,sans-serif; --font:'DM Sans',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  --radius:14px; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.65 var(--font);
  background-image:radial-gradient(1100px 560px at 80% -10%,rgba(56,189,248,.10),transparent 60%),radial-gradient(800px 480px at -10% 40%,rgba(167,139,250,.07),transparent 60%);background-attachment:fixed}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(5,7,13,.92);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
.top .in{max-width:820px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font:800 17px var(--display);display:flex;gap:8px;align-items:center;margin-right:6px}
.brand i{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:600 13px var(--font);border:1px solid var(--line-strong);background:transparent;color:var(--muted);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.wrap{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:26px 120px}
.eyebrow{font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.short{background:var(--panel);border:1px solid var(--line-strong);border-left:3px solid var(--gold);border-radius:var(--radius);padding:14px 18px;margin:14px 0 22px}
.short h2{font:800 16px var(--display);margin:0 0 6px;color:var(--gold)}
.short ul{margin:0;padding-left:20px;display:grid;gap:6px;color:var(--soft)}
article h1{font:800 clamp(28px,6vw,40px)/1.08 var(--display);margin:6px 0 14px;text-wrap:balance}
article h2{font:800 22px/1.2 var(--display);margin:34px 0 10px;padding-top:14px;border-top:1px solid var(--line);text-wrap:balance}
article h3{font:600 18px var(--display);margin:24px 0 8px}
article p,article li{color:var(--soft);max-width:68ch}
article strong{color:var(--text)}
article a{color:var(--accent)}
article ul,article ol{padding-left:22px;display:grid;gap:6px}
article code{font:.85em var(--mono);background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:5px;padding:1px 5px;overflow-wrap:anywhere}
article pre{background:var(--solid);border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto}
article pre code{background:none;border:0;padding:0}
article blockquote{margin:12px 0;padding:8px 14px;border-left:2px solid var(--accent);color:var(--soft);font-style:italic}
.tbl{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.tbl table{border-collapse:collapse;width:100%;font-size:15px;min-width:520px}
.tbl th,.tbl td{text-align:left;padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
.tbl th{font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-top:0}
.tbl td:first-child{color:var(--text);font-weight:600}
.rec{background:rgba(52,211,153,.13);color:var(--good);border-radius:5px;padding:0 5px;font-weight:600}
.cta{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(5,7,13,.96) 35%);display:flex;justify-content:center;pointer-events:none}
.cta a{pointer-events:auto;font:700 15px var(--font);background:var(--gold);color:#1a1300;text-decoration:none;border-radius:12px;padding:12px 20px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.meta{font:12px var(--mono);color:var(--muted)}
.empty{color:var(--muted);border:1px dashed var(--line-strong);border-radius:12px;padding:18px}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>

const D = {"docs": [{"path": "brainstorms/2026-10-09-middle-plans.md", "label": "The middle: two plans", "card": "middle-go", "md": "# The \"middle\": two plans to talk through (2026-10-09)\n\nCharlie answered two Desk cards that change the routing: **elder-names: by\njob** and **youtube-ingest: yes, one skill**. He wanted to talk through \"the\nmiddle\" before anything changes, so nothing below is built yet. One Desk card\n(\"middle-go\") asks whether to go ahead. Background: `2026-10-09-charlies-thoughts.md`\nsections B, C, D; `research/council-plan.md`.\n\n## What the end-to-end test adds (`audits/evidence/2026-10-09-end-to-end/`)\nThe router → brain → answer path works today in a fresh Claude session (2 hops,\nquote checked). So renaming is safe **only if every route still lands**: the\nsame test is the check after each plan. It also found a gap for the\nmodel-routing talk: no written rule for stepping up to a stronger model.\n\n## Plan 1: name the elders by their job\n**The picture:** head = the router (`AGENTS.md`); **middle = the council**,\nwhere the brains meet and give a recommendation; hands = skills, scripts,\nroutines; Charlie = the Chief, who decides.\n\n| Elder | Is today | Holds | Agent |\n|---|---|---|---|\n| **Architect** | ENATE (`nate-brain`, `research/nate-herk/brain/`) | how to build and run the OS; Nate's voice | `architect` |\n| **Quartermaster** | Hands Brain (`hands-brain`, `research/hands/`) | what kit to use now, from any source | `quartermaster` |\n| **Maker** | (new) Boris Cherny | how Claude Code is meant to be used | later, after research |\n| **Teacher** | Karpathy (parked) | first principles, learning | later |\n| **Guardian** | (new) a role, not a person | two checklists: \"is it true and does it work?\" (audit) and \"is it safe?\" (security, privacy, public repo) | later |\n| **Builder** | Nick (parked) | building and shipping | parked |\n\n**Smallest first (one session, about 45 minutes):**\n1. Rename the two that exist, **names eator` (new person).\n\n**Smallest first (one session, about an hour):**\n1. Write `.claude/skills/youtube-ingest/SKILL.md` (about 40 lines) by moving\n   the steps above word for word; **no script changes**.\n2. Shorten the three skills to \"get the videos with `youtube-ingest`, then…\".\n3. Test: re-run last week's ingest (W41 of the show, and the 4 Nate gap videos\n   in `research/nate-herk/triage.md`) through the new skill; the week file and\n   triage file must come out the same (`git diff` empty apart from dates).\n4. Router: one line (\"Get YouTube videos into any brain → `youtube-ingest`\");\n   capability map row; audit.\n\n## Questions for the talk (my recommended answer first)\n1. **Go ahead with both as written?** Recommended: yes, Plan 2 first (no\n   renames, easy test), then Plan 1.\n2. **Keep the folders where they are?** Recommended: yes; names change, paths don't.\n3. **Rename the Decision Desk?** If \"the desk\" means the Mac workspace, the\n   Desk could become \"the Chief's Desk\" (you are the Chief). Recommended: yes,\n   title only, same link.\n4. **Model routing** (ChatGPT's prompt) stays a separate talk after these two.\n", "mins": 4, "summary": ["Plan 1: give the brains job titles. ENATE becomes the Architect, the Hands Brain the Quartermaster. Names only; folders and links stay.", "Plan 2: one skill fetches YouTube videos for every brain, instead of the same steps copied into three skills.", "Recommended: do Plan 2 first (nothing gets renamed, easy to test), then Plan 1. Each is about one session."]}, {"path": "context/todo.md", "label": "Everything unfinished", "card": null, "md": "# Everything unfinished (one list, so nothing gets forgotten)\n\nWritten 2026-10-09 from `current-focus.md`, the hand-off, the Desk, Mac day,\nChatGPT's hand-off and the battle test. The priority still lives only in\n`current-focus.md`; this is the full list behind it. Tick items off by\ndeleting them (history stays in `decisions.md`).\n\n## Needs Charlie (Decision Desk or a setting only he can change)\n- [ ] Desk: **missed Friday audit** (run now / wait / move later)\n- [ ] Desk: **middle-go** (one YouTube ingester, elder names by job)\n- [ ] Desk: **journey video style** (Mix recommended; Terminal is his favourite)\n- [ ] claude.ai settings: switch off 9 unused built-in skills (built-in-browser, chrome-browser, computer-use, import-memory, morning, docx, xlsx, pptx, pdf)\n- [ ] Add the Higgsfield connector (`https://mcp.higgsfield.ai/mcp`) and finish Canva's sign-in; then Claude makes one test image (cost said first)\n- [ ] Voice Gym: rewrite 5 or more messages; then Claude writes his voice notes into `aios-intake.md` Q2\n- [ ] Check ChatGPT accepts the longer instructions box (`exports/chatgpt-instructions.md`, box 2 is about 2,000 characters)\n- [ ] Confirm or change Claude's \"where this is heading\" theory for `current-focus.md`\n\n## Next to build (in order, after the Desk answers)\n1. [ ] Whatever \"middle-go\" picks: one `youtube-ingest` skill, then elder names (`brainstorms/2026-10-09-middle-plans.md`), re-running the end-to-end test after any rename\n2. [ ] Model comparisons on real work before any helper goes back to a cheaper model (`system/model-usage.md`); add the missing \"step up to the stronger model\" rule\n3. [ ] Journey video: improve the chosen style, then a proper video file with voice-over\n4. [ ] The council (Nate's voice first; research Boris Cherny as \"the Maker\")\n5. [ ] Anthropic's plugin marketplace as the Hands Brain's next source\n6. [ ] Set-up kit (paused): first friend or family set-up from plan v0.4\n7. [ ] First YouTube short\n\n## Waiting for the Mac (`context/mac-day.md`, starts when Charlie says \"I'm on Mac\")\n- [ ] Clone the repo; Obsidian; Nate's 3D brain; context7 and superpowers plugins\n- [ ] **Codex test**: same 5 rulebook questions, every skill listed, the three Codex fallbacks, what Codex blocks\n- [ ] `/doctor` on the Mac; optional FreeLLMAPI trial only if limits keep stopping sessions\n\n## Small tidy-ups (Claude can do these; offered, not yet agreed)\n- [ ] One home page linking every page\n- [ ] Refresh the Watch Path and the two oldest lessons (they still name `MISSION.md`, `NOTES.md`)\n- [ ] Mark Kit Compare as decided; the round Brain map\n- [ ] Review the Corey Haines research another session added (`research/corey-haines/`) and log it\n- [ ] Triage Nate's Grok Bot video (MgvwZaDPCs4) before ChatGPT's routing prompt is run\n- [ ] ENATE: link Rules 2 and 3 with concepts 19 and 28\n- [ ] Hands Brain: the 35 tools with unknown prices (step 3 of `research/hands/improvement-plan.md`, not chosen)\n\n## Watch-outs (things running on their own)\n- [ ] \"Weekly Hands Brain update\" runs Saturdays at 8:47am: the same early time that hit the usage limit on Friday\n- [ ] \"Flashcard check\" still runs every evening although flashcards are parked: pause it?\n- [ ] Two sessions editing at once caused clashes today: close sessions when they finish\n\n## Parked by choice (don't start without Charlie)\nNick Saraev work; flashcards; Karpathy brain; Dan Martell; the decorators'\nFacebook post and an unlisted test video; vidIQ (after 5 videos) and Canva\nthumbnails (after 3); the decorating business; Nate-channel audit's 8 older\ndecisions (`audits/2026-10-08-nate-channel.md`); `tools/` → `scripts/` rename.\n", "mins": 3, "summary": []}, {"path": "research/council-plan.md", "label": "The council plan", "card": null, "md": "# The council of elders (plan, 2026-10-09)\n\nCharlie's idea: once the brains hold enough, each one has a **voice**, and\nhe can ask them side by side, see where they agree and where they don't,\nthen decide. It grows out of the parked \"council\" (Nick, Nate, Karpathy) in\n`context/current-focus.md`.\n\n## The members (now)\n| Member | Knows | Voice file | State |\n|---|---|---|---|\n| ENATE (Nate Herk) | How to build and run an AI OS | `nate-herk/brain/rules.md` (rules with quotes) | Ready; voice file to write |\n| The Next New Thing | Which tools are worth it this week | `hands/voices/the-next-new-thing.md` | **Pilot**: 1 video |\n| Charlie | What he actually needs, in his words | `aios-intake.md` Q2 (from the Voice Gym) | Waiting on his practice rewrites |\n| Nick Saraev | Building and shipping | `nick-saraev/brain/` | Parked |\n| Karpathy | Learning and first principles | transcripts saved | Parked |\n\n## What a voice file holds (same shape for every member)\n1. **What they value** when judging something, each with a verbatim quote.\n2. **Red flags** they warn about.\n3. **How they decide** whether they'd use it.\n4. **Where they differ** from the other members.\n\n## Steps (smallest first)\n1. Pilot the Next New Thing's voice on its newest video, with an\n   `opinion` (theirs) and `our_view` (ours) on every tool. **In progress.**\n2. If the pilot is useful, add opinions to every video, newest first, back to W38.\n3. Write ENATE's voice file from its rules (no new videos needed).\n4. Charlie's voice file once the Voice Gym has 5 or more rewrites.\n5. A `council` skill: one question to every member, each answering only from\n   its own sources (quotes, or labelled \"inferring\"), then a table of where\n   they agree and where they don't, and a recommendation. Charlie decides.\n6. Un-park Nick and Karpathy only when the set-up kit work allows it.\n", "mins": 1, "summary": []}, {"path": "system/model-usage.md", "label": "How we choose models", "card": null, "md": "# Model usage — quality first, then lower usage\n\nCharlie's policy, 2026-10-09. This extends the existing router; it is not a\nnew routing service or a claim that automatic model switching is installed.\n\n## Choose before delegating\n1. Keep the user's main model. Use a deterministic script for exact counts,\n   filtering, file checks or transformations when one already does the job.\n2. Define the output and its acceptance checks before choosing a worker.\n   Retrieve only the sources needed; do not load whole brains or full chats.\n3. Default unproven delegations to the main model (`inherit` in active Claude\n   agent definitions). A cheaper candidate is a trial until it has evidence\n   for that task class, source conditions and model version. Verify the actual\n   model selected by the host; aliases and configuration can change it.\n4. Complex synthesis, architecture, ambiguous tasks and decisions with serious\n   consequences stay with the strongest configured available model. Do not\n   quietly change the user's main model, bypass a model allowlist or invent\n   access to a provider. If the strong model is unavailable, save the state\n   and mark the task blocked; do not silently lower the quality bar.\n\n## Acceptance, escalation and promotion\n- Compare candidate and strongest available baseline using the same inputs,\n  context, permissions and acceptance criteria. The baseline also has to pass\n  source/tests-based checks; agreement alone does not prove correctness.\n- All critical checks must pass: source accuracy, required completeness,\n  usable output format, uncertainty handling and instruction boundaries.\n  For prose, match required quality rather than identical wording.\n- A candidate's missed critical check, unsupported assertion, lost requirement\n  or worse usable result rejects that result. Escalate the failed task to the\n  strong model with the original evidence and a compact failure description.\n  Validate that output too. A permissions or missing-source failure is not\n  repaired by paying for a stronger model: resolve or report that blocker.\n- At most one candidate attempt and one strong recovery by default; no retry\n  loops or multi-model panels. A transient tool failure may get one bounded\n  retry if useful, recorded separately from reasoning failure.\n- Before making a cheaper route normal, pass a predeclared representative\n  held-out set including difficult, missing-data and failed-tool cases.\n  Record inputs, model/version/effort, outputs, checks and failures. Critical\n  failures mean no promotion; narrow the scope or retain the strong model.\n- Compare total workflow usage: worker + checker + retries + integration;\n  record tokens/cost, latency and human corrections where exposed. Unknown\n  metrics stay unmeasured. Do not claim savings without observations.\n- Recheck after model, skill, prompt or source changes; suspend a route after\n  a quality regression. Restore the previous proven route without losing work.\n\n## Fan-out and fan-in\nUse one lead by default. Start with at most two helpers for independent,\nsubstantial, checkable tasks; this is a conservative starting limit, not a\nmeasured optimum. Increase only with a concrete benefit, budget and separate\nownership, within the host's limits. Simple lookups and dependent steps stay\nsequential. Each helper gets task, minimal sources, constraints, output shape\nand finish check; no helpers spawning more helpers by default.\n\nOne lead integrates all outputs, checks citations and contradictions, flags\nmissing or failed pieces, and writes shared files once. Do not treat a set of\nplausible worker answers as a checked final answer. Stop work that is no longer\nneeded and preserve a short handoff when limits approach.\n\n## Current evidence and next trial\n`audits/evidence/2026-10-09-usage-pilot/`: one fixed-input extraction case;\ngpt-6-luna and gpt-6-astra, medium reasoning, each matched all nine expected\nfields. No tools used. This is a smoke test, not nine independent tasks or a\nproduction approval. Costs, tokens and controlled latency are unmeasured.\nNo cheaper production route has been promoted by this test.\n\nNext use `try-tool` on held-out real extraction/retrieval jobs against the\nstrong baseline. FreeLLMAPI needs a separate explicit-provider trial, current\nterms and working credentials. Do not enable untested automatic fallback.\nThe current review is `research/hands/reviews/freellmapi-2026-10-09.md`.\n\nClaude configuration source, checked 2026-10-09:\nhttps://code.claude.com/docs/en/sub-agents#choose-a-model . `inherit` uses the\nmain model; per-invocation choices/configuration can affect selection. This\nsession has not verified actual Claude model resolution after these edits.\n", "mins": 3, "summary": []}], "desk": "https://claude.ai/artifact/R7efnQ6QZtGKVsyV1fCuxx"};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function show(i){
  cur = i; try { localStorage.setItem("reader-doc", i); } catch(e) {}
  const d = D.docs[i];
