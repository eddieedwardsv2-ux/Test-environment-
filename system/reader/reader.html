<style>
/* Layout: the Hands Brain's dark glass look. A row of document chips, then one
   readable column: "in short" box, the document, and a sticky answer button. */
:root{
  --bg:#05070d; --panel:rgba(12,17,28,.86); --solid:#0d1320; --text:#e8ecf4; --soft:#c9d2e3; --muted:#8b94a8;
  --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.16); --accent:#38bdf8; --gold:#fbbf24; --good:#34d399;
  --display:'Archivo','DM Sans',system-ui,sans-serif; --font:'DM Sans',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  --radius:14px; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.65 var(--font);
  background-image:radial-gradient(1100px 560px at 80% -10%,rgba(56,189,248,.10),transparent 60%),radial-gradient(800px 480px at -10% 40%,rgba(167,139,250,.07),transparent 60%);background-attachment:fixed}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(5,7,13,.92);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
.top .in{max-width:820px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font:800 17px var(--display);display:flex;gap:8px;align-items:center;margin-right:6px}
.brand i{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:600 13px var(--font);border:1px solid var(--line-strong);background:transparent;color:var(--muted);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.wrap{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:26px 120px}
.eyebrow{font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.short{background:var(--panel);border:1px solid var(--line-strong);border-left:3px solid var(--gold);border-radius:var(--radius);padding:14px 18px;margin:14px 0 22px}
.short h2{font:800 16px var(--display);margin:0 0 6px;color:var(--gold)}
.short ul{margin:0;padding-left:20px;display:grid;gap:6px;color:var(--soft)}
article h1{font:800 clamp(28px,6vw,40px)/1.08 var(--display);margin:6px 0 14px;text-wrap:balance}
article h2{font:800 22px/1.2 var(--display);margin:34px 0 10px;padding-top:14px;border-top:1px solid var(--line);text-wrap:balance}
article h3{font:600 18px var(--display);margin:24px 0 8px}
article p,article li{color:var(--soft);max-width:68ch}
article strong{color:var(--text)}
article a{color:var(--accent)}
article ul,article ol{padding-left:22px;display:grid;gap:6px}
article code{font:.85em var(--mono);background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:5px;padding:1px 5px;overflow-wrap:anywhere}
article pre{background:var(--solid);border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto}
article pre code{background:none;border:0;padding:0}
article blockquote{margin:12px 0;padding:8px 14px;border-left:2px solid var(--accent);color:var(--soft);font-style:italic}
.tbl{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.tbl table{border-collapse:collapse;width:100%;font-size:15px;min-width:520px}
.tbl th,.tbl td{text-align:left;padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
.tbl th{font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-top:0}
.tbl td:first-child{color:var(--text);font-weight:600}
.rec{background:rgba(52,211,153,.13);color:var(--good);border-radius:5px;padding:0 5px;font-weight:600}
.cta{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(5,7,13,.96) 35%);display:flex;justify-content:center;pointer-events:none}
.cta a{pointer-events:auto;font:700 15px var(--font);background:var(--gold);color:#1a1300;text-decoration:none;border-radius:12px;padding:12px 20px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.meta{font:12px var(--mono);color:var(--muted)}
.empty{color:var(--muted);border:1px dashed var(--line-strong);border-radius:12px;padding:18px}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>

ication range |\n|---|---:|---:|---:|---|\n| Kurzgesagt | 25.70M | 6.85M | 3.21% | Mar 10, 2026–Sep 22, 2026 |\n| Veritasium | 21.30M | 6.55M | 2.51% | May 3, 2026–Sep 21, 2026 |\n| 3Blue1Brown | 8.68M | 1.55M | 3.11% | Sep 18, 2025–Sep 18, 2026 |\n| Fireship | 4.29M | 2.35M | 1.34% | Aug 27, 2026–Sep 21, 2026 |\n| Nate Herk | 1.06M | 71K | Unavailable | Sep 9, 2026–Sep 19, 2026 |\n| Matt Wolfe | 1.02M | 156K | Unavailable | Aug 26, 2026–Sep 22, 2026 |\n| AI Explained | 0.46M | 119K | 3.81% | May 29, 2026–Sep 16, 2026 |\n\nSources: [Kurzgesagt](https://prepublish.ai/youtube-channel/kurzgesagt), [Veritasium](https://prepublish.ai/youtube-channel/veritasium), [3Blue1Brown](https://prepublish.ai/youtube-channel/3blue1brown), [Fireship](https://prepublish.ai/youtube-channel/fireship), [Nate](https://prepublish.ai/youtube-channel/nateherk), [Matt](https://prepublish.ai/youtube-channel/mreflow), [AI Explained](https://prepublish.ai/youtube-channel/aiexplained-official). Interaction snapshots: SPEAKRJ URLs retained with each matched row in [sample data](2026-10-12-brand-engagement-sample.json).\n\nSelection: latest ten listed non-Shorts uploads dated on/before 22 September 2026, excluding videos over two hours. The cutoff avoids extremely fresh uploads at the oldest provider snapshot. Ages still vary widely: 3Blue1Brown's sample extends back a year. Views are rounded provider values; interactions use their own same-snapshot numerator and denominator. Nate/Matt interaction data was inaccessible, not zero. This is a consistent format/count comparison, **not a fully age-matched engagement benchmark**. Different topic markets and sampling coverage also limit cross-brand ranking.\n\nAll seven have ten selected records (70 total); five have ten matched interaction records (50 total). Video IDs are missing: title/date/count matching is provisional. We manually distinguished 3Blue1Brown's same-title/same-date Short and full video. Do not promote these rankings to verified facts without video-ID and current-source checks.\n\n## Observations and draft hypotheses\n\n- **Nate:** saved Karpathy teaching demonstrates defining a finish line, building a small example, predicting, running and comparing; his OS teaching routes to situational context. Use outcome-first practical demonstration. Sources: [Karpathy example, 8:05](https://www.youtube.com/watch?v=bvGptCLDhyo&t=485s), [router, 12:46](https://www.youtube.com/watch?v=Ek1NBfnnTH0&t=766s).\n- **Fireship:** one inspected [caption source](https://prepublish.ai/youtube-transcript/FluKUJyeYD8) combines topical narration with jokes and a fast sequence of examples. Proposed use: tighter openings and economical transitions. Do not copy its insults, medical jokes, catchphrases or treat speed as a proven retention cause.\n- **3Blue1Brown:** [neural-network captions](https://prepublish.ai/youtube-transcript/aircAruvnKk) begin with recognising a handwritten digit; the [official attention lesson](https://www.3blue1brown.com/lessons/attention) carries a concrete language example through diagrams, questions and caveats. Proposed use: one example develops with the explanation.\n- **Kurzgesagt:** [asteroid captions](https://prepublish.ai/youtube-transcript/dKm7T13X7n4) use a concrete scenario, scale comparisons, unsuccessful approaches and a revised solution. Its [official site](https://kurzgesagt.org/) describes illustration/animation for approachable complex topics. Proposed use: scenario and mechanism, without manufacturing disaster stakes.\n- **Matt Wolfe:** one [interview caption source](https://prepublish.ai/youtube-transcript/S2VJU5DQqlU) moves from a striking capability to what it does, who uses it, costs and an on-screen walkthrough described in speech. Proposed use: connect a tool to a real job and ask practical questions. This is not proof of its actual visuals.\n- **Veritasium:** its [official site](https://www.veritasium.com/) describes experiments, interviews and demos. A [third-party script comparison](https://prepublish.ai/breakdowns/veritasium) suggests concrete stakes as a hypothesis; the comparison is observational and not independently replicated here.\n- **AI Explained:** sampled titles frame documents, evidence and uncertainty; actual caption retrieval of a selected recent video failed. Treat its detailed script habits as unconfirmed, rather than inventing them from titles.\n\nThese observations are limited examples, not comprehensive creator voice analyses. No motion/thumbnail inspection completed. Colour, typography and layouts below are Charlie's proposed design choices, not extracted brand specifications.\n\n## Shared rules for every guide\n\nAudience: a UK beginner learning to use AI for real work. Start with why this matters to the reader. Prefer concrete nouns and verbs; explain terms when needed. Use paragraphs of two to four connected sentences for articles; lists only for true steps or comparisons. Preserve nuance, never use an arbitrary word/line limit to delete necessary information.\n\nState what was observed, inferred and remains unknown. Link significant facts to sources. Label invented demonstrations and illustrative data. Never say we tested, measured or saved something without a receipt. Headlines must deliver the promised answer. Avoid invented credentials, revenue claims and guaranteed outcomes.\n\nVisuals must explain a relationship, process or result. No decorative node cloud as proof of a working system. Use real screenshots for real products. Charts require units, dates and source notes. Text should remain readable on a phone, meaning must not depend on colour alone, and motion should have a reduced-motion alternative.\n\n## Draft 1 — Practical teacher\n\n**Purpose:** help a beginner complete one useful task. Default candidate for setup lessons and workflow tutorials.\n\n**Voice:** warm, direct and specific. Speak as a capable colleague. Brief explanation, then show what to do and how to check it. One light aside is enough; do not make the learner the joke.\n\n**Structure:** the problem and desired result → worked example → steps and reasons → actual check → next action. Show a failure only when it teaches the mechanism.\n\n**Visual proposal:** light warm background, near-black text and one blue accent. Clear numbered steps, one screenshot crop per step, highlight the exact control or changed result. Prefer a human-readable file path over a crowded architecture map.\n\n**Article adaptation:** lead with the task, include a worked example and a short finish-line checklist. **Short-video adaptation:** show the intended result first, then one main operation and its check. **Carousel adaptation:** one operation per slide; finish with a usable prompt or checklist.\n\n**Same-topic example:**\n> If your AI keeps missing notes you've already saved, start by checking where it looked. A short index can point it towards the right project, but the test is whether a new session finds the correct note and shows its source. Pick one question with a known answer, run it, and record what it reads.\n\n**Reusable instruction:**\nWrite for a beginner completing [task]. Explain the useful result, demonstrate a worked example, give the necessary steps and show how to check success. Use plain UK English and connected prose. Separate actual results from suggested tests. Finish with one next action.\n\n**Review:** can the reader act without guessing a missing step? Does the check measure the outcome rather than repeat the instructions? Is any time/cost promise evidenced?\n\n## Draft 2 — Visual explainer\n\n**Purpose:** make an unfamiliar mechanism understandable. Candidate for routers, agents, second brains and workflow diagrams.\n\n**Voice:** curious, calm and clear. Begin with a concrete situation, introduce one analogy, then explain exactly where the analogy stops. Build complexity gradually.\n\n**Structure:** familiar example → useful mental picture → mechanism → complication → practical implication. Reuse the same example rather than changing subjects each paragraph.\n\n**Visual proposal:** ink-coloured background, white labels, cyan for retrieval and amber for decisions. Consistent colours represent consistent roles; also use labels/shapes. Draw a few meaningful elements and reveal changes gradually. Avoid copying another creator's characters or diagram styling.\n\n**Article adaptation:** one central diagram and connected explanatory prose. **Video adaptation:** synchronise narration with the state being shown; pause after introducing a new relationship. **Slides adaptation:** retain stable object positions across successive frames.\n\n**Same-topic example:**\n> Imagine asking a librarian for one book and receiving the entire library. An AI knowledge system faces a similar problem when it loads a whole folder for a small question. The index acts as a map: it points to the relevant shelf, while the source note supplies the evidence. The map helps only if its pointers still work.\n\n**Reusable instruction:**\nExplain [mechanism] through one concrete example. Build from the familiar situation to the actual mechanism, flag the limits of any analogy and suggest one diagram that would make the explanation clearer. Use calm UK English. End with a practical implication.\n\n**Review:** can someone explain the mechanism afterwards? Do diagram labels match the explanation? Does every animation communicate a change? Is the analogy accurate enough for this audience?\n\n## Draft 3 — Evidence-led analyst\n\n**Purpose:** help someone choose what to trust or test. Candidate for model/tool comparisons, research briefings and business decisions.\n\n**Voice:** measured, curious and willing to disagree. A strong opening identifies a concrete uncertainty; it does not manufacture controversy.\n\n**Structure:** decision/question → evidence → alternative explanation → limits → recommendation → test. Keep evidence and interpretation visibly distinct.\n\n**Visual proposal:** warm white background, dark text, restrained teal accents. Compact comparison tables, readable source/date notes and labelled confidence or status. Use amber for unresolved questions with a written label. Avoid fake precision, dramatic scorecards and meaningless rankings.\n\n**Article adaptation:** answer first, then support and limitations. **Video adaptation:** show the test input and result alongside the claim. **Briefing adaptation:** what changed, why it matters and the smallest worthwhile trial.\n\n**Same-topic example:**\n> A tidy knowledge base can still return the wrong answer. To judge whether the structure helps, give two setups the same questions and check their answers against known sources. Record accuracy and what each reads; measure usage only when the account exposes it. A shorter response alone tells us little about whether retrieval improved.\n\n**Reusable instruction:**\nHelp decide [question]. Lead with the provisional conclusion, identify supporting evidence and the strongest alternative explanation, state the limits, and recommend one measurable test. Use clear UK English. Distinguish observed facts from inference and missing data.\n\n**Review:** is the conclusion proportional to the evidence? Are comparators fair? Are missing data shown as missing? Could another explanation account for the apparent improvement?\n\n## How to choose and apply\n\nRecommendation: use Practical teacher as the initial candidate for beginner lessons; Visual explainer for mechanisms; Evidence-led analyst for comparisons. This is an editorial recommendation, not a tested engagement prediction.\n\nKeep these as selectable guides in a project/voice file. Retrieve only the chosen guide plus necessary brand/project context. Do not load all three into every task or install a framework for them. The capability map already provides creator research, ingestion and writing routes; no paid service or new plugin is needed for these briefs.\n\nNext validation: use the same verified topic and facts to produce one 250-word article and one 45–60-second script in each direction. Ask a small group of beginners to identify the main point, explain the mechanism and choose the next action. Record their answers. Revise confusing passages before measuring real published performance. If later published, record retention and interactions within the same format/time window; do not attribute differences to voice alone.\n\n## Status\n\nResearch sample and three concrete briefs exist. No full brand identity selected; no guide activated; no publishing or installs performed. Public metrics remain provisional (missing IDs, varying ages/snapshots, two missing interaction datasets). Visual brand analysis, full seven-brand caption review and independent Guardian review are outstanding. Workspace audit/page rebuild unavailable after the earlier usage-limit review failure; no claim those checks ran here.\n\n**NOT VERIFIED** — strongest-brand ranking, causal engagement benefit and runtime output quality. Drafts are ready for Charlie to compare as proposals.\n", "mins": 9, "summary": []}, {"path": "brainstorms/2026-10-12-style-guide-test-drafts.md", "label": "All nine style tests", "card": null, "md": "# Style-guide trial: nine articles and nine scripts\n\nAll scenarios are invented teaching examples. No real beginner responses collected yet.\n\n## Topic 1\n\n### Practical teacher — Help AI find the current note\n\n#### Article\n\nIf AI gives you an old answer when the current note is already saved, check the route it followed. Start with one question whose answer you know, rather than reorganising the whole knowledge base. That gives you a clear way to judge whether it found the right evidence.\n\nIn this fictional example, the main router points to projects/example/index.md. The project index points to policy-current.md and policy-archived.md. The current document was updated on 10 October and requires review before sending a draft. The archived document was updated on 1 September and is marked obsolete. Your question asks for the current review requirement, so policy-current.md must supply the answer.\n\nAsk AI to show the route from the main router, through the project index, to the current document. Then ask it to state the requirement and cite that file. You should be able to see both where the answer came from and why that source applies. A citation to the archived file would still be the wrong answer.\n\nThe index helps direct the search, but it does not prove the answer is correct. Check that its links work and that the selected document is current. This question does not require loading the entire knowledge base, although the example proves neither a token saving nor guaranteed accuracy.\n\nYour next action is to ask AI for its route and source, then check the document's status. Keep the question small enough that you can recognise the correct result yourself.\n\n#### Spoken script\n\nIf AI misses a note you've saved, ask where it looked. In this fictional example, the main router points to projects/example/index.md. That index lists policy-current.md, updated 10 October, and policy-archived.md, updated 1 September and marked obsolete. The current rule requires review before sending a draft. Ask AI to follow the router, open the index, select policy-current.md and cite it in the answer. Then check the links and the document's status. An index points towards evidence; it does not prove accuracy. This question needs neither the entire knowledge base nor a promise of token savings. Your next action: ask for the route and source, then check that it selected the current policy.\n\n### Visual explainer — A map to the right shelf\n\n#### Article\n\nImagine asking a librarian for today's borrowing rules and being handed an old notice. The notice exists, and someone can show you where it came from, but it cannot answer a question about the current rules. Finding something and finding the right thing are different tasks.\n\nOur fictional knowledge base has a similar arrangement. Its main router is the entrance map, pointing to projects/example/index.md. That project index acts like a shelf label: it points to policy-current.md and policy-archived.md. The current note was updated on 10 October and requires review before sending a draft. The archived note was updated on 1 September and is marked obsolete.\n\nPicture the route as four connected stops: main router, project index, current document, answer with its source. Each stop helps the AI reach the next. When the question asks for the current review requirement, the route should end at policy-current.md. Ending at the archived note would produce the wrong answer even if the file were cited accurately.\n\nThe library analogy has a limit. A map cannot judge the truth or freshness of the book it points towards. Likewise, the index is a pointer rather than proof. Its links must work, and the selected document's status must be checked. This question does not need the entire knowledge base, but that alone establishes neither token savings nor guaranteed accuracy.\n\nAsk AI to show its route and source, then check the document's status. The useful result is a visible path to the current evidence, rather than a bigger pile of notes.\n\n#### Spoken script\n\nImagine a library map pointing you to an obsolete notice. Finding it would not make its rules current. In our fictional example, the main router leads to projects/example/index.md, which lists two notes. Policy-current.md was updated 10 October and requires review before sending a draft. Policy-archived.md was updated 1 September and is obsolete. Follow four stops: router, project index, current document, answer with its source. The index is a map, not proof: check its links and the selected note's status. This question does not need the whole knowledge base, but no token saving or accuracy guarantee is established. Ask AI to show that route and source, then check it chose the current policy.\n\n### Evidence-led analyst — A source link can still lead to the wrong answer\n\n#### Article\n\nA cited answer can still be wrong if its source is obsolete. Before judging a knowledge system by how neatly it is organised, check whether it can answer a question using the document that actually applies. The important distinction is between locating a file and locating current evidence.\n\nConsider a fictional test. The main router points to projects/example/index.md, and that project index points to two documents. Policy-current.md was updated on 10 October and requires review before sending a draft. Policy-archived.md was updated on 1 September and is marked obsolete. For a question about the current review requirement, policy-current.md is the correct source.\n\nThere are two possible outcomes to compare. If AI selects the current file, states its requirement and cites it, the answer matches the supplied evidence. If it selects the archived file, the source citation may be accurate while the answer remains unsuitable. An index alone cannot distinguish those outcomes for us.\n\nCheck the route from router to index to document, confirm that the links work, and inspect the selected document's status. Loading the whole knowledge base is unnecessary for this question. However, this invented example does not measure token savings or show that the approach guarantees accuracy on other tasks. Those would require separate evidence.\n\nThe next action is to ask AI to show its route and source, then check the document's status. Judge this particular answer against the current note before drawing a broader conclusion about the system's reliability or efficiency.\n\n#### Spoken script\n\nA citation does not prove an answer is current. In this fictional test, the router leads to projects/example/index.md. That index lists policy-current.md, updated 10 October, and policy-archived.md, updated 1 September and obsolete. The current requirement is review before sending a draft. Selecting and citing policy-current.md answers the question; citing the archived file does not. Check the route, the links and the selected document's status. The whole knowledge base is unnecessary here, but this example establishes neither token savings nor guaranteed accuracy elsewhere. Your next action is to ask AI for its route and source, then check it used the current policy. Judge the answer against that evidence.\n\n## Topic 2\n\n### Practical teacher — Draft the quote, then check what is missing\n\n#### Article\n\nAI can help organise an enquiry into a quote draft, but you still need to check what the customer has asked for and what remains unknown. Begin with the supplied information, show the calculation clearly, and leave gaps visible rather than filling them with guesses.\n\nHere is a fictional decorating example. All quantities and prices are invented teaching inputs, not market rates. The enquiry specifies 20 square metres of walls. The supplied labour rate is £12 per square metre, so labour comes to £240. Add the supplied £45 materials cost and the illustrative subtotal is £285.\n\nWrite those inputs and calculations into the draft so a person can check them. Keep the scope equally clear: ceiling, doors and additional preparation are not included in the stated work. Do not treat a request to paint the walls as permission to add other surfaces or assume that every preparation task is covered.\n\nNext, list the unanswered questions. Tax treatment, access, final surface condition and start date are unknown. The AI should leave them unresolved, rather than silently include tax or invent a date. The £285 subtotal is a calculation from the example inputs; it is not an approved final price.\n\nYour next action is to confirm the scope and unknowns with the appropriate person, then obtain approval before sending the quote. A useful draft makes that review easier because the numbers, exclusions and unanswered questions are visible together. Completing the arithmetic does not complete the decision to send it.\n\n#### Spoken script\n\nTurn an enquiry into a draft by using the supplied facts and keeping gaps visible. This decorating example is fictional; its prices are not market rates. There are 20 square metres of walls at £12 per square metre: £240 labour. Add £45 materials and the illustrative subtotal is £285. Ceiling, doors and additional preparation are outside the stated scope. Tax treatment, access, final surface condition and start date are unknown. Do not silently add tax, invent dates or call the subtotal an approved final quote. AI can show the calculation and list questions. Your next action is to confirm the scope and unknowns, then obtain a person's approval before sending.\n\n### Visual explainer — Follow the enquiry into a quote draft\n\n#### Article\n\nPicture an enquiry moving across a desk in three stages: supplied information, a calculation, and a draft waiting for review. Information should only move into the calculation when it has actually been supplied. Unanswered questions stay visible beside the draft, rather than disappearing into a confident final price.\n\nOur decorating example is fictional, and its quantities and prices are teaching inputs rather than market rates. The first stage contains 20 square metres of walls, a labour rate of £12 per square metre and £45 for materials. In the calculation stage, 20 multiplied by £12 produces £240 labour. Adding £45 gives an illustrative subtotal of £285.\n\nNow picture the scope as a labelled outline around the work. It contains the specified walls. Ceiling, doors and additional preparation are outside that stated outline. The drawing would describe the supplied scope; it would not establish what the customer ultimately needs or what a decorator will approve.\n\nFour unanswered labels remain beside the draft: tax treatment, access, final surface condition and start date. The AI can display them, but it must not turn a blank label into an invented fact. It should neither silently include tax nor choose a start date. The subtotal remains illustrative, not an approved final quote.\n\nThe last stage therefore needs a person. Your next action is to confirm the scope and unknowns, then obtain approval before sending. The diagram helps you follow how the draft was formed; the review determines whether it is ready to leave the desk.\n\n#### Spoken script\n\nPicture three stages: enquiry, calculation, draft awaiting review. This decorating example is fictional, with invented inputs rather than market rates. The enquiry supplies 20 square metres of walls at £12 per square metre and £45 materials. The calculation gives £240 labour and a £285 illustrative subtotal. Draw the scope around the walls: ceiling, doors and additional preparation remain outside it. Beside the draft, keep four unknowns visible: tax treatment, access, final surface condition and start date. Those blanks must not become invented dates, silent tax assumptions or an approved final price. Your next action is to confirm the scope and unknowns, then obtain a person's approval before sending.\n\n### Evidence-led analyst — Correct arithmetic is not an approved quote\n\n#### Article\n\nA quote draft can contain correct arithmetic and still be unready to send. The calculation answers one question: what follows from the supplied inputs? It does not settle whether the scope is complete, whether the assumptions are acceptable or whether a person has approved the price.\n\nConsider a fictional decorating enquiry. Its quantities and prices are invented teaching inputs, not market rates. It specifies 20 square metres of walls at a supplied labour rate of £12 per square metre. Labour is therefore £240. With the supplied £45 materials cost, the illustrative subtotal is £285. That result is supported by the example's numbers.\n\nThe limits of the calculation matter equally. Ceiling, doors and additional preparation are not in the stated scope. Tax treatment, access, final surface condition and start date are unknown. A completed-looking document would not resolve any of those questions. If AI silently included tax or invented a date, it would introduce an unsupported assumption.\n\nWe can therefore judge the draft on two separate grounds. Its arithmetic should match the supplied inputs, and its wording should preserve the exclusions and unknowns. Passing the arithmetic check does not make £285 an approved final quote. The AI may draft the calculation and list what needs clarification, but a person must confirm the scope and approve the quote before it is sent.\n\nYour next action is to confirm the scope and unknowns, then obtain that approval. Evaluate the draft by whether it supports a clear decision, rather than whether it looks finished.\n\n#### Spoken script\n\nCorrect arithmetic does not make a quote ready to send. In this fictional decorating example, invented inputs specify 20 square metres of walls at £12 per square metre. That gives £240 labour; adding £45 materials gives a £285 illustrative subtotal. These are not market rates. Ceiling, doors and additional preparation are outside the stated scope. Tax treatment, access, final surface condition and start date remain unknown. Check the calculation separately from those assumptions. AI may draft the figures and list questions, but must not silently include tax, invent dates or present £285 as an approved final quote. Confirm the scope and unknowns, then obtain a person's approval before sending.\n\n## Topic 3\n\n### Practical teacher — Check the result before accepting all done\n\n#### Article\n\nWhen AI says a task is finished, check the result against what you asked it to do. Write the finish line as a few observable requirements, then look for evidence of each one. A confident completion message is useful only when the required behaviours actually occurred.\n\nIn this simulated example, the task has three requirements: retrieve the current policy, cite its file and leave the response as a draft. The test log is invented for teaching; it is not a receipt from a real run. The response uses the archived September document, includes that archived file path, and is saved without being sent.\n\nRead the observations one requirement at a time. Retrieving the current policy fails because the selected document is archived. Citation presence passes because a file path is included, but that does not make the source correct. Keeping the response as a draft also passes because it was not sent.\n\nThe overall task fails. One required behaviour is missing, so two passes cannot turn the result into success. A message saying all done would not change what the log shows. This is why it helps to define the finish line before accepting the output.\n\nYour next action is to correct the source selection and rerun the failed retrieval check, along with any other checks affected by that change. Record what you expected and what actually happened. If the revised task passes, describe that particular result accurately: a narrow pass does not prove that the system will be reliable on every task.\n\n#### Spoken script\n\nCheck the result before accepting all done. This is a simulated teaching log, not a real run. The task must retrieve the current policy, cite its file and leave the response as a draft. Instead, it uses the archived September document, cites that archived path and saves the response without sending. Retrieval fails. Citation presence passes, but does not make the source correct. Draft preservation passes. The task still fails overall because one required check failed. Correct the source selection, then rerun retrieval and any other checks affected by the change. Keep the expected and actual results as evidence. Even a later pass proves only that particular result, not universal reliability.\n\n### Visual explainer — Three checkpoints before the finish line\n\n#### Article\n\nImagine a task moving through three checkpoints before it reaches the finish line. Each checkpoint represents something the task must do. Two green lights cannot compensate for a failed requirement at the third, even if the completion message beside the finish line says all done.\n\nIn our simulated example, the checkpoints are retrieving the current policy, citing its file and preserving the response as a draft. This is an invented teaching log, not evidence of an actual run. The recorded response uses the archived September document, includes the archived file path, and is saved without being sent.\n\nAt the first checkpoint, place the expected result beside the observation. Expected: the current policy. Observed: an archived document. That check fails. At the second, the file path is present, so citation presence passes. However, an arrow still points back to the wrong source; the citation has not repaired the failed retrieval. At the third, the response remains unsent, so draft preservation passes.\n\nThe overall route therefore stops before the finish line. The checkpoint picture explains why the result fails, but the actual decision comes from comparing each requirement with its evidence. A reassuring message cannot replace that comparison.\n\nYour next action is to correct the source selection, then rerun the failed retrieval check and any other checks affected by the change. Record expected and actual results together. If the route subsequently passes, it demonstrates that specific outcome; it does not establish universal reliability for every journey through the system.\n\n#### Spoken script\n\nPicture three checkpoints: current policy, source citation and saved draft. This fictional test log describes a simulation, not an actual run. The response uses the archived September policy, cites its path and stays saved without being sent. The first checkpoint fails: the source is wrong. Citation presence passes, but the arrow still points to an archived document. Draft preservation also passes. Two passes do not complete a route with a failed requirement, whatever the all done message says. Correct the source selection and rerun retrieval plus any other checks affected by the change. Record the expected and actual results. A later pass would show this specific outcome, not universal reliability.\n\n### Evidence-led analyst — Does the evidence support the success claim?\n\n#### Article\n\nThe evidence in this example does not support a claim of success. The task completes two required behaviours but fails a third. Before accepting an AI completion message, compare its claim with the finish line and the observations, rather than treating the message itself as a test result.\n\nThis is a simulated teaching log, not an actual run. The task must retrieve the current policy, cite its file and leave the response as a draft. The observed response uses the archived September document, includes that archived file path, and is saved without being sent. Those observations allow three separate judgements.\n\nRetrieval fails because the selected policy is archived. Citation presence passes, since a file path appears, but that narrow pass does not show that the source is correct. Draft preservation passes because the response was not sent. The overall task fails because the requirement to retrieve the current policy remains unsatisfied.\n\nAn alternative reading would count two passes and call the task mostly successful. That describes partial completion, but it does not meet the supplied finish line. All three behaviours are required. Neither the number of passes nor an all done message can remove the failed check.\n\nThe next action is to correct the source selection and rerun the failed retrieval check, plus any other checks affected by that change. Retain expected and actual results as evidence. If the revised result passes, limit the conclusion to what was tested. A narrow pass does not demonstrate universal reliability across other tasks or conditions.\n\n#### Spoken script\n\nDoes the evidence support the success claim? In this simulated teaching log, not an actual run, the task must retrieve the current policy, cite its file and leave a draft. The response uses the archived September policy, cites its path and stays saved without being sent. Citation presence and draft preservation pass; retrieving the current policy fails. Calling that mostly successful does not satisfy a finish line requiring all three behaviours. The task fails overall, regardless of an all done message. Correct the source selection and rerun retrieval and any other affected checks. Retain expected and actual results. A later pass would support a narrow conclusion about that test, not universal reliability.\n\n## Status\n\nWord ranges and selected fixed inputs checked; author semantic review completed. Runtime and beginner understanding NOT VERIFIED.\n", "mins": 16, "summary": []}, {"path": "audits/2026-10-09-advisors-and-router.md", "label": "Architect, Quartermaster, router steps", "card": null, "md": "# The Architect, the Quartermaster and the router (9 Oct 2026, late)\n\nCharlie: \"Do the Architect and Quartermaster work together well? We need relations between\nNate's knowledge of skills and which ones to use. Show how many steps our router goes through:\nare we doing things wrong?\"\n\n## 1. Did they work together? Not really, until tonight\n- The Quartermaster linked **41 of 162** tools to Nate's ideas (37 concepts), but Nate's own\n  toolkit, **30 tools he uses on camera** with exact quotes, was almost absent: only **2** were\n  in the Quartermaster's list. Its list was fed only by The Next New Thing and skills.sh.\n- Neither advisor read the other's files. Helpers can't call each other.\n\n## 2. What changed\n- **Nate's toolkit is now a Quartermaster source** (`tools/build_hands.py`, source 4): all 30\n  tools carry \"Nate uses it\" with his quote, timestamp and concept numbers (gold rings on the\n  map); **25 were new**, so the list grew from 162 to 187. They count as one sighting each but\n  never as news (his video dates aren't recorded, so they're dated to the oldest week).\n- First results: `skill-creator` (Nate's \"first skill I install\"; we already have it, unused),\n  `frontend-design` (our first Elder trial), Superpowers and Context 7 (both on Charlie's list of\n  5 plugins), Context Mode, Firecrawl, Claude-Mem now ranked with Nate's evidence.\n- **Each advisor reads the other** (`.claude/agents/`): the Quartermaster checks what Charlie\n  already has, then the Architect's concepts and rules, and adds an \"Architect:\" line; the\n  Architect adds a \"Quartermaster:\" line for tool questions. Proven for the Quartermaster with a\n  fresh helper (`audits/evidence/2026-10-09-qm-architect-link/test.md`); live for the real\n  advisors from the next session (helpers load at session start); the Architect side untested.\n\n## 3. Router steps (`python3 tools/route_depth.py`)\n| Steps from the router | Notes |\n|---|---|\n| 0 (the router, `AGENTS.md`) | 1 |\n| 1 | 43 |\n| 2 | 42 |\n| 3 | 9 |\n| 4 | 4 |\n| unreached | 0 (2 fixed tonight: a level-up reference, the 4-hour watch plan) |\n\n99 current notes; **85 of 99 are within 2 steps.** Loaded on every message: about 13,400\ncharacters (~3,360 tokens, `tools/context_check.py`). Typical questions: an answer on the Desk:\n1 step (router, `decide` skill); Nate's rule on something: 3 (router, `architect`, brain index,\nrules); a tool: 3 (router, `quartermaster`, Hands mini-router, one `tools.json` search).\nThe 4-step notes are the show presenters' weekly opinion notes, reached through the council plan.\nThe audit now warns if any current note can't be reached.\n\n## 4. Are we doing things wrong?\n- **The router: no.** It's shallow and small; nothing is lost.\n- **Yes, three things:** (1) the two advisors' knowledge wasn't connected (fixed tonight);\n  (2) changes to a helper don't apply until the next session, so a test in the same session\n  can fail for the wrong reason (now written down); (3) process overhead: grade.\n\n**What works:** the hourly transcript job is now *proven* unattended: 10 scheduled, successful runs in a row today (c4). The structure gate is clean and the fault drill catches 23 of 23 planted faults (c1, c3).\n**Biggest mismatch:** `context/current-focus.md`, the one file every session reads first, still tells a new session that Charlie must answer \"middle-go\" and that a Desk item is pending. Both plans are built and every card was closed (c7, c10). A fresh session would give Charlie old instructions.\n\nScope: Claude Code cloud runner session; Codex declared but not in this container. 7 applicable connection domains, 3 priority workflows (set-up kit plan, transcript fetch, audit gate), 5 probes, 15 pages, 23 Desk cards.\nFindings: 3 confirmed defects (a7c3-01, a7c3-02, b9f5-02), 2 verification gaps (b9f5-05, a7c3-04), 2 opportunities (a7c3-03, b9f5-06). 3 prior findings resolved.\nLimits: X posts not checked (script not run, side effects). Notion: auth only, no content read. Codex discovery not run.\n\n## AGENTS.md / CLAUDE.md findings\n\nRoot manuals: `AGENTS.md` **checked** (99 lines, c2). `CLAUDE.md` **checked**: imports `@AGENTS.md`, plus one Claude-only memory note. No scoped manuals. Shared guidance agrees by construction.\n\n| File and section/line | Rule or missing route | Finding and practical effect | Recommended change |\n|---|---|---|---|\n| `AGENTS.md` \"Session start\" | \"read `context/current-focus.md` (the only place the priority lives…)\" | Manual is right; the **file it routes to** is stale (AIOS-a7c3-01, downstream). A session following the rule would ask Charlie to answer a closed card. | Refresh current-focus \"Next step\" (Desk card) |\n| `AGENTS.md` table row \"ChatGPT copy of these rules\" | \"update when this file or working-rules change\" | Downstream drift (AIOS-b9f5-02): export predates the Architect/Quartermaster/youtube-ingest changes (c11). | Regenerate the export |\n\nDone well: the old two-audit-skills conflict (AIOS-
