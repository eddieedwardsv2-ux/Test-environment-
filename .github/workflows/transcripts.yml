# Fetch YouTube transcripts on GitHub's runners. YouTube blocks every data
# centre (GitHub's too, tested 2026-10-07), but the free youtube-transcript.ai
# service rate-limits per IP, so GitHub's runner gets its own allowance on top
# of the cloud session's. Results are committed to research/<creator>/.
name: transcripts
on:
  workflow_dispatch:
    inputs:
      creator: { description: "research folder, e.g. nick-saraev", required: true }
      videos: { description: "space-separated video IDs", required: true }
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch transcripts via the free service (GitHub's IP has its own allowance)
        env:
          CREATOR: ${{ inputs.creator }}
          VIDEOS: ${{ inputs.videos }}
        run: python3 research/get_transcript.py "$CREATOR" $VIDEOS || echo "some videos unavailable"
      - name: Save to the repo
        run: |
          git config user.name "transcripts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research
          git diff --cached --quiet && echo "nothing fetched" && exit 1
          git commit -m "Raw captions for ${{ inputs.creator }}: ${{ inputs.videos }}"
          git push
