# Fetch YouTube transcripts on GitHub's runners. YouTube blocks every data
# centre (GitHub's too, tested 2026-10-07), but the free youtube-transcript.ai
# service rate-limits per IP, so each runner gets its own allowance. Three
# "fetch" jobs run at once, each on its own machine, taking every 3rd entry of
# research/transcript-queue.txt; "save" then commits what they got and removes
# finished entries from the queue.
name: transcripts
on:
  schedule:
    - cron: "23 * * * *"   # hourly
  workflow_dispatch:
    inputs:
      creator: { description: "research folder, e.g. nick-saraev (blank = process the queue)", required: false }
      videos: { description: "space-separated video IDs (blank = process the queue)", required: false }
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Fetch this job's share
        env:
          CREATOR: ${{ inputs.creator }}
          VIDEOS: ${{ inputs.videos }}
          SHARD: ${{ matrix.shard }}
        run: |
          if [ -n "$CREATOR" ] && [ -n "$VIDEOS" ]; then
            [ "$SHARD" = "1" ] && { python3 research/get_transcript.py "$CREATOR" $VIDEOS || true; }
          else
            python3 research/process_queue.py 3 "$SHARD/3" || true
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: transcripts-${{ matrix.shard }}
          path: |
            research/*/*-transcript.md
            research/*/*-raw.txt
          if-no-files-found: ignore
  save:
    needs: fetch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/download-artifact@v4
        with: { path: fetched, merge-multiple: true }
      - name: Save new transcripts and tidy the queue
        run: |
          [ -d fetched ] && cp -rn fetched/. research/ || true
          python3 research/process_queue.py --cleanup
          git config user.name "transcripts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "Transcripts fetched by GitHub Actions"
          git push
