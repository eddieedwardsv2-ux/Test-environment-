l=\"noopener\">bCl 1:23:32<\/a>."}], "rules": [24], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 5}, {"id": "c24", "kind": "concept", "g": "nate", "t": "Permissions are keys and deny lists, not prompts", "n": 24, "sec": "G", "secTitle": "From the wider course and newer videos", "body": [{"t": "p", "h": "Assume the agent will do anything it is able to. Safety comes from what it physically can't do: scoped API keys that only allow the needed actions, and a settings deny list for risky commands. His 150,000-email accident came from too many tools, not the permission mode."}, {"t": "q", "h": "\"A prompt is never a permission layer. You basically have to have the assumption that if it can, it will.\" <a href=\"https://www.youtube.com/watch?v=8QQ_INxAhRs&amp;t=1471s\" target=\"_blank\" rel=\"noopener\">8QQ 24:31<\/a>"}, {"t": "q", "h": "\"Can you help me update the settings file so that you physically cannot do those things?\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=4468s\" target=\"_blank\" rel=\"noopener\">jdb 1:14:28<\/a>"}, {"t": "p", "h": "Also: \"there's no point in giving the agent that actual tool to be able to do so.\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=4254s\" target=\"_blank\" rel=\"noopener\">jdb 1:10:54<\/a>; per-key permissions <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=2324s\" target=\"_blank\" rel=\"noopener\">bCl 38:44<\/a>."}], "rules": [25], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 5}, {"id": "c25", "kind": "concept", "g": "nate", "t": "Secrets in .env; your own keys travel, app connectors don't", "n": 25, "sec": "G", "secTitle": "From the wider course and newer videos", "body": [{"t": "p", "h": "Keys live in a <code>.env<\/code> file kept out of Git and out of chat. Prefer an API key plus a reference .md over app connectors or piles of MCP servers: connectors are lost when you change tool, and loaded MCPs eat tokens."}, {"t": "q", "h": "\"If you rely on these connections, that is not great\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=5844s\" target=\"_blank\" rel=\"noopener\">jdb 1:37:24<\/a>"}, {"t": "q", "h": "\"if you switch off to a different desktop app or a different harness, you lose everything.\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=5844s\" target=\"_blank\" rel=\"noopener\">jdb 1:37:24<\/a>"}, {"t": "p", "h": "Also: \"gets excluded from anytime we do a public push\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=2510s\" target=\"_blank\" rel=\"noopener\">bCl 41:50<\/a>; MCP token cost <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=2385s\" target=\"_blank\" rel=\"noopener\">bCl 39:45<\/a>."}], "rules": [26], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 4}, {"id": "c26", "kind": "concept", "g": "nate", "t": "Grill me: interview the knowledge out of your head", "n": 26, "sec": "G", "secTitle": "From the wider course and newer videos", "body": [{"t": "p", "h": "The bottleneck is getting what you know into the system; a quick brain dump is never enough. The grill-me skill asks one question at a time, checkpoints every answer to a doc in <code>brainstorms/<\/code>, flags gaps to chase with others, and can be re-run when things change. Up-front time gets a skill close to right on the first try."}, {"t": "q", "h": "\"It's not ever good enough.\" <a href=\"https://www.youtube.com/watch?v=c0kaKxM2pHg&amp;t=62s\" target=\"_blank\" rel=\"noopener\">c0k 1:02<\/a>"}, {"t": "q", "h": "\"the bigger problem is getting everything out of your brain into the system\" <a href=\"https://www.youtube.com/watch?v=DTCyvo6cC54&amp;t=1338s\" target=\"_blank\" rel=\"noopener\">DTC 22:18<\/a>"}, {"t": "p", "h": "Also: checkpointing to brainstorms <a href=\"https://www.youtube.com/watch?v=c0kaKxM2pHg&amp;t=153s\" target=\"_blank\" rel=\"noopener\">c0k 2:33<\/a>; open flags <a href=\"https://www.youtube.com/watch?v=c0kaKxM2pHg&amp;t=367s\" target=\"_blank\" rel=\"noopener\">c0k 6:07<\/a>; ask until 95% sure <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=19974s\" target=\"_blank\" rel=\"noopener\">jdb 5:32:54<\/a>."}], "rules": [30], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 5}, {"id": "c27", "kind": "concept", "g": "nate", "t": "Session hygiene: clear between tasks, hand off before it degrades", "n": 27, "sec": "G", "secTitle": "From the wider course and newer videos", "body": [{"t": "p", "h": "Each message in a long chat costs more than in a fresh one, so start fresh for unrelated tasks. Before clearing (he says around 250-300k tokens, as autocompact comes too late), have the agent write a hand-off: what was done, files made, open decisions, next step."}, {"t": "q", "h": "\"Use slashclear between unrelated tasks.\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=19853s\" target=\"_blank\" rel=\"noopener\">jdb 5:30:53<\/a>"}, {"t": "q", "h": "\"Here are open decisions. Here's what's next.\" <a href=\"https://www.youtube.com/watch?v=0WDkwMxj13s&amp;t=1344s\" target=\"_blank\" rel=\"noopener\">0WD 22:24<\/a>"}, {"t": "p", "h": "Also: \"But the autocompact kicks in way too late.\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=7248s\" target=\"_blank\" rel=\"noopener\">jdb 2:00:48<\/a>."}], "rules": [29], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 4}, {"id": "c28", "kind": "concept", "g": "nate", "t": "One set of files for every tool (Claude Code and Codex)", "n": 28, "sec": "G", "secTitle": "From the wider course and newer videos", "body": [{"t": "p", "h": "Build tool-agnostic. Codex reads AGENTS.md, keeps config and agents in <code>.codex/<\/code> and skills in <code>.agents/<\/code>; skill files are identical between the two, only agent files differ (TOML vs markdown). A CLAUDE.md can simply reference AGENTS.md."}, {"t": "q", "h": "\"you're building things to be tool agnostic\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=124s\" target=\"_blank\" rel=\"noopener\">bCl 2:04<\/a>"}, {"t": "q", "h": "\"the skill files, which are the markdown files with the YAML front matter, are the exact same.\" <a href=\"https://www.youtube.com/watch?v=kB9iMD0EjT8&amp;t=184s\" target=\"_blank\" rel=\"noopener\">kB9 3:04<\/a>"}, {"t": "p", "h": "Also: <a href=\"https://www.youtube.com/watch?v=DTCyvo6cC54&amp;t=1369s\" target=\"_blank\" rel=\"noopener\">DTC 22:49<\/a>; shared skills and agents go in the repo <a href=\"https://www.youtube.com/watch?v=e18sdZLwP7o&amp;t=1497s\" target=\"_blank\" rel=\"noopener\">e18 24:57<\/a>."}], "rules": [], "note": "no rule yet; concept 3 says the same files serve Codex.", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 5}, {"id": "c29", "kind": "concept", "g": "nate", "t": "Context costs money and rots: act at about half the window", "n": 29, "sec": "H", "secTitle": "From the full-channel audit (2026-10-08)", "body": [{"t": "p", "h": "Every new message makes Claude re-read the whole chat from the start, so long chats cost more and, past roughly half the window, the answers get worse. Look at what is filling the context (run /context in a fresh session, delete unused tools, skills and servers) before blaming the model, convert documents to markdown because it is cheaper for AI, and check your usage allowance. When a path has gone wrong, rewind or restart rather than piling corrections on top of the failed attempt."}, {"t": "q", "h": "\"somewhere around halfway through your context window, it starts to fall apart.\" <a href=\"https://www.youtube.com/watch?v=eRS3CmvrOvA&amp;t=272s\" target=\"_blank\" rel=\"noopener\">eRS 4:32<\/a>"}, {"t": "q", "h": "\"go into a fresh session, do /context, and see what you're sitting at before you even send off anything\" <a href=\"https://www.youtube.com/watch?v=_qZvORxGqI0&amp;t=64s\" target=\"_blank\" rel=\"noopener\">_qZ 1:04<\/a>"}, {"t": "q", "h": "\"Claude rereads the entire conversation from the beginning, and all of those are tokens that it's charging you for\" <a href=\"https://www.youtube.com/watch?v=49V-5Ock8LU&amp;t=64s\" target=\"_blank\" rel=\"noopener\">49V 1:04<\/a>"}], "rules": [31], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 5}, {"id": "c30", "kind": "concept", "g": "nate", "t": "Plan, let the AI attack the plan, then build", "n": 30, "sec": "H", "secTitle": "From the full-channel audit (2026-10-08)", "body": [{"t": "p", "h": "Before anything non-trivial, plan first, then ask Claude to push back and play devil's advocate on the plan before it builds. Big plans are saved to a file and worked phase by phase, one session each. Nate teaches plan mode for this; Charlie declined plan mode itself on 2026-10-08, and this repo's 95%-or-ask rule (R14: be 95% sure or ask 1-2 questions) does the same job."}, {"t": "q", "h": "\"You ask Claude to start challenging you and pushing back and playing devil's advocate before it builds anything or before it approves any plan\" <a href=\"https://www.youtube.com/watch?v=iTY8Q449YNQ&amp;t=156s\" target=\"_blank\" rel=\"noopener\">iTY 2:36<\/a>"}, {"t": "q", "h": "\"Have one for discovery where you can have Claude read through PDFs and read through the code base\" <a href=\"https://www.youtube.com/watch?v=_qZvORxGqI0&amp;t=1285s\" target=\"_blank\" rel=\"noopener\">_qZ 21:25<\/a>"}, {"t": "q", "h": "\"So what you always want to do when you're creating an idea is you want to go on plan mode.\" <a href=\"https://www.youtube.com/watch?v=mpALXah_PBg&amp;t=7300s\" target=\"_blank\" rel=\"noopener\">mpA 2:01:40<\/a>"}], "rules": [32], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 5}, {"id": "c31", "kind": "concept", "g": "nate", "t": "A separate checker decides \"done\"; then try to break it", "n": 31, "sec": "H", "secTitle": "From the full-channel audit (2026-10-08)", "body": [{"t": "p", "h": "The worker should not mark its own homework: a different model or persona checks the result, and after \"done\" you stress test it for edge cases. When output is bad, first ask whether it is a model, harness or organisation problem. Verification steps also go into the to-do list, not just the end."}, {"t": "q", "h": "\"is this a model problem, is this a harness problem? Or is this an organization problem?\" <a href=\"https://www.youtube.com/watch?v=6LNlCpQPYFc&amp;t=1927s\" target=\"_blank\" rel=\"noopener\">6LN 32:07<\/a>"}, {"t": "q", "h": "\"Claude doesn't get to declare itself done. A different model has to look at it with a different persona\" <a href=\"https://www.youtube.com/watch?v=iTY8Q449YNQ&amp;t=1345s\" target=\"_blank\" rel=\"noopener\">iTY 22:25<\/a>"}, {"t": "q", "h": "\"by the time it tells you it's done, you stress test it more. and you try to find those edge cases\" <a href=\"https://www.youtube.com/watch?v=iTY8Q449YNQ&amp;t=583s\" target=\"_blank\" rel=\"noopener\">iTY 9:43<\/a>"}], "rules": [33], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 4}, {"id": "c32", "kind": "concept", "g": "nate", "t": "Skills do one job, are built from a real run, and retire when they stop earning", "n": 32, "sec": "H", "secTitle": "From the full-channel audit (2026-10-08)", "body": [{"t": "p", "h": "Each skill or agent does one specific job. Build it by doing the task together once, then turning that run into a skill, and keep adding a line to a \"don'ts\" list for each real failure. Write instructions specifically, not vaguely. Retire a skill that no longer adds value, which matters once you have around ten."}, {"t": "q", "h": "\"the whole idea is that you want a skill to do one very specific job\" <a href=\"https://www.youtube.com/watch?v=X-pbJWKmwi0&amp;t=3985s\" target=\"_blank\" rel=\"noopener\">Xpb 1:06:25<\/a>"}, {"t": "q", "h": "\"So you want to make sure that your skill is actually adding value and not holding\" <a href=\"https://www.youtube.com/watch?v=6LNlCpQPYFc&amp;t=1469s\" target=\"_blank\" rel=\"noopener\">6LN 24:29<\/a>"}, {"t": "q", "h": "\"The way that I build my skills is I have Claude Code do something with me. I walk it through the steps\" <a href=\"https://www.youtube.com/watch?v=mpALXah_PBg&amp;t=22892s\" target=\"_blank\" rel=\"noopener\">mpA 6:21:32<\/a>"}], "rules": [34], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 5}, {"id": "c33", "kind": "concept", "g": "nate", "t": "Unattended runs: one-shot, stateless, bounded, tested by hand first, fixed parts in scripts", "n": 33, "sec": "H", "secTitle": "From the full-channel audit (2026-10-08)", "body": [{"t": "p", "h": "A scheduled or background run must never need to stop and ask, can only see the repo, APIs and environment secrets, and needs a bounded scope with a named deliverable. Test it by hand and prove one live run before switching the schedule on. Put the fixed details in a script, because an agent left to interpret the same message will drift."}, {"t": "q", "h": "\"the agent was just interpreting the message different every time and it just acted differently\" <a href=\"https://www.youtube.com/watch?v=X-pbJWKmwi0&amp;t=10825s\" target=\"_blank\" rel=\"noopener\">Xpb 3:00:25<\/a>"}, {"t": "q", "h": "\"So, bound the scope, name the deliverable, and then all your sub agents can be put on Haiku.\" <a href=\"https://www.youtube.com/watch?v=jZgcWCzxh1I&amp;t=671s\" target=\"_blank\" rel=\"noopener\">jZg 11:11<\/a>"}, {"t": "q", "h": "\"You're not around. So, you probably want to make sure that it doesn't ever have to stop and ask you questions.\" <a href=\"https://www.youtube.com/watch?v=ehg4fhydTgs&amp;t=93s\" target=\"_blank\" rel=\"noopener\">ehg 1:33<\/a>"}], "rules": [35], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 5}, {"id": "c34", "kind": "concept", "g": "nate", "t": "Permissions in layers: deny plus allow, start strict, helpers inherit, read-only and drafts first", "n": 34, "sec": "H", "secTitle": "From the full-channel audit (2026-10-08)", "body": [{"t": "p", "h": "Deny the destructive commands and also explicitly allow the safe ones. Start with read-only access and drafts, with a human approving anything outward, and remember that helper agents inherit the main session's permissions. Nate also describes auto mode (a classifier approves safe commands); auto mode is not adopted here, so the deny list stays the safety layer."}, {"t": "q", "h": "\"So, I would always start with like read-only access whenever you can, have the agent only do drafts\" <a href=\"https://www.youtube.com/watch?v=Ktnwygcnd8U&amp;t=640s\" target=\"_blank\" rel=\"noopener\">Ktn 10:40<\/a>"}, {"t": "q", "h": "\"go into your permissions and explicitly allow the commands that you know are safe\" <a href=\"https://www.youtube.com/watch?v=jqoFP9QapXI&amp;t=847s\" target=\"_blank\" rel=\"noopener\">jqo 14:07<\/a>"}, {"t": "q", "h": "\"they inherit the permissions from the main session. So, if you're on bypass permissions, then all of your agents are going to be on bypass permissions\" <a href=\"https://www.youtube.com/watch?v=vDVSGVpB2vc&amp;t=731s\" target=\"_blank\" rel=\"noopener\">vDV 12:11<\/a>"}], "rules": [36], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 5}, {"id": "c35", "kind": "concept", "g": "nate", "t": "Check before anything goes public: security review, private-data hook, untrusted content, plugin vetting", "n": 35, "sec": "H", "secTitle": "From the full-channel audit (2026-10-08)", "body": [{"t": "p", "h": "Before publishing, run a security review and use a hook to strip private data, not just a rule. Web pages and transcripts are untrusted content that could trick an agent into sending data out. Vet a plugin against a checklist (network calls, exfiltration, shell injection, secrets) before installing it."}, {"t": "q", "h": "\"that there's a hook that fires to remove any PII, any sensitive data of that client that I don't want living on my GitHub.\" <a href=\"https://www.youtube.com/watch?v=6LNlCpQPYFc&amp;t=1439s\" target=\"_blank\" rel=\"noopener\">6LN 23:59<\/a>"}, {"t": "q", "h": "\"if Claude reads malicious content during a run, then it theoretically could be tricked into sending data to an external server.\" <a href=\"https://www.youtube.com/watch?v=ehg4fhydTgs&amp;t=701s\" target=\"_blank\" rel=\"noopener\">ehg 11:41<\/a>"}, {"t": "q", "h": "\"I basically told it to run a security review and make sure that my API keys aren't exposed and that there's no vulnerabilities\" <a href=\"https://www.youtube.com/watch?v=saggDHHnmtQ&amp;t=1801s\" target=\"_blank\" rel=\"noopener\">sag 30:01<\/a>"}], "rules": [37], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 5}, {"id": "c36", "kind": "concept", "g": "nate", "t": "File hygiene: scratch apart from deliverables, folder READMEs, project first, start every task in the project", "n": 36, "sec": "H", "secTitle": "From the full-channel audit (2026-10-08)", "body": [{"t": "p", "h": "Tell the AI where throwaway files go so they stay apart from deliverables, and give every folder a short README saying why it exists. Everything starts in the project and is promoted to global only when earned, and every task starts inside the project, not a plain chat. \"Remember this\" has to end up in a file in the repo, since cloud auto-memory is wiped."}, {"t": "q", "h": "\"so that your agent always understands why does this folder exist and where should it look for different things\" <a href=\"https://www.youtube.com/watch?v=X-pbJWKmwi0&amp;t=5576s\" target=\"_blank\" rel=\"noopener\">Xpb 1:32:56<\/a>"}, {"t": "q", "h": "\"Everything is project until deserves to be promoted to global so that I know at all times what is the running total of everything that's running globally.\" <a href=\"https://www.youtube.com/watch?v=6LNlCpQPYFc&amp;t=1897s\" target=\"_blank\" rel=\"noopener\">6LN 31:37<\/a>"}, {"t": "q", "h": "\"if you want your assistant to remember something permanently, just tell it remember that I always prefer X.\" <a href=\"https://www.youtube.com/watch?v=mpALXah_PBg&amp;t=21188s\" target=\"_blank\" rel=\"noopener\">mpA 5:53:08<\/a>"}], "rules": [38], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 5}, {"id": "c37", "kind": "concept", "g": "nate", "t": "Operator habits: paste the whole error, make it do its own chores, match model and effort, adopt tools only for real pain, cap parallel sessions, use the OS for everything", "n": 37, "sec": "H", "secTitle": "From the full-channel audit (2026-10-08)", "body": [{"t": "p", "h": "Small habits that add up: paste the whole error, ask the AI to do the chores it lists for you, and use the cheapest model and effort that does the job. Adopt a new tool only for a real pain point and trial it on real work, run no more than three or four parallel sessions, and use your OS for everything for a week."}, {"t": "q", "h": "\"try to force yourself to do everything from here, from this interface\" <a href=\"https://www.youtube.com/watch?v=X-pbJWKmwi0&amp;t=2712s\" target=\"_blank\" rel=\"noopener\">Xpb 45:12<\/a>"}, {"t": "q", "h": "\"do not automatically run everything at maximum effort or even just high.\" <a href=\"https://www.youtube.com/watch?v=FBVNS1l5Vb8&amp;t=279s\" target=\"_blank\" rel=\"noopener\">FBV 4:39<\/a>"}, {"t": "q", "h": "\"it has some action items, it actually just tells you to do some stuff that it could do itself\" <a href=\"https://www.youtube.com/watch?v=saggDHHnmtQ&amp;t=917s\" target=\"_blank\" rel=\"noopener\">sag 15:17<\/a>"}], "rules": [39], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 5}, {"id": "c38", "kind": "concept", "g": "nate", "t": "Parts rot at different speeds; score each audit", "n": 38, "sec": "H", "secTitle": "From the full-channel audit (2026-10-08)", "body": [{"t": "p", "h": "Different parts of an OS go stale at different rates, so review each at its own pace. Score every audit and keep the scores, so you can see the system improving over time."}, {"t": "q", "h": "\"it will store your scores every time so that you can see how you're actually improving your system\" <a href=\"https://www.youtube.com/watch?v=X-pbJWKmwi0&amp;t=3195s\" target=\"_blank\" rel=\"noopener\">Xpb 53:15<\/a>"}, {"t": "q", "h": "\"All of these different parts decay, become obsolete or rot at different rates.\" <a href=\"https://www.youtube.com/watch?v=6LNlCpQPYFc&amp;t=1377s\" target=\"_blank\" rel=\"noopener\">6LN 22:57<\/a>"}], "rules": [40], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 4}, {"id": "r1", "kind": "rule", "g": "nate", "t": "Name the failure mode before fixing", "n": 1, "conf": "stated: the four modes; inference: naming one before any fix", "body": [{"t": "p", "h": "A wrong answer is poisoning, bloat, confusion or clash. Each has a different fix, so name it first."}, {"t": "q", "h": "\"the four failure modes, poisoning, bloat, confusion, and clash.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=94s\" target=\"_blank\" rel=\"noopener\">1:34<\/a>"}, {"t": "check", "h": "<em>Which of the four is this: false fact, too much loaded, something missing, or two sources disagreeing?<\/em> (Concept 1)"}], "concepts": [1], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 3}, {"id": "r2", "kind": "rule", "g": "nate", "t": "Fix poisoning with verification, not hope", "n": 2, "conf": "stated", "body": [{"t": "p", "h": "Cross-check facts against a live source or a search; if the agent isn't sure, put a human in the loop."}, {"t": "q", "h": "\"poisoning is the easiest one to fix because basically it's just a matter of having some verification.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=156s\" target=\"_blank\" rel=\"noopener\">2:36<\/a>"}, {"t": "q", "h": "Also: \"Never accept AI output without asking why\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=397s\" target=\"_blank\" rel=\"noopener\">6:37<\/a>"}, {"t": "check", "h": "<em>Where does this fact get checked before it's used?<\/em>"}], "concepts": [], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 3}, {"id": "r3", "kind": "rule", "g": "nate", "t": "One current source per fact", "n": 3, "conf": "inference", "body": [{"t": "p", "h": "Nate describes clash (old and new policies side by side, <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=247s\" target=\"_blank\" rel=\"noopener\">4:07<\/a>) but gives no fix in these videos (none of the 14 added on 2026-10-07 gives one either, so this stays inference). Our rule: when a fact changes, update or retire the old copy rather than adding a second one; history goes in a log, not beside the current state."}, {"t": "check", "h": "<em>Is this fact written anywhere else? Which one wins?<\/em>"}], "concepts": [], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 2}, {"id": "r4", "kind": "rule", "g": "nate", "t": "Always-loaded is for expertise only", "n": 4, "conf": "stated", "body": [{"t": "p", "h": "Load who you are, goals and policies every run. Fetch one-off, situational data just in time."}, {"t": "q", "h": "\"the situational context is things that you need just in time.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=338s\" target=\"_blank\" rel=\"noopener\">5:38<\/a>"}, {"t": "q", "h": "Also: \"I said don't read from the wiki unless you actually need it.\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=8423s\" target=\"_blank\" rel=\"noopener\">2:20:23<\/a>; \"cloudmd is the rules. Memory is, you know, learned facts.\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=7490s\" target=\"_blank\" rel=\"noopener\">2:04:50<\/a>"}, {"t": "check", "h": "<em>Is this needed on every run? If not, route to it instead of loading it.<\/em> (Concept 2)"}], "concepts": [2], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 5}, {"id": "r5", "kind": "rule", "g": "nate", "t": "The root file routes; it doesn't store", "n": 5, "conf": "stated, demonstrated", "body": [{"t": "p", "h": "Keep CLAUDE.md / AGENTS.md to a short identity plus a table of where things live."}, {"t": "q", "h": "\"I treat this almost purely as a router.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=766s\" target=\"_blank\" rel=\"noopener\">12:46<\/a>"}, {"t": "q", "h": "Also: \"I go into a routing map and that's the majority of my agents.mmd\" <a href=\"https://www.youtube.com/watch?v=yysILVsfLFM&amp;t=367s\" target=\"_blank\" rel=\"noopener\">6:07<\/a>; \"it's an index, not a dump\" <a href=\"https://www.youtube.com/watch?v=LrgfmZkl3nc&amp;t=334s\" target=\"_blank\" rel=\"noopener\">5:34<\/a>"}, {"t": "p", "h": "Shown on screen at <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=797s\" target=\"_blank\" rel=\"noopener\">13:17<\/a>. <em>Supporting:<\/em> <a href=\"https://www.youtube.com/watch?v=DTCyvo6cC54&amp;t=274s\" target=\"_blank\" rel=\"noopener\">4:34<\/a> (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/every-level-of-a-claude-second-brain-explained--DTCyvo6cC54-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "check", "h": "<em>Could this paragraph be a file plus one routing line?<\/em> (Concept 3)"}], "concepts": [3], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 6}, {"id": "r6", "kind": "rule", "g": "nate", "t": "Judge the layout by whether things can be found, not by copying someone", "n": 6, "conf": "stated", "body": [{"t": "p", "h": "Any structure is fine if you can find things by hand without search; the only failure is ignoring repeated wrong answers."}, {"t": "q", "h": "\"see if you could find it without searching, without asking Claude\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1100s\" target=\"_blank\" rel=\"noopener\">18:20<\/a>"}, {"t": "check", "h": "<em>Could Charlie guess this file's path without searching?<\/em> (Concept 4)"}], "concepts": [4], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 3}, {"id": "r7", "kind": "rule", "g": "nate", "t": "Audit read-only, then wait for approval", "n": 7, "conf": "demonstrated", "body": [{"t": "p", "h": "The audit reports findings and fixes into a dated file and changes nothing until you say yes. For big projects, one sub-agent per check."}, {"t": "q", "h": "\"It won't actually do anything yet.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=64s\" target=\"_blank\" rel=\"noopener\">1:04<\/a>"}, {"t": "q", "h": "Also: \"Maybe every single Friday, you run an audit\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=8910s\" target=\"_blank\" rel=\"noopener\">2:28:30<\/a>"}, {"t": "p", "h": "Fix list \"await approval\" at <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=523s\" target=\"_blank\" rel=\"noopener\">8:43<\/a>; fan-out at <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=614s\" target=\"_blank\" rel=\"noopener\">10:14<\/a>."}, {"t": "check", "h": "<em>Does this audit only report? Who approves the fixes?<\/em> (Concept 7)"}], "concepts": [7], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 4}, {"id": "r8", "kind": "rule", "g": "nate", "t": "Treat every index and route as a claim to check against the disk", "n": 8, "conf": "stated, demonstrated", "body": [{"t": "p", "h": "Check that routes point to things that exist, that nothing is misrouted, that index counts match reality, and that feeds are fresh."}, {"t": "q", "h": "\"Indexes and wiks are claims about what exists and what's current. The audit checks every claim against reality.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=583s\" target=\"_blank\" rel=\"noopener\">9:43<\/a>"}, {"t": "p", "h": "Demo: 55 folders in the index vs 79 on disk, <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=492s\" target=\"_blank\" rel=\"noopener\">8:12<\/a>; freshness grades, <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=675s\" target=\"_blank\" rel=\"noopener\">11:15<\/a>."}, {"t": "check", "h": "<em>Which claims in this index could a script check? Which feeds have a last-updated date?<\/em> (Concepts 7, 8)"}], "concepts": [7, 8], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 4}, {"id": "r9", "kind": "rule", "g": "nate", "t": "Segment knowledge that is distinct and growing", "n": 9, "conf": "stated, demonstrated", "body": [{"t": "p", "h": "Split it into its own wiki or folder so the agent searches less."}, {"t": "q", "h": "\"the more you can segment stuff out, the better.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1221s\" target=\"_blank\" rel=\"noopener\">20:21<\/a>"}, {"t": "p", "h": "Claude suggested his own split, <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1039s\" target=\"_blank\" rel=\"noopener\">17:19<\/a>."}, {"t": "check", "h": "<em>Is this folder mixing two kinds of growing material? Would splitting it narrow the search?<\/em> (Concept 5)"}], "concepts": [5], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 3}, {"id": "r10", "kind": "rule", "g": "nate", "t": "Automate what arrives on a schedule", "n": 10, "conf": "stated", "body": [{"t": "p", "h": "If you keep asking for the same pull, make it a cron or routine."}, {"t": "q", "h": "\"Build automations to update data.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1131s\" target=\"_blank\" rel=\"noopener\">18:51<\/a>"}, {"t": "check", "h": "<em>Has Charlie asked for this same fetch again and again? Then schedule it.<\/em> (Concept 6)"}], "concepts": [6], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 3}, {"id": "r11", "kind": "rule", "g": "nate", "t": "Backtrack every miss, then fix the route", "n": 11, "conf": "stated", "body": [{"t": "p", "h": "Have the agent explain where it looked and why it missed, then update the routing or move files. Just telling it not to let that happen again is weaker."}, {"t": "q", "h": "\"Have it update the routing.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1402s\" target=\"_blank\" rel=\"noopener\">23:22<\/a>"}, {"t": "q", "h": "Also: \"every time you correct AI, you feed that correction back into the system\" <a href=\"https://www.youtube.com/watch?v=3XIGcM7VICc&amp;t=397s\" target=\"_blank\" rel=\"noopener\">6:37<\/a>; \"update the skill in the smallest durable place\" <a href=\"https://www.youtube.com/watch?v=HIRDzMtuWFk&amp;t=365s\" target=\"_blank\" rel=\"noopener\">6:05<\/a>"}, {"t": "check", "h": "<em>Where did it look, why did it miss, and what line in the router changes?<\/em> (Concept 9)"}], "concepts": [9], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 5}, {"id": "r12", "kind": "rule", "g": "nate", "t": "Raw evidence stays untouched; the brain is derived from it", "n": 12, "conf": "demonstrated", "body": [{"t": "p", "h": "Keep transcripts and posts as-is in raw files; build the wiki pages on top and record what was fetched."}, {"t": "q", "h": "\"The raw files don't get touched\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=244s\" target=\"_blank\" rel=\"noopener\">4:04<\/a>"}, {"t": "check", "h": "<em>Is anyone editing a raw transcript? Is there a record of what was fetched?<\/em> (Concept 10)"}], "concepts": [10], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 3}, {"id": "r13", "kind": "rule", "g": "nate", "t": "No source, no rule; label inference", "n": 13, "conf": "stated, demonstrated", "body": [{"t": "p", "h": "Every rule links to an exact quote and where it came from; unsourced reasoning says it is inferred."}, {"t": "q", "h": "\"if there is no source, the agent has to say explicitly that it's inferring\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=394s\" target=\"_blank\" rel=\"noopener\">6:34<\/a>"}, {"t": "check", "h": "<em>Can each claim be clicked back to a timestamp?<\/em> (Concept 12)"}], "concepts": [12], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 3}, {"id": "r14", "kind": "rule", "g": "nate", "t": "Ingest relationally", "n": 14, "conf": "demonstrated", "body": [{"t": "p", "h": "A new source updates every page it touches plus the index and log. A one-source rule is provisional until a second source backs it."}, {"t": "q", "h": "\"it will update every page that post touches.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=578s\" target=\"_blank\" rel=\"noopener\">9:38<\/a>"}, {"t": "check", "h": "<em>Which concepts and rules does this new source change? Did index and log get updated?<\/em> (Concepts 11, 13)"}], "concepts": [11, 13], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 4}, {"id": "r15", "kind": "rule", "g": "nate", "t": "Turn distilled knowledge into an agent plus a skill", "n": 15, "conf": "demonstrated", "body": [{"t": "p", "h": "The agent holds the rules and runs in its own context; the skill is the entry point and grades answers against the rules."}, {"t": "q", "h": "\"So, those are the two things we have, a Karpathy agent and a Karpathy skill.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=425s\" target=\"_blank\" rel=\"noopener\">7:05<\/a>"}, {"t": "p", "h": "<em>Supporting, a challenge:<\/em> keep skills less specific so they don't hold newer models back, <a href=\"https://www.youtube.com/watch?v=XNQBCRcwXV4&amp;t=341s\" target=\"_blank\" rel=\"noopener\">5:41<\/a> (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/i-deleted-all-my-claude-skills-and-claude-got-smarter--XNQBCRcwXV4-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "q", "h": "Also: \"They could literally just be a 50line markdown file.\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=5134s\" target=\"_blank\" rel=\"noopener\">1:25:34<\/a>"}, {"t": "p", "h": "<em>Newer wins:<\/em> XNQ is #54 in upload order; the newer 9KO (#16) and HIR (#22) still build skills, now with verification loops and trigger tests (Rules 16, 21), so read XNQ as \"less specific\", not \"no skills\"."}, {"t": "check", "h": "<em>Is there already an agent or skill for this? Is the new one short?<\/em> (Concept 14)"}], "concepts": [14], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 5}, {"id": "r16", "kind": "rule", "g": "nate", "t": "Enforce verification with a gate", "n": 16, "conf": "demonstrated", "body": [{"t": "p", "h": "A hook that blocks \"done\" until the check has run beats a reminder in the prompt."}, {"t": "q", "h": "\"it's a step that we have to make sure that the agent can't skip\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=455s\" target=\"_blank\" rel=\"noopener\">7:35<\/a>"}, {"t": "q", "h": "Also: \"every single skill that I build works in some sort of verification loop\" <a href=\"https://www.youtube.com/watch?v=9KOtMsZ9I28&amp;t=580s\" target=\"_blank\" rel=\"noopener\">9:40<\/a>"}, {"t": "check", "h": "<em>What stops the agent claiming this works without running it?<\/em> (Concept 15)"}], "concepts": [15], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 4}, {"id": "r17", "kind": "rule", "g": "nate", "t": "Test in the real setting before trusting it", "n": 17, "conf": "stated, demonstrated", "body": [{"t": "p", "h": "Define done first, test on real tasks and the real environment, and try to break it. \"It works\" may only be true where it was tried."}, {"t": "q", "h": "\"saying that it works was only true in one specific setting or terminal.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=548s\" target=\"_blank\" rel=\"noopener\">9:08<\/a>"}, {"t": "q", "h": "Also: \"You have to define what done looks like before you even start building.\" <a href=\"https://www.youtube.com/watch?v=3XIGcM7VICc&amp;t=760s\" target=\"_blank\" rel=\"noopener\">12:40<\/a>; \"Before returning the final output, define the acceptance criteria.\" <a href=\"https://www.youtube.com/watch?v=HIRDzMtuWFk&amp;t=485s\" target=\"_blank\" rel=\"noopener\">8:05<\/a>; \"does this answer like a teammate\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=764s\" target=\"_blank\" rel=\"noopener\">12:44<\/a>"}, {"t": "check", "h": "<em>Where was this tested? On Charlie's real device and real data?<\/em> (Concept 16)"}], "concepts": [16], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 6}, {"id": "r18", "kind": "rule", "g": "nate", "t": "Human understanding is the finish line", "n": 18, "conf": "stated", "body": [{"t": "p", "h": "The system should leave Charlie understanding what he built and how his OS is laid out, not just holding output."}, {"t": "q", "h": "\"you can outsource your thinking, but you cannot outsource your understanding.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=608s\" target=\"_blank\" rel=\"noopener\">10:08<\/a> (Nate quoting Karpathy)"}, {"t": "q", "h": "\"I actually understand my own second brain\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1131s\" target=\"_blank\" rel=\"noopener\">18:51<\/a>"}, {"t": "check", "h": "<em>Could Charlie explain this change in his own words?<\/em> (Concept 17)"}], "concepts": [17], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 4}, {"id": "r19", "kind": "rule", "g": "nate", "t": "Keep the router under 200 lines", "n": 19, "conf": "stated", "body": [{"t": "p", "h": "It is re-read with every message, so every line costs on every turn; past the limit it gets ignored."}, {"t": "q", "h": "\"So keep it under 200 lines.\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=20187s\" target=\"_blank\" rel=\"noopener\">5:36:27<\/a>"}, {"t": "q", "h": "Also: \"if it grows too big, it can start to get messy and feel ignored\" <a href=\"https://www.youtube.com/watch?v=DTCyvo6cC54&amp;t=304s\" target=\"_blank\" rel=\"noopener\">5:04<\/a>"}, {"t": "check", "h": "<em>How long is the router now? Does this addition need to live there?<\/em> (Concept 18)"}], "concepts": [18], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 4}, {"id": "r20", "kind": "rule", "g": "nate", "t": "Register every new skill or folder in the router, and log it", "n": 20, "conf": "stated", "body": [{"t": "p", "h": "A skill or folder the router doesn't mention is one the agent won't find; the decision to add it goes in the log."}, {"t": "q", "h": "\"It's going to register the skill in claw.md and it's going to log its decisions.\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=5408s\" target=\"_blank\" rel=\"noopener\">1:30:08<\/a>"}, {"t": "q", "h": "Also: \"you're going to just want to make sure that your claused file is getting updated as well\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=1714s\" target=\"_blank\" rel=\"noopener\">28:34<\/a>"}, {"t": "check", "h": "<em>Is the new skill routed and logged with a date?<\/em> (Concept 3)"}], "concepts": [3], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 3}, {"id": "r21", "kind": "rule", "g": "nate", "t": "Skill descriptions are triggers: user's words, no overlap, trigger-tested", "n": 21, "conf": "stated", "body": [{"t": "p", "h": "Write the description in the words Charlie would say, make sure no two skills compete, then test obvious, reworded and unrelated requests."}, {"t": "q", "h": "\"Put the words a real person would use inside the description and make sure two skills aren't competing for the same request.\" <a href=\"https://www.youtube.com/watch?v=HIRDzMtuWFk&amp;t=242s\" target=\"_blank\" rel=\"noopener\">4:02<\/a>"}, {"t": "q", "h": "Also: \"The first one is an obvious request that should trigger it.\" <a href=\"https://www.youtube.com/watch?v=HIRDzMtuWFk&amp;t=273s\" target=\"_blank\" rel=\"noopener\">4:33<\/a>"}, {"t": "check", "h": "<em>Which other skill could fire on this request? Did a reworded request trigger it?<\/em> (Concept 21)"}], "concepts": [21], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 3}, {"id": "r22", "kind": "rule", "g": "nate", "t": "Validate skill and agent front matter", "n": 22, "conf": "stated", "body": [{"t": "p", "h": "A small syntax slip such as an unclosed quote stops a skill or agent firing, silently; check it with a script."}, {"t": "q", "h": "\"You have to close off the quotes if you open them up\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=9462s\" target=\"_blank\" rel=\"noopener\">2:37:42<\/a>"}, {"t": "check", "h": "<em>Does the front matter have a name, a description and a closing <code>---<\/code>?<\/em> (Concept 21)"}], "concepts": [21], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 3}, {"id": "r23", "kind": "rule", "g": "nate", "t": "New skills report only until battle-tested", "n": 23, "conf": "stated", "body": [{"t": "p", "h": "A new skill proposes and asks; it earns permission to act on its own after many good runs."}, {"t": "q", "h": "\"Once we've ran the skill 10, 20, 30 times and we've kind of like battle tested it and we feel more confident in it, then we can maybe make it a little bit more autonomous.\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=6457s\" target=\"_blank\" rel=\"noopener\">1:47:37<\/a>"}, {"t": "check", "h": "<em>How many times has this skill run? Should it still wait for a yes?<\/em> (Concept 22)"}], "concepts": [22], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 3}, {"id": "r24", "kind": "rule", "g": "nate", "t": "Sub-agents for bulky output, read-only by their tools, and not overused", "n": 24, "conf": "stated", "body": [{"t": "p", "h": "Send context-heavy searches to a sub-agent; limit its tools rather than asking nicely; skip it for quick or dependent steps."}, {"t": "q", "h": "\"is this about to dump a pile of stuff into my chat that I'll never read again?\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=9827s\" target=\"_blank\" rel=\"noopener\">2:43:47<\/a>"}, {"t": "q", "h": "Also: \"you can put that so that these sub-agents are explicitly read-only\" <a href=\"https://www.youtube.com/watch?v=e18sdZLwP7o&amp;t=430s\" target=\"_blank\" rel=\"noopener\">7:10<\/a>; \"if you're forcing too many sub agents, you're going to get worse results\" <a href=\"https://www.youtube.com/watch?v=e18sdZLwP7o&amp;t=1497s\" target=\"_blank\" rel=\"noopener\">24:57<\/a>"}, {"t": "check", "h": "<em>Would this output flood the main chat? Is the sub-agent's tool list read-only?<\/em> (Concept 23)"}], "concepts": [23], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 4}, {"id": "r25", "kind": "rule", "g": "nate", "t": "Block risky actions with settings and keys, not prompts", "n": 25, "conf": "stated", "body": [{"t": "p", "h": "A deny list in settings or a least-privilege key physically stops the action; an instruction in a prompt only asks."}, {"t": "q", "h": "\"A prompt is never a permission layer.\" <a href=\"https://www.youtube.com/watch?v=8QQ_INxAhRs&amp;t=1471s\" target=\"_blank\" rel=\"noopener\">24:31<\/a>"}, {"t": "q", "h": "Also: \"Can you help me update the settings file so that you physically cannot do those things?\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=4468s\" target=\"_blank\" rel=\"noopener\">1:14:28<\/a>"}, {"t": "check", "h": "<em>What actually stops this action if the agent ignores the instruction?<\/em> (Concept 24)"}], "concepts": [24], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 4}, {"id": "r26", "kind": "rule", "g": "nate", "t": "Secrets live in `.env`, never in chat or Git", "n": 26, "conf": "stated", "body": [{"t": "p", "h": "Put keys in an <code>.env<\/code> file excluded from pushes, not in the conversation history."}, {"t": "q", "h": "\"It's it's much more secure for you to paste in your API key into the ENV rather than you know giving it in the chat history\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=2510s\" target=\"_blank\" rel=\"noopener\">41:50<\/a>"}, {"t": "check", "h": "<em>Is any key in the chat, a committed file or this public repo?<\/em> (Concept 25)"}], "concepts": [25], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 3}, {"id": "r27", "kind": "rule", "g": "nate", "t": "Look at visual output before calling it done", "n": 27, "conf": "demonstrated", "body": [{"t": "p", "h": "For pages and apps, take a screenshot and check it; code that runs can still look broken."}, {"t": "q", "h": "\"we built a plan to add visual validation\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=3817s\" target=\"_blank\" rel=\"noopener\">1:03:37<\/a>"}, {"t": "check", "h": "<em>Has anyone looked at a screenshot of this on phone and desktop?<\/em> (Concept 16)"}], "concepts": [16], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 3}, {"id": "r28", "kind": "rule", "g": "nate", "t": "Save every audit and read the last one first", "n": 28, "conf": "stated", "body": [{"t": "p", "h": "Dated reports in an audits folder let the next audit see what was found and whether it was fixed."}, {"t": "q", "h": "\"look for earlier reports inside of the audit folder\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=614s\" target=\"_blank\" rel=\"noopener\">10:14<\/a>"}, {"t": "check", "h": "<em>Where is the last audit, and were its fixes done?<\/em> (Concept 7)"}], "concepts": [7], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 3}, {"id": "r29", "kind": "rule", "g": "nate", "t": "Hand off and clear before context rots", "n": 29, "conf": "stated", "body": [{"t": "p", "h": "Clear between unrelated tasks; in long sessions write a hand-off (done, files, open decisions, next) and start fresh."}, {"t": "q", "h": "\"here's what we did. Here's the files that were created. Here are open decisions. Here's what's next.\" <a href=\"https://www.youtube.com/watch?v=0WDkwMxj13s&amp;t=1344s\" target=\"_blank\" rel=\"noopener\">22:24<\/a>"}, {"t": "q", "h": "Also: \"Use slashclear between unrelated tasks.\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=19853s\" target=\"_blank\" rel=\"noopener\">5:30:53<\/a>; \"if we get past 250,000 300,000, I'm going to do a session handoff\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=7248s\" target=\"_blank\" rel=\"noopener\">2:00:48<\/a>"}, {"t": "check", "h": "<em>Is this session still on one task? Is the next step written down for a fresh one?<\/em> (Concept 27)"}], "concepts": [27], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 4}, {"id": "r30", "kind": "rule", "g": "nate", "t": "Extract knowledge by interview, not brain dump", "n": 30, "conf": "stated, demonstrated", "body": [{"t": "p", "h": "Have the agent ask one question at a time until it understands, and save the answers; a quick dump leaves gaps."}, {"t": "q", "h": "\"Interview me relentlessly about every aspect of this plan until we reach a shared understanding\" <a href=\"https://www.youtube.com/watch?v=c0kaKxM2pHg&amp;t=92s\" target=\"_blank\" rel=\"noopener\">1:32<\/a>"}, {"t": "q", "h": "Also: \"the bigger problem is getting everything out of your brain into the system\" <a href=\"https://www.youtube.com/watch?v=DTCyvo6cC54&amp;t=1338s\" target=\"_blank\" rel=\"noopener\">22:18<\/a>"}, {"t": "check", "h": "<em>Did this knowledge come from Charlie answering questions, and is it saved?<\/em> (Concept 26)"}], "concepts": [26], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 4}, {"id": "r31", "kind": "rule", "g": "nate", "t": "Context costs money and rots: act at about half the window", "n": 31, "conf": "stated", "body": [{"t": "p", "h": "Every message re-reads the whole chat, so long chats cost more and get worse; check what fills the window and act at about half, not when auto-compact fires."}, {"t": "q", "h": "\"Claude rereads the entire conversation from the beginning, and all of those are tokens that it's charging you for\" <a href=\"https://www.youtube.com/watch?v=49V-5Ock8LU&amp;t=64s\" target=\"_blank\" rel=\"noopener\">1:04<\/a>"}, {"t": "q", "h": "Also: \"somewhere around halfway through your context window, it starts to fall apart.\" <a href=\"https://www.youtube.com/watch?v=eRS3CmvrOvA&amp;t=272s\" target=\"_blank\" rel=\"noopener\">4:32<\/a>"}, {"t": "check", "h": "<em>Is this chat past about half the window, and do we know what is filling it?<\/em> (Concept 29)"}], "concepts": [29], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 4}, {"id": "r32", "kind": "rule", "g": "nate", "t": "Plan, let the AI attack the plan, then build", "n": 32, "conf": "stated", "body": [{"t": "p", "h": "Nate says plan first and have the AI play devil's advocate on the plan before building; save big plans to a file and work phase by phase. Charlie declined plan mode on 2026-10-08, so the 1-2 questions from the router stand in for it."}, {"t": "q", "h": "\"You ask Claude to start challenging you and pushing back and playing devil's advocate before it builds anything or before it approves any plan\" <a href=\"https://www.youtube.com/watch?v=iTY8Q449YNQ&amp;t=156s\" target=\"_blank\" rel=\"noopener\">2:36<\/a>"}, {"t": "q", "h": "Also: \"Have one for discovery where you can have Claude read through PDFs and read through the code base\" <a href=\"https://www.youtube.com/watch?v=_qZvORxGqI0&amp;t=1285s\" target=\"_blank\" rel=\"noopener\">21:25<\/a>"}, {"t": "check", "h": "<em>Did we ask 1-2 questions or have the AI attack the plan before a big build?<\/em> (Concept 30)"}], "concepts": [30], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 4}, {"id": "r33", "kind": "rule", "g": "nate", "t": "A separate checker decides \"done\"; then try to break it", "n": 33, "conf": "stated", "body": [{"t": "p", "h": "The worker doesn't mark its own homework: a different checker looks at it, then you stress test it for edge cases. When output is bad, ask whether it is the model, the tool or our own organisation."}, {"t": "q", "h": "\"Claude doesn't get to declare itself done. A different model has to look at it with a different persona\" <a href=\"https://www.youtube.com/watch?v=iTY8Q449YNQ&amp;t=1345s\" target=\"_blank\" rel=\"noopener\">22:25<\/a>"}, {"t": "q", "h": "Also: \"by the time it tells you it's done, you stress test it more. and you try to find those edge cases\" <a href=\"https://www.youtube.com/watch?v=iTY8Q449YNQ&amp;t=583s\" target=\"_blank\" rel=\"noopener\">9:43<\/a>"}, {"t": "check", "h": "<em>Who other than the builder checked this, and what did we try to break?<\/em> (Concept 31)"}], "concepts": [31], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 3}, {"id": "r34", "kind": "rule", "g": "nate", "t": "Skills do one job, are built from a real run, and retire when they stop earning", "n": 34, "conf": "stated", "body": [{"t": "p", "h": "One skill, one job; build it by walking the AI through a real task first, then turn that into the skill. Retire any skill that no longer adds value."}, {"t": "q", "h": "\"the whole idea is that you want a skill to do one very specific job\" <a href=\"https://www.youtube.com/watch?v=X-pbJWKmwi0&amp;t=3985s\" target=\"_blank\" rel=\"noopener\">1:06:25<\/a>"}, {"t": "q", "h": "Also: \"The way that I build my skills is I have Claude Code do something with me. I walk it through the steps\" <a href=\"https://www.youtube.com/watch?v=mpALXah_PBg&amp;t=22892s\" target=\"_blank\" rel=\"noopener\">6:21:32<\/a>"}, {"t": "check", "h": "<em>Does this skill do one job, come from a real run, and still earn its place?<\/em> (Concept 32)"}], "concepts": [32], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 4}, {"id": "r35", "kind": "rule", "g": "nate", "t": "Unattended runs: one-shot, stateless, bounded, tested by hand first, fixed parts in scripts", "n": 35, "conf": "stated", "body": [{"t": "p", "h": "A scheduled job can't stop and ask, only sees the repo, APIs and secrets, and needs a bounded scope. Test it by hand and prove one live run before switching on the schedule; put fixed steps in a script so the agent can't drift."}, {"t": "q", "h": "\"You're not around. So, you probably want to make sure that it doesn't ever have to stop and ask you questions.\" <a href=\"https://www.youtube.com/watch?v=ehg4fhydTgs&amp;t=93s\" target=\"_blank\" rel=\"noopener\">1:33<\/a>"}, {"t": "q", "h": "Also: \"the agent was just interpreting the message different every time and it just acted differently\" <a href=\"https://www.youtube.com/watch?v=X-pbJWKmwi0&amp;t=10825s\" target=\"_blank\" rel=\"noopener\">3:00:25<\/a>"}, {"t": "check", "h": "<em>Could this run finish with nobody there, and was it tested by hand first?<\/em> (Concept 33)"}], "concepts": [33], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 4}, {"id": "r36", "kind": "rule", "g": "nate", "t": "Permissions in layers: deny plus allow, start strict, helpers inherit, read-only and drafts first", "n": 36, "conf": "stated", "body": [{"t": "p", "h": "Deny the destructive commands and allow the safe ones; helpers inherit the main session's permissions; start read-only and draft-only with a human approving outward actions. Auto mode and bypass permissions are not adopted here."}, {"t": "q", "h": "\"go into your permissions and explicitly allow the commands that you know are safe\" <a href=\"https://www.youtube.com/watch?v=jqoFP9QapXI&amp;t=847s\" target=\"_blank\" rel=\"noopener\">14:07<\/a>"}, {"t": "q", "h": "Also: \"they inherit the permissions from the main session. So, if you're on bypass permissions, then all of your agents are going to be on bypass permissions\" <a href=\"https://www.youtube.com/watch?v=vDVSGVpB2vc&amp;t=731s\" target=\"_blank\" rel=\"noopener\">12:11<\/a>"}, {"t": "check", "h": "<em>Which commands are denied, which allowed, and does the helper inherit the same limits?<\/em> (Concept 34)"}], "concepts": [34], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 4}, {"id": "r37", "kind": "rule", "g": "nate", "t": "Check before anything goes public: security review, private-data hook, untrusted content, plugin vetting", "n": 37, "conf": "stated", "body": [{"t": "p", "h": "Run a security review before publishing, strip private data with a hook rather than a rule, treat web pages and transcripts as possibly hostile, and vet any plugin first."}, {"t": "q", "h": "\"I basically told it to run a security review and make sure that my API keys aren't exposed and that there's no vulnerabilities\" <a href=\"https://www.youtube.com/watch?v=saggDHHnmtQ&amp;t=1801s\" target=\"_blank\" rel=\"noopener\">30:01<\/a>"}, {"t": "q", "h": "Also: \"that there's a hook that fires to remove any PII, any sensitive data of that client that I don't want living on my GitHub.\" <a href=\"https://www.youtube.com/watch?v=6LNlCpQPYFc&amp;t=1439s\" target=\"_blank\" rel=\"noopener\">23:59<\/a>"}, {"t": "check", "h": "<em>Has a security and private-data check run before this goes public?<\/em> (Concept 35)"}], "concepts": [35], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 4}, {"id": "r38", "kind": "rule", "g": "nate", "t": "File hygiene: scratch apart from deliverables, folder READMEs, project first, start every task in the project", "n": 38, "conf": "stated", "body": [{"t": "p", "h": "Tell the AI where throwaway files go, give each folder a short README, keep everything in the project until it earns going global, and start tasks inside the project."}, {"t": "q", "h": "\"if we don't tell Claude how to organize its files, it's going to get messy quick to the point where I don't understand where things are\" <a href=\"https://www.youtube.com/watch?v=3GAxd90fEE4&amp;t=428s\" target=\"_blank\" rel=\"noopener\">7:08<\/a>"}, {"t": "q", "h": "Also: \"so that your agent always understands why does this folder exist and where should it look for different things\" <a href=\"https://www.youtube.com/watch?v=X-pbJWKmwi0&amp;t=5576s\" target=\"_blank\" rel=\"noopener\">1:32:56<\/a>"}, {"t": "check", "h": "<em>Is scratch work kept apart from deliverables, and does the folder explain itself?<\/em> (Concept 36)"}], "concepts": [36], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 4}, {"id": "r39", "kind": "rule", "g": "nate", "t": "Operator habits: paste the whole error, make it do its own chores, match model and effort, adopt tools only for real pain, cap parallel sessions, use the OS for everything", "n": 39, "conf": "stated", "body": [{"t": "p", "h": "Small habits: paste the full error, ask the AI to do chores it lists for you, use the cheapest model and effort that does the job, adopt a tool only for a real pain point, and keep to three or four parallel sessions."}, {"t": "q", "h": "\"this is the error that I got. And then I paste in all that messy stuff and shoot it off\" <a href=\"https://www.youtube.com/watch?v=saggDHHnmtQ&amp;t=1984s\" target=\"_blank\" rel=\"noopener\">33:04<\/a>"}, {"t": "q", "h": "Also: \"do not automatically run everything at maximum effort or even just high.\" <a href=\"https://www.youtube.com/watch?v=FBVNS1l5Vb8&amp;t=279s\" target=\"_blank\" rel=\"noopener\">4:39<\/a>"}, {"t": "check", "h": "<em>Is the model and effort matched to the task, and is this tool solving a real pain?<\/em> (Concept 37)"}], "concepts": [37], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 4}, {"id": "r40", "kind": "rule", "g": "nate", "t": "Parts rot at different speeds; score each audit", "n": 40, "conf": "stated", "body": [{"t": "p", "h": "Different parts of the OS go stale at different rates, so review each at its own pace and keep a score from every audit to see whether the OS is improving."}, {"t": "q", "h": "\"All of these different parts decay, become obsolete or rot at different rates.\" <a href=\"https://www.youtube.com/watch?v=6LNlCpQPYFc&amp;t=1377s\" target=\"_blank\" rel=\"noopener\">22:57<\/a>"}, {"t": "q", "h": "Also: \"it will store your scores every time so that you can see how you're actually improving your system\" <a href=\"https://www.youtube.com/watch?v=X-pbJWKmwi0&amp;t=3195s\" target=\"_blank\" rel=\"noopener\">53:15<\/a>"}, {"t": "check", "h": "<em>Which part of the OS is stalest, and what did the last audit score?<\/em> (Concept 38)"}], "concepts": [38], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 4}], "edges": [[".claude/agents/nate-brain.md", "AGENTS.md", "link"], [".claude/agents/nate-brain.md", "research/nate-herk/README.md", "link"], [".claude/agents/nate-brain.md", "research/nate-herk/brain/concepts.md", "link"], [".claude/agents/nate-brain.md", "research/nate-herk/brain/index.md", "link"], [".claude/agents/nate-brain.md", "research/nate-herk/brain/rules.md", "link"], [".claude/agents/nate-brain.md", "system/standard-ai-os-v1.md", "link"], [".claude/agents/nick-brain.md", "AGENTS.md", "link"], [".claude/agents/nick-brain.md", "context/about-me.md", "link"], [".claude/agents/nick-brain.md", "context/current-focus.md", "link"], [".claude/agents/nick-brain.md", "context/how-i-learn.md", "link"], [".claude/agents/nick-brain.md", "research/nick-saraev/brain/concepts.md", "link"], [".claude/agents/nick-brain.md", "research/nick-saraev/brain/index.md", "link"], [".claude/agents/nick-brain.md", "research/nick-saraev/brain/rules.md", "link"], [".claude/agents/nick-brain.md", "research/nick-saraev/brain/x-themes.md", "link"], [".claude/agents/video-tutor.md", "context/current-focus.md", "link"], [".claude/agents/video-tutor.md", "context/working-rules.md", "link"], [".claude/skills/audit/SKILL.md", ".claude/skills/audit/compatibility.md", "link"], [".claude/skills/audit/SKILL.md", ".claude/skills/audit/history.md", "link"], [".claude/skills/audit/SKILL.md", ".claude/skills/audit/rubric.md", "link"], [".claude/skills/audit/SKILL.md", ".claude/skills/audit/templates/report.md", "link"], [".claude/skills/audit/SKILL.md", ".claude/skills/os-audit/SKILL.md", "link"], [".claude/skills/audit/SKILL.md", "AGENTS.md", "link"], [".claude/skills/audit/SKILL.md", "CLAUDE.md", "link"], [".claude/skills/audit/SKILL.md", "THIRD-PARTY-NOTICES.md", "link"], [".claude/skills/audit/SKILL.md", "audits/README.md", "link"], [".claude/skills/audit/compatibility.md", "AGENTS.md", "link"], [".claude/skills/audit/compatibility.md", "CLAUDE.md", "link"], [".claude/skills/audit/history.md", ".claude/skills/audit/templates/report.md", "link"], [".claude/skills/audit/history.md", "audits/README.md", "link"], [".claude/skills/brain-ingest/SKILL.md", "context/current-focus.md", "link"], [".claude/skills/brain-ingest/SKILL.md", "context/environment.md", "link"], [".claude/skills/grill-me/SKILL.md", "AGENTS.md", "link"], [".claude/skills/grill-me/SKILL.md", "CLAUDE.md", "link"], [".claude/skills/grill-me/SKILL.md", "THIRD-PARTY-NOTICES.md", "link"], [".claude/skills/grill-me/SKILL.md", "context/README.md", "link"], [".claude/skills/grill-me/SKILL.md", "projects/README.md", "link"], [".claude/skills/grill-me/SKILL.md", "research/nate-herk/the-skill-that-10x-d-my-claude-code-projects--c0kaKxM2pHg-transcript.md", "link"], [".claude/skills/level-up/SKILL.md", ".claude/skills/level-up/references/3ms-framework.md", "link"], [".claude/skills/level-up/SKILL.md", "AGENTS.md", "link"], [".claude/skills/level-up/SKILL     <div class="list">${GROUPS.map(([g,name])=>`<button class="src" data-g="${g}" aria-pressed="${shown[g]}"><i style="background:${COL[g]}"></i>${esc(name)}<b>${cnt(g)}</b></button>`).join("")}</div>
    <div class="row2"><button class="pill" id="loose" aria-pressed="${looseOnly}">Loose ends · ${loose}</button><button class="pill" id="reset">Reset view</button></div>`;
}

/* ---------------- graph ---------------- */
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
let W=0,H=0,DPR=1,transform=d3.zoomIdentity;
const R = n => 2.2 + Math.sqrt(n.d)*1.15;
function anchor(g){
  const i = GROUPS.findIndex(x=>x[0]===g), a = (i/GROUPS.length)*Math.PI*2 - Math.PI/2;
  const rad = g==="core" ? 0 : 230;
  return [Math.cos(a)*rad, Math.sin(a)*rad];
}
N.forEach(n=>{ const [ax,ay]=anchor(n.g); n.x=ax+(Math.random()-.5)*80; n.y=ay+(Math.random()-.5)*80; });
const sim = d3.forceSimulation(N)
  .force("link", d3.forceLink(L).id(d=>d.id).distance(l=>l.k==="has"?26:l.k==="feeds"?22:46).strength(l=>l.k==="link"?0.08:0.3))
  .force("charge", d3.forceManyBody().strength(n=>-14-n.d*1.4).distanceMax(320))
  .force("x", d3.forceX(n=>anchor(n.g)[0]).strength(0.07))
  .force("y", d3.forceY(n=>anchor(n.g)[1]).strength(0.07))
  .force("collide", d3.forceCollide(n=>R(n)+1.5))
  .alphaDecay(0.035)
  .on("tick", draw);

function size(){
  const r = cv.getBoundingClientRect(); DPR = window.devicePixelRatio||1;
  W = r.width; H = r.height; cv.width = W*DPR; cv.height = H*DPR; draw();
}
function fit(){
  const xs=N.map(n=>n.x), ys=N.map(n=>n.y);
  const x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
  const narrow = W<700, padTop = narrow?150:40, padBot = narrow?80:40;
  const k = Math.min((W-40)/(x1-x0||1), (H-padTop-padBot)/(y1-y0||1), 2.2)*0.95;
  const cx = narrow ? W/2 : W*0.56;
  const t = d3.zoomIdentity.translate(cx - k*(x0+x1)/2, padTop + (H-padTop-padBot)/2 - k*(y0+y1)/2).scale(k);
  d3.select(cv).call(zoom.transform, t);
}
const zoom = d3.zoom().scaleExtent([0.2,8]).on("zoom", e=>{ transform=e.transform; draw(); });
d3.select(cv).call(zoom).on("dblclick.zoom", null);

function visible(n){
  if(!shown[n.g]) return false;
  if(looseOnly && n.d>1) return false;
  return true;
}
N.forEach(n=>{ n.s = (n.t+" "+n.id+" "+(n.kind==="file"?n.ex:n.body.map(b=>b.h).join(" "))).replace(/<[^>]+>/g,"").toLowerCase(); });
function hit(n){ return !query || n.s.includes(query); }

function draw(){
  if(!W) return;
  ctx.setTransform(DPR,0,0,DPR,0,0); ctx.clearRect(0,0,W,H);
  ctx.save(); ctx.translate(transform.x, transform.y); ctx.scale(transform.k, transform.k);
  const sel = selected ? new Set([selected, ...nbr[selected].map(x=>x[0])]) : null;
  // edges
  ctx.lineWidth = 0.6/transform.k;
  for(const l of L){
    const a=l.source, b=l.target; if(!visible(a)||!visible(b)) continue;
    const on = sel && (a.id===selected || b.id===selected);
    ctx.strokeStyle = on ? COL[(a.id===selected?b:a).g] : "rgba(140,151,173," + (sel||query?0.05:0.13) + ")";
    if(on) ctx.lineWidth = 1.4/transform.k; else ctx.lineWidth = 0.6/transform.k;
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  }
  // nodes
  for(const n of N){
    if(!visible(n)) continue;
    const dim = (sel && !sel.has(n.id)) || (query && !hit(n));
    const f = flags[docId(n.id)];
    ctx.globalAlpha = dim ? 0.14 : 1;
    ctx.fillStyle = COL[n.g];
    ctx.beginPath(); ctx.arc(n.x,n.y,R(n),0,Math.PI*2); ctx.fill();
    if(f && f.kind){ ctx.strokeStyle = f.kind==="confusing"?css.getPropertyValue("--confuse"):f.kind==="delete"?css.getPropertyValue("--del"):css.getPropertyValue("--keep"); ctx.lineWidth=2/transform.k; ctx.beginPath(); ctx.arc(n.x,n.y,R(n)+2.5/transform.k,0,Math.PI*2); ctx.stroke(); }
    if(n.id===selected){ ctx.strokeStyle="#fff"; ctx.lineWidth=2/transform.k; ctx.beginPath(); ctx.arc(n.x,n.y,R(n)+4/transform.k,0,Math.PI*2); ctx.stroke(); }
  }
  ctx.globalAlpha = 1;
  // labels: big hubs always, neighbours when selected, matches when searching
  ctx.font = `500 ${11/transform.k}px JetBrains Mono, monospace`; ctx.textAlign="center";
  for(const n of N){
    if(!visible(n)) continue;
    const want = (sel && sel.has(n.id)) || (query && hit(n) && N.filter(hit).length<40) || (!sel && !query && n.d >= 28 && transform.k>0.5) || (transform.k>2.4 && !sel);
    if(!want) continue;
    const s = n.kind==="file" ? n.t.slice(0,34) : (n.kind==="concept"?"C":"R")+n.n;
    ctx.fillStyle = "rgba(7,10,18,.75)"; const w = ctx.measureText(s).width;
    ctx.fillRect(n.x-w/2-3/transform.k, n.y-R(n)-16/transform.k, w+6/transform.k, 13/transform.k);
    ctx.fillStyle = "#e8ecf5"; ctx.fillText(s, n.x, n.y-R(n)-6/transform.k);
  }
  ctx.restore();
}
cv.addEventListener("click", e=>{
  const r = cv.getBoundingClientRect();
  const [x,y] = transform.invert([e.clientX-r.left, e.clientY-r.top]);
  let best=null, bd=Infinity;
  for(const n of N){ if(!visible(n)) continue; const d=Math.hypot(n.x-x,n.y-y); if(d<bd){bd=d;best=n;} }
  if(best && bd < R(best) + 14/transform.k) select(best.id); else { selected=null; document.getElementById("sheet").hidden=true; draw(); }
});

/* ---------------- note body (shared by map + review) ---------------- */
function bodyHTML(n){
  if(n.kind==="file"){
    return `<p>${esc(n.ex||"(empty file)")}</p><p class="muted"><code>${esc(n.id)}</code> · <a href="${n.u}" target="_blank" rel="noopener">Open full file on GitHub</a></p>`;
  }
  let h = n.body.map(b=> b.t==="q" ? `<blockquote>${b.h}</blockquote>` : b.t==="check" ? `<div class="check"><b>Agent check</b>${b.h}</div>` : `<p>${b.h}</p>`).join("");
  if(n.kind==="concept" && !n.rules.length) h += `<p class="muted" style="color:var(--confuse)">Not linked to any rule. Brain says: ${n.note||"no rule yet"}</p>`;
  if(n.kind==="rule" && !n.concepts.length) h += `<p class="muted" style="color:var(--confuse)">No concept points to this rule.</p>`;
  return h;
}
function connsHTML(n){
  const list = nbr[n.id].slice().sort((a,b)=>byId[b[0]].d-byId[a[0]].d);
  if(!list.length) return `<div class="conns"><h4>Connections</h4><p class="muted">Nothing links here yet. This is a loose end.</p></div>`;
  const max = 40;
  return `<div class="conns"><h4>${list.length} connection${list.length>1?"s":""}</h4><ul>${list.slice(0,max).map(([id,k,dir])=>{
    const m=byId[id]; return `<li><button data-go="${esc(id)}"><i style="background:${COL[m.g]}"></i><span>${esc(label(m))}</span><em>${dir==="out"?KLABEL[k]:"from"}</em></button></li>`;}).join("")}</ul>${list.length>max?`<p class="muted">+ ${list.length-max} more</p>`:""}</div>`;
}
function markHTML(n){
  const f = flags[docId(n.id)]||{};
  return `<div class="mark" data-mark="${esc(n.id)}"><div class="btns">
    <button data-k="keep" aria-pressed="${f.kind==="keep"}">Keep</button>
    <button data-k="confusing" aria-pressed="${f.kind==="confusing"}">Confusing</button>
    <button data-k="delete" aria-pressed="${f.kind==="delete"}">Delete?</button></div>
    <textarea id="note-${esc(docId(n.id))}" placeholder="What's unclear, or why delete it?">${esc(f.note||"")}</textarea><div class="st"></div></div>`;
}
function headHTML(n, close){
  const sub = n.kind==="concept" ? `Nate's concept ${n.n} · section ${n.sec}` : n.kind==="rule" ? `Nate's rule ${n.n}${n.conf?" · "+esc(n.conf):""}` : GNAME[n.g] + (n.cr?" · "+n.cr:"");
  return `<div class="sh-head"><div class="t"><span class="tag"><i style="background:${COL[n.g]}"></i>${sub}</span><h2>${esc(n.kind==="file"?n.t:n.t)}</h2></div>${close?'<button class="x" id="close" aria-label="Close">✕</button>':""}</div>`;
}
function select(id){
  selected = id; const n = byId[id], sh = document.getElementById("sheet");
  sh.innerHTML = headHTML(n,true) + `<div class="sh-body">${bodyHTML(n)}${connsHTML(n)}</div>` + markHTML(n);
  sh.hidden = false; draw();
}

/* ---------------- review ---------------- */
let rvSet = "nate", rvTodo = true, rvIdx = 0;
function queue(){
  let q = rvSet==="nate" ? N.filter(n=>n.g==="nate") : rvSet==="loose" ? N.filter(n=>n.d<=1) : N.filter(n=>n.kind==="file" && n.g!=="transcripts" && n.g!=="templates");
  q.sort((a,b)=> (a.kind===b.kind ? (a.n||0)-(b.n||0) : a.kind==="concept"?-1:1) || a.id.localeCompare(b.id));
  if(rvSet==="nate"){ // concept, then the rules it feeds
    const out=[], seen=new Set();
    N.filter(n=>n.kind==="concept").sort((a,b)=>a.n-b.n).forEach(c=>{ out.push(c); seen.add(c.id); c.rules.forEach(r=>{ if(!seen.has("r"+r)){ out.push(byId["r"+r]); seen.add("r"+r);} }); });
    N.filter(n=>n.kind==="rule"&&!seen.has(n.id)).forEach(r=>out.push(r));
    q = out;
  }
  return q;
}
function renderReview(){
  const all = queue(), todo = all.filter(n=>!(flags[docId(n.id)]||{}).kind);
  const q = rvTodo ? todo : all;
  if(rvIdx >= q.length) rvIdx = Math.max(0,q.length-1);
  const cnt = k => all.filter(n=>(flags[docId(n.id)]||{}).kind===k).length;
  const done = all.length - todo.length, pct = x => (x/all.length*100)+"%";
  const n = q[rvIdx];
  document.getElementById("rv").innerHTML = `
    <div class="rv-top">
      <button class="pill" data-set="nate" aria-pressed="${rvSet==="nate"}">Nate's brain · ${N.filter(n=>n.g==="nate").length}</button>
      <button class="pill" data-set="ours" aria-pressed="${rvSet==="ours"}">Our OS files · ${N.filter(n=>n.kind==="file"&&n.g!=="transcripts"&&n.g!=="templates").length}</button>
      <button class="pill" data-set="loose" aria-pressed="${rvSet==="loose"}">Loose ends · ${loose}</button>
      <button class="pill" id="todo" aria-pressed="${rvTodo}">Unreviewed only</button>
    </div>
    <div class="prog"><span>${done} / ${all.length}</span><div class="bar"><span style="width:${pct(cnt("keep"))};background:var(--keep)"></span><span style="width:${pct(cnt("confusing"))};background:var(--confuse)"></span><span style="width:${pct(cnt("delete"))};background:var(--del)"></span></div><span>${cnt("confusing")} ? · ${cnt("delete")} ✕</span></div>
    ${n ? `<article class="card">${headHTML(n,false)}<div class="sh-body">${bodyHTML(n)}${connsHTML(n)}</div>${markHTML(n)}</article>
      <div class="nav"><button id="prev" ${rvIdx?"":"disabled"}>← Back</button><button id="onmap">Show on map</button><button id="next" ${rvIdx<q.length-1?"":"disabled"}>Skip →</button></div>`
      : `<div class="done"><b>All reviewed.</b>Every card in this set has a mark. Tell Claude "read my marks".</div>`}`;
}

/* ---------------- saving ---------------- */
const timers = {};
async function save(id, st){
  const did = docId(id), f = flags[did]||{}, n = byId[id];
  if(!db){ try{ localStorage.setItem("brain-flags", JSON.stringify(flags)); }catch(e){} if(st) st.textContent="Saved in this browser only"; return; }
  try{
    if(!f.kind && !f.note) await db.collection("flags").doc(did).delete();
    else await db.collection("flags").doc(did).set({item:id, kind:f.kind||null, note:f.note||"", title:n.t, updatedAt:new Date().toISOString()});
    if(st) st.textContent="Saved";
  }catch(e){ if(st) st.textContent = e && e.code==="not_granted" ? "Couldn't save: you can only view this page." : "Couldn't save. Try again in a moment."; }
}

/* ---------------- events ---------------- */
function showTab(t){
  document.getElementById("t-map").setAttribute("aria-selected", t==="map");
  document.getElementById("t-rev").setAttribute("aria-selected", t==="rev");
  document.getElementById("map").hidden = t!=="map";
  document.getElementById("review").hidden = t!=="rev";
  if(t==="rev") renderReview(); else { size(); }
}
document.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.id==="t-map") return showTab("map");
  if(b.id==="t-rev") return showTab("rev");
  if(b.id==="close"){ selected=null; document.getElementById("sheet").hidden=true; draw(); return; }
  if(b.id==="lg-t"){ document.getElementById("legend").classList.toggle("min"); renderLegend(); return; }
  if(b.id==="loose"){ looseOnly=!looseOnly; renderLegend(); draw(); return; }
  if(b.id==="reset"){ GROUPS.forEach(([g])=>shown[g]=true); looseOnly=false; selected=null; document.getElementById("sheet").hidden=true; renderLegend(); fit(); return; }
  if(b.dataset.g){ shown[b.dataset.g]=!shown[b.dataset.g]; renderLegend(); draw(); return; }
  if(b.dataset.go){
    if(!document.getElementById("review").hidden){ showTab("map"); }
    const n = byId[b.dataset.go]; shown[n.g]=true; looseOnly=false; renderLegend(); select(n.id);
    const k = Math.max(transform.k,1.6); d3.select(cv).transition().duration(450).call(zoom.transform, d3.zoomIdentity.translate(W/2-k*n.x, H*0.35-k*n.y).scale(k));
    return;
  }
  if(b.dataset.set){ rvSet=b.dataset.set; rvIdx=0; renderReview(); return; }
  if(b.id==="todo"){ rvTodo=!rvTodo; rvIdx=0; renderReview(); return; }
  if(b.id==="prev"){ rvIdx--; renderReview(); return; }
  if(b.id==="next"){ rvIdx++; renderReview(); return; }
  if(b.id==="onmap"){ const id = document.querySelector("#rv [data-mark]")?.dataset.mark; if(id){ b.dataset.go=id; b.click(); } return; }
  const m = b.closest("[data-mark]");
  if(m && b.dataset.k){
    const id = m.dataset.mark, did = docId(id), f = flags[did] || (flags[did]={});
    f.kind = f.kind===b.dataset.k ? null : b.dataset.k;
    const inReview = !document.getElementById("review").hidden;
    if(inReview){ if(!rvTodo && f.kind) rvIdx++; renderReview(); } else { select(id); }
    renderNums(); draw();
    save(id, document.querySelector("#"+(inReview?"rv":"sheet")+" .st"));
  }
});
document.addEventListener("input", e=>{
  if(e.target.id==="q"){ query=e.target.value.trim().toLowerCase(); draw(); return; }
  if(e.target.id && e.target.id.startsWith("note-")){
    const m = e.target.closest("[data-mark]"), id = m.dataset.mark, did = docId(id), f = flags[did] || (flags[did]={});
    f.note = e.target.value; const st = m.querySelector(".st"); st.textContent="Typing…";
    clearTimeout(timers[did]); timers[did] = setTimeout(()=>save(id, st), 900);
  }
});
document.getElementById("q").addEventListener("keydown", e=>{
  if(e.key==="Enter"){ const m = N.filter(n=>visible(n)&&hit(n)).sort((a,b)=>b.d-a.d)[0]; if(m){ const t=document.createElement("button"); t.dataset.go=m.id; document.body.appendChild(t); t.click(); t.remove(); } }
});
window.addEventListener("resize", size);

/* ---------------- start ---------------- */
renderNums(); renderLegend(); size();
for(let i=0;i<220;i++) sim.tick();
fit(); sim.alpha(0.05).restart();
try{ const s=localStorage.getItem("brain-flags"); if(s){ flags=JSON.parse(s)||{}; renderNums(); draw(); } }catch(e){}
(async()=>{
  try{ db = await window.claude?.use?.("db"); }catch(e){ db=null; }
  if(!db) return;
  db.collection("flags").onSnapshot(snap=>{
    const next = {};
    snap.docs.forEach(d=>{ const v=d.data(); if(v) next[d.id]={kind:v.kind||null, note:v.note||""}; });
    const a = document.activeElement;
    if(a && a.id && a.id.startsWith("note-")){ const did=a.id.slice(5); if(flags[did]) next[did]=flags[did]; }
    flags = next; renderNums(); draw();
    if(!(a && a.id && a.id.startsWith("note-"))){
      if(!document.getElementById("review").hidden) renderReview();
      else if(selected) select(selected);
    }
  });
})();
</script>
