"}, {"t": "q", "h": "\"the more you can segment stuff out, the better.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1221s\" target=\"_blank\" rel=\"noopener\">20:21<\/a>"}, {"t": "p", "h": "Claude suggested his own split, <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1039s\" target=\"_blank\" rel=\"noopener\">17:19<\/a>."}, {"t": "check", "h": "<em>Is this folder mixing two kinds of growing material? Would splitting it narrow the search?<\/em> (Concept 5)"}]}, {"n": 10, "title": "Automate what arrives on a schedule", "conf": "stated", "concepts": [6], "body": [{"t": "p", "h": "If you keep asking for the same pull, make it a cron or routine."}, {"t": "q", "h": "\"Build automations to update data.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1131s\" target=\"_blank\" rel=\"noopener\">18:51<\/a>"}, {"t": "check", "h": "<em>Has Charlie asked for this same fetch again and again? Then schedule it.<\/em> (Concept 6)"}]}, {"n": 11, "title": "Backtrack every miss, then fix the route", "conf": "stated", "concepts": [9], "body": [{"t": "p", "h": "Have the agent explain where it looked and why it missed, then update the routing or move files. Just telling it not to let that happen again is weaker."}, {"t": "q", "h": "\"Have it update the routing.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1402s\" target=\"_blank\" rel=\"noopener\">23:22<\/a>"}, {"t": "q", "h": "Also: \"every time you correct AI, you feed that correction back into the system\" <a href=\"https://www.youtube.com/watch?v=3XIGcM7VICc&amp;t=397s\" target=\"_blank\" rel=\"noopener\">6:37<\/a>; \"update the skill in the smallest durable place\" <a href=\"https://www.youtube.com/watch?v=HIRDzMtuWFk&amp;t=365s\" target=\"_blank\" rel=\"noopener\">6:05<\/a>"}, {"t": "check", "h": "<em>Where did it look, why did it miss, and what line in the router changes?<\/em> (Concept 9)"}]}, {"n": 12, "title": "Raw evidence stays untouched; the brain is derived from it", "conf": "demonstrated", "concepts": [10], "body": [{"t": "p", "h": "Keep transcripts and posts as-is in raw files; build the wiki pages on top and record what was fetched."}, {"t": "q", "h": "\"The raw files don't get touched\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=244s\" target=\"_blank\" rel=\"noopener\">4:04<\/a>"}, {"t": "check", "h": "<em>Is anyone editing a raw transcript? Is there a record of what was fetched?<\/em> (Concept 10)"}]}, {"n": 13, "title": "No source, no rule; label inference", "conf": "stated, demonstrated", "concepts": [12], "body": [{"t": "p", "h": "Every rule links to an exact quote and where it came from; unsourced reasoning says it is inferred."}, {"t": "q", "h": "\"if there is no source, the agent has to say explicitly that it's inferring\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=394s\" target=\"_blank\" rel=\"noopener\">6:34<\/a>"}, {"t": "check", "h": "<em>Can each claim be clicked back to a timestamp?<\/em> (Concept 12)"}]}, {"n": 14, "title": "Ingest relationally", "conf": "demonstrated", "concepts": [11, 13], "body": [{"t": "p", "h": "A new source updates every page it touches plus the index and log. A one-source rule is provisional until a second source backs it."}, {"t": "q", "h": "\"it will update every page that post touches.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=578s\" target=\"_blank\" rel=\"noopener\">9:38<\/a>"}, {"t": "check", "h": "<em>Which concepts and rules does this new source change? Did index and log get updated?<\/em> (Concepts 11, 13)"}]}, {"n": 15, "title": "Turn distilled knowledge into an agent plus a skill", "conf": "demonstrated", "concepts": [14], "body": [{"t": "p", "h": "The agent holds the rules and runs in its own context; the skill is the entry point and grades answers against the rules."}, {"t": "q", "h": "\"So, those are the two things we have, a Karpathy agent and a Karpathy skill.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=425s\" target=\"_blank\" rel=\"noopener\">7:05<\/a>"}, {"t": "p", "h": "<em>Supporting, a challenge:<\/em> keep skills less specific so they don't hold newer models back, <a href=\"https://www.youtube.com/watch?v=XNQBCRcwXV4&amp;t=341s\" target=\"_blank\" rel=\"noopener\">5:41<\/a> (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/i-deleted-all-my-claude-skills-and-claude-got-smarter--XNQBCRcwXV4-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "q", "h": "Also: \"They could literally just be a 50line markdown file.\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=5134s\" target=\"_blank\" rel=\"noopener\">1:25:34<\/a>"}, {"t": "p", "h": "<em>Newer wins:<\/em> XNQ is #54 in upload order; the newer 9KO (#16) and HIR (#22) still build skills, now with verification loops and trigger tests (Rules 16, 21), so read XNQ as \"less specific\", not \"no skills\"."}, {"t": "check", "h": "<em>Is there already an agent or skill for this? Is the new one short?<\/em> (Concept 14)"}]}, {"n": 16, "title": "Enforce verification with a gate", "conf": "demonstrated", "concepts": [15], "body": [{"t": "p", "h": "A hook that blocks \"done\" until the check has run beats a reminder in the prompt."}, {"t": "q", "h": "\"it's a step that we have to make sure that the agent can't skip\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=455s\" target=\"_blank\" rel=\"noopener\">7:35<\/a>"}, {"t": "q", "h": "Also: \"every single skill that I build works in some sort of verification loop\" <a href=\"https://www.youtube.com/watch?v=9KOtMsZ9I28&amp;t=580s\" target=\"_blank\" rel=\"noopener\">9:40<\/a>"}, {"t": "check", "h": "<em>What stops the agent claiming this works without running it?<\/em> (Concept 15)"}]}, {"n": 17, "title": "Test in the real setting before trusting it", "conf": "stated, demonstrated", "concepts": [16], "body": [{"t": "p", "h": "Define done first, test on real tasks and the real environment, and try to break it. \"It works\" may only be true where it was tried."}, {"t": "q", "h": "\"saying that it works was only true in one specific setting or terminal.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=548s\" target=\"_blank\" rel=\"noopener\">9:08<\/a>"}, {"t": "q", "h": "Also: \"You have to define what done looks like before you even start building.\" <a href=\"https://www.youtube.com/watch?v=3XIGcM7VICc&amp;t=760s\" target=\"_blank\" rel=\"noopener\">12:40<\/a>; \"Before returning the final output, define the acceptance criteria.\" <a href=\"https://www.youtube.com/watch?v=HIRDzMtuWFk&amp;t=485s\" target=\"_blank\" rel=\"noopener\">8:05<\/a>; \"does this answer like a teammate\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=764s\" target=\"_blank\" rel=\"noopener\">12:44<\/a>"}, {"t": "check", "h": "<em>Where was this tested? On Charlie's real device and real data?<\/em> (Concept 16)"}]}, {"n": 18, "title": "Human understanding is the finish line", "conf": "stated", "concepts": [17], "body": [{"t": "p", "h": "The system should leave Charlie understanding what he built and how his OS is laid out, not just holding output."}, {"t": "q", "h": "\"you can outsource your thinking, but you cannot outsource your understanding.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=608s\" target=\"_blank\" rel=\"noopener\">10:08<\/a> (Nate quoting Karpathy)"}, {"t": "q", "h": "\"I actually understand my own second brain\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1131s\" target=\"_blank\" rel=\"noopener\">18:51<\/a>"}, {"t": "check", "h": "<em>Could Charlie explain this change in his own words?<\/em> (Concept 17)"}]}, {"n": 19, "title": "Keep the router under 200 lines", "conf": "stated", "concepts": [18], "body": [{"t": "p", "h": "It is re-read with every message, so every line costs on every turn; past the limit it gets ignored."}, {"t": "q", "h": "\"So keep it under 200 lines.\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=20187s\" target=\"_blank\" rel=\"noopener\">5:36:27<\/a>"}, {"t": "q", "h": "Also: \"if it grows too big, it can start to get messy and feel ignored\" <a href=\"https://www.youtube.com/watch?v=DTCyvo6cC54&amp;t=304s\" target=\"_blank\" rel=\"noopener\">5:04<\/a>"}, {"t": "check", "h": "<em>How long is the router now? Does this addition need to live there?<\/em> (Concept 18)"}]}, {"n": 20, "title": "Register every new skill or folder in the router, and log it", "conf": "stated", "concepts": [3], "body": [{"t": "p", "h": "A skill or folder the router doesn't mention is one the agent won't find; the decision to add it goes in the log."}, {"t": "q", "h": "\"It's going to register the skill in claw.md and it's going to log its decisions.\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=5408s\" target=\"_blank\" rel=\"noopener\">1:30:08<\/a>"}, {"t": "q", "h": "Also: \"you're going to just want to make sure that your claused file is getting updated as well\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=1714s\" target=\"_blank\" rel=\"noopener\">28:34<\/a>"}, {"t": "check", "h": "<em>Is the new skill routed and logged with a date?<\/em> (Concept 3)"}]}, {"n": 21, "title": "Skill descriptions are triggers: user's words, no overlap, trigger-tested", "conf": "stated", "concepts": [21], "body": [{"t": "p", "h": "Write the description in the words Charlie would say, make sure no two skills compete, then test obvious, reworded and unrelated requests."}, {"t": "q", "h": "\"Put the words a real person would use inside the description and make sure two skills aren't competing for the same request.\" <a href=\"https://www.youtube.com/watch?v=HIRDzMtuWFk&amp;t=242s\" target=\"_blank\" rel=\"noopener\">4:02<\/a>"}, {"t": "q", "h": "Also: \"The first one is an obvious request that should trigger it.\" <a href=\"https://www.youtube.com/watch?v=HIRDzMtuWFk&amp;t=273s\" target=\"_blank\" rel=\"noopener\">4:33<\/a>"}, {"t": "check", "h": "<em>Which other skill could fire on this request? Did a reworded request trigger it?<\/em> (Concept 21)"}]}, {"n": 22, "title": "Validate skill and agent front matter", "conf": "stated", "concepts": [21], "body": [{"t": "p", "h": "A small syntax slip such as an unclosed quote stops a skill or agent firing, silently; check it with a script."}, {"t": "q", "h": "\"You have to close off the quotes if you open them up\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=9462s\" target=\"_blank\" rel=\"noopener\">2:37:42<\/a>"}, {"t": "check", "h": "<em>Does the front matter have a name, a description and a closing <code>---<\/code>?<\/em> (Concept 21)"}]}, {"n": 23, "title": "New skills report only until battle-tested", "conf": "stated", "concepts": [22], "body": [{"t": "p", "h": "A new skill proposes and asks; it earns permission to act on its own after many good runs."}, {"t": "q", "h": "\"Once we've ran the skill 10, 20, 30 times and we've kind of like battle tested it and we feel more confident in it, then we can maybe make it a little bit more autonomous.\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=6457s\" target=\"_blank\" rel=\"noopener\">1:47:37<\/a>"}, {"t": "check", "h": "<em>How many times has this skill run? Should it still wait for a yes?<\/em> (Concept 22)"}]}, {"n": 24, "title": "Sub-agents for bulky output, read-only by their tools, and not overused", "conf": "stated", "concepts": [23], "body": [{"t": "p", "h": "Send context-heavy searches to a sub-agent; limit its tools rather than asking nicely; skip it for quick or dependent steps."}, {"t": "q", "h": "\"is this about to dump a pile of stuff into my chat that I'll never read again?\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=9827s\" target=\"_blank\" rel=\"noopener\">2:43:47<\/a>"}, {"t": "q", "h": "Also: \"you can put that so that these sub-agents are explicitly read-only\" <a href=\"https://www.youtube.com/watch?v=e18sdZLwP7o&amp;t=430s\" target=\"_blank\" rel=\"noopener\">7:10<\/a>; \"if you're forcing too many sub agents, you're going to get worse results\" <a href=\"https://www.youtube.com/watch?v=e18sdZLwP7o&amp;t=1497s\" target=\"_blank\" rel=\"noopener\">24:57<\/a>"}, {"t": "check", "h": "<em>Would this output flood the main chat? Is the sub-agent's tool list read-only?<\/em> (Concept 23)"}]}, {"n": 25, "title": "Block risky actions with settings and keys, not prompts", "conf": "stated", "concepts": [24], "body": [{"t": "p", "h": "A deny list in settings or a least-privilege key physically stops the action; an instruction in a prompt only asks."}, {"t": "q", "h": "\"A prompt is never a permission layer.\" <a href=\"https://www.youtube.com/watch?v=8QQ_INxAhRs&amp;t=1471s\" target=\"_blank\" rel=\"noopener\">24:31<\/a>"}, {"t": "q", "h": "Also: \"Can you help me update the settings file so that you physically cannot do those things?\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=4468s\" target=\"_blank\" rel=\"noopener\">1:14:28<\/a>"}, {"t": "check", "h": "<em>What actually stops this action if the agent ignores the instruction?<\/em> (Concept 24)"}]}, {"n": 26, "title": "Secrets live in `.env`, never in chat or Git", "conf": "stated", "concepts": [25], "body": [{"t": "p", "h": "Put keys in an <code>.env<\/code> file excluded from pushes, not in the conversation history."}, {"t": "q", "h": "\"It's it's much more secure for you to paste in your API key into the ENV rather than you know giving it in the chat history\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=2510s\" target=\"_blank\" rel=\"noopener\">41:50<\/a>"}, {"t": "check", "h": "<em>Is any key in the chat, a committed file or this public repo?<\/em> (Concept 25)"}]}, {"n": 27, "title": "Look at visual output before calling it done", "conf": "demonstrated", "concepts": [16], "body": [{"t": "p", "h": "For pages and apps, take a screenshot and check it; code that runs can still look broken."}, {"t": "q", "h": "\"we built a plan to add visual validation\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=3817s\" target=\"_blank\" rel=\"noopener\">1:03:37<\/a>"}, {"t": "check", "h": "<em>Has anyone looked at a screenshot of this on phone and desktop?<\/em> (Concept 16)"}]}, {"n": 28, "title": "Save every audit and read the last one first", "conf": "stated", "concepts": [7], "body": [{"t": "p", "h": "Dated reports in an audits folder let the next audit see what was found and whether it was fixed."}, {"t": "q", "h": "\"look for earlier reports inside of the audit folder\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=614s\" target=\"_blank\" rel=\"noopener\">10:14<\/a>"}, {"t": "check", "h": "<em>Where is the last audit, and were its fixes done?<\/em> (Concept 7)"}]}, {"n": 29, "title": "Hand off and clear before context rots", "conf": "stated", "concepts": [27], "body": [{"t": "p", "h": "Clear between unrelated tasks; in long sessions write a hand-off (done, files, open decisions, next) and start fresh."}, {"t": "q", "h": "\"here's what we did. Here's the files that were created. Here are open decisions. Here's what's next.\" <a href=\"https://www.youtube.com/watch?v=0WDkwMxj13s&amp;t=1344s\" target=\"_blank\" rel=\"noopener\">22:24<\/a>"}, {"t": "q", "h": "Also: \"Use slashclear between unrelated tasks.\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=19853s\" target=\"_blank\" rel=\"noopener\">5:30:53<\/a>; \"if we get past 250,000 300,000, I'm going to do a session handoff\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=7248s\" target=\"_blank\" rel=\"noopener\">2:00:48<\/a>"}, {"t": "check", "h": "<em>Is this session still on one task? Is the next step written down for a fresh one?<\/em> (Concept 27)"}]}, {"n": 30, "title": "Extract knowledge by interview, not brain dump", "conf": "stated, demonstrated", "concepts": [26], "body": [{"t": "p", "h": "Have the agent ask one question at a time until it understands, and save the answers; a quick dump leaves gaps."}, {"t": "q", "h": "\"Interview me relentlessly about every aspect of this plan until we reach a shared understanding\" <a href=\"https://www.youtube.com/watch?v=c0kaKxM2pHg&amp;t=92s\" target=\"_blank\" rel=\"noopener\">1:32<\/a>"}, {"t": "q", "h": "Also: \"the bigger problem is getting everything out of your brain into the system\" <a href=\"https://www.youtube.com/watch?v=DTCyvo6cC54&amp;t=1338s\" target=\"_blank\" rel=\"noopener\">22:18<\/a>"}, {"t": "check", "h": "<em>Did this knowledge come from Charlie answering questions, and is it saved?<\/em> (Concept 26)"}]}, {"n": 31, "title": "Context costs money and rots: act at about half the window", "conf": "stated", "concepts": [29], "body": [{"t": "p", "h": "Every message re-reads the whole chat, so long chats cost more and get worse; check what fills the window and act at about half, not when auto-compact fires."}, {"t": "q", "h": "\"Claude rereads the entire conversation from the beginning, and all of those are tokens that it's charging you for\" <a href=\"https://www.youtube.com/watch?v=49V-5Ock8LU&amp;t=64s\" target=\"_blank\" rel=\"noopener\">1:04<\/a>"}, {"t": "q", "h": "Also: \"somewhere around halfway through your context window, it starts to fall apart.\" <a href=\"https://www.youtube.com/watch?v=eRS3CmvrOvA&amp;t=272s\" target=\"_blank\" rel=\"noopener\">4:32<\/a>"}, {"t": "check", "h": "<em>Is this chat past about half the window, and do we know what is filling it?<\/em> (Concept 29)"}]}, {"n": 32, "title": "Plan, let the AI attack the plan, then build", "conf": "stated", "concepts": [30], "body": [{"t": "p", "h": "Nate says plan first and have the AI play devil's advocate on the plan before building; save big plans to a file and work phase by phase. Charlie declined plan mode on 2026-10-08, so the 1-2 questions from the router stand in for it."}, {"t": "q", "h": "\"You ask Claude to start challenging you and pushing back and playing devil's advocate before it builds anything or before it approves any plan\" <a href=\"https://www.youtube.com/watch?v=iTY8Q449YNQ&amp;t=156s\" target=\"_blank\" rel=\"noopener\">2:36<\/a>"}, {"t": "q", "h": "Also: \"Have one for discovery where you can have Claude read through PDFs and read through the code base\" <a href=\"https://www.youtube.com/watch?v=_qZvORxGqI0&amp;t=1285s\" target=\"_blank\" rel=\"noopener\">21:25<\/a>"}, {"t": "check", "h": "<em>Did we ask 1-2 questions or have the AI attack the plan before a big build?<\/em> (Concept 30)"}]}, {"n": 33, "title": "A separate checker decides \"done\"; then try to break it", "conf": "stated", "concepts": [31], "body": [{"t": "p", "h": "The worker doesn't mark its own homework: a different checker looks at it, then you stress test it for edge cases. When output is bad, ask whether it is the model, the tool or our own organisation."}, {"t": "q", "h": "\"Claude doesn't get to declare itself done. A different model has to look at it with a different persona\" <a href=\"https://www.youtube.com/watch?v=iTY8Q449YNQ&amp;t=1345s\" target=\"_blank\" rel=\"noopener\">22:25<\/a>"}, {"t": "q", "h": "Also: \"by the time it tells you it's done, you stress test it more. and you try to find those edge cases\" <a href=\"https://www.youtube.com/watch?v=iTY8Q449YNQ&amp;t=583s\" target=\"_blank\" rel=\"noopener\">9:43<\/a>"}, {"t": "check", "h": "<em>Who other than the builder checked this, and what did we try to break?<\/em> (Concept 31)"}]}, {"n": 34, "title": "Skills do one job, are built from a real run, and retire when they stop earning", "conf": "stated", "concepts": [32], "body": [{"t": "p", "h": "One skill, one job; build it by walking the AI through a real task first, then turn that into the skill. Retire any skill that no longer adds value."}, {"t": "q", "h": "\"the whole idea is that you want a skill to do one very specific job\" <a href=\"https://www.youtube.com/watch?v=X-pbJWKmwi0&amp;t=3985s\" target=\"_blank\" rel=\"noopener\">1:06:25<\/a>"}, {"t": "q", "h": "Also: \"The way that I build my skills is I have Claude Code do something with me. I walk it through the steps\" <a href=\"https://www.youtube.com/watch?v=mpALXah_PBg&amp;t=22892s\" target=\"_blank\" rel=\"noopener\">6:21:32<\/a>"}, {"t": "check", "h": "<em>Does this skill do one job, come from a real run, and still earn its place?<\/em> (Concept 32)"}]}, {"n": 35, "title": "Unattended runs: one-shot, stateless, bounded, tested by hand first, fixed parts in scripts", "conf": "stated", "concepts": [33], "body": [{"t": "p", "h": "A scheduled job can't stop and ask, only sees the repo, APIs and secrets, and needs a bounded scope. Test it by hand and prove one live run before switching on the schedule; put fixed steps in a script so the agent can't drift."}, {"t": "q", "h": "\"You're not around. So, you probably want to make sure that it doesn't ever have to stop and ask you questions.\" <a href=\"https://www.youtube.com/watch?v=ehg4fhydTgs&amp;t=93s\" target=\"_blank\" rel=\"noopener\">1:33<\/a>"}, {"t": "q", "h": "Also: \"the agent was just interpreting the message different every time and it just acted differently\" <a href=\"https://www.youtube.com/watch?v=X-pbJWKmwi0&amp;t=10825s\" target=\"_blank\" rel=\"noopener\">3:00:25<\/a>"}, {"t": "check", "h": "<em>Could this run finish with nobody there, and was it tested by hand first?<\/em> (Concept 33)"}]}, {"n": 36, "title": "Permissions in layers: deny plus allow, start strict, helpers inherit, read-only and drafts first", "conf": "stated", "concepts": [34], "body": [{"t": "p", "h": "Deny the destructive commands and allow the safe ones; helpers inherit the main session's permissions; start read-only and draft-only with a human approving outward actions. Auto mode and bypass permissions are not adopted here."}, {"t": "q", "h": "\"go into your permissions and explicitly allow the commands that you know are safe\" <a href=\"https://www.youtube.com/watch?v=jqoFP9QapXI&amp;t=847s\" target=\"_blank\" rel=\"noopener\">14:07<\/a>"}, {"t": "q", "h": "Also: \"they inherit the permissions from the main session. So, if you're on bypass permissions, then all of your agents are going to be on bypass permissions\" <a href=\"https://www.youtube.com/watch?v=vDVSGVpB2vc&amp;t=731s\" target=\"_blank\" rel=\"noopener\">12:11<\/a>"}, {"t": "check", "h": "<em>Which commands are denied, which allowed, and does the helper inherit the same limits?<\/em> (Concept 34)"}]}, {"n": 37, "title": "Check before anything goes public: security review, private-data hook, untrusted content, plugin vetting", "conf": "stated", "concepts": [35], "body": [{"t": "p", "h": "Run a security review before publishing, strip private data with a hook rather than a rule, treat web pages and transcripts as possibly hostile, and vet any plugin first."}, {"t": "q", "h": "\"I basically told it to run a security review and make sure that my API keys aren't exposed and that there's no vulnerabilities\" <a href=\"https://www.youtube.com/watch?v=saggDHHnmtQ&amp;t=1801s\" target=\"_blank\" rel=\"noopener\">30:01<\/a>"}, {"t": "q", "h": "Also: \"that there's a hook that fires to remove any PII, any sensitive data of that client that I don't want living on my GitHub.\" <a href=\"https://www.youtube.com/watch?v=6LNlCpQPYFc&amp;t=1439s\" target=\"_blank\" rel=\"noopener\">23:59<\/a>"}, {"t": "check", "h": "<em>Has a security and private-data check run before this goes public?<\/em> (Concept 35)"}]}, {"n": 38, "title": "File hygiene: scratch apart from deliverables, folder READMEs, project first, start every task in the project", "conf": "stated", "concepts": [36], "body": [{"t": "p", "h": "Tell the AI where throwaway files go, give each folder a short README, keep everything in the project until it earns going global, and start tasks inside the project."}, {"t": "q", "h": "\"if we don't tell Claude how to organize its files, it's going to get messy quick to the point where I don't understand where things are\" <a href=\"https://www.youtube.com/watch?v=3GAxd90fEE4&amp;t=428s\" target=\"_blank\" rel=\"noopener\">7:08<\/a>"}, {"t": "q", "h": "Also: \"so that your agent always understands why does this folder exist and where should it look for different things\" <a href=\"https://www.youtube.com/watch?v=X-pbJWKmwi0&amp;t=5576s\" target=\"_blank\" rel=\"noopener\">1:32:56<\/a>"}, {"t": "check", "h": "<em>Is scratch work kept apart from deliverables, and does the folder explain itself?<\/em> (Concept 36)"}]}, {"n": 39, "title": "Operator habits: paste the whole error, make it do its own chores, match model and effort, adopt tools only for real pain, cap parallel sessions, use the OS for everything", "conf": "stated", "concepts": [37], "body": [{"t": "p", "h": "Small habits: paste the full error, ask the AI to do chores it lists for you, use the cheapest model and effort that does the job, adopt a tool only for a real pain point, and keep to three or four parallel sessions."}, {"t": "q", "h": "\"this is the error that I got. And then I paste in all that messy stuff and shoot it off\" <a href=\"https://www.youtube.com/watch?v=saggDHHnmtQ&amp;t=1984s\" target=\"_blank\" rel=\"noopener\">33:04<\/a>"}, {"t": "q", "h": "Also: \"do not automatically run everything at maximum effort or even just high.\" <a href=\"https://www.youtube.com/watch?v=FBVNS1l5Vb8&amp;t=279s\" target=\"_blank\" rel=\"noopener\">4:39<\/a>"}, {"t": "check", "h": "<em>Is the model and effort matched to the task, and is this tool solving a real pain?<\/em> (Concept 37)"}]}, {"n": 40, "title": "Parts rot at different speeds; score each audit", "conf": "stated", "concepts": [38], "body": [{"t": "p", "h": "Different parts of the OS go stale at different rates, so review each at its own pace and keep a score from every audit to see whether the OS is improving."}, {"t": "q", "h": "\"All of these different parts decay, become obsolete or rot at different rates.\" <a href=\"https://www.youtube.com/watch?v=6LNlCpQPYFc&amp;t=1377s\" target=\"_blank\" rel=\"noopener\">22:57<\/a>"}, {"t": "q", "h": "Also: \"it will store your scores every time so that you can see how you're actually improving your system\" <a href=\"https://www.youtube.com/watch?v=X-pbJWKmwi0&amp;t=3195s\" target=\"_blank\" rel=\"noopener\">53:15<\/a>"}, {"t": "check", "h": "<em>Which part of the OS is stalest, and what did the last audit score?<\/em> (Concept 38)"}]}]};
const C = DATA.concepts, R = DATA.rules;
const byC = Object.fromEntries(C.map(c=>[c.n,c])), byR = Object.fromEntries(R.map(r=>[r.n,r]));
const SEC = []; C.forEach(c=>{ if(!SEC.find(s=>s.id===c.sec)) SEC.push({id:c.sec,title:c.secTitle}); });
const ALL = [...C.map(c=>"c"+c.n), ...R.map(r=>"r"+r.n)];

let flags = {};            // id -> {kind, note}
let db = null, view = "sec", filter = "all", query = "";
const open = new Set();

const FILTERS = [
  ["all","All"],["confusing","Confusing"],["delete","Delete?"],["keep","Keep"],
  ["todo","Not reviewed"],["unlinked","Not linked"]
];
function isUnlinked(id){ return id[0]==="c" ? !byC[id.slice(1)].rules.length : !byR[id.slice(1)].concepts.length; }
function matchesFilter(id){
  const f = flags[id];
  if(filter==="all") return true;
  if(filter==="todo") return !f || !f.kind;
  if(filter==="unlinked") return isUnlinked(id);
  return f && f.kind===filter;
}
function textOf(id){
  const o = id[0]==="c" ? byC[id.slice(1)] : byR[id.slice(1)];
  return (o.title+" "+o.body.map(b=>b.h).join(" ")).replace(/<[^>]+>/g,"").toLowerCase();
}
const TXT = Object.fromEntries(ALL.map(id=>[id,textOf(id)]));
function visible(id){ return matchesFilter(id) && (!query || TXT[id].includes(query)); }

function esc(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

function flagPill(id){
  const f = flags[id];
  if(!f) return "";
  if(f.kind) return `<span class="flag ${f.kind}">${f.kind==="delete"?"Delete?":f.kind}</span>`;
  if(f.note) return `<span class="flag note">Note</span>`;
  return "";
}
function bodyHTML(o){
  return o.body.map(b=>{
    if(b.t==="q") return `<blockquote>${b.h}</blockquote>`;
    if(b.t==="check") return `<div class="check"><b>Agent check</b>${b.h}</div>`;
    return `<p>${b.h}</p>`;
  }).join("");
}
function itemHTML(id){
  const isC = id[0]==="c", o = isC ? byC[id.slice(1)] : byR[id.slice(1)];
  const f = flags[id] || {};
  const k = f.kind ? " f-"+f.kind : "";
  const sub = isC ? `<small>Section ${o.sec} · feeds ${o.rules.length?o.rules.length+" rule"+(o.rules.length>1?"s":""):"no rule yet"}</small>`
                  : `<small>${o.conf?esc(o.conf)+" · ":""}${o.concepts.length?"from concept "+o.concepts.join(", "):"no concept linked"}</small>`;
  let inner = "";
  if(open.has(id)){
    let links;
    if(isC){
      links = o.rules.length
        ? `<div class="links">Feeds: ${o.rules.map(n=>`<button data-go="r${n}">Rule ${n}</button>`).join("")}</div>`
        : `<div class="gap">Not linked to a rule. Brain says: ${o.note||"no rule yet"}</div>`;
    } else {
      links = o.concepts.length
        ? `<div class="links">Comes from: ${o.concepts.map(n=>`<button data-go="c${n}">Concept ${n}</button>`).join("")}</div>`
        : `<div class="gap">No concept points to this rule, so it sits outside the flow.</div>`;
    }
    inner = `<div class="body">${bodyHTML(o)}${links}
      <div class="review">
        <div class="row" role="group" aria-label="Mark ${id}">
          <button data-k="confusing" aria-pressed="${f.kind==="confusing"}">Confusing</button>
          <button data-k="delete" aria-pressed="${f.kind==="delete"}">Delete?</button>
          <button data-k="keep" aria-pressed="${f.kind==="keep"}">Keep</button>
        </div>
        <textarea id="note-${id}" placeholder="What's unclear, or why delete it?">${esc(f.note||"")}</textarea>
        <div class="st" data-st></div>
      </div></div>`;
  }
  return `<div class="item ${isC?"concept":"rule"}${k}" id="${id}" data-id="${id}">
    <button class="head" aria-expanded="${open.has(id)}" data-toggle>
      <span class="id">${isC?"C":"R"}${o.n}</span>
      <span class="ttl">${esc(o.title)}${sub}</span>${flagPill(id)}
    </button>${inner}</div>`;
}

function render(){
  const list = document.getElementById("list");
  let h = "";
  if(view==="sec"){
    SEC.forEach(s=>{
      const cs = C.filter(c=>c.sec===s.id);
      const parts = cs.map(c=>{
        const cid="c"+c.n;
        const kids = c.rules.map(n=>"r"+n).filter(visible);
        const show = visible(cid) || kids.length;
        if(!show) return "";
        const kidH = open.has(cid) && kids.length ? `<div class="kids">${kids.map(itemHTML).join("")}</div>` : "";
        return itemHTML(cid) + kidH;
      }).join("");
      if(parts) h += `<h2 id="sec-${s.id}"><span class="sl">${s.id}</span>${esc(s.title)}</h2>${parts}`;
    });
    const loose = R.filter(r=>!r.concepts.length).map(r=>"r"+r.n).filter(visible);
    if(loose.length) h += `<h2><span class="sl">?</span>Rules with no concept</h2><p class="secnote">These rules aren't linked from any concept, so they only show up here.</p>${loose.map(itemHTML).join("")}`;
  } else {
    h = R.map(r=>"r"+r.n).filter(visible).map(itemHTML).join("");
  }
  list.innerHTML = h || `<p class="empty">Nothing matches this filter yet.</p>`;
  renderStats();
}

function renderStats(){
  const cnt = k => ALL.filter(id=>flags[id]&&flags[id].kind===k).length;
  const c=cnt("confusing"), d=cnt("delete"), k=cnt("keep"), done=c+d+k, notes=ALL.filter(id=>flags[id]&&flags[id].note).length;
  document.getElementById("stats").innerHTML =
    `<span><b>${C.length}</b> concepts</span><span><b>${R.length}</b> rules</span><span><b>${done}</b> / ${ALL.length} reviewed</span><span><b>${c}</b> confusing</span><span><b>${d}</b> delete?</span><span><b>${notes}</b> notes</span>`;
  const pct = n => (n/ALL.length*100)+"%";
  document.getElementById("bar").innerHTML =
    `<span style="width:${pct(k)};background:var(--keep)"></span><span style="width:${pct(c)};background:var(--confuse)"></span><span style="width:${pct(d)};background:var(--del)"></span>`;
  const counts = {all:ALL.length,confusing:c,delete:d,keep:k,todo:ALL.length-done,unlinked:ALL.filter(isUnlinked).length};
  document.getElementById("filters").innerHTML = FILTERS.map(([v,l])=>
    `<button class="chip" data-f="${v}" aria-pressed="${filter===v}">${l}<span class="n">${counts[v]}</span></button>`).join("");
}

function renderFlow(){
  const el = document.getElementById("flow");
  el.insertAdjacentHTML("beforeend", SEC.map((s,i)=>
    `${i?'<span class="arrow" aria-hidden="true">→</span>':""}<button class="step" data-sec="${s.id}"><i>${s.id}</i>${esc(s.title)}</button>`).join(""));
}

/* ---------- saving ---------- */
const timers = {};
async function save(id, statusEl){
  const f = flags[id] || {};
  const o = id[0]==="c" ? byC[id.slice(1)] : byR[id.slice(1)];
  if(!db){ try{ localStorage.setItem("brainmap-flags", JSON.stringify(flags)); }catch(e){} if(statusEl) statusEl.textContent="Saved in this browser only"; return; }
  try{
    if(!f.kind && !f.note){ await db.collection("flags").doc(id).delete(); }
    else await db.collection("flags").doc(id).set({ item:id, kind:f.kind||null, note:f.note||"", title:o.title, updatedAt:new Date().toISOString() });
    if(statusEl) statusEl.textContent = "Saved";
  }catch(e){
    if(statusEl) statusEl.textContent = "Couldn't save: " + (e && e.code==="not_granted" ? "you don't have edit access to this page." : "try again in a moment.");
  }
}

document.addEventListener("click", e=>{
  const t = e.target.closest("button"); if(!t) return;
  if(t.id==="v-sec"||t.id==="v-rules"){
    view = t.id==="v-sec"?"sec":"rules";
    document.getElementById("v-sec").setAttribute("aria-pressed", view==="sec");
    document.getElementById("v-rules").setAttribute("aria-pressed", view==="rules");
    render(); return;
  }
  if(t.dataset.f){ filter=t.dataset.f; render(); return; }
  if(t.dataset.sec){
    if(view!=="sec"){ view="sec"; document.getElementById("v-sec").setAttribute("aria-pressed",true); document.getElementById("v-rules").setAttribute("aria-pressed",false); }
    filter="all"; query=""; document.getElementById("q").value=""; render();
    document.getElementById("sec-"+t.dataset.sec)?.scrollIntoView({behavior:"smooth",block:"start"}); return;
  }
  if(t.dataset.go){ goTo(t.dataset.go); return; }
  const item = t.closest(".item");
  if(t.hasAttribute("data-toggle") && item){
    const id=item.dataset.id; open.has(id)?open.delete(id):open.add(id); render();
    document.getElementById(id)?.scrollIntoView({block:"nearest"}); return;
  }
  if(t.dataset.k && item){
    const id=item.dataset.id; const f = flags[id] || (flags[id]={});
    f.kind = f.kind===t.dataset.k ? null : t.dataset.k;
    render();
    save(id, document.querySelector(`#${id} [data-st]`));
  }
});
document.addEventListener("input", e=>{
  if(e.target.id==="q"){ query=e.target.value.trim().toLowerCase(); render(); document.getElementById("q").focus(); return; }
  if(e.target.id && e.target.id.startsWith("note-")){
    const id = e.target.id.slice(5); const f = flags[id] || (flags[id]={});
    f.note = e.target.value;
    const st = e.target.parentElement.querySelector("[data-st]"); st.textContent="Typing…";
    clearTimeout(timers[id]); timers[id]=setTimeout(()=>{ save(id, document.querySelector(`#${id} [data-st]`)); renderStats(); },900);
  }
});
function goTo(id){
  if(view==="rules" && id[0]==="c"){ view="sec"; document.getElementById("v-sec").setAttribute("aria-pressed",true); document.getElementById("v-rules").setAttribute("aria-pressed",false); }
  filter="all"; query=""; document.getElementById("q").value="";
  if(id[0]==="r" && view==="sec"){ const r=byR[id.slice(1)]; if(r.concepts.length) open.add("c"+r.concepts[0]); }
  open.add(id); render();
  const el=document.getElementById(id); if(el){ el.scrollIntoView({behavior:"smooth",block:"start"}); el.classList.add("flash"); }
}

renderFlow(); render();
try{ const s=localStorage.getItem("brainmap-flags"); if(s){ flags=JSON.parse(s)||{}; render(); } }catch(e){}

(async()=>{
  const saveEl = document.getElementById("save");
  try{ db = await window.claude?.use?.("db"); }catch(e){ db=null; }
  if(!db){ saveEl.textContent = "Saving to your board isn't available in this view, so marks stay in this browser only."; return; }
  saveEl.textContent = "Marks and notes save to your review board, so Claude can read them.";
  db.collection("flags").onSnapshot(snap=>{
    const next = {};
    snap.docs.forEach(d=>{ const v=d.data(); if(v) next[d.id]={kind:v.kind||null,note:v.note||""}; });
    // keep any note the viewer is typing right now
    const a=document.activeElement;
    if(a && a.id && a.id.startsWith("note-")){ const id=a.id.slice(5); if(flags[id]) next[id]=flags[id]; }
    flags = next;
    if(a && a.id && a.id.startsWith("note-")) renderStats(); else render();
  }, ()=>{ saveEl.textContent = "Lost the connection to your board. Reload the page to see the latest marks."; });
})();
</script>
