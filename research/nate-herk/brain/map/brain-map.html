itself done. A different model has to look at it with a different persona\" <a href=\"https://www.youtube.com/watch?v=iTY8Q449YNQ&amp;t=1345s\" target=\"_blank\" rel=\"noopener\">22:25<\/a>"}, {"t": "q", "h": "Also: \"by the time it tells you it's done, you stress test it more. and you try to find those edge cases\" <a href=\"https://www.youtube.com/watch?v=iTY8Q449YNQ&amp;t=583s\" target=\"_blank\" rel=\"noopener\">9:43<\/a>"}, {"t": "q", "h": "Also: \"creating alignment between the human reviewer and the LLM.\" <a href=\"https://www.youtube.com/watch?v=l8ywUsEJ2XQ&amp;t=2284s\" target=\"_blank\" rel=\"noopener\">38:04<\/a> (a guest: an AI judge is trusted only after it agrees with a human); \"spin up 50 different sub aents and have all of them test this thing, try to break it\" <a href=\"https://www.youtube.com/watch?v=FqnNL8fnUWo&amp;t=1340s\" target=\"_blank\" rel=\"noopener\">22:20<\/a>"}, {"t": "check", "h": "<em>Who other than the builder checked this, and what did we try to break?<\/em> (Concepts 31, 41)"}, {"t": "p", "h": "<strong>Built as:<\/strong> the <code>guardian<\/code> agent (<code>.claude/agents/guardian.md<\/code>, 2026-10-09), called at the end of big tasks (<code>context/working-rules.md<\/code>)."}], "concepts": [31, 41], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 6}, {"id": "r34", "kind": "rule", "g": "nate", "t": "Skills do one job, are built from a real run, and retire when they stop earning", "n": 34, "conf": "stated", "body": [{"t": "p", "h": "One skill, one job; build it by walking the AI through a real task first, then turn that into the skill. Retire any skill that no longer adds value."}, {"t": "q", "h": "\"the whole idea is that you want a skill to do one very specific job\" <a href=\"https://www.youtube.com/watch?v=X-pbJWKmwi0&amp;t=3985s\" target=\"_blank\" rel=\"noopener\">1:06:25<\/a>"}, {"t": "q", "h": "Also: \"The way that I build my skills is I have Claude Code do something with me. I walk it through the steps\" <a href=\"https://www.youtube.com/watch?v=mpALXah_PBg&amp;t=22892s\" target=\"_blank\" rel=\"noopener\">6:21:32<\/a>"}, {"t": "check", "h": "<em>Does this skill do one job, come from a real run, and still earn its place?<\/em> (Concept 32)"}], "concepts": [32], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 4}, {"id": "r35", "kind": "rule", "g": "nate", "t": "Unattended runs: one-shot, stateless, bounded, tested by hand first, fixed parts in scripts", "n": 35, "conf": "stated", "body": [{"t": "p", "h": "A scheduled job can't stop and ask, only sees the repo, APIs and secrets, and needs a bounded scope. Test it by hand and prove one live run before switching on the schedule; put fixed steps in a script so the agent can't drift."}, {"t": "q", "h": "\"You're not around. So, you probably want to make sure that it doesn't ever have to stop and ask you questions.\" <a href=\"https://www.youtube.com/watch?v=ehg4fhydTgs&amp;t=93s\" target=\"_blank\" rel=\"noopener\">1:33<\/a>"}, {"t": "q", "h": "Also: \"the agent was just interpreting the message different every time and it just acted differently\" <a href=\"https://www.youtube.com/watch?v=X-pbJWKmwi0&amp;t=10825s\" target=\"_blank\" rel=\"noopener\">3:00:25<\/a>"}, {"t": "q", "h": "Also: \"I actually did this before where I had a routine that was very simple like this and after about a month, it started to just go rogue.\" <a href=\"https://www.youtube.com/watch?v=FqnNL8fnUWo&amp;t=608s\" target=\"_blank\" rel=\"noopener\">10:08<\/a>; \"every time an agent wakes up, it's going to leave some sort of handoff message\" <a href=\"https://www.youtube.com/watch?v=eg_1NXDcoPk&amp;t=91s\" target=\"_blank\" rel=\"noopener\">1:31<\/a>; \"we want to have Codex do as much verification on it as possible.\" <a href=\"https://www.youtube.com/watch?v=FqnNL8fnUWo&amp;t=578s\" target=\"_blank\" rel=\"noopener\">9:38<\/a>"}, {"t": "check", "h": "<em>Could this run finish with nobody there, and was it tested by hand first?<\/em> (Concepts 33, 42)"}], "concepts": [33, 42], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 7}, {"id": "r36", "kind": "rule", "g": "nate", "t": "Permissions in layers: deny plus allow, start strict, helpers inherit, read-only and drafts first", "n": 36, "conf": "stated", "body": [{"t": "p", "h": "Deny the destructive commands and allow the safe ones; helpers inherit the main session's permissions; start read-only and draft-only with a human approving outward actions. Auto mode and bypass permissions are not adopted here."}, {"t": "q", "h": "\"go into your permissions and explicitly allow the commands that you know are safe\" <a href=\"https://www.youtube.com/watch?v=jqoFP9QapXI&amp;t=847s\" target=\"_blank\" rel=\"noopener\">14:07<\/a>"}, {"t": "q", "h": "Also: \"they inherit the permissions from the main session. So, if you're on bypass permissions, then all of your agents are going to be on bypass permissions\" <a href=\"https://www.youtube.com/watch?v=vDVSGVpB2vc&amp;t=731s\" target=\"_blank\" rel=\"noopener\">12:11<\/a>"}, {"t": "check", "h": "<em>Which commands are denied, which allowed, and does the helper inherit the same limits?<\/em> (Concept 34)"}], "concepts": [34], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 4}, {"id": "r37", "kind": "rule", "g": "nate", "t": "Check before anything goes public: security review, private-data hook, untrusted content, plugin vetting", "n": 37, "conf": "stated", "body": [{"t": "p", "h": "Run a security review before publishing, strip private data with a hook rather than a rule, treat web pages and transcripts as possibly hostile, and vet any plugin first."}, {"t": "q", "h": "\"I basically told it to run a security review and make sure that my API keys aren't exposed and that there's no vulnerabilities\" <a href=\"https://www.youtube.com/watch?v=saggDHHnmtQ&amp;t=1801s\" target=\"_blank\" rel=\"noopener\">30:01<\/a>"}, {"t": "q", "h": "Also: \"that there's a hook that fires to remove any PII, any sensitive data of that client that I don't want living on my GitHub.\" <a href=\"https://www.youtube.com/watch?v=6LNlCpQPYFc&amp;t=1439s\" target=\"_blank\" rel=\"noopener\">23:59<\/a>"}, {"t": "q", "h": "Also (a guest): \"security breach that's one thing that you like cannot take back\" <a href=\"https://www.youtube.com/watch?v=l8ywUsEJ2XQ&amp;t=1207s\" target=\"_blank\" rel=\"noopener\">20:07<\/a>; \"if you protect your secrets and your credentials you have rowle security on\" <a href=\"https://www.youtube.com/watch?v=l8ywUsEJ2XQ&amp;t=3665s\" target=\"_blank\" rel=\"noopener\">1:01:05<\/a>"}, {"t": "check", "h": "<em>Has a security and private-data check run before this goes public?<\/em> (Concepts 35, 43)"}], "concepts": [35, 43], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 6}, {"id": "r38", "kind": "rule", "g": "nate", "t": "File hygiene: scratch apart from deliverables, folder READMEs, project first, start every task in the project", "n": 38, "conf": "stated", "body": [{"t": "p", "h": "Tell the AI where throwaway files go, give each folder a short README, keep everything in the project until it earns going global, and start tasks inside the project."}, {"t": "q", "h": "\"if we don't tell Claude how to organize its files, it's going to get messy quick to the point where I don't understand where things are\" <a href=\"https://www.youtube.com/watch?v=3GAxd90fEE4&amp;t=428s\" target=\"_blank\" rel=\"noopener\">7:08<\/a>"}, {"t": "q", "h": "Also: \"so that your agent always understands why does this folder exist and where should it look for different things\" <a href=\"https://www.youtube.com/watch?v=X-pbJWKmwi0&amp;t=5576s\" target=\"_blank\" rel=\"noopener\">1:32:56<\/a>"}, {"t": "check", "h": "<em>Is scratch work kept apart from deliverables, and does the folder explain itself?<\/em> (Concept 36)"}], "concepts": [36], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 4}, {"id": "r39", "kind": "rule", "g": "nate", "t": "Operator habits: paste the whole error, make it do its own chores, match model and effort, adopt tools only for real pain, cap parallel sessions, use the OS for everything", "n": 39, "conf": "stated", "body": [{"t": "p", "h": "Small habits: paste the full error, ask the AI to do chores it lists for you, use the cheapest model and effort that does the job, adopt a tool only for a real pain point, and keep to three or four parallel sessions."}, {"t": "q", "h": "\"this is the error that I got. And then I paste in all that messy stuff and shoot it off\" <a href=\"https://www.youtube.com/watch?v=saggDHHnmtQ&amp;t=1984s\" target=\"_blank\" rel=\"noopener\">33:04<\/a>"}, {"t": "q", "h": "Also: \"do not automatically run everything at maximum effort or even just high.\" <a href=\"https://www.youtube.com/watch?v=FBVNS1l5Vb8&amp;t=279s\" target=\"_blank\" rel=\"noopener\">4:39<\/a>"}, {"t": "q", "h": "Also: \"they said to just start on medium and scale it up or down if you need.\" <a href=\"https://www.youtube.com/watch?v=QCkHIyEPIYo&amp;t=430s\" target=\"_blank\" rel=\"noopener\">7:10<\/a>; \"using Opus 5.5 as the orchestrator that spins up and sends off very specific instructions to a bunch of little GBD6 soul workers.\" <a href=\"https://www.youtube.com/watch?v=eF3yeJuifoQ&amp;t=2015s\" target=\"_blank\" rel=\"noopener\">33:35<\/a>; \"you're not using a slower and more expensive model to actually categorize all of those comments in the first place.\" <a href=\"https://www.youtube.com/watch?v=ymgH8jS6Wb8&amp;t=244s\" target=\"_blank\" rel=\"noopener\">4:04<\/a>"}, {"t": "check", "h": "<em>Is the model and effort matched to the task, and is this tool solving a real pain?<\/em> (Concepts 37, 40)"}], "concepts": [37, 40], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 8}, {"id": "r40", "kind": "rule", "g": "nate", "t": "Parts rot at different speeds; score each audit", "n": 40, "conf": "stated", "body": [{"t": "p", "h": "Different parts of the OS go stale at different rates, so review each at its own pace and keep a score from every audit to see whether the OS is improving."}, {"t": "q", "h": "\"All of these different parts decay, become obsolete or rot at different rates.\" <a href=\"https://www.youtube.com/watch?v=6LNlCpQPYFc&amp;t=1377s\" target=\"_blank\" rel=\"noopener\">22:57<\/a>"}, {"t": "q", "h": "Also: \"it will store your scores every time so that you can see how you're actually improving your system\" <a href=\"https://www.youtube.com/watch?v=X-pbJWKmwi0&amp;t=3195s\" target=\"_blank\" rel=\"noopener\">53:15<\/a>"}, {"t": "check", "h": "<em>Which part of the OS is stalest, and what did the last audit score?<\/em> (Concept 38)"}], "concepts": [38], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 4}, {"id": "r41", "kind": "rule", "g": "nate", "t": "Smallest context that works; prune after every new model", "n": 41, "conf": "stated", "body": [{"t": "p", "h": "Keep what only you can supply (voice, goals, audience, how the work runs, the reason, the gotchas). Cut what the model can look up, anything said twice, and rules written for older models. Load one-job procedures only for that job, and re-audit the set-up whenever the model changes."}, {"t": "q", "h": "\"the best context is the smallest amount of context that gets you the highest quality result at the cheapest cost.\" <a href=\"https://www.youtube.com/watch?v=oz2CwrPV2Rg&amp;t=123s\" target=\"_blank\" rel=\"noopener\">2:03<\/a>"}, {"t": "q", "h": "Also: \"every time a new model drops and you switch into it, you should probably just run this sort of audit anyways\" <a href=\"https://www.youtube.com/watch?v=oz2CwrPV2Rg&amp;t=640s\" target=\"_blank\" rel=\"noopener\">10:40<\/a>"}, {"t": "q", "h": "Also (a second, guest source; Rule 41 no longer rests on one video): \"the better models and harnesses get, the easier all the things that we have to do as developers get.\" <a href=\"https://www.youtube.com/watch?v=l8ywUsEJ2XQ&amp;t=1947s\" target=\"_blank\" rel=\"noopener\">32:27<\/a>"}, {"t": "check", "h": "<em>Is this line something only Charlie can tell it, or something it could find or no longer needs? Is it written anywhere else?<\/em> (Concept 39)"}], "concepts": [18, 39], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 5}, {"id": "r42", "kind": "rule", "g": "nate", "t": "Start at the lowest rung: the simplest build that works, fixed flows as code, more users means more care", "n": 42, "conf": "stated", "body": [{"t": "p", "h": "Build the simplest thing that does the job and move up only when you truly need to. A predictable flow is code run on a schedule or trigger, with AI only for the steps that need judgment; an agent loop is for work that must decide how often to look again. The more people rely on it, the more care it needs: a private tool is low stakes, a client's or the public's is not, and a leak cannot be undone."}, {"t": "q", "h": "\"build the simplest solution possible and only move up the sort of AI systems pyramid as I call it when you truly need that functionality.\" <a href=\"https://www.youtube.com/watch?v=FqnNL8fnUWo&amp;t=1764s\" target=\"_blank\" rel=\"noopener\">29:24<\/a>"}, {"t": "q", "h": "Also: \"the more deterministic your automation gets, the more of a waste it would be to use codeex to host that.\" <a href=\"https://www.youtube.com/watch?v=FqnNL8fnUWo&amp;t=367s\" target=\"_blank\" rel=\"noopener\">6:07<\/a>; \"If there's not pain, then why create more?\" <a href=\"https://www.youtube.com/watch?v=DTCyvo6cC54&amp;t=244s\" target=\"_blank\" rel=\"noopener\">4:04<\/a>; a guest: \"it gets more complex and the stakes are bigger.\" <a href=\"https://www.youtube.com/watch?v=l8ywUsEJ2XQ&amp;t=869s\" target=\"_blank\" rel=\"noopener\">14:29<\/a>"}, {"t": "check", "h": "<em>Could a fixed script do this instead of an agent? Who will rely on it, and what could not be undone if it went wrong?<\/em> (Concepts 42, 43, 20)"}], "concepts": [20, 42, 43], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 7}, {"id": "r43", "kind": "rule", "g": "nate", "t": "Measure before you switch: same prompt, your own work, isolated, cost counted, known-right answers", "n": 43, "conf": "stated, demonstrated", "body": [{"t": "p", "h": "Before changing a model, effort level or prompt for real work, run the same task both ways in separate folders on your own examples and compare quality, time and cost. One result is not proof. For anything automated, keep a small golden set of known-right answers and re-run it after every change."}, {"t": "q", "h": "\"you got to get in there and you got to test it on your own skills and your own prompts and your own processes.\" <a href=\"https://www.youtube.com/watch?v=7eo-11K2e3c&amp;t=1517s\" target=\"_blank\" rel=\"noopener\">25:17<\/a>"}, {"t": "q", "h": "Also: \"I put them in different work trees so they literally can't touch.\" <a href=\"https://www.youtube.com/watch?v=GmLcJVzkxPA&amp;t=62s\" target=\"_blank\" rel=\"noopener\">1:02<\/a>; \"What you're really going to want to do is run evals, meaning you're going to have a golden data set of 100 use cases and 100 correct answers\" <a href=\"https://www.youtube.com/watch?v=ymgH8jS6Wb8&amp;t=763s\" target=\"_blank\" rel=\"noopener\">12:43<\/a>"}, {"t": "check", "h": "<em>Was the change tried on Charlie's real tasks, in isolation, with cost counted and a known-right answer to compare with?<\/em> (Concepts 40, 41)"}], "concepts": [40, 41], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 6}, {"id": "r44", "kind": "rule", "g": "nate", "t": "Prove it in a fixed shape: say what the check won't catch, then VERIFIED / NOT VERIFIED", "n": 44, "conf": "stated", "body": [{"t": "p", "h": "Before building, name the strongest check you actually have and what it would not catch. After building, run it and report two lines: VERIFIED (what was run and what it returned) and NOT VERIFIED (what couldn't be checked, and why). Reading your own code is not a check. On a real task the order is interview, spec (naming files and the decisions Charlie would question), verify, then a skill on the second solve; automate only once that skill is trusted, writing to one place and logging every run."}, {"t": "q", "h": "\"Why the format is mandatory: without a required shape, \"it should work\" slides right in. NOT VERIFIED forces honesty.\" <a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/six-phrases-instagram-source.md\" target=\"_blank\" rel=\"noopener\">six phrases, 4<\/a>"}, {"t": "q", "h": "Also: \"The verifier is \"I reviewed the code.\" That's not a verifier.\" <a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/six-phrases-instagram-source.md\" target=\"_blank\" rel=\"noopener\">six phrases, what breaks<\/a>; \"Let it read broadly and write to exactly one place.\" <a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/six-phrases-instagram-source.md\" target=\"_blank\" rel=\"noopener\">six phrases, 6<\/a>"}, {"t": "check", "h": "<em>Did the report show what was run and what it returned, and say plainly what wasn't checked? Did the plan name files and the calls Charlie might disagree with?<\/em> (Concepts 44, 31)"}], "concepts": [31, 44], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 3}], "edges": [[".claude/agen function showTab(t){
  document.getElementById("t-map").setAttribute("aria-selected", t==="map");
  document.getElementById("t-rev").setAttribute("aria-selected", t==="rev");
  document.getElementById("map").hidden = t!=="map";
  document.getElementById("review").hidden = t!=="rev";
  if(t==="rev") renderReview(); else { size(); }
}
document.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.id==="t-map") return showTab("map");
  if(b.id==="t-rev") return showTab("rev");
  if(b.id==="close"){ selected=null; document.getElementById("sheet").hidden=true; draw(); return; }
  if(b.id==="lg-t"){ document.getElementById("legend").classList.toggle("min"); renderLegend(); return; }
  if(b.id==="loose"){ looseOnly=!looseOnly; renderLegend(); draw(); return; }
  if(b.id==="reset"){ GROUPS.forEach(([g])=>shown[g]=true); looseOnly=false; selected=null; document.getElementById("sheet").hidden=true; renderLegend(); fit(); return; }
  if(b.dataset.g){ shown[b.dataset.g]=!shown[b.dataset.g]; renderLegend(); draw(); return; }
  if(b.dataset.go){
    if(!document.getElementById("review").hidden){ showTab("map"); }
    const n = byId[b.dataset.go]; shown[n.g]=true; looseOnly=false; renderLegend(); select(n.id);
    const k = Math.max(transform.k,1.6); d3.select(cv).transition().duration(450).call(zoom.transform, d3.zoomIdentity.translate(W/2-k*n.x, H*0.35-k*n.y).scale(k));
    return;
  }
  if(b.dataset.set){ rvSet=b.dataset.set; rvIdx=0; renderReview(); return; }
  if(b.id==="todo"){ rvTodo=!rvTodo; rvIdx=0; renderReview(); return; }
  if(b.id==="prev"){ rvIdx--; renderReview(); return; }
  if(b.id==="next"){ rvIdx++; renderReview(); return; }
  if(b.id==="onmap"){ const id = document.querySelector("#rv [data-mark]")?.dataset.mark; if(id){ b.dataset.go=id; b.click(); } return; }
  const m = b.closest("[data-mark]");
  if(m && b.dataset.k){
    const id = m.dataset.mark, did = docId(id), f = flags[did] || (flags[did]={});
    f.kind = f.kind===b.dataset.k ? null : b.dataset.k;
    const inReview = !document.getElementById("review").hidden;
    if(inReview){ if(!rvTodo && f.kind) rvIdx++; renderReview(); } else { select(id); }
    renderNums(); draw();
    save(id, document.querySelector("#"+(inReview?"rv":"sheet")+" .st"));
  }
});
document.addEventListener("input", e=>{
  if(e.target.id==="q"){ query=e.target.value.trim().toLowerCase(); draw(); return; }
  if(e.target.id && e.target.id.startsWith("note-")){
    const m = e.target.closest("[data-mark]"), id = m.dataset.mark, did = docId(id), f = flags[did] || (flags[did]={});
    f.note = e.target.value; const st = m.querySelector(".st"); st.textContent="Typing…";
    clearTimeout(timers[did]); timers[did] = setTimeout(()=>save(id, st), 900);
  }
});
document.getElementById("q").addEventListener("keydown", e=>{
  if(e.key==="Enter"){ const m = N.filter(n=>visible(n)&&hit(n)).sort((a,b)=>b.d-a.d)[0]; if(m){ const t=document.createElement("button"); t.dataset.go=m.id; document.body.appendChild(t); t.click(); t.remove(); } }
});
window.addEventListener("resize", size);

/* ---------------- start ---------------- */
renderNums(); renderLegend(); size();
for(let i=0;i<220;i++) sim.tick();
fit(); sim.alpha(0.05).restart();
try{ const s=localStorage.getItem("brain-flags"); if(s){ flags=JSON.parse(s)||{}; renderNums(); draw(); } }catch(e){}
(async()=>{
  try{ db = await window.claude?.use?.("db"); }catch(e){ db=null; }
  if(!db) return;
  db.collection("flags").onSnapshot(snap=>{
    const next = {};
    snap.docs.forEach(d=>{ const v=d.data(); if(v) next[d.id]={kind:v.kind||null, note:v.note||""}; });
    const a = document.activeElement;
    if(a && a.id && a.id.startsWith("note-")){ const did=a.id.slice(5); if(flags[did]) next[did]=flags[did]; }
    flags = next; renderNums(); draw();
    if(!(a && a.id && a.id.startsWith("note-"))){
      if(!document.getElementById("review").hidden) renderReview();
      else if(selected) select(selected);
    }
  });
})();
</script>
