<title>Charlie's Brain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-screen star map (Map tab) with a stats corner, a sources legend and a slide-up note sheet;
   Review tab is one card at a time with big thumb buttons. Deliberately dark-only, like a night-sky map. */
:root{
  --bg:#070a12; --panel:#0e1320; --panel2:#151b2b; --line:#232b3e; --fg:#e8ecf5; --muted:#8c97ad; --accent:#8fb3ff;
  --core:#7aa2ff; --nate:#ff7ab6; --transcripts:#f5a524; --creators:#b18cff; --research:#c9b6ff;
  --skills:#3ddc97; --audits:#ff7a7a; --projects:#5ce1e6; --learning:#ffd166; --templates:#7d879b;
  --confuse:#f5b84a; --del:#ff6b74; --keep:#4fd99a;
  --f-ui:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-ui);margin:0;overflow:hidden}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code{font:12.5px var(--f-mono);background:var(--panel2);padding:1px 5px;border-radius:4px}

.app{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--bg);position:relative;z-index:4}
.brand{font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand i{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.tabs{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;padding:5px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
#q{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:7px 11px;font:inherit;font-size:14px}
.main{flex:1;position:relative;min-height:0}

/* map */
#map{position:absolute;inset:0}
#cv{width:100%;height:100%;display:block;touch-action:none}
.hero{position:absolute;left:16px;top:14px;pointer-events:none;max-width:60%}
.hero .eye{font:500 10.5px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hero h1{font-size:clamp(22px,4.4vw,38px);line-height:1.02;margin:6px 0 8px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.hero h1 span{color:var(--muted)}
.nums{display:flex;gap:18px;font:500 18px var(--f-mono)}
.nums small{display:block;font:10px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.legend{position:absolute;left:16px;bottom:16px;background:rgba(14,19,32,.86);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:200px;max-width:calc(100% - 32px)}
.legend h3{margin:0 0 6px;font:500 10.5px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
.legend h3 button{border:0;background:none;color:var(--muted);font:inherit;padding:0}
.src{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:3px 0;font-size:13px;text-align:left}
.src i{width:8px;height:8px;border-radius:50%;flex:none}
.src b{margin-left:auto;font:400 12px var(--f-mono);color:var(--muted)}
.src[aria-pressed="false"]{opacity:.35}
.legend .row2{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:4px 10px;font-size:12px}
.pill[aria-pressed="true"]{border-color:var(--confuse);color:var(--confuse)}
.legend.min .list,.legend.min .row2{display:none}

/* note sheet */
.sheet{position:absolute;right:16px;top:14px;bottom:16px;width:min(400px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5);z-index:3}
.sheet[hidden]{display:none}
.sh-head{padding:14px 14px 10px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.sh-head .t{flex:1;min-width:0}
.tag{display:inline-flex;align-items:center;gap:6px;font:500 11px var(--f-mono);letter-spacing:.05em;color:var(--muted);text-transform:uppercase}
.tag i{width:8px;height:8px;border-radius:50%}
.sh-head h2{margin:4px 0 0;font-size:18px;line-height:1.25;text-wrap:balance;overflow-wrap:anywhere}
.x{border:1px solid var(--line);background:var(--panel2);border-radius:8px;width:32px;height:32px;flex:none}
.sh-body{padding:12px 14px;overflow:auto;display:flex;flex-direction:column;gap:10px;min-height:0}
.sh-body p{margin:0;overflow-wrap:anywhere}
.sh-body blockquote{margin:0;padding:6px 10px;border-left:3px solid var(--nate);background:var(--panel2);border-radius:0 6px 6px 0;font-size:14px;overflow-wrap:anywhere}
.check{background:var(--panel2);border-radius:8px;padding:8px 10px;font-size:14px}
.check b{display:block;font:500 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted);font-size:13px}
.conns h4{margin:4px 0 6px;font:500 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.conns ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.conns button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:5px 6px;border-radius:6px;font-size:13.5px}
.conns button:hover{background:var(--panel2)}
.conns button i{width:7px;height:7px;border-radius:50%;flex:none}
.conns button span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conns button em{margin-left:auto;font:normal 11px var(--f-mono);color:var(--muted)}

.mark{border-top:1px solid var(--line);padding:10px 14px 14px;display:flex;flex-direction:column;gap:8px;background:var(--panel)}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btns button{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:9px 6px;font-weight:700;font-size:14px}
.btns button[data-k="confusing"][aria-pressed="true"]{background:var(--confuse);border-color:var(--confuse);color:#1a1200}
.btns button[data-k="delete"][aria-pressed="true"]{background:var(--del);border-color:var(--del);color:#1f0306}
.btns button[data-k="keep"][aria-pressed="true"]{background:var(--keep);border-color:var(--keep);color:#02160c}
.mark textarea{width:100%;min-height:52px;resize:vertical;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:14px}
.st{font-size:12px;color:var(--muted);min-height:16px}

/* review */
#review{position:absolute;inset:0;overflow:auto;display:flex;justify-content:center}
#review[hidden]{display:none}
.rv{width:100%;max-width:640px;padding:16px 16px 24px;display:flex;flex-direction:column;gap:12px;min-height:100%}
.rv-top{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rv-top .pill[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.prog{display:flex;align-items:center;gap:10px;font:500 13px var(--f-mono);color:var(--muted)}
.prog .bar{flex:1;height:5px;background:var(--panel2);border-radius:3px;overflow:hidden;display:flex}
.prog .bar span{height:100%}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;flex:1;min-height:340px;overflow:hidden}
.card .sh-body{flex:1}
.nav{display:flex;gap:8px}
.nav button{flex:1;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:9px;font-weight:600}
.done{padding:40px 18px;text-align:center;color:var(--muted)}
.done b{display:block;color:var(--fg);font-size:20px;margin-bottom:6px}
.legend .list{max-height:40vh;overflow:auto}

@media (max-width:700px){
  .top{flex-wrap:wrap}
  #q{order:3;flex-basis:100%}
  .hero{max-width:calc(100% - 32px)}
  .hero h1{font-size:24px}
  .nums{font-size:15px;gap:14px}
  .sheet{left:8px;right:8px;width:auto;top:auto;bottom:8px;max-height:72%}
  .legend{bottom:12px;left:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><i></i>Charlie's Brain</div>
    <div class="tabs" role="tablist">
      <button id="t-map" role="tab" aria-selected="true">Map</button>
      <button id="t-rev" role="tab" aria-selected="false">Review</button>
    </div>
    <input id="q" type="search" placeholder="Search notes, skills, concepts, videos…" aria-label="Search">
  </header>
  <div class="main">
    <section id="map">
      <canvas id="cv" aria-label="Map of every note and how they connect"></canvas>
      <div class="hero">
        <div class="eye">● A living knowledge system</div>
        <h1>Every idea.<br><span>Connected.</span></h1>
        <div class="nums" id="nums"></div>
      </div>
      <div class="legend" id="legend"></div>
      <aside class="sheet" id="sheet" hidden></aside>
    </section>
    <section id="review" hidden><div class="rv" id="rv"></div></section>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
const DATA = {"nodes": [{"id": "AGENTS.md", "kind": "file", "g": "core", "t": "Charlie's AI OS — router", "ex": "For any AI agent in this repo (Codex reads it directly; Claude Code imports it from CLAUDE.md). It loads with every message, so it holds who you're helping, how to work and where things live; detail sits in the files it points to. Smallest context that works, not shortest: cut a line only if it's duplicated, can be looked up or is stale (research/nate-herk/lesson-smallest-context.md). You're helping Charlie, a UK beg…", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/AGENTS.md", "cr": "", "d": 79}, {"id": "CLAUDE.md", "kind": "file", "g": "core", "t": "CLAUDE.md", "ex": "@AGENTS.md <!-- Claude Code reads CLAUDE.md, Codex reads AGENTS.md. Everything lives in AGENTS.md so the two never drift; this import pulls it in (see https://code.claude.com/docs/en/memory#agents-md). Claude-only notes go below. -- - Auto memory lives on the machine (~/.claude/projects/…/memory/) and is wiped with each cloud session, so anything worth keeping goes in this repo.", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/CLAUDE.md", "cr": "", "d": 19}, {"id": "EXPANSIONS.md", "kind": "file", "g": "core", "t": "EXPANSIONS — what to add as you grow", "ex": "The kit ships lean on purpose: six skills and a small set of context and reference files. As you grow, use /link to add new sources to the right route, and /audit to check that the information remains findable and current. The AIOS structure should look like a small, well-run business. Not a hoarder's basement. --- Folder / file Purpose ------ context/ About you, your business, your priorities. Filled by /onboard. re…", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/EXPANSIONS.md", "cr": "", "d": 11}, {"id": "README.md", "kind": "file", "g": "core", "t": "Charlie's AI OS", "ex": "A beginner's second brain for learning Claude Code and Codex. Start at AGENTS.md, the router that maps where everything lives (CLAUDE.md imports it for Claude Code).", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/README.md", "cr": "", "d": 1}, {"id": "THIRD-PARTY-NOTICES.md", "kind": "file", "g": "core", "t": "Third-party notices", "ex": "These files come from Nate Herk's AIS-OS starter kit, https://github.com/nateherkai/AIS-OS (commit ce9cb93, 2026-09-06), under the MIT licence below. The Three Ms of AI™ and The Four Cs of an AI OS™ are trademarks of Nate Herk; attribution is kept in each file. - references/parked-skills/onboard/ (parked 2026-10-08), .claude/skills/audit/, .claude/skills/link/, .claude/skills/level-up/, .claude/skills/grill-me/ (adap…", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/THIRD-PARTY-NOTICES.md", "cr": "", "d": 22}, {"id": "aios-intake.md", "kind": "file", "g": "core", "t": "AIS-OS Intake", "ex": "Filled 2026-10-08 from existing repo sources (each answer names its source). Q2 needs real writing pasted by Charlie; Q5 and the first half of Q7 are pending. Public repo: no private details. This is the source-of-truth file for your AIOS. Fill it in by typing, voice-pasting (Wispr Flow / OS dictation), or running /onboard for a guided conversation. Whichever mode, this file is what /onboard reads to scaffold your Da…", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/aios-intake.md", "cr": "", "d": 14}, {"id": "connections.md", "kind": "file", "g": "core", "t": "Connections", "ex": "Registry of every system this AI OS can reach (Nate's AIS-OS kit layout; see THIRD-PARTY-NOTICES.md). The audit skill checks it for coverage and freshness. \"Last checked\" means a successful read on that date, not just \"configured\". Public repo: tool names and status only, never keys or account details (keys: context/environment.md). # Domain Tool Mechanism Auth Last checked ------------------ 1 Revenue / Financials —…", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/connections.md", "cr": "", "d": 21}, {"id": "decisions.md", "kind": "file", "g": "audits", "t": "Decision log", "ex": "Charlie asked whether the Architect and Quartermaster work together, for relations between Nate's knowledge of skills and which to use, and to see the router's steps. Nate's 30 tools (nate-mentions.json) were almost absent from the Quartermaster (2 of 30): now source 4 of tools/buildhands.py, 25 added (162 to 187 tools), sighting dated to the oldest week so it never counts as news. New tools/routedepth.py: 85 of 99 c…", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/decisions.md", "cr": "", "d": 77}, {"id": ".claude/agents/architect.md", "kind": "file", "g": "skills", "t": "architect (agent)", "ex": "You are Nate's brain: an architecture advisor built from Nate Herk's public videos. You are not Nate, you don't imitate his voice, and you never claim to be him. You advise Charlie, a UK beginner learning Claude Code and Codex, on how his AI OS is organised. 1. research/nate-herk/brain/index.md: what's covered, and which transcript answers which kind of question. Always read this first. 2. research/nate-herk/brain/ru…", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/.claude/agents/architect.md", "cr": "", "d": 11}, {"id": ".claude/agents/guardian.md", "kind": "file", "g": "skills", "t": "guardian (agent)", "ex": "You are the Guardian. Someone else did the work; you decide if it's done. Nate: \"Claude doesn't get to declare itself done. A different model has to look at it with a different persona\" (iTY8Q449YNQ 22:25). You start with a fresh context on purpose: judge what is on disk and in Git, not what anyone says about it. You are given: Charlie's ask (his words), the \"done when\" list, the files or commits to check, and the dr…", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/.claude/agents/guardian.md", "cr": "", "d": 8}, {"id": ".claude/agents/nick-brain.md", "kind": "file", "g": "skills", "t": "nick-brain (agent)", "ex": "You are Nick's brain: an advisor built from Nick Saraev's public videos and X posts. You are not Nick and never claim to be; you answer as Nick's public content suggests he would, for Charlie, a UK beginner learning Claude Code and Codex who is building a YouTube channel. 1. research/nick-saraev/brain/index.md — what's covered and what isn't. 2. research/nick-saraev/brain/rules.md — his operating rules, each with quo…", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/.claude/agents/nick-brain.md", "cr": "", "d": 13}, {"id": ".claude/agents/video-tutor.md", "kind": "file", "g": "skills", "t": "video-tutor (agent)", "ex": "You are a patient specialist tutor. Your student, Charlie, is a UK beginner learning Claude Code and Codex. He is capable but new: explain every technical term the first time, in plain UK English, using everyday or trade analogies (he has worked in decorating, removals and landscaping). Transcript files in research/<creator/-transcript.md plus that folder's README.md. Read every transcript you are given in full befor…", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/.claude/agents/video-tutor.md", "cr": "", "d": 8}, {"id": ".claude/skills/audit/SKILL.md", "kind": "file", "g": "skills", "t": "audit (skill)", "ex": "Check whether this AIOS can find the right information and do useful work reliably, and identify changes that would make the user's work easier. Score Context, Connections, Capabilities, and Cadence out of 25 each, using rubric.md. This is rubric v2. Label the number verified operational reliability, not overall usefulness or percentage of work the AIOS can do. A folder, installed skill, API key, or confident claim i…", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/.claude/skills/audit/SKILL.md", "cr": "", "d": 26}, {"id": ".claude/skills/audit/compatibility.md", "kind": "file", "g": "skills", "t": "Routing and cross-runtime compatibility", "ex": "Required for every audit. Keep checks bounded and read-only. Inspect the runtimes actually used or explicitly targeted for migration; a single-runtime project does not need duplicate installations to pass. Treat a potential future migration as an optional opportunity unless requested. Never install, synchronize, rename, or run project workflows merely to audit them. - Read applicable manuals, scoped overrides, bridge…", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/.claude/skills/audit/compatibility.md", "cr": "", "d": 3}, {"id": ".claude/skills/audit/content-check.md", "kind": "file", "g": "skills", "t": "Content check (part of the audit skill; was os-audit until 2026-10-08)", "ex": "The failure-mode check and the backtrack after a miss. Run it after a wrong or missed answer, after big structural changes, when Charlie asks \"is anything wrong, stale or clashing?\", and after every switch to a new model (Rule 41). Start with python3 tools/contextcheck.py: what loads into every message, its size, and anything hidden (parent-folder or user-wide instructions, competing skills). Based on Nate Herk, \"Ste…", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/.claude/skills/audit/content-check.md", "cr": "", "d": 12}, {"id": ".claude/skills/audit/history.md", "kind": "file", "g": "skills", "t": "Automatic audit history", "ex": "Read this at the start of every AIOS audit. The dated reports are the durable history; each new report carries the finding ledger forward. Do not maintain a separate editable score database or depend on this conversation. Writing reports does not schedule future audits or repair the inspected system. 1. Resolve the audited project's root and its existing audits/ directory. Inspect report names and metadata first, not…", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/.claude/skills/audit/history.md", "cr": "", "d": 3}, {"id": ".claude/skills/audit/rubric.md", "kind": "file", "g": "skills", "t": "Four Cs rubric v2", "ex": "There are five criteria per C, each worth 5 points. Use 0, 1, 3, or 5 only: select the highest anchor fully supported by evidence. 0 means absent, contradicted, or not evidenced at even the 1-point level. Higher anchors retain the substantive checks below them; numerical coverage bands (such as N1) are alternatives, not simultaneous requirements. Never interpolate, start with full points and deduct, award points for …", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/.claude/skills/audit/rubric.md", "cr": "", "d": 1}, {"id": ".claude/skills/audit/templates/report.md", "kind": "file", "g": "skills", "t": "AIOS Audit: <project and date>", "ex": "<What works, most consequential mismatch, inspected runtimes/workflows/domains/probes, counts, exclusions, and verification limits. Mark partial runs explicitly. <Exact checked/missing/not-checked manuals, shared guidance comparison, finding IDs and file references, scoped coverage, and whether manuals changed. <Compatibility matrix and unique findings grouped by confirmed defect, verification gap, intentional differ…", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/.claude/skills/audit/templates/report.md", "cr": "", "d": 2}, {"id": ".claude/skills/brain-ingest/SKILL.md", "kind": "file", "g": "skills", "t": "brain-ingest (skill)", "ex": "Nate Herk's \"ingest\" step (research/nate-herk/i-built-another-andrej-karpathy-using-claude--bvGptCLDhyo-transcript.md, 9:08–9:38): one new source in, every affected page updated, nothing edited by hand. A brain lives in research/<creator/brain/: index.md (coverage), concepts.md (ideas from videos), x-themes.md (opinions from X), rules.md (operating rules, each with quotes), log.md (what was added when). List, triage …", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/.claude/skills/brain-ingest/SKILL.md", "cr": "", "d": 8}, {"id": ".cla , "kind": "file", "g": "skills", "t": "grill-me (skill)", "ex": "Relentlessly interview the user about every aspect of the topic until you reach shared understanding. Walk down each branch of the decision tree, resolving dependencies one by one. The real goal is to extract what's in their head into a durable, organized markdown file so nothing is lost as context fills up. Long interviews fill up context. If you hold answers only in your head, you will eventually misremember, confl…", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/.claude/skills/grill-me/SKILL.md", "cr": "", "d": 12}, {"id": ".claude/skills/i-have-adhd/SKILL.md", "kind": "file", "g": "skills", "t": "i-have-adhd (skill)", "ex": "The reader has ADHD. Output is not just brief. It is shaped so an ADHD brain can act on it. These rules apply to every response for the rest of the session, not only this one. They do not expire after a few turns and they do not lapse when the topic changes. If you are unsure whether they still apply, they do. Turn them off only when the reader says \"stop adhd mode\" or \"normal mode\". Confirm in one line, then return …", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/.claude/skills/i-have-adhd/SKILL.md", "cr": "", "d": 3}, {"id": ".claude/skills/level-up/SKILL.md", "kind": "file", "g": "skills", "t": "level-up (skill)", "ex": "Adapted from The Three Ms of AI™. © 2026 Nate Herk. All rights reserved. One interview = one artifact. Mindset phase always runs first. Background and checks: reference.md. Framework: references/3ms-framework.md. Resolve paths via AGENTS.md (see the last block). Read priorities, about-me (top pain), connections.md, the decisions log, skill frontmatter and any recent audits/ report. Ask only for what those lack. If an…", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/.claude/skills/level-up/SKILL.md", "cr": "", "d": 12}, {"id": ".claude/skills/level-up/reference.md", "kind": "file" com/eddieedwardsv2-ux/test-environment-/blob/main/templates/README.md", "cr": "", "d": 6}, {"id": "templates/standard-ai-os-v1/AGENTS.md", "kind": "file", "g": "templates", "t": "AI OS — router", "ex": "Loads at the start of every session, for any AI tool (Claude Code reads it via CLAUDE.md; Codex and others read AGENTS.md directly). It says who you're helping, how to work and where things live. It points; it doesn't store. Keep it under 200 lines (it's re-read with every message): details belong in the files below. Edits take effect in a new session. You're helping the person described in context/about-me.md. Their…", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/templates/standard-ai-os-v1/AGENTS.md", "cr": "", "d": 8}, {"id": "templates/standard-ai-os-v1/CLAUDE.md", "kind": "file", "g": "templates", "t": "templates/standard-ai-os-v1/CLAUDE.md", "ex": "@AGENTS.md - Anything worth keeping between sessions goes in these files, not only in Claude's auto memory.", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/templates/standard-ai-os-v1/CLAUDE.md", "cr": "", "d": 1}, {"id": "templates/standard-ai-os-v1/README.md", "kind": "file", "g": "templates", "t": "Standard AI-OS v1 (not yet personalised)", "ex": "A blank AI operating system built from Nate Herk's teaching (the full requirement list, with quotes, lives in the repo this was copied from: system/standard-ai-os-v1.md). Everything here is self-contained. The person's details are left as not yet personalised placeholders. AGENTS.md router: who, how to work, where things live (points, doesn't store) CLAUDE.md imports AGENTS.md (one router, every tool) context/ always…", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/templates/standard-ai-os-v1/README.md", "cr": "", "d": 16}, {"id": "templates/standard-ai-os-v1/decisions.md", "kind": "file", "g": "templates", "t": "Decisions", "ex": "Add-only log (newest at the top). Add a dated entry whenever you make a big change (a new folder, skill, rule or priority) and say why. Never delete old entries: a later entry supersedes an earlier one. <!-- Example: Why: … Supersedes: … (if any) --", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/templates/standard-ai-os-v1/decisions.md", "cr": "", "d": 1}, {"id": "templates/standard-ai-os-v1/.claude/skills/grill-me/SKILL.md", "kind": "file", "g": "templates", "t": "grill-me (skill)", "ex": "A quick brain dump is never enough; this asks until nothing is missing. 1. Open the capture file first: brainstorms/YYYY-MM-DD-<topic.md (create brainstorms/ if missing; continue an existing file on the same topic). Sections: Summary · Key decisions · Q&A log · Open flags. 2. Ask one question at a time. Settle the decisions others depend on first, and give your recommended answer with each question. If the files alre…", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/templates/standard-ai-os-v1/.claude/skills/grill-me/SKILL.md", "cr": "", "d": 2}, {"id": "templates/standard-ai-os-v1/.claude/skills/os-audit/SKILL.md", "kind": "file", "g": "templates", "t": "os-audit (skill)", "ex": "Report first: the only file it writes is the report; it never fixes, renames or deletes until you say yes to each fix. 1. Read the last report (audits/YYYY-MM-DD.md, if any): which findings are fixed, still open, or back again? 2. Routes: every path in AGENTS.md exists. Reverse: every folder, skill and agent has a route pointing to it. 3. Index truth: any index or README list matches the files on disk. 4. Freshness: …", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/templates/standard-ai-os-v1/.claude/skills/os-audit/SKILL.md", "cr": "", "d": 3}, {"id": "templates/standard-ai-os-v1/context/README.md", "kind": "file", "g": "templates", "t": "context/", "ex": "Always-true background: who you are (about-me.md) and what matters now (current-focus.md). Small, lasting facts only. Fill them with the grill-me skill.", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/templates/standard-ai-os-v1/context/README.md", "cr": "", "d": 3}, {"id": "templates/standard-ai-os-v1/context/about-me.md", "kind": "file", "g": "templates", "t": "About me", "ex": "Always-true background. Grows over time (fill it with the grill-me skill rather than a quick brain dump). Keep it to lasting facts; nothing private if the repo is public. - Who I am / my role: not yet personalised - What I'm working towards (this year): not yet personalised - Tools and devices I use (my stack): not yet personalised - How I like answers (tone, length, level): not yet personalised", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/templates/standard-ai-os-v1/context/about-me.md", "cr": "", "d": 4}, {"id": "templates/standard-ai-os-v1/context/current-focus.md", "kind": "file", "g": "templates", "t": "Current focus", "ex": "The one place that says what matters now. Refresh it whenever priorities change (at least every quarter). - Refresh by: a date 3 months from today; move it on each time you refresh - Priority (next 90 days): not yet personalised - Next step: not yet personalised - Parked (not now): nothing yet", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/templates/standard-ai-os-v1/context/current-focus.md", "cr": "", "d": 3}, {"id": "templates/standard-ai-os-v1/projects/README.md", "kind": "file", "g": "templates", "t": "Projects", "ex": "One folder per project (or client): projects/<name/. This is usually the biggest folder; deliverables land here. Each project folder starts with a README.md saying the goal, what \"done\" looks like and where its files are. A project with its own rules can have its own AGENTS.md/CLAUDE.md.", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/templates/standard-ai-os-v1/projects/README.md", "cr": "", "d": 3}, {"id": "templates/standard-ai-os-v1/research/README.md", "kind": "file", "g": "templates", "t": "Research (knowledge base, level 2)", "ex": "Add this only when you have about 30+ notes and keep forgetting what's in them. - Raw evidence: research/<source/ holds the original material (transcripts, posts, articles). Raw files are never edited. - Derived brain: research/<source/brain/ holds what was learned, built from the raw files: index.md (what's here now, the entry point), log.md (what was added when), concepts.md and rules.md (every claim with an exact …", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/templates/standard-ai-os-v1/research/README.md", "cr": "", "d": 2}, {"id": "c1", "kind": "concept", "g": "nate", "t": "Four context failure modes: poisoning, bloat, confusion, clash", "n": 1, "sec": "A", "secTitle": "Why an AI OS gives wrong answers", "body": [{"t": "p", "h": "When an agent is wrong because of its context, it is one of four things. <em>Poisoning<\/em>: a false fact sits in the context and the agent repeats it confidently. <em>Bloat<\/em>: so much is loaded that the agent can't pick out what's relevant (needle in a haystack). <em>Confusion<\/em>: something is irrelevant or missing, so the agent fills the gap itself (classic hallucination). <em>Clash<\/em>: old and new sources, or two sources, disagree, so the agent can't tell which to trust. Poisoning is the easiest to fix (verify: web search, cross-check a live source, or a human in the loop); bloat is harder and is handled by the expertise/situational split (concept 2)."}, {"t": "q", "h": "\"the four failure modes, poisoning, bloat, confusion, and clash.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=94s\" target=\"_blank\" rel=\"noopener\">1:34<\/a>"}, {"t": "q", "h": "\"Poisoning means you have a false fact somewhere in the context.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=125s\" target=\"_blank\" rel=\"noopener\">2:05<\/a>"}, {"t": "q", "h": "\"In March your policy was always refund. In June your policy is now to never refund.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=247s\" target=\"_blank\" rel=\"noopener\">4:07<\/a>"}, {"t": "p", "h": "Also: verification fix <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=156s\" target=\"_blank\" rel=\"noopener\">2:36<\/a>; bloat <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=186s\" target=\"_blank\" rel=\"noopener\">3:06<\/a>; confusion <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=216s\" target=\"_blank\" rel=\"noopener\">3:36<\/a>. Source: AI OS (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/steal-my-exact-ai-os-setup-5-simple-tips--Ek1NBfnnTH0-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "p", "h": "Nate gives no specific fix for clash or confusion in this video. <strong>(inference)<\/strong> Clash is fixed by keeping one current source per fact and marking or retiring old ones; confusion by making sure the missing thing has a route."}], "rules": [1, 2, 3], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 5}, {"id": "c2", "kind": "concept", "g": "nate", "t": "Expertise context vs situational context", "n": 2, "sec": "A", "secTitle": "Why an AI OS gives wrong answers", "body": [{"t": "p", "h": "Expertise context is what the agent needs on every run (who you are, goals, what the business does, policies): the rulebook, like a system prompt. Situational context is pulled in just in time for one task (a support ticket from yesterday). His analogy: the principal knows how classrooms run; the teacher knows each student. Keeping situational data always loaded adds bloat, confusion and even clash. In his \"four C's\" framework he maps <em>context<\/em> to expertise and <em>connections<\/em> to situational."}, {"t": "q", "h": "\"I think of context as expertise and I think of connections as situational.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=277s\" target=\"_blank\" rel=\"noopener\">4:37<\/a>"}, {"t": "q", "h": "\"expertise context is the rulebook\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=338s\" target=\"_blank\" rel=\"noopener\">5:38<\/a>"}, {"t": "q", "h": "\"go use that live lookup, pull the data in because you need it\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=368s\" target=\"_blank\" rel=\"noopener\">6:08<\/a>"}, {"t": "p", "h": "Source: AI OS (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/steal-my-exact-ai-os-setup-5-simple-tips--Ek1NBfnnTH0-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "p", "h": "Also: <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=8423s\" target=\"_blank\" rel=\"noopener\">bCl 2:20:23<\/a> \"I said don't read from the wiki unless you actually need it.\"; second brain = the first two C's, <a href=\"https://www.youtube.com/watch?v=yysILVsfLFM&amp;t=124s\" target=\"_blank\" rel=\"noopener\">yys 2:04<\/a>."}], "rules": [4], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 5}, {"id": "c3", "kind": "concept", "g": "nate", "t": "The root file is a router, not a warehouse", "n": 3, "sec": "B", "secTitle": "Organising the OS", "body": [{"t": "p", "h": "His main CLAUDE.md says who the agent is in a line or two and is otherwise a routing table: if you need X, go here (wiki path, hot cache, index, memory, tools, skills and agents, decisions, templates, projects). Sub-folders can have their own CLAUDE.md for project-level instructions. Because it is all plain files and folders, other agents (Codex, Hermes) can use the same setup."}, {"t": "q", "h": "\"I treat this almost purely as a router.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=766s\" target=\"_blank\" rel=\"noopener\">12:46<\/a>"}, {"t": "q", "h": "\"my cloudmd is essentially just a master routing file, just a master table of context.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=827s\" target=\"_blank\" rel=\"noopener\">13:47<\/a>"}, {"t": "q", "h": "\"a bunch of files and folders, which means you can plug in Hermes, you can plug in codecs\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=919s\" target=\"_blank\" rel=\"noopener\">15:19<\/a>"}, {"t": "p", "h": "Also: he shows the routing table at <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=797s\" target=\"_blank\" rel=\"noopener\">13:17<\/a>. Source: AI OS (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/steal-my-exact-ai-os-setup-5-simple-tips--Ek1NBfnnTH0-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "p", "h": "<em>Supporting:<\/em> the same idea in <a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/every-level-of-a-claude-second-brain-explained--DTCyvo6cC54-transcript.md\" target=\"_blank\" rel=\"noopener\">Every Level of a Claude Second Brain<\/a>, \"the claw.md is kind of treated as a router\" <a href=\"https://www.youtube.com/watch?v=DTCyvo6cC54&amp;t=274s\" target=\"_blank\" rel=\"noopener\">4:34<\/a>, and in <a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/i-turned-claude-into-the-ultimate-second-brain--8QQ_INxAhRs-transcript.md\" target=\"_blank\" rel=\"noopener\">I Turned Claude Into the Ultimate Second Brain<\/a>, \"I think of my Claude and MD file as my router\" <a href=\"https://www.youtube.com/watch?v=8QQ_INxAhRs&amp;t=309s\" target=\"_blank\" rel=\"noopener\">5:09<\/a>."}, {"t": "p", "h": "Also: \"I go into a routing map and that's the majority of my agents.mmd\" <a href=\"https://www.youtube.com/watch?v=yysILVsfLFM&amp;t=367s\" target=\"_blank\" rel=\"noopener\">yys 6:07<\/a>; new skills get registered in it <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=5408s\" target=\"_blank\" rel=\"noopener\">bCl 1:30:08<\/a>; \"cloudmd is the rules. Memory is, you know, learned facts.\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=7490s\" target=\"_blank\" rel=\"noopener\">jdb 2:04:50<\/a>. Length: concept 39 (concept 18's 200 lines is only the ceiling)."}], "rules": [5, 20], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 9}, {"id": "c4", "kind": "concept", "g": "nate", "t": "No single right layout; the test is whether you (and the agent) can find things", "n": 4, "sec": "B", "secTitle": "Organising the OS", "body": [{"t": "p", "h": "Flat or deeply nested doesn't matter. What matters is routing rules good enough that you and the agent can find things. His check: think of something you made and find it in the file explorer without searching or asking Claude. If you can, an agent with routing rules probably can too. The only wrong setup is one that keeps giving wrong answers while you do nothing."}, {"t": "q", "h": "\"routing rules in place so that you and your agents can find it.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1009s\" target=\"_blank\" rel=\"noopener\">16:49<\/a>"}, {"t": "q", "h": "\"see if you could find it without searching, without asking Claude\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1100s\" target=\"_blank\" rel=\"noopener\">18:20<\/a>"}, {"t": "q", "h": "\"the only way that you're doing this wrong is if you're constantly getting wrong answers and you're not doing anything about it.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1100s\" target=\"_blank\" rel=\"noopener\">18:20<\/a>"}, {"t": "p", "h": "Source: AI OS (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/steal-my-exact-ai-os-setup-5-simple-tips--Ek1NBfnnTH0-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "p", "h": "<em>Supporting:<\/em> \"can your agent find it again, and could you find it again\" <a href=\"https://www.youtube.com/watch?v=DTCyvo6cC54&amp;t=122s\" target=\"_blank\" rel=\"noopener\">2:02<\/a> (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/every-level-of-a-claude-second-brain-explained--DTCyvo6cC54-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}], "rules": [6], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 4}, {"id": "c5", "kind": "concept", "g": "nate", "t": "Segment knowledge that is distinct and growing", "n": 5, "sec": "B", "secTitle": "Organising the OS", "body": [{"t": "p", "h": "When separate bodies of knowledge keep growing (his YouTube transcripts and his meeting transcripts), split them into their own wikis so the agent knows where to look and searches far fewer files: faster, more accurate and cheaper on tokens. Claude Code itself suggested his split. Clients: keep internal knowledge (dates, price, scope, calls) in the OS, segmented by client; keep client-facing deliverables in a separate repo, while the OS still knows the engagement exists."}, {"t": "q", "h": "\"the more you can segment stuff out, the better.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1221s\" target=\"_blank\" rel=\"noopener\">20:21<\/a>"}, {"t": "q", "h": "\"how can you narrow the actual context that your agent is going to be looking through?\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1251s\" target=\"_blank\" rel=\"noopener\">20:51<\/a>"}, {"t": "q", "h": "\"it still needs to know about this engagement.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1341s\" target=\"_blank\" rel=\"noopener\">22:21<\/a>"}, {"t": "p", "h": "Also: the split Claude suggested <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1039s\" target=\"_blank\" rel=\"noopener\">17:19<\/a>–<a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1070s\" target=\"_blank\" rel=\"noopener\">17:50<\/a>. Source: AI OS (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/steal-my-exact-ai-os-setup-5-simple-tips--Ek1NBfnnTH0-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}], "rules": [9], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 3}, {"id": "c6", "kind": "concept", "g": "nate", "t": "Cadence: automate data that arrives on a schedule", "n": 6, "sec": "B", "secTitle": "Organising the OS", "body": [{"t": "p", "h": "If you keep asking the agent to pull the same data, it isn't really just-in-time situational context. Data that lands on a fixed rhythm (his Monday Q&amp;A, Tuesday leadership meeting) should be pulled in by a cron or routine, so it is there even if you forget. Natural language plus an API key is usually enough to set it up."}, {"t": "q", "h": "\"Build automations to update data.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1131s\" target=\"_blank\" rel=\"noopener\">18:51<\/a>"}, {"t": "q", "h": "\"this isn't sort of like a just in time sort of situational context thing\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1161s\" target=\"_blank\" rel=\"noopener\">19:21<\/a>"}, {"t": "p", "h": "Also: the audit's \"durability\" suggestion of weekly crons <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=553s\" target=\"_blank\" rel=\"noopener\">9:13<\/a>. Source: AI OS (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/steal-my-exact-ai-os-setup-5-simple-tips--Ek1NBfnnTH0-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "p", "h": "Also: of much-used skills, \"If they're getting used so often, why not just automate them?\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=8910s\" target=\"_blank\" rel=\"noopener\">bCl 2:28:30<\/a>. Cadence is the fourth C and comes last: concept 19."}], "rules": [10], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 4}, {"id": "c7", "kind": "concept", "g": "nate", "t": "The OS audit: indexes are claims, check them against reality", "n": 7, "sec": "C", "secTitle": "Keeping it true", "body": [{"t": "p", "h": "His <code>OS audit<\/code> skill reads the whole project and reports what is weak. It is read-only: it lists findings and fixes, writes a dated report into an <code>audits/<\/code> folder, reads the previous report first, and waits for a yes before fixing anything. Checks include routing integrity (does everything the router points to exist, and is anything misrouted in reverse), index truth (does the index match the disk), freshness, memory, bloat, duplication and organisation. On big projects it fans out one explore sub-agent per check and merges their reports. His demo found the index said 55 folders while the disk had 79, and listed the wrong answers that would cause."}, {"t": "q", "h": "\"It won't actually do anything yet.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=64s\" target=\"_blank\" rel=\"noopener\">1:04<\/a>"}, {"t": "q", "h": "\"Indexes and wiks are claims about what exists and what's current. The audit checks every claim against reality.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=583s\" target=\"_blank\" rel=\"noopener\">9:43<\/a>"}, {"t": "q", "h": "\"Index says 55 folders, but disk has 79.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=492s\" target=\"_blank\" rel=\"noopener\">8:12<\/a>"}, {"t": "p", "h": "Also: fix list marked await approval <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=523s\" target=\"_blank\" rel=\"noopener\">8:43<\/a>; checks <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=614s\" target=\"_blank\" rel=\"noopener\">10:14<\/a>–<a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=706s\" target=\"_blank\" rel=\"noopener\">11:46<\/a>. Before the skill, he did the same thing by asking weekly or monthly in plain chat: \"have AI audit itself.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1009s\" target=\"_blank\" rel=\"noopener\">16:49<\/a>. Source: AI OS (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/steal-my-exact-ai-os-setup-5-simple-tips--Ek1NBfnnTH0-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "p", "h": "Also: reports are saved and the skill should \"look for earlier reports inside of the audit folder\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=614s\" target=\"_blank\" rel=\"noopener\">10:14<\/a>; run it weekly, \"Maybe every single Friday, you run an audit\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=8910s\" target=\"_blank\" rel=\"noopener\">bCl 2:28:30<\/a>."}], "rules": [7, 8, 28], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 6}, {"id": "c8", "kind": "concept", "g": "nate", "t": "Freshness is a separate check from accuracy", "n": 8, "sec": "C", "secTitle": "Keeping it true", "body": [{"t": "p", "h": "Data can be correct but stale. The audit grades each data feed as fresh, drifting, frozen, retired or on demand. His demo's knowledge was current only to 29 June, so any later business question would get a confident but wrong answer."}, {"t": "q", "h": "\"Are all the data feeds current?\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=675s\" target=\"_blank\" rel=\"noopener\">11:15<\/a>"}, {"t": "q", "h": "\"fresh, drifting, frozen, retired, or if they're on demand.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=675s\" target=\"_blank\" rel=\"noopener\">11:15<\/a>"}, {"t": "q", "h": "\"would give me a confident June state answer, which would be wrong.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=523s\" target=\"_blank\" rel=\"noopener\">8:43<\/a>"}, {"t": "p", "h": "Source: AI OS (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/steal-my-exact-ai-os-setup-5-simple-tips--Ek1NBfnnTH0-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}], "rules": [8], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 3}, {"id": "c9", "kind": "concept", "g": "nate", "t": "Backtrack retrieval misses, then fix the route", "n": 9, "sec": "C", "secTitle": "Keeping it true", "body": [{"t": "p", "h": "When the agent searches for ages, or says it has no access to something you know is there, don't just tell it not to let that happen again. Make it retrace what it did and where it looked, explain why it missed, and then update the routing or reorganise files based on what it found."}, {"t": "q", "h": "\"you searched, and help me figure out why you didn't find that data right away.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1402s\" target=\"_blank\" rel=\"noopener\">23:22<\/a>"}, {"t": "q", "h": "\"Have it update the routing. Have it maybe even move stuff or reorganize stuff based on what it found when it was backtracking.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1402s\" target=\"_blank\" rel=\"noopener\">23:22<\/a>"}, {"t": "p", "h": "Also: \"number five is to backtrack\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1371s\" target=\"_blank\" rel=\"noopener\">22:51<\/a>. Source: AI OS (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/steal-my-exact-ai-os-setup-5-simple-tips--Ek1NBfnnTH0-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "p", "h": "<em>Supporting:<\/em> a 5-minute search for a file he knows the location of means the architecture needs updating, <a href=\"https://www.youtube.com/watch?v=8QQ_INxAhRs&amp;t=339s\" target=\"_blank\" rel=\"noopener\">5:39<\/a> (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/i-turned-claude-into-the-ultimate-second-brain--8QQ_INxAhRs-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "p", "h": "Also: \"every time you correct AI, you feed that correction back into the system\" <a href=\"https://www.youtube.com/watch?v=3XIGcM7VICc&amp;t=397s\" target=\"_blank\" rel=\"noopener\">3XI 6:37<\/a>; fix it where it lasts, \"update the skill in the smallest durable place\" <a href=\"https://www.youtube.com/watch?v=HIRDzMtuWFk&amp;t=365s\" target=\"_blank\" rel=\"noopener\">HIR 6:05<\/a>."}], "rules": [11], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 6}, {"id": "c10", "kind": "concept", "g": "nate", "t": "Raw evidence vs derived brain", "n": 10, "sec": "D", "secTitle": "Building an expert brain", "body": [{"t": "p", "h": "Step one gathers everything the expert has said into one raw folder, one sub-folder per source (he used free YouTube caption tools, and a paid X API that cost about a dollar), with one agent per source in parallel and a written record of what was fetched so it can be checked. Raw text alone is too messy to search well, so an LLM compiles it into a wiki (Karpathy's LLM-wiki idea). The raw files are never edited; the wiki is the derived layer on top. Obsidian is only a viewer."}, {"t": "q", "h": "\"I told it to write down what it got, so that you can actually check it.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=214s\" target=\"_blank\" rel=\"noopener\">3:34<\/a>"}, {"t": "q", "h": "\"It's like finding a needle in a haystack.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=214s\" target=\"_blank\" rel=\"noopener\">3:34<\/a>"}, {"t": "q", "h": "\"The raw files don't get touched\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=244s\" target=\"_blank\" rel=\"noopener\">4:04<\/a>"}, {"t": "p", "h": "Also: crawl set-up <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=183s\" target=\"_blank\" rel=\"noopener\">3:03<\/a>; Obsidian as the visual layer <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=274s\" target=\"_blank\" rel=\"noopener\">4:34<\/a>. Source: Karpathy (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/i-built-another-andrej-karpathy-using-claude--bvGptCLDhyo-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "p", "h": "<em>Supporting:<\/em> raw → wiki → index and log, shown step by step in <a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/fable-5-karpathy-s-llm-wiki-is-basically-cheating--hQvwMj7IJe4-transcript.md\" target=\"_blank\" rel=\"noopener\">Karpathy's LLM Wiki Is Basically Cheating<\/a>, <a href=\"https://www.youtube.com/watch?v=hQvwMj7IJe4&amp;t=518s\" target=\"_blank\" rel=\"noopener\">8:38<\/a>."}], "rules": [12], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 4}, {"id": "c11", "kind": "concept", "g": "nate", "t": "The brain's pages: index, log, source pages, concepts and rules", "n": 11, "sec": "D", "secTitle": "Building an expert brain", "body": [{"t": "p", "h": "The wiki keeps an index and a log, has one page per thing the expert wrote or said, and topic pages (principles, rules, methods, how he explains, how he debugs). He also mentions a \"hot page\". <strong>(inference)<\/strong> In this repo that maps to <code>index.md<\/code> (current state, what's covered), <code>log.md<\/code> (history), <code>concepts.md<\/code> (ideas) and <code>rules.md<\/code> (operating rules), with the transcripts as the source pages."}, {"t": "q", "h": "\"keeps an index, keeps a log\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=244s\" target=\"_blank\" rel=\"noopener\">4:04<\/a>"}, {"t": "p", "h": "Also: page types <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=274s\" target=\"_blank\" rel=\"noopener\">4:34<\/a>–<a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=304s\" target=\"_blank\" rel=\"noopener\">5:04<\/a>; index, hot page and log updated on ingest <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=578s\" target=\"_blank\" rel=\"noopener\">9:38<\/a>. Source: Karpathy (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/i-built-another-andrej-karpathy-using-claude--bvGptCLDhyo-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "p", "h": "<em>Supporting:<\/em> the index and log let the AI \"incrementally build and maintain this wiki\" <a href=\"https://www.youtube.com/watch?v=hQvwMj7IJe4&amp;t=578s\" target=\"_blank\" rel=\"noopener\">9:38<\/a> (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/fable-5-karpathy-s-llm-wiki-is-basically-cheating--hQvwMj7IJe4-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "p", "h": "Also: on memory files, \"it's an index, not a dump\" <a href=\"https://www.youtube.com/watch?v=LrgfmZkl3nc&amp;t=334s\" target=\"_blank\" rel=\"noopener\">Lrg 5:34<\/a>."}], "rules": [14], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 5}, {"id": "c12", "kind": "concept", "g": "nate", "t": "Provenance and inference labels", "n": 12, "sec": "D", "secTitle": "Building an expert brain", "body": [{"t": "p", "h": "Rules are what make the agent think like the expert, not just recall him. Each rule must link to an exact quote and where it came from, so you can click through and check it. If there is no source, the agent must say it is inferring."}, {"t": "q", "h": "\"what makes it think like him instead of just knowing what he said in the past.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=334s\" target=\"_blank\" rel=\"noopener\">5:34<\/a>"}, {"t": "q", "h": "\"every rule has to connect with an exact quote from him and where it came from. Because we don't want Claude to just make things up.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=334s\" target=\"_blank\" rel=\"noopener\">5:34<\/a>"}, {"t": "q", "h": "\"if there is no source, the agent has to say explicitly that it's inferring\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=394s\" target=\"_blank\" rel=\"noopener\">6:34<\/a>"}, {"t": "p", "h": "Source: Karpathy (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/i-built-another-andrej-karpathy-using-claude--bvGptCLDhyo-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}], "rules": [13], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 3}, {"id": "c13", "kind": "concept", "g": "nate", "t": "Relational ingestion", "n": 13, "sec": "D", "secTitle": "Building an expert brain", "body": [{"t": "p", "h": "The wiki links pages to each other: every rule links to its sources and every source to the rules it supports, so you query a relationship map, not a pile of notes. Adding one new link via an ingest command writes a source page, updates every page that source touches, and updates the index, hot page and log. In his demo a rule that had one source got a second and was promoted to a real rule. He never edited the wiki by hand."}, {"t": "q", "h": "\"Every rule links back to the source that it came from\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=304s\" target=\"_blank\" rel=\"noopener\">5:04<\/a>"}, {"t": "q", "h": "\"it will update every page that post touches.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=578s\" target=\"_blank\" rel=\"noopener\">9:38<\/a>"}, {"t": "q", "h": "\"a rule that was sitting on the bench with one source behind it got its second source and became a real rule.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=578s\" target=\"_blank\" rel=\"noopener\">9:38<\/a>"}, {"t": "p", "h": "Also: relationships make querying work <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=244s\" target=\"_blank\" rel=\"noopener\">4:04<\/a>. Source: Karpathy (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/i-built-another-andrej-karpathy-using-claude--bvGptCLDhyo-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}], "rules": [14], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 3}, {"id": "c14", "kind": "concept", "g": "nate", "t": "Specialist agents and skills", "n": 14, "sec": "E", "secTitle": "Turning knowledge into behaviour", "body": [{"t": "p", "h": "The rules become two files. A sub-agent holds the rules, how it talks and the loop it runs on every task; being a separate Claude with its own context, it doesn't drag your whole conversation along. A skill (a slash command) is the entry point: it sends your question to the agent and grades the answer against a checklist, one line per rule. The same knowledge can then feed your other skills, agents and workflows."}, {"t": "q", "h": "\"it doesn't drag your whole conversation along with it.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=394s\" target=\"_blank\" rel=\"noopener\">6:34<\/a>"}, {"t": "q", "h": "\"grades the answer against a checklist, one line per rule\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=425s\" target=\"_blank\" rel=\"noopener\">7:05<\/a>"}, {"t": "q", "h": "\"I can wire that knowledge into my own skills and my own agents and my own workflows\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=122s\" target=\"_blank\" rel=\"noopener\">2:02<\/a>"}, {"t": "p", "h": "Source: Karpathy (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/i-built-another-andrej-karpathy-using-claude--bvGptCLDhyo-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "p", "h": "<em>Supporting, a challenge:<\/em> in <a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/i-deleted-all-my-claude-skills-and-claude-got-smarter--XNQBCRcwXV4-transcript.md\" target=\"_blank\" rel=\"noopener\">I Deleted All My Claude Skills<\/a> he warns over-specific skills can hold newer models back and suggests \"making versions of them that aren't as specific\" <a href=\"https://www.youtube.com/watch?v=XNQBCRcwXV4&amp;t=341s\" target=\"_blank\" rel=\"noopener\">5:41<\/a>. <strong>(inference)<\/strong> Make skills for repeatable procedures, but keep them short."}, {"t": "p", "h": "Also: skill anatomy and triggering, concept 21; sub-agents in depth, concept 23."}], "rules": [15], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 4}, {"id": "c15", "kind": "concept", "g": "nate", "t": "Run gates: enforce verification, don't just ask for it", "n": 15, "sec": "E", "secTitle": "Turning knowledge into behaviour", "body": [{"t": "p", "h": "A hook runs when the agent tries to finish its turn. If it wrote code it never ran, the hook blocks the answer and sends it back. Verification becomes a step the agent can't skip."}, {"t": "q", "h": "\"a little script that runs right when the agent tries to finish its turn.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=455s\" target=\"_blank\" rel=\"noopener\">7:35<\/a>"}, {"t": "q", "h": "\"if it wrote code and it never ran it, the hook will basically block the answer\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=455s\" target=\"_blank\" rel=\"noopener\">7:35<\/a>"}, {"t": "q", "h": "\"baking in like a verification loop.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=455s\" target=\"_blank\" rel=\"noopener\">7:35<\/a>"}, {"t": "p", "h": "Source: Karpathy (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/i-built-another-andrej-karpathy-using-claude--bvGptCLDhyo-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "p", "h": "Also: \"every single skill that I build works in some sort of verification loop\" <a href=\"https://www.youtube.com/watch?v=9KOtMsZ9I28&amp;t=580s\" target=\"_blank\" rel=\"noopener\">9KO 9:40<\/a>."}, {"t": "p", "h": "<em>Supporting:<\/em> \"You verify yourself so that I don't have to verify.\" <a href=\"https://www.youtube.com/watch?v=XNQBCRcwXV4&amp;t=555s\" target=\"_blank\" rel=\"noopener\">9:15<\/a> (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/i-deleted-all-my-claude-skills-and-claude-got-smarter--XNQBCRcwXV4-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "p", "h": "Also: \"It delivered output one and then it watched it. It realized there was some mistakes and then it came back and it delivered output two.\" <a href=\"https://www.youtube.com/watch?v=7jHXoPGnA4c&amp;t=1113s\" target=\"_blank\" rel=\"noopener\">7jH 18:33<\/a>."}], "rules": [16], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 6}, {"id": "c16", "kind": "concept", "g": "nate", "t": "Real-world testing", "n": 16, "sec": "E", "secTitle": "Turning knowledge into behaviour", "body": [{"t": "p", "h": "The last step is testing on real things. Teaching test: it writes down what done means first, builds the smallest version, predicts, runs, shows a broken version, then lists what it ran and which rule drove each move. Review test: \"would the client accept this?\" on a script that had passed Claude's own test; the agent predicted a crash on an emoji in a normal Windows terminal, ran it that way, and it crashed. It then trimmed what wasn't earning its place and proved the trimmed version behaved the same by running both side by side."}, {"t": "q", "h": "\"the last step, of course, is just to test it.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=485s\" target=\"_blank\" rel=\"noopener\">8:05<\/a>"}, {"t": "q", "h": "\"saying that it works was only true in one specific setting or terminal.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=548s\" target=\"_blank\" rel=\"noopener\">9:08<\/a>"}, {"t": "q", "h": "\"we make it test on things that are real.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=608s\" target=\"_blank\" rel=\"noopener\">10:08<\/a>"}, {"t": "p", "h": "Also: the emoji crash <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=517s\" target=\"_blank\" rel=\"noopener\">8:37<\/a>. Source: Karpathy (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/i-built-another-andrej-karpathy-using-claude--bvGptCLDhyo-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "p", "h": "Also: a slides skill that couldn't see its own output got Chrome so it could \"open the page screenshot it look at it\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=3817s\" target=\"_blank\" rel=\"noopener\">bCl 1:03:37<\/a>; \"Before returning the final output, define the acceptance criteria.\" <a href=\"https://www.youtube.com/watch?v=HIRDzMtuWFk&amp;t=485s\" target=\"_blank\" rel=\"noopener\">HIR 8:05<\/a>."}, {"t": "p", "h": "Also: \"But, if Claude has your files and your examples and your workflows and your style guides and the actual success criteria for what good looks like\" <a href=\"https://www.youtube.com/watch?v=brB-hSiV2iU&amp;t=334s\" target=\"_blank\" rel=\"noopener\">brB 5:34<\/a>"}, {"t": "p", "h": "Also: \"I don't think that just giving Astra seven trading days was enough to really know if this is a viable strategy.\" <a href=\"https://www.youtube.com/watch?v=eg_1NXDcoPk&amp;t=1042s\" target=\"_blank\" rel=\"noopener\">eg_ 17:22<\/a>; a model refusing to act only shows up in the real setting, \"it actually has a restriction in there and it stopped trading for me.\" <a href=\"https://www.youtube.com/watch?v=eg_1NXDcoPk&amp;t=249s\" target=\"_blank\" rel=\"noopener\">eg_ 4:09<\/a>."}], "rules": [17, 27], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 8}, {"id": "c17", "kind": "concept", "g": "nate", "t": "Human understanding is the finish line", "n": 17, "sec": "F", "secTitle": "The point of it all", "body": [{"t": "p", "h": "The brain is not a voice clone or impression; it condenses how an expert thinks so you can talk to it until you understand. You can't be expert in everything, but you must understand what you ship, and your own system: he still finds his own files by hand to make sure he understands his OS. Team-wide AI OS sync is, for him, unsolved and a people and habit problem more than a tech one; mastering your own system first makes that easier."}, {"t": "q", "h": "\"you can outsource your thinking, but you cannot outsource your understanding.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=608s\" target=\"_blank\" rel=\"noopener\">10:08<\/a> (Nate quoting Karpathy)"}, {"t": "q", "h": "\"then I can just talk to it until I understand it.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=122s\" target=\"_blank\" rel=\"noopener\">2:02<\/a>"}, {"t": "q", "h": "\"I actually understand my own second brain\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1131s\" target=\"_blank\" rel=\"noopener\">18:51<\/a>"}, {"t": "q", "h": "\"I don't think it's a tech problem. I think it's a people problem.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1432s\" target=\"_blank\" rel=\"noopener\">23:52<\/a>"}, {"t": "p", "h": "Also: not an impression <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=31s\" target=\"_blank\" rel=\"noopener\">0:31<\/a>; master your own systems first <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1463s\" target=\"_blank\" rel=\"noopener\">24:23<\/a>. Sources: Karpathy (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/i-built-another-andrej-karpathy-using-claude--bvGptCLDhyo-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>), AI OS (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/steal-my-exact-ai-os-setup-5-simple-tips--Ek1NBfnnTH0-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "p", "h": "Also: \"Never accept AI output without asking why\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=397s\" target=\"_blank\" rel=\"noopener\">bCl 6:37<\/a>; \"You can't scale a system if you haven't lived in it yourself.\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=9092s\" target=\"_blank\" rel=\"noopener\">bCl 2:31:32<\/a>."}, {"t": "p", "h": "<em>Supporting:<\/em> for rolling an OS out to a team, \"you have to learn it first\" <a href=\"https://www.youtube.com/watch?v=8QQ_INxAhRs&amp;t=1993s\" target=\"_blank\" rel=\"noopener\">33:13<\/a> (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/i-turned-claude-into-the-ultimate-second-brain--8QQ_INxAhRs-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}], "rules": [18], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 6}, {"id": "c18", "kind": "concept", "g": "nate", "t": "The router is re-read every message, so keep it under 200 lines", "n": 18, "sec": "G", "secTitle": "From the wider course and newer videos", "body": [{"t": "p", "h": "<em>Replaced by concept 39 (2026-10-09):<\/em> the newer idea is the smallest context that works, not a fixed length; 200 lines is only the hard ceiling. The facts below (re-read every message, edits apply next session) still hold."}, {"t": "p", "h": "CLAUDE.md is loaded as system context at the start of every chat, so every extra line costs on every turn. Edits to it only take effect in a new session."}, {"t": "q", "h": "\"Claude auto reads it at the start of every single chat as system context. So keep it under 200 lines.\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=20187s\" target=\"_blank\" rel=\"noopener\">jdb 5:36:27<\/a>"}, {"t": "q", "h": "\"the edit actually doesn't apply until you restart that session.\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=21315s\" target=\"_blank\" rel=\"noopener\">jdb 5:55:15<\/a>"}, {"t": "p", "h": "Also: keep decisions, not chat history, in it: \"Save decisions, not conversations.\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=20645s\" target=\"_blank\" rel=\"noopener\">jdb 5:44:05<\/a>."}], "rules": [19, 41], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 4}, {"id": "c19", "kind": "concept", "g": "nate", "t": "The four C's, built in order: context, connections, capabilities, cadence", "n": 19, "sec": "G", "secTitle": "From the wider course and newer videos", "body": [{"t": "p", "h": "Context is what the AI knows about you; connections are the live data it can reach; capabilities are the skills that make it useful; cadence is when it acts on its own. The first two are the second brain. Each layer needs the one before it."}, {"t": "q", "h": "\"You can't have cadence without connections. You can't have capability without context. And you have to go in this order.\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=734s\" target=\"_blank\" rel=\"noopener\">bCl 12:14<\/a>"}, {"t": "q", "h": "\"each of these layers can't happen without the previous one.\" <a href=\"https://www.youtube.com/watch?v=0WDkwMxj13s&amp;t=489s\" target=\"_blank\" rel=\"noopener\">0WD 8:09<\/a>"}, {"t": "p", "h": "Also: <a href=\"https://www.youtube.com/watch?v=yysILVsfLFM&amp;t=124s\" target=\"_blank\" rel=\"noopener\">yys 2:04<\/a>, <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=15580s\" target=\"_blank\" rel=\"noopener\">jdb 4:19:40<\/a>. Links concept 2 (context/connections) and concept 6 (cadence)."}, {"t": "p", "h": "Also: \"So these four things really come one after the other, context, connections, capabilities, and cadence.\" <a href=\"https://www.youtube.com/watch?v=X-pbJWKmwi0&amp;t=2742s\" target=\"_blank\" rel=\"noopener\">Xpb 45:42<\/a>"}], "rules": [], "note": "no rule yet; links concepts 2 and 6 (above).", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 6}, {"id": "c20", "kind": "concept", "g": "nate", "t": "Levels of a second brain: start at level 1, move up only when it hurts", "n": 20, "sec": "G", "secTitle": "From the wider course and newer videos", "body": [{"t": "p", "h": "Level 1 is a router plus folders. Move to a compiled wiki (level 2) when notes pile up and you forget what's in them; a markdown wiki with good indexes is enough until hundreds of pages. Only keep knowledge that will still matter in a year."}, {"t": "q", "h": "\"If you have 30 plus notes and you keep forgetting what's in them, look at level two.\" <a href=\"https://www.youtube.com/watch?v=DTCyvo6cC54&amp;t=1733s\" target=\"_blank\" rel=\"noopener\">DTC 28:53<\/a>"}, {"t": "q", "h": "\"if you have hundreds of pages with good indexes, you're fine with wiki graph\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=8607s\" target=\"_blank\" rel=\"noopener\">bCl 2:23:27<\/a>"}, {"t": "p", "h": "Also: \"If there's not pain, then why create more?\" <a href=\"https://www.youtube.com/watch?v=DTCyvo6cC54&amp;t=244s\" target=\"_blank\" rel=\"noopener\">DTC 4:04<\/a>; \"in a year, will it be good for me to have this memory in here?\" <a href=\"https://www.youtube.com/watch?v=DTCyvo6cC54&amp;t=1643s\" target=\"_blank\" rel=\"noopener\">DTC 27:23<\/a>."}, {"t": "q", "h": "\"My wiki has links, isn't that a knowledge graph? Not exactly.\" — <a href=\"https://www.youtube.com/watch?v=DTCyvo6cC54&amp;t=761s\" target=\"_blank\" rel=\"noopener\">12:41<\/a>"}, {"t": "p", "h": "Added 2026-10-08: links between wiki pages are level 2, \"it's like a a see also. It's like backlinks\"; level 4 knowledge graphs record <em>how<\/em> things relate, and he plays with them but doesn't use them day to day. So \"fully connected\" at our level means every page links to related pages, not a graph tool."}], "rules": [42], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 4}, {"id": "c21", "kind": "concept", "g": "nate", "t": "Skills: progressive loading, and the description is the trigger", "n": 21, "sec": "G", "secTitle": "From the wider course and newer videos", "body": [{"t": "p", "h": "Claude reads only each skill's name and description (front matter, about 100 tokens) to pick one, then the full SKILL.md, then extra files only if needed. So the description must use the words a person would actually say, two skills mustn't compete, and broken front matter (an unclosed quote) stops it firing. Test with an obvious request, a reworded one and an unrelated one. Keep SKILL.md under 500 lines."}, {"t": "q", "h": "\"it would only read the YAML front matter.\" <a href=\"https://www.youtube.com/watch?v=zKBPwDpBfhs&amp;t=730s\" target=\"_blank\" rel=\"noopener\">zKB 12:10<\/a>"}, {"t": "q", "h": "\"a skill that Claude can't find is basically a skill that you don't have.\" <a href=\"https://www.youtube.com/watch?v=HIRDzMtuWFk&amp;t=273s\" target=\"_blank\" rel=\"noopener\">HIR 4:33<\/a>"}, {"t": "p", "h": "Also: <a href=\"https://www.youtube.com/watch?v=zKBPwDpBfhs&amp;t=700s\" target=\"_blank\" rel=\"noopener\">zKB 11:40<\/a>–<a href=\"https://www.youtube.com/watch?v=zKBPwDpBfhs&amp;t=761s\" target=\"_blank\" rel=\"noopener\">12:41<\/a>; <a href=\"https://www.youtube.com/watch?v=HIRDzMtuWFk&amp;t=242s\" target=\"_blank\" rel=\"noopener\">HIR 4:02<\/a>; \"You have to close off the quotes if you open them up\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=9462s\" target=\"_blank\" rel=\"noopener\">jdb 2:37:42<\/a>; \"keep the skill.md under 500 lines\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=4888s\" target=\"_blank\" rel=\"noopener\">bCl 1:21:28<\/a>."}], "rules": [21, 22], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 7}, {"id": "c22", "kind": "concept", "g": "nate", "t": "Skills start small, keep working code, and earn autonomy", "n": 22, "sec": "G", "secTitle": "From the wider course and newer videos", "body": [{"t": "p", "h": "A skill can be a short prompt you were tired of retyping. When a script works, save it as a file the skill points to rather than letting Claude rewrite it each run. New skills report and ask; give them more freedom only after many runs."}, {"t": "q", "h": "\"A skill can just be a prompt that you don't want to have to say every single time.\" <a href=\"https://www.youtube.com/watch?v=c0kaKxM2pHg&amp;t=122s\" target=\"_blank\" rel=\"noopener\">c0k 2:02<\/a>"}, {"t": "q", "h": "\"don't leave that code trapped inside the chat\" <a href=\"https://www.youtube.com/watch?v=HIRDzMtuWFk&amp;t=122s\" target=\"_blank\" rel=\"noopener\">HIR 2:02<\/a>"}, {"t": "p", "h": "Also: \"battle tested\" first <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=6457s\" target=\"_blank\" rel=\"noopener\">jdb 1:47:37<\/a>; \"They could literally just be a 50line markdown file.\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=5134s\" target=\"_blank\" rel=\"noopener\">bCl 1:25:34<\/a>; vet third-party skills <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=4735s\" target=\"_blank\" rel=\"noopener\">bCl 1:18:55<\/a>."}], "rules": [23], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 6}, {"id": "c23", "kind": "concept", "g": "nate", "t": "Sub-agents: for piles of output, read-only by their tools, never forced", "n": 23, "sec": "G", "secTitle": "From the wider course and newer videos", "body": [{"t": "p", "h": "Use a sub-agent when a job would flood your chat with output you won't re-read (many files, big searches). Make one read-only through its tool list, not by asking. Don't use them for one quick step: too many gives worse results. Shared agents live in the repo."}, {"t": "q", "h": "\"is this about to dump a pile of stuff into my chat that I'll never read again? If that's ever yes, delegate it to a sub agent.\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=9827s\" target=\"_blank\" rel=\"noopener\">jdb 2:43:47<\/a>"}, {"t": "q", "h": "\"if you're forcing too many sub agents, you're going to get worse results\" <a href=\"https://www.youtube.com/watch?v=e18sdZLwP7o&amp;t=1497s\" target=\"_blank\" rel=\"noopener\">e18 24:57<\/a>"}, {"t": "p", "h": "Also: \"explicitly read-only\" via disallowed tools <a href=\"https://www.youtube.com/watch?v=e18sdZLwP7o&amp;t=430s\" target=\"_blank\" rel=\"noopener\">e18 7:10<\/a>; \"so that you don't blow your own context window\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=5012s\" target=\"_blank\" rel=\"noopener\">bCl 1:23:32<\/a>."}], "rules": [24], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 5}, {"id": "c24", "kind": "concept", "g": "nate", "t": "Permissions are keys and deny lists, not prompts", "n": 24, "sec": "G", "secTitle": "From the wider course and newer videos", "body": [{"t": "p", "h": "Assume the agent will do anything it is able to. Safety comes from what it p
