hysically can't do: scoped API keys that only allow the needed actions, and a settings deny list for risky commands. His 150,000-email accident came from too many tools, not the permission mode."}, {"t": "q", "h": "\"A prompt is never a permission layer. You basically have to have the assumption that if it can, it will.\" <a href=\"https://www.youtube.com/watch?v=8QQ_INxAhRs&amp;t=1471s\" target=\"_blank\" rel=\"noopener\">8QQ 24:31<\/a>"}, {"t": "q", "h": "\"Can you help me update the settings file so that you physically cannot do those things?\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=4468s\" target=\"_blank\" rel=\"noopener\">jdb 1:14:28<\/a>"}, {"t": "p", "h": "Also: \"there's no point in giving the agent that actual tool to be able to do so.\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=4254s\" target=\"_blank\" rel=\"noopener\">jdb 1:10:54<\/a>; per-key permissions <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=2324s\" target=\"_blank\" rel=\"noopener\">bCl 38:44<\/a>."}], "rules": [25], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 5}, {"id": "c25", "kind": "concept", "g": "nate", "t": "Secrets in .env; your own keys travel, app connectors don't", "n": 25, "sec": "G", "secTitle": "From the wider course and newer videos", "body": [{"t": "p", "h": "Keys live in a <code>.env<\/code> file kept out of Git and out of chat. Prefer an API key plus a reference .md over app connectors or piles of MCP servers: connectors are lost when you change tool, and loaded MCPs eat tokens."}, {"t": "q", "h": "\"If you rely on these connections, that is not great\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=5844s\" target=\"_blank\" rel=\"noopener\">jdb 1:37:24<\/a>"}, {"t": "q", "h": "\"if you switch off to a different desktop app or a different harness, you lose everything.\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=5844s\" target=\"_blank\" rel=\"noopener\">jdb 1:37:24<\/a>"}, {"t": "p", "h": "Also: \"gets excluded from anytime we do a public push\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=2510s\" target=\"_blank\" rel=\"noopener\">bCl 41:50<\/a>; MCP token cost <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=2385s\" target=\"_blank\" rel=\"noopener\">bCl 39:45<\/a>."}, {"t": "p", "h": "Also: \"You don't want to paste it right in here into the chat thread, you want to paste it into the .env file.\" <a href=\"https://www.youtube.com/watch?v=oWCcN6hSFjA&amp;t=155s\" target=\"_blank\" rel=\"noopener\">oWC 2:35<\/a>; keys in one file move with you, \"I like to put all my API keys in there so that if I ever need to move them over to cloud code or if I need to move them over to trigger.dev, I already have them in one spot\" <a href=\"https://www.youtube.com/watch?v=FqnNL8fnUWo&amp;t=518s\" target=\"_blank\" rel=\"noopener\">Fqn 8:38<\/a>."}], "rules": [26], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 6}, {"id": "c26", "kind": "concept", "g": "nate", "t": "Grill me: interview the knowledge out of your head", "n": 26, "sec": "G", "secTitle": "From the wider course and newer videos", "body": [{"t": "p", "h": "The bottleneck is getting what you know into the system; a quick brain dump is never enough. The grill-me skill asks one question at a time, checkpoints every answer to a doc in <code>brainstorms/<\/code>, flags gaps to chase with others, and can be re-run when things change. Up-front time gets a skill close to right on the first try."}, {"t": "q", "h": "\"It's not ever good enough.\" <a href=\"https://www.youtube.com/watch?v=c0kaKxM2pHg&amp;t=62s\" target=\"_blank\" rel=\"noopener\">c0k 1:02<\/a>"}, {"t": "q", "h": "\"the bigger problem is getting everything out of your brain into the system\" <a href=\"https://www.youtube.com/watch?v=DTCyvo6cC54&amp;t=1338s\" target=\"_blank\" rel=\"noopener\">DTC 22:18<\/a>"}, {"t": "p", "h": "Also: checkpointing to brainstorms <a href=\"https://www.youtube.com/watch?v=c0kaKxM2pHg&amp;t=153s\" target=\"_blank\" rel=\"noopener\">c0k 2:33<\/a>; open flags <a href=\"https://www.youtube.com/watch?v=c0kaKxM2pHg&amp;t=367s\" target=\"_blank\" rel=\"noopener\">c0k 6:07<\/a>; ask until 95% sure <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=19974s\" target=\"_blank\" rel=\"noopener\">jdb 5:32:54<\/a>."}], "rules": [30], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 5}, {"id": "c27", "kind": "concept", "g": "nate", "t": "Session hygiene: clear between tasks, hand off before it degrades", "n": 27, "sec": "G", "secTitle": "From the wider course and newer videos", "body": [{"t": "p", "h": "Each message in a long chat costs more than in a fresh one, so start fresh for unrelated tasks. Before clearing (he says around 250-300k tokens, as autocompact comes too late), have the agent write a hand-off: what was done, files made, open decisions, next step."}, {"t": "q", "h": "\"Use slashclear between unrelated tasks.\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=19853s\" target=\"_blank\" rel=\"noopener\">jdb 5:30:53<\/a>"}, {"t": "q", "h": "\"Here are open decisions. Here's what's next.\" <a href=\"https://www.youtube.com/watch?v=0WDkwMxj13s&amp;t=1344s\" target=\"_blank\" rel=\"noopener\">0WD 22:24<\/a>"}, {"t": "p", "h": "Also: \"But the autocompact kicks in way too late.\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=7248s\" target=\"_blank\" rel=\"noopener\">jdb 2:00:48<\/a>."}], "rules": [29], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 4}, {"id": "c28", "kind": "concept", "g": "nate", "t": "One set of files for every tool (Claude Code and Codex)", "n": 28, "sec": "G", "secTitle": "From the wider course and newer videos", "body": [{"t": "p", "h": "Build tool-agnostic. Codex reads AGENTS.md, keeps config and agents in <code>.codex/<\/code> and skills in <code>.agents/<\/code>; skill files are identical between the two, only agent files differ (TOML vs markdown). A CLAUDE.md can simply reference AGENTS.md."}, {"t": "q", "h": "\"you're building things to be tool agnostic\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=124s\" target=\"_blank\" rel=\"noopener\">bCl 2:04<\/a>"}, {"t": "q", "h": "\"the skill files, which are the markdown files with the YAML front matter, are the exact same.\" <a href=\"https://www.youtube.com/watch?v=kB9iMD0EjT8&amp;t=184s\" target=\"_blank\" rel=\"noopener\">kB9 3:04<\/a>"}, {"t": "p", "h": "Also: <a href=\"https://www.youtube.com/watch?v=DTCyvo6cC54&amp;t=1369s\" target=\"_blank\" rel=\"noopener\">DTC 22:49<\/a>; shared skills and agents go in the repo <a href=\"https://www.youtube.com/watch?v=e18sdZLwP7o&amp;t=1497s\" target=\"_blank\" rel=\"noopener\">e18 24:57<\/a>."}], "rules": [], "note": "no rule yet; concept 3 says the same files serve Codex.", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 5}, {"id": "c29", "kind": "concept", "g": "nate", "t": "Context costs money and rots: act at about half the window", "n": 29, "sec": "H", "secTitle": "From the full-channel audit (2026-10-08)", "body": [{"t": "p", "h": "Every new message makes Claude re-read the whole chat from the start, so long chats cost more and, past roughly half the window, the answers get worse. Look at what is filling the context (run /context in a fresh session, delete unused tools, skills and servers) before blaming the model, convert documents to markdown because it is cheaper for AI, and check your usage allowance. When a path has gone wrong, rewind or restart rather than piling corrections on top of the failed attempt."}, {"t": "q", "h": "\"somewhere around halfway through your context window, it starts to fall apart.\" <a href=\"https://www.youtube.com/watch?v=eRS3CmvrOvA&amp;t=272s\" target=\"_blank\" rel=\"noopener\">eRS 4:32<\/a>"}, {"t": "q", "h": "\"go into a fresh session, do /context, and see what you're sitting at before you even send off anything\" <a href=\"https://www.youtube.com/watch?v=_qZvORxGqI0&amp;t=64s\" target=\"_blank\" rel=\"noopener\">_qZ 1:04<\/a>"}, {"t": "q", "h": "\"Claude rereads the entire conversation from the beginning, and all of those are tokens that it's charging you for\" <a href=\"https://www.youtube.com/watch?v=49V-5Ock8LU&amp;t=64s\" target=\"_blank\" rel=\"noopener\">49V 1:04<\/a>"}], "rules": [31], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 5}, {"id": "c30", "kind": "concept", "g": "nate", "t": "Plan, let the AI attack the plan, then build", "n": 30, "sec": "H", "secTitle": "From the full-channel audit (2026-10-08)", "body": [{"t": "p", "h": "Before anything non-trivial, plan first, then ask Claude to push back and play devil's advocate on the plan before it builds. Big plans are saved to a file and worked phase by phase, one session each. Nate teaches plan mode for this; Charlie declined plan mode itself on 2026-10-08, and this repo's 95%-or-ask rule (R14: be 95% sure or ask 1-2 questions) does the same job."}, {"t": "q", "h": "\"You ask Claude to start challenging you and pushing back and playing devil's advocate before it builds anything or before it approves any plan\" <a href=\"https://www.youtube.com/watch?v=iTY8Q449YNQ&amp;t=156s\" target=\"_blank\" rel=\"noopener\">iTY 2:36<\/a>"}, {"t": "q", "h": "\"Have one for discovery where you can have Claude read through PDFs and read through the code base\" <a href=\"https://www.youtube.com/watch?v=_qZvORxGqI0&amp;t=1285s\" target=\"_blank\" rel=\"noopener\">_qZ 21:25<\/a>"}, {"t": "q", "h": "\"So what you always want to do when you're creating an idea is you want to go on plan mode.\" <a href=\"https://www.youtube.com/watch?v=mpALXah_PBg&amp;t=7300s\" target=\"_blank\" rel=\"noopener\">mpA 2:01:40<\/a>"}], "rules": [32], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 5}, {"id": "c31", "kind": "concept", "g": "nate", "t": "A separate checker decides \"done\"; then try to break it", "n": 31, "sec": "H", "secTitle": "From the full-channel audit (2026-10-08)", "body": [{"t": "p", "h": "The worker should not mark its own homework: a different model or persona checks the result, and after \"done\" you stress test it for edge cases. When output is bad, first ask whether it is a model, harness or organisation problem. Verification steps also go into the to-do list, not just the end."}, {"t": "q", "h": "\"is this a model problem, is this a harness problem? Or is this an organization problem?\" <a href=\"https://www.youtube.com/watch?v=6LNlCpQPYFc&amp;t=1927s\" target=\"_blank\" rel=\"noopener\">6LN 32:07<\/a>"}, {"t": "q", "h": "\"Claude doesn't get to declare itself done. A different model has to look at it with a different persona\" <a href=\"https://www.youtube.com/watch?v=iTY8Q449YNQ&amp;t=1345s\" target=\"_blank\" rel=\"noopener\">iTY 22:25<\/a>"}, {"t": "q", "h": "\"by the time it tells you it's done, you stress test it more. and you try to find those edge cases\" <a href=\"https://www.youtube.com/watch?v=iTY8Q449YNQ&amp;t=583s\" target=\"_blank\" rel=\"noopener\">iTY 9:43<\/a>"}, {"t": "p", "h": "Also: stress test an automation with many helpers before a customer finds the bugs, \"spin up 50 different sub aents and have all of them test this thing, try to break it\" <a href=\"https://www.youtube.com/watch?v=FqnNL8fnUWo&amp;t=1340s\" target=\"_blank\" rel=\"noopener\">Fqn 22:20<\/a>; an AI judge checked against a human is concept 41."}], "rules": [33, 44], "note": "Rules 33 and 44 (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md\" target=\"_blank\" rel=\"noopener\">rules.md<\/a>).", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 6}, {"id": "c32", "kind": "concept", "g": "nate", "t": "Skills do one job, are built from a real run, and retire when they stop earning", "n": 32, "sec": "H", "secTitle": "From the full-channel audit (2026-10-08)", "body": [{"t": "p", "h": "Each skill or agent does one specific job. Build it by doing the task together once, then turning that run into a skill, and keep adding a line to a \"don'ts\" list for each real failure. Write instructions specifically, not vaguely. Retire a skill that no longer adds value, which matters once you have around ten."}, {"t": "q", "h": "\"the whole idea is that you want a skill to do one very specific job\" <a href=\"https://www.youtube.com/watch?v=X-pbJWKmwi0&amp;t=3985s\" target=\"_blank\" rel=\"noopener\">Xpb 1:06:25<\/a>"}, {"t": "q", "h": "\"So you want to make sure that your skill is actually adding value and not holding\" <a href=\"https://www.youtube.com/watch?v=6LNlCpQPYFc&amp;t=1469s\" target=\"_blank\" rel=\"noopener\">6LN 24:29<\/a>"}, {"t": "q", "h": "\"The way that I build my skills is I have Claude Code do something with me. I walk it through the steps\" <a href=\"https://www.youtube.com/watch?v=mpALXah_PBg&amp;t=22892s\" target=\"_blank\" rel=\"noopener\">mpA 6:21:32<\/a>"}, {"t": "p", "h": "Also: reverse-engineer a good example into a skill, \"Analyze this video, which was created by Opus 5.5, and figure out why this is so good.\" <a href=\"https://www.youtube.com/watch?v=7jHXoPGnA4c&amp;t=307s\" target=\"_blank\" rel=\"noopener\">7jH 5:07<\/a>; and keep feeding each run back, \"If you ever find yourself repeating something, just throw it in the skill.\" <a href=\"https://www.youtube.com/watch?v=7jHXoPGnA4c&amp;t=1083s\" target=\"_blank\" rel=\"noopener\">7jH 18:03<\/a>."}], "rules": [34], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 6}, {"id": "c33", "kind": "concept", "g": "nate", "t": "Unattended runs: one-shot, stateless, bounded, tested by hand first, fixed parts in scripts", "n": 33, "sec": "H", "secTitle": "From the full-channel audit (2026-10-08)", "body": [{"t": "p", "h": "A scheduled or background run must never need to stop and ask, can only see the repo, APIs and environment secrets, and needs a bounded scope with a named deliverable. Test it by hand and prove one live run before switching the schedule on. Put the fixed details in a script, because an agent left to interpret the same message will drift."}, {"t": "q", "h": "\"the agent was just interpreting the message different every time and it just acted differently\" <a href=\"https://www.youtube.com/watch?v=X-pbJWKmwi0&amp;t=10825s\" target=\"_blank\" rel=\"noopener\">Xpb 3:00:25<\/a>"}, {"t": "q", "h": "\"So, bound the scope, name the deliverable, and then all your sub agents can be put on Haiku.\" <a href=\"https://www.youtube.com/watch?v=jZgcWCzxh1I&amp;t=671s\" target=\"_blank\" rel=\"noopener\">jZg 11:11<\/a>"}, {"t": "q", "h": "\"You're not around. So, you probably want to make sure that it doesn't ever have to stop and ask you questions.\" <a href=\"https://www.youtube.com/watch?v=ehg4fhydTgs&amp;t=93s\" target=\"_blank\" rel=\"noopener\">ehg 1:33<\/a>"}, {"t": "p", "h": "Also: \"we want to have Codex do as much verification on it as possible.\" <a href=\"https://www.youtube.com/watch?v=FqnNL8fnUWo&amp;t=578s\" target=\"_blank\" rel=\"noopener\">Fqn 9:38<\/a>; wake-ups pass notes, \"every time an agent wakes up, it's going to leave some sort of handoff message\" <a href=\"https://www.youtube.com/watch?v=eg_1NXDcoPk&amp;t=91s\" target=\"_blank\" rel=\"noopener\">eg_ 1:31<\/a>. Deterministic versus agent loop is concept 42."}], "rules": [35], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 7}, {"id": "c34", "kind": "concept", "g": "nate", "t": "Permissions in layers: deny plus allow, start strict, helpers inherit, read-only and drafts first", "n": 34, "sec": "H", "secTitle": "From the full-channel audit (2026-10-08)", "body": [{"t": "p", "h": "Deny the destructive commands and also explicitly allow the safe ones. Start with read-only access and drafts, with a human approving anything outward, and remember that helper agents inherit the main session's permissions. Nate also describes auto mode (a classifier approves safe commands); auto mode is not adopted here, so the deny list stays the safety layer."}, {"t": "q", "h": "\"So, I would always start with like read-only access whenever you can, have the agent only do drafts\" <a href=\"https://www.youtube.com/watch?v=Ktnwygcnd8U&amp;t=640s\" target=\"_blank\" rel=\"noopener\">Ktn 10:40<\/a>"}, {"t": "q", "h": "\"go into your permissions and explicitly allow the commands that you know are safe\" <a href=\"https://www.youtube.com/watch?v=jqoFP9QapXI&amp;t=847s\" target=\"_blank\" rel=\"noopener\">jqo 14:07<\/a>"}, {"t": "q", "h": "\"they inherit the permissions from the main session. So, if you're on bypass permissions, then all of your agents are going to be on bypass permissions\" <a href=\"https://www.youtube.com/watch?v=vDVSGVpB2vc&amp;t=731s\" target=\"_blank\" rel=\"noopener\">vDV 12:11<\/a>"}], "rules": [36], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 5}, {"id": "c35", "kind": "concept", "g": "nate", "t": "Check before anything goes public: security review, private-data hook, untrusted content, plugin vetting", "n": 35, "sec": "H", "secTitle": "From the full-channel audit (2026-10-08)", "body": [{"t": "p", "h": "Before publishing, run a security review and use a hook to strip private data, not just a rule. Web pages and transcripts are untrusted content that could trick an agent into sending data out. Vet a plugin against a checklist (network calls, exfiltration, shell injection, secrets) before installing it."}, {"t": "q", "h": "\"that there's a hook that fires to remove any PII, any sensitive data of that client that I don't want living on my GitHub.\" <a href=\"https://www.youtube.com/watch?v=6LNlCpQPYFc&amp;t=1439s\" target=\"_blank\" rel=\"noopener\">6LN 23:59<\/a>"}, {"t": "q", "h": "\"if Claude reads malicious content during a run, then it theoretically could be tricked into sending data to an external server.\" <a href=\"https://www.youtube.com/watch?v=ehg4fhydTgs&amp;t=701s\" target=\"_blank\" rel=\"noopener\">ehg 11:41<\/a>"}, {"t": "q", "h": "\"I basically told it to run a security review and make sure that my API keys aren't exposed and that there's no vulnerabilities\" <a href=\"https://www.youtube.com/watch?v=saggDHHnmtQ&amp;t=1801s\" target=\"_blank\" rel=\"noopener\">sag 30:01<\/a>"}, {"t": "p", "h": "Also (a guest): \"if you protect your secrets and your credentials you have rowle security on\" <a href=\"https://www.youtube.com/watch?v=l8ywUsEJ2XQ&amp;t=3665s\" target=\"_blank\" rel=\"noopener\">l8y 1:01:05<\/a>. The stakes ladder is concept 43."}], "rules": [37], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 6}, {"id": "c36", "kind": "concept", "g": "nate", "t": "File hygiene: scratch apart from deliverables, folder READMEs, project first, start every task in the project", "n": 36, "sec": "H", "secTitle": "From the full-channel audit (2026-10-08)", "body": [{"t": "p", "h": "Tell the AI where throwaway files go so they stay apart from deliverables, and give every folder a short README saying why it exists. Everything starts in the project and is promoted to global only when earned, and every task starts inside the project, not a plain chat. \"Remember this\" has to end up in a file in the repo, since cloud auto-memory is wiped."}, {"t": "q", "h": "\"so that your agent always understands why does this folder exist and where should it look for different things\" <a href=\"https://www.youtube.com/watch?v=X-pbJWKmwi0&amp;t=5576s\" target=\"_blank\" rel=\"noopener\">Xpb 1:32:56<\/a>"}, {"t": "q", "h": "\"Everything is project until deserves to be promoted to global so that I know at all times what is the running total of everything that's running globally.\" <a href=\"https://www.youtube.com/watch?v=6LNlCpQPYFc&amp;t=1897s\" target=\"_blank\" rel=\"noopener\">6LN 31:37<\/a>"}, {"t": "q", "h": "\"if you want your assistant to remember something permanently, just tell it remember that I always prefer X.\" <a href=\"https://www.youtube.com/watch?v=mpALXah_PBg&amp;t=21188s\" target=\"_blank\" rel=\"noopener\">mpA 5:53:08<\/a>"}], "rules": [38], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 5}, {"id": "c37", "kind": "concept", "g": "nate", "t": "Operator habits: paste the whole error, make it do its own chores, match model and effort, adopt tools only for real pain, cap parallel sessions, use the OS for everything", "n": 37, "sec": "H", "secTitle": "From the full-channel audit (2026-10-08)", "body": [{"t": "p", "h": "Small habits that add up: paste the whole error, ask the AI to do the chores it lists for you, and use the cheapest model and effort that does the job. Adopt a new tool only for a real pain point and trial it on real work, run no more than three or four parallel sessions, and use your OS for everything for a week."}, {"t": "q", "h": "\"try to force yourself to do everything from here, from this interface\" <a href=\"https://www.youtube.com/watch?v=X-pbJWKmwi0&amp;t=2712s\" target=\"_blank\" rel=\"noopener\">Xpb 45:12<\/a>"}, {"t": "q", "h": "\"do not automatically run everything at maximum effort or even just high.\" <a href=\"https://www.youtube.com/watch?v=FBVNS1l5Vb8&amp;t=279s\" target=\"_blank\" rel=\"noopener\">FBV 4:39<\/a>"}, {"t": "q", "h": "\"it has some action items, it actually just tells you to do some stuff that it could do itself\" <a href=\"https://www.youtube.com/watch?v=saggDHHnmtQ&amp;t=917s\" target=\"_blank\" rel=\"noopener\">sag 15:17<\/a>"}, {"t": "p", "h": "Also: use the cheap model for the cheap decision, \"you're not using a slower and more expensive model to actually categorize all of those comments in the first place.\" <a href=\"https://www.youtube.com/watch?v=ymgH8jS6Wb8&amp;t=244s\" target=\"_blank\" rel=\"noopener\">ymg 4:04<\/a>; a big model can direct small ones, \"using Opus 5.5 as the orchestrator that spins up and sends off very specific instructions to a bunch of little GBD6 soul workers.\" <a href=\"https://www.youtube.com/watch?v=eF3yeJuifoQ&amp;t=2015s\" target=\"_blank\" rel=\"noopener\">eF3 33:35<\/a>; start pay-per-use until your pattern is clear, \"starting with pay-per-usage is a lot safer than just committing to a monthly subscription.\" <a href=\"https://www.youtube.com/watch?v=oWCcN6hSFjA&amp;t=611s\" target=\"_blank\" rel=\"noopener\">oWC 10:11<\/a>; adopt by fit, \"I think it's really about understanding what are the things that matter most to you.\" <a href=\"https://www.youtube.com/watch?v=BvvfZKKz4Yo&amp;t=944s\" target=\"_blank\" rel=\"noopener\">Bvv 15:44<\/a>; and if a tool cannot explain itself you lose trust, \"I start to lose trust over what kind of knowledge it actually has.\" <a href=\"https://www.youtube.com/watch?v=BvvfZKKz4Yo&amp;t=761s\" target=\"_blank\" rel=\"noopener\">Bvv 12:41<\/a>. How he tests a model is concept 40."}], "rules": [39], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 9}, {"id": "c38", "kind": "concept", "g": "nate", "t": "Parts rot at different speeds; score each audit", "n": 38, "sec": "H", "secTitle": "From the full-channel audit (2026-10-08)", "body": [{"t": "p", "h": "Different parts of an OS go stale at different rates, so review each at its own pace. Score every audit and keep the scores, so you can see the system improving over time."}, {"t": "q", "h": "\"it will store your scores every time so that you can see how you're actually improving your system\" <a href=\"https://www.youtube.com/watch?v=X-pbJWKmwi0&amp;t=3195s\" target=\"_blank\" rel=\"noopener\">Xpb 53:15<\/a>"}, {"t": "q", "h": "\"All of these different parts decay, become obsolete or rot at different rates.\" <a href=\"https://www.youtube.com/watch?v=6LNlCpQPYFc&amp;t=1377s\" target=\"_blank\" rel=\"noopener\">6LN 22:57<\/a>"}], "rules": [40], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 4}, {"id": "c39", "kind": "concept", "g": "nate", "t": "The smallest context that works: keep what's yours, cut what it can find, load procedures when needed, prune after every new model", "n": 39, "sec": "I", "secTitle": "Newest videos (2026-10-08)", "body": [{"t": "p", "h": "Newer models need far less instruction. Anthropic cut over 80% of Claude Code's own system prompt with no measured loss. Keep the details only you can supply: your voice, goals, audience, how your business works, why you want something, and the gotchas. Cut what the model can look up (long folder listings), what's written in more than one place, and old rules added for older models. Move a procedure that applies to one job into a skill that loads when that job comes up. Give the outcome, the reason and the limits, then get out of its way: heavy guard rails made his \"pretty\" output worse than a fresh, bare session's. Audit the set-up (Claude Code's <code>/doctor<\/code>, then a read-only \"smallest change\" prompt) monthly, quarterly or <strong>whenever you switch to a new model<\/strong>, and schedule it once you trust it."}, {"t": "q", "h": "\"the best context is the smallest amount of context that gets you the highest quality result at the cheapest cost.\" <a href=\"https://www.youtube.com/watch?v=oz2CwrPV2Rg&amp;t=123s\" target=\"_blank\" rel=\"noopener\">oz2 2:03<\/a>"}, {"t": "q", "h": "\"minimal doesn't necessarily mean short.\" <a href=\"https://www.youtube.com/watch?v=oz2CwrPV2Rg&amp;t=123s\" target=\"_blank\" rel=\"noopener\">oz2 2:03<\/a>"}, {"t": "q", "h": "\"I want to keep the details that help Claude understand the job and what makes it specific to me and then test it whether it still needs the procedure that I've written around it.\" <a href=\"https://www.youtube.com/watch?v=oz2CwrPV2Rg&amp;t=335s\" target=\"_blank\" rel=\"noopener\">oz2 5:35<\/a>"}, {"t": "q", "h": "\"if a detailed procedure only applies to when I'm editing a video, I'd rather load it in when I'm actually editing a video.\" <a href=\"https://www.youtube.com/watch?v=oz2CwrPV2Rg&amp;t=396s\" target=\"_blank\" rel=\"noopener\">oz2 6:36<\/a>"}, {"t": "q", "h": "\"every time a new model drops and you switch into it, you should probably just run this sort of audit anyways\" <a href=\"https://www.youtube.com/watch?v=oz2CwrPV2Rg&amp;t=640s\" target=\"_blank\" rel=\"noopener\">oz2 10:40<\/a>"}, {"t": "p", "h": "Also: what to keep, \"I mean my voice, I mean my goals, I mean my audience and the way that my business works.\" <a href=\"https://www.youtube.com/watch?v=oz2CwrPV2Rg&amp;t=366s\" target=\"_blank\" rel=\"noopener\">oz2 6:06<\/a>; hidden extra context, \"there can be instructions coming from somewhere else that you don't even know you're technically paying for.\" <a href=\"https://www.youtube.com/watch?v=oz2CwrPV2Rg&amp;t=517s\" target=\"_blank\" rel=\"noopener\">oz2 8:37<\/a>; his audit prompt, \"Audit this repo and show me the smallest change that would make the path from a raw YouTube idea to a filming ready script faster.\" <a href=\"https://www.youtube.com/watch?v=oz2CwrPV2Rg&amp;t=579s\" target=\"_blank\" rel=\"noopener\">oz2 9:39<\/a>."}, {"t": "p", "h": "<em>Source behind it:<\/em> Anthropic, \"The new rules of context engineering for Claude 5 generation models\" (Thariq Shihipar, 2026-07-24), summarised in <a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/anthropic-context-engineering-claude-5-source.md\" target=\"_blank\" rel=\"noopener\">../anthropic-context-engineering-claude-5-source.md<\/a>. Supports concepts 2 (expertise vs situational) and 14 (keep skills short), and Rule 18's audit cadence."}, {"t": "p", "h": "Also (a guest): models improving makes planning, specs and checks lighter, \"the better models and harnesses get, the easier all the things that we have to do as developers get.\" <a href=\"https://www.youtube.com/watch?v=l8ywUsEJ2XQ&amp;t=1947s\" target=\"_blank\" rel=\"noopener\">l8y 32:27<\/a> This is a second source for pruning rules written for older models (Rule 41)."}, {"t": "p", "h": "<em>Added later the same day:<\/em> the other 13 newest transcripts (8 model or tool tests, 1 trading experiment, 1 Codex automations tutorial, 1 guest interview, 1 business-idea video, 1 video-editing demo). Model tests date within weeks, so who won which task is not kept here; only how Nate tests, what carries over when you switch model, and four ideas that are new (40-43). Other lessons from them sit in \"Also\" lines on concepts 15, 16, 25, 31, 32, 33, 35, 37 and 39."}], "rules": [41], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 4}, {"id": "c40", "kind": "concept", "g": "nate", "t": "Test a model on your own work: same prompt, isolated, cost counted, then pick by the job", "n": 40, "sec": "I", "secTitle": "Newest videos (2026-10-08)", "body": [{"t": "p", "h": "This is how Nate tests a new model, and what to check when you switch. Give every model the exact same prompt at the same effort level, run them side by side in separate work trees so they cannot touch each other's files, record runtime and cost (at API prices even on a subscription), judge the outputs without knowing which is which, and ask which model gives more for the same money. One run is not proof, and a short trial can mislead. What carried over across his tests: a task with a clear spec and a way to check it goes to the cheaper model first; a vague, open-ended goal is where the bigger model's taste pays for itself; start effort at medium and scale up only for work that needs the reasoning; and fast modes cost many times the usage. Then re-run it on your own skills and prompts whenever the model changes (Rule 41)."}, {"t": "q", "h": "\"you got to get in there and you got to test it on your own skills and your own prompts and your own processes.\" <a href=\"https://www.youtube.com/watch?v=7eo-11K2e3c&amp;t=1517s\" target=\"_blank\" rel=\"noopener\">7eo 25:17<\/a>"}, {"t": "q", "h": "\"I put them in different work trees so they literally can't touch.\" <a href=\"https://www.youtube.com/watch?v=GmLcJVzkxPA&amp;t=62s\" target=\"_blank\" rel=\"noopener\">GmL 1:02<\/a>"}, {"t": "q", "h": "\"if I had a hundred bucks and I gave a hundred bucks to Opus and I gave a 100 bucks to Soul, which one would give me a better output or better quality for that 100 bucks?\" <a href=\"https://www.youtube.com/watch?v=eF3yeJuifoQ&amp;t=32s\" target=\"_blank\" rel=\"noopener\">eF3 0:32<\/a>"}, {"t": "q", "h": "\"if you have a task with an objective definition of done, then try that out with Sonnet 5.5 first.\" <a href=\"https://www.youtube.com/watch?v=7eo-11K2e3c&amp;t=93s\" target=\"_blank\" rel=\"noopener\">7eo 1:33<\/a>"}, {"t": "q", "h": "\"opus and sonnet would have given me a similar result but sonnets would have been cheaper.\" <a href=\"https://www.youtube.com/watch?v=7eo-11K2e3c&amp;t=812s\" target=\"_blank\" rel=\"noopener\">7eo 13:32<\/a>"}, {"t": "q", "h": "\"they said to just start on medium and scale it up or down if you need.\" <a href=\"https://www.youtube.com/watch?v=QCkHIyEPIYo&amp;t=430s\" target=\"_blank\" rel=\"noopener\">QCk 7:10<\/a>"}, {"t": "p", "h": "Also: the lesson of the trial itself, \"obviously one test like this isn't definitive\" <a href=\"https://www.youtube.com/watch?v=eF3yeJuifoQ&amp;t=1650s\" target=\"_blank\" rel=\"noopener\">eF3 27:30<\/a>; vague goals suit Claude models and exact specs suit GPT models, \"GBT models just feel like they are a really good obedient worker.\" <a href=\"https://www.youtube.com/watch?v=GmLcJVzkxPA&amp;t=2482s\" target=\"_blank\" rel=\"noopener\">GmL 41:22<\/a>; the point of testing, \"the whole point of testing models is testing them on your use cases, your knowledge work, the way that you use AI.\" <a href=\"https://www.youtube.com/watch?v=GmLcJVzkxPA&amp;t=2148s\" target=\"_blank\" rel=\"noopener\">GmL 35:48<\/a>; effort levels, \"Max, I think was just way too much for not enough good.\" <a href=\"https://www.youtube.com/watch?v=QCkHIyEPIYo&amp;t=1526s\" target=\"_blank\" rel=\"noopener\">QCk 25:26<\/a>; fast modes, \"I would never really care about the speed if it was going to eat that much more of my weekly usage.\" <a href=\"https://www.youtube.com/watch?v=pY5_Ux_YJjo&amp;t=282s\" target=\"_blank\" rel=\"noopener\">pY5 4:42<\/a>; a short experiment is thin evidence, \"I don't think that just giving Astra seven trading days was enough to really know if this is a viable strategy.\" <a href=\"https://www.youtube.com/watch?v=eg_1NXDcoPk&amp;t=1042s\" target=\"_blank\" rel=\"noopener\">eg_ 17:22<\/a>."}], "rules": [39, 43], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 9}, {"id": "c41", "kind": "concept", "g": "nate", "t": "Evals before trust: a golden set, repeat runs, and an AI judge checked against a human", "n": 41, "sec": "I", "secTitle": "Newest videos (2026-10-08)", "body": [{"t": "p", "h": "Before you rely on a cheap model, a changed prompt or an AI agent, test it against examples where you already know the right answer (a golden set), and expect results to vary run to run, so one fixed failure proves little. When quality is a matter of taste, an AI judge can check outputs at scale, but only after you have a person mark about 100 examples and measure how often the judge agrees, then tune the judge's instructions until it does. If you switch the judge's model, check the agreement again. The judge idea is the guest Dave's (Glido); Nate's own examples are the golden data set and the repeat runs."}, {"t": "q", "h": "\"What you're really going to want to do is run evals, meaning you're going to have a golden data set of 100 use cases and 100 correct answers\" <a href=\"https://www.youtube.com/watch?v=ymgH8jS6Wb8&amp;t=763s\" target=\"_blank\" rel=\"noopener\">ymg 12:43<\/a>"}, {"t": "q", "h": "\"this is essentially our golden data set that we're testing the agent against because we know what the correct answers should be\" <a href=\"https://www.youtube.com/watch?v=QDsenEcAJIk&amp;t=275s\" target=\"_blank\" rel=\"noopener\">QDs 4:35<\/a>"}, {"t": "q", "h": "\"fixing just one example doesn't prove the whole agent is reliable\" <a href=\"https://www.youtube.com/watch?v=QDsenEcAJIk&amp;t=306s\" target=\"_blank\" rel=\"noopener\">QDs 5:06<\/a>"}, {"t": "q", "h": "\"creating alignment between the human reviewer and the LLM.\" <a href=\"https://www.youtube.com/watch?v=l8ywUsEJ2XQ&amp;t=2284s\" target=\"_blank\" rel=\"noopener\">l8y 38:04<\/a>"}, {"t": "q", "h": "\"this is where you can essentially capture the taste.\" <a href=\"https://www.youtube.com/watch?v=l8ywUsEJ2XQ&amp;t=2314s\" target=\"_blank\" rel=\"noopener\">l8y 38:34<\/a>"}, {"t": "q", "h": "\"if you switch the model it might not be as good anymore because the model might interpret it differently.\" <a href=\"https://www.youtube.com/watch?v=l8ywUsEJ2XQ&amp;t=2468s\" target=\"_blank\" rel=\"noopener\">l8y 41:08<\/a>"}, {"t": "p", "h": "Also: why the decision model is not trusted blind, \"don't just plug in Jev and trust what it says automatically.\" <a href=\"https://www.youtube.com/watch?v=ymgH8jS6Wb8&amp;t=763s\" target=\"_blank\" rel=\"noopener\">ymg 12:43<\/a>; why agents vary, \"they are non-deterministic.\" <a href=\"https://www.youtube.com/watch?v=QDsenEcAJIk&amp;t=306s\" target=\"_blank\" rel=\"noopener\">QDs 5:06<\/a>."}], "rules": [17, 33, 43], "note": "Rules 17, 33 and 43 (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md\" target=\"_blank\" rel=\"noopener\">rules.md<\/a>). Builds on concept 31 (a separate checker).", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 7}, {"id": "c42", "kind": "concept", "g": "nate", "t": "Fixed flows belong in code; use an agent loop only when it must loop", "n": 42, "sec": "I", "secTitle": "Newest videos (2026-10-08)", "body": [{"t": "p", "h": "Ask whether an automation is deterministic (the same steps in the same order every time, with AI only inside one or two steps, such as drafting) or whether it must decide how many times to look. A deterministic flow should be written as code and run by a scheduler or a trigger outside the agent: it costs far less (agent routines on a subscription eat the weekly limit) and cannot drift. Plan with the AI, have it build and test locally, then prove one live run on the host before switching the schedule on. Keep the agent loop (the Codex SDK) for work that truly needs the AI to go back and look again, and build the simplest version first."}, {"t": "q", "h": "\"the more deterministic your automation gets, the more of a waste it would be to use codeex to host that.\" <a href=\"https://www.youtube.com/watch?v=FqnNL8fnUWo&amp;t=367s\" target=\"_blank\" rel=\"noopener\">Fqn 6:07<\/a>"}, {"t": "q", "h": "\"build the simplest solution possible and only move up the sort of AI systems pyramid as I call it when you truly need that functionality.\" <a href=\"https://www.youtube.com/watch?v=FqnNL8fnUWo&amp;t=1764s\" target=\"_blank\" rel=\"noopener\">Fqn 29:24<\/a>"}, {"t": "q", "h": "\"this eats at your actual weekly usage limit.\" <a href=\"https://www.youtube.com/watch?v=FqnNL8fnUWo&amp;t=1s\" target=\"_blank\" rel=\"noopener\">Fqn 0:01<\/a>"}, {"t": "q", "h": "\"we want to have Codex do as much verification on it as possible.\" <a href=\"https://www.youtube.com/watch?v=FqnNL8fnUWo&amp;t=578s\" target=\"_blank\" rel=\"noopener\">Fqn 9:38<\/a>"}, {"t": "q", "h": "\"I actually did this before where I had a routine that was very simple like this and after about a month, it started to just go rogue.\" <a href=\"https://www.youtube.com/watch?v=FqnNL8fnUWo&amp;t=608s\" target=\"_blank\" rel=\"noopener\">Fqn 10:08<\/a>"}, {"t": "p", "h": "Also: a stateless loop leaves notes for itself, \"every time an agent wakes up, it's going to leave some sort of handoff message\" <a href=\"https://www.youtube.com/watch?v=eg_1NXDcoPk&amp;t=91s\" target=\"_blank\" rel=\"noopener\">eg_ 1:31<\/a>; pay per use against a subscription has a break-even, \"there's a break-even point.\" <a href=\"https://www.youtube.com/watch?v=oWCcN6hSFjA&amp;t=581s\" target=\"_blank\" rel=\"noopener\">oWC 9:41<\/a>; the ladder in concept 20 is the same advice."}], "rules": [35, 42], "note": "Rules 35 and 42 (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md\" target=\"_blank\" rel=\"noopener\">rules.md<\/a>). Extends concept 33.", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 6}, {"id": "c43", "kind": "concept", "g": "nate", "t": "Match your care to who will use it: the stakes ladder (a guest's view)", "n": 43, "sec": "I", "secTitle": "Newest videos (2026-10-08)", "body": [{"t": "p", "h": "Guest Dave (Glido) puts building on a ladder: a tool just for you (stakes very low, just build), then your team, then a client's company (contracts and data-privacy duties), then a product the public uses. Each rung is more complex and riskier, and you earn your way up rather than skipping rungs. Bad architecture shows up as a slow or broken app you will notice; a security breach cannot be taken back. Beginners are not expected to know security, only to know the topics to ask the AI about: a standard database with row-level security, strong passwords and two-step sign-in, secrets kept out of code, and firewalls that only let the front end through. He also says he now goes straight to building rather than writing big specs first (see \"Videos that disagree\" below)."}, {"t": "q", "h": "\"it gets more complex and the stakes are bigger.\" <a href=\"https://www.youtube.com/watch?v=l8ywUsEJ2XQ&amp;t=869s\" target=\"_blank\" rel=\"noopener\">l8y 14:29<\/a>"}, {"t": "q", "h": "\"if you just build something for you, you use it. Stakes are very low.\" <a href=\"https://www.youtube.com/watch?v=l8ywUsEJ2XQ&amp;t=869s\" target=\"_blank\" rel=\"noopener\">l8y 14:29<\/a>"}, {"t": "q", "h": "\"security breach that's one thing that you like cannot take back\" <a href=\"https://www.youtube.com/watch?v=l8ywUsEJ2XQ&amp;t=1207s\" target=\"_blank\" rel=\"noopener\">l8y 20:07<\/a>"}, {"t": "q", "h": "\"you really do have to earn your way up to the next rung.\" <a href=\"https://www.youtube.com/watch?v=l8ywUsEJ2XQ&amp;t=1207s\" target=\"_blank\" rel=\"noopener\">l8y 20:07<\/a>"}, {"t": "q", "h": "\"if you protect your secrets and your credentials you have rowle security on and you put proper firewalls on your database your back end and whitelist it for your like front end application that is security in a nutshell\" <a href=\"https://www.youtube.com/watch?v=l8ywUsEJ2XQ&amp;t=3665s\" target=\"_blank\" rel=\"noopener\">l8y 1:01:05<\/a>"}, {"t": "q", "h": "\"It's just the awareness being able to like ask the right questions\" <a href=\"https://www.youtube.com/watch?v=l8ywUsEJ2XQ&amp;t=3726s\" target=\"_blank\" rel=\"noopener\">l8y 1:02:06<\/a>"}, {"t": "p", "h": "Also: why planning matters less now, \"the better models and harnesses get, the easier all the things that we have to do as developers get.\" <a href=\"https://www.youtube.com/watch?v=l8ywUsEJ2XQ&amp;t=1947s\" target=\"_blank\" rel=\"noopener\">l8y 32:27<\/a> Most of this video is the guest talking, so it is his view, not Nate's; Nate's questions only steer it."}], "rules": [37, 42], "note": "Rules 37 and 42 (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md\" target=\"_blank\" rel=\"noopener\">rules.md<\/a>). Supports concept 35 (check before going public).", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 4}, {"id": "c44", "kind": "concept", "g": "nate", "t": "Six phrases, in order: interview, spec, verify, skill; sub-agents for research; automate last", "n": 44, "sec": "J", "secTitle": "Other formats (Instagram DMs, posts)", "body": [{"t": "p", "h": "A ready-made prompt for each stage of a real task. <strong>Interview me:<\/strong> one question at a time until a stranger could build it, asking what \"done\" looks like and flagging what was vague, and never asking what was already said. <strong>Implementation spec:<\/strong> what gets built, which files (named), the order, what could go wrong, what is <em>not<\/em> being done, and the three decisions you'd most likely disagree with. <strong>Verify before you build:<\/strong> pick the strongest check you have (a test run, a command's output, real data, a re-read of the diff against the ask), say what it would <em>not<\/em> catch, then report VERIFIED and NOT VERIFIED; \"I reviewed the code\" is not a check. <strong>Build me a skill:<\/strong> the second time you solve something, written as imperative instructions to a future agent (when it fires, steps, prompts that worked, mistakes and fixes), under 300 lines. <strong>Sub-agents<\/strong> only for independent work (search, review, research): say how many, what each owns and how a contradiction is settled, then reconcile into one answer. <strong>Automate this<\/strong> last: show what runs, when, what it touches and what happens on failure; read broadly, write to exactly one place, show anything it would send, log every run."}, {"t": "q", "h": "\"Then tell me what that check would NOT catch.\" <a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/six-phrases-instagram-source.md\" target=\"_blank\" rel=\"noopener\">six phrases, 4<\/a>"}, {"t": "q", "h": "\"VERIFIED: [what you ran, what it returned]\" <a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/six-phrases-instagram-source.md\" target=\"_blank\" rel=\"noopener\">six phrases, 4<\/a>"}, {"t": "q", "h": "\"NOT VERIFIED: [what you couldn't check and why]\" <a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/six-phrases-instagram-source.md\" target=\"_blank\" rel=\"noopener\">six phrases, 4<\/a>"}, {"t": "q", "h": "\"End with the three decisions in this plan I'm most likely to disagree with, and why you chose them.\" <a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/six-phrases-instagram-source.md\" target=\"_blank\" rel=\"noopener\">six phrases, 2<\/a>"}, {"t": "q", "h": "\"The rule: run this the second time you solve something, not the first.\" <a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/six-phrases-instagram-source.md\" target=\"_blank\" rel=\"noopener\">six phrases, 5<\/a>"}, {"t": "q", "h": "\"Let it read broadly and write to exactly one place.\" <a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/six-phrases-instagram-source.md\" target=\"_blank\" rel=\"noopener\">six phrases, 6<\/a>"}, {"t": "q", "h": "\"Make it state the conflict before resolving it.\" <a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/six-phrases-instagram-source.md\" target=\"_blank\" rel=\"noopener\">six phrases, what breaks<\/a>"}, {"t": "p", "h": "Also: the trap in interviews, \"One question at a time is not optional.\" <a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/six-phrases-instagram-source.md\" target=\"_blank\" rel=\"noopener\">six phrases, 3<\/a>; \"Get phrases 2 and 4 reliable before you reach for this one.\" <a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/six-phrases-instagram-source.md\" target=\"_blank\" rel=\"noopener\">six phrases, 6<\/a>."}, {"t": "p", "h": "<em>Source:<\/em> an Instagram auto-DM pasted by Charlie on 2026-10-09 (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/six-phrases-instagram-source.md\" target=\"_blank\" rel=\"noopener\">six-phrases-instagram-source.md<\/a>); attributed to Nate, not a video, date sent unknown. It restates concepts 22 (skills earn autonomy), 23 (sub-agents), 26 (grill me), 31 (a separate checker) and 42 (fixed flows, careful automation); what's new is the exact report shape, \"what it would NOT catch\", the \"three decisions you'd disagree with\" line and \"write to exactly one place\". Its \"do not write code until I say go\" is a checkpoint; this OS keeps Charlie out of the loop for small, easy-to-undo work and puts real choices on the Desk instead (see <code>context/working-rules.md<\/code>)."}], "rules": [44], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 2}, {"id": "r1", "kind": "rule", "g": "nate", "t": "Name the failure mode before fixing", "n": 1, "conf": "stated: the four modes; inference: naming one before any fix", "body": [{"t": "p", "h": "A wrong answer is poisoning, bloat, confusion or clash. Each has a different fix, so name it first."}, {"t": "q", "h": "\"the four failure modes, poisoning, bloat, confusion, and clash.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=94s\" target=\"_blank\" rel=\"noopener\">1:34<\/a>"}, {"t": "check", "h": "<em>Which of the four is this: false fact, too much loaded, something missing, or two sources disagreeing?<\/em> (Concept 1)"}], "concepts": [1], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 3}, {"id": "r2", "kind": "rule", "g": "nate", "t": "Fix poisoning with verification, not hope", "n": 2, "conf": "stated", "body": [{"t": "p", "h": "Cross-check facts against a live source or a search; if the agent isn't sure, put a human in the loop."}, {"t": "q", "h": "\"poisoning is the easiest one to fix because basically it's just a matter of having some verification.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=156s\" target=\"_blank\" rel=\"noopener\">2:36<\/a>"}, {"t": "q", "h": "Also: \"Never accept AI output without asking why\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=397s\" target=\"_blank\" rel=\"noopener\">6:37<\/a>"}, {"t": "check", "h": "<em>Where does this fact get checked before it's used?<\/em> (Concept 1: poisoning)"}], "concepts": [1], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 4}, {"id": "r3", "kind": "rule", "g": "nate", "t": "One current source per fact", "n": 3, "conf": "inference", "body": [{"t": "p", "h": "Nate describes clash (old and new policies side by side, <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=247s\" target=\"_blank\" rel=\"noopener\">4:07<\/a>) but gives no fix in these videos (none of the 14 added on 2026-10-07 gives one either, so this stays inference). Our rule: when a fact changes, update or retire the old copy rather than adding a second one; history goes in a log, not beside the current state."}, {"t": "check", "h": "<em>Is this fact written anywhere else? Which one wins?<\/em> (Concept 1: clash)"}], "concepts": [1], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 3}, {"id": "r4", "kind": "rule", "g": "nate", "t": "Always-loaded is for expertise only", "n": 4, "conf": "stated", "body": [{"t": "p", "h": "Load who you are, goals and policies every run. Fetch one-off, situational data just in time."}, {"t": "q", "h": "\"the situational context is things that you need just in time.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=338s\" target=\"_blank\" rel=\"noopener\">5:38<\/a>"}, {"t": "q", "h": "Also: \"I said don't read from the wiki unless you actually need it.\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=8423s\" target=\"_blank\" rel=\"noopener\">2:20:23<\/a>; \"cloudmd is the rules. Memory is, you know, learned facts.\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=7490s\" target=\"_blank\" rel=\"noopener\">2:04:50<\/a>"}, {"t": "check", "h": "<em>Is this needed on every run? If not, route to it instead of loading it.<\/em> (Concept 2)"}], "concepts": [2], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 5}, {"id": "r5", "kind": "rule", "g": "nate", "t": "The root file routes; it doesn't store", "n": 5, "conf": "stated, demonstrated", "body": [{"t": "p", "h": "Keep CLAUDE.md / AGENTS.md to a short identity plus a table of where things live."}, {"t": "q", "h": "\"I treat this almost purely as a router.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=766s\" target=\"_blank\" rel=\"noopener\">12:46<\/a>"}, {"t": "q", "h": "Also: \"I go into a routing map and that's the majority of my agents.mmd\" <a href=\"https://www.youtube.com/watch?v=yysILVsfLFM&amp;t=367s\" target=\"_blank\" rel=\"noopener\">6:07<\/a>; \"it's an index, not a dump\" <a href=\"https://www.youtube.com/watch?v=LrgfmZkl3nc&amp;t=334s\" target=\"_blank\" rel=\"noopener\">5:34<\/a>"}, {"t": "p", "h": "Shown on screen at <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=797s\" target=\"_blank\" rel=\"noopener\">13:17<\/a>. <em>Supporting:<\/em> <a href=\"https://www.youtube.com/watch?v=DTCyvo6cC54&amp;t=274s\" target=\"_blank\" rel=\"noopener\">4:34<\/a> (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/every-level-of-a-claude-second-brain-explained--DTCyvo6cC54-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "check", "h": "<em>Could this paragraph be a file plus one routing line?<\/em> (Concept 3)"}], "concepts": [3], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 6}, {"id": "r6", "kind": "rule", "g": "nate", "t": "Judge the layout by whether things can be found, not by copying someone", "n": 6, "conf": "stated", "body": [{"t": "p", "h": "Any structure is fine if you can find things by hand without search; the only failure is ignoring repeated wrong answers."}, {"t": "q", "h": "\"see if you could find it without searching, without asking Claude\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1100s\" target=\"_blank\" rel=\"noopener\">18:20<\/a>"}, {"t": "check", "h": "<em>Could Charlie guess this file's path without searching?<\/em> (Concept 4)"}], "concepts": [4], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 3}, {"id": "r7", "kind": "rule", "g": "nate", "t": "Audit read-only, then wait for approval", "n": 7, "conf": "demonstrated", "body": [{"t": "p", "h": "The audit reports findings and fixes into a dated file and changes nothing until you say yes. For big projects, one sub-agent per check."}, {"t": "q", "h": "\"It won't actually do anything yet.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=64s\" target=\"_blank\" rel=\"noopener\">1:04<\/a>"}, {"t": "q", "h": "Also: \"Maybe every single Friday, you run an audit\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=8910s\" target=\"_blank\" rel=\"noopener\">2:28:30<\/a>"}, {"t": "p", "h": "Fix list \"await approval\" at <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=523s\" target=\"_blank\" rel=\"noopener\">8:43<\/a>; fan-out at <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=614s\" target=\"_blank\" rel=\"noopener\">10:14<\/a>."}, {"t": "check", "h": "<em>Does this audit only report? Who approves the fixes?<\/em> (Concept 7)"}], "concepts": [7], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 4}, {"id": "r8", "kind": "rule", "g": "nate", "t": "Treat every index and route as a claim to check against the disk", "n": 8, "conf": "stated, demonstrated", "body": [{"t": "p", "h": "Check that routes point to things that exist, that nothing is misrouted, that index counts match reality, and that feeds are fresh."}, {"t": "q", "h": "\"Indexes and wiks are claims about what exists and what's current. The audit checks every claim against reality.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=583s\" target=\"_blank\" rel=\"noopener\">9:43<\/a>"}, {"t": "p", "h": "Demo: 55 folders in the index vs 79 on disk, <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=492s\" target=\"_blank\" rel=\"noopener\">8:12<\/a>; freshness grades, <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=675s\" target=\"_blank\" rel=\"noopener\">11:15<\/a>."}, {"t": "check", "h": "<em>Which claims in this index could a script check? Which feeds have a last-updated date?<\/em> (Concepts 7, 8)"}], "concepts": [7, 8], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 4}, {"id": "r9", "kind": "rule", "g": "nate", "t": "Segment knowledge that is distinct and growing", "n": 9, "conf": "stated, demonstrated", "body": [{"t": "p", "h": "Split it into its own wiki or folder so the agent searches less."}, {"t": "q", "h": "\"the more you can segment stuff out, the better.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1221s\" target=\"_blank\" rel=\"noopener\">20:21<\/a>"}, {"t": "p", "h": "Claude suggested his own split, <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1039s\" target=\"_blank\" rel=\"noopener\">17:19<\/a>."}, {"t": "check", "h": "<em>Is this folder mixing two kinds of growing material? Would splitting it narrow the search?<\/em> (Concept 5)"}], "concepts": [5], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 3}, {"id": "r10", "kind": "rule", "g": "nate", "t": "Automate what arrives on a schedule", "n": 10, "conf": "stated", "body": [{"t": "p", "h": "If you keep asking for the same pull, make it a cron or routine."}, {"t": "q", "h": "\"Build automations to update data.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1131s\" target=\"_blank\" rel=\"noopener\">18:51<\/a>"}, {"t": "check", "h": "<em>Has Charlie asked for this same fetch again and again? Then schedule it.<\/em> (Concept 6)"}], "concepts": [6], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 3}, {"id": "r11", "kind": "rule", "g": "nate", "t": "Backtrack every miss, then fix the route", "n": 11, "conf": "stated", "body": [{"t": "p", "h": "Have the agent explain where it looked and why it missed, then update the routing or move files. Just telling it not to let that happen again is weaker."}, {"t": "q", "h": "\"Have it update the routing.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1402s\" target=\"_blank\" rel=\"noopener\">23:22<\/a>"}, {"t": "q", "h": "Also: \"every time you correct AI, you feed that correction back into the system\" <a href=\"https://www.youtube.com/watch?v=3XIGcM7VICc&amp;t=397s\" target=\"_blank\" rel=\"noopener\">6:37<\/a>; \"update the skill in the smallest durable place\" <a href=\"https://www.youtube.com/watch?v=HIRDzMtuWFk&amp;t=365s\" target=\"_blank\" rel=\"noopener\">6:05<\/a>"}, {"t": "check", "h": "<em>Where did it look, why did it miss, and what line in the router changes?<\/em> (Concept 9)"}], "concepts": [9], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 5}, {"id": "r12", "kind": "rule", "g": "nate", "t": "Raw evidence stays untouched; the brain is derived from it", "n": 12, "conf": "demonstrated", "body": [{"t": "p", "h": "Keep transcripts and posts as-is in raw files; build the wiki pages on top and record what was fetched."}, {"t": "q", "h": "\"The raw files don't get touched\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=244s\" target=\"_blank\" rel=\"noopener\">4:04<\/a>"}, {"t": "check", "h": "<em>Is anyone editing a raw transcript? Is there a record of what was fetched?<\/em> (Concept 10)"}], "concepts": [10], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 3}, {"id": "r13", "kind": "rule", "g": "nate", "t": "No source, no rule; label inference", "n": 13, "conf": "stated, demonstrated", "body": [{"t": "p", "h": "Every rule links to an exact quote and where it came from; unsourced reasoning says it is inferred."}, {"t": "q", "h": "\"if there is no source, the agent has to say explicitly that it's inferring\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=394s\" target=\"_blank\" rel=\"noopener\">6:34<\/a>"}, {"t": "check", "h": "<em>Can each claim be clicked back to a timestamp?<\/em> (Concept 12)"}], "concepts": [12], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 3}, {"id": "r14", "kind": "rule", "g": "nate", "t": "Ingest relationally", "n": 14, "conf": "demonstrated", "body": [{"t": "p", "h": "A new source updates every page it touches plus the index and log. A one-source rule is provisional until a second source backs it."}, {"t": "q", "h": "\"it will update every page that post touches.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=578s\" target=\"_blank\" rel=\"noopener\">9:38<\/a>"}, {"t": "check", "h": "<em>Which concepts and rules does this new source change? Did index and log get updated?<\/em> (Concepts 11, 13)"}], "concepts": [11, 13], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 4}, {"id": "r15", "kind": "rule", "g": "nate", "t": "Turn distilled knowledge into an agent plus a skill", "n": 15, "conf": "demonstrated", "body": [{"t": "p", "h": "The agent holds the rules and runs in its own context; the skill is the entry point and grades answers against the rules."}, {"t": "q", "h": "\"So, those are the two things we have, a Karpathy agent and a Karpathy skill.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=425s\" target=\"_blank\" rel=\"noopener\">7:05<\/a>"}, {"t": "p", "h": "<em>Supporting, a challenge:<\/em> keep skills less specific so they don't hold newer models back, <a href=\"https://www.youtube.com/watch?v=XNQBCRcwXV4&amp;t=341s\" target=\"_blank\" rel=\"noopener\">5:41<\/a> (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/i-deleted-all-my-claude-skills-and-claude-got-smarter--XNQBCRcwXV4-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "q", "h": "Also: \"They could literally just be a 50line markdown file.\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=5134s\" target=\"_blank\" rel=\"noopener\">1:25:34<\/a>"}, {"t": "p", "h": "<em>Newer wins:<\/em> XNQ is #54 in upload order; the newer 9KO (#16) and HIR (#22) still build skills, now with verification loops and trigger tests (Rules 16, 21), so read XNQ as \"less specific\", not \"no skills\"."}, {"t": "check", "h": "<em>Is there already an agent or skill for this? Is the new one short?<\/em> (Concept 14)"}], "concepts": [14], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 5}, {"id": "r16", "kind": "rule", "g": "nate", "t": "Enforce verification with a gate", "n": 16, "conf": "demonstrated", "body": [{"t": "p", "h": "A hook that blocks \"done\" until the check has run beats a reminder in the prompt."}, {"t": "q", "h": "\"it's a step that we have to make sure that the agent can't skip\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=455s\" target=\"_blank\" rel=\"noopener\">7:35<\/a>"}, {"t": "q", "h": "Also: \"every single skill that I build works in some sort of verification loop\" <a href=\"https://www.youtube.com/watch?v=9KOtMsZ9I28&amp;t=580s\" target=\"_blank\" rel=\"noopener\">9:40<\/a>"}, {"t": "check", "h": "<em>What stops the agent claiming this works without running it?<\/em> (Concept 15)"}], "concepts": [15], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 4}, {"id": "r17", "kind": "rule", "g": "nate", "t": "Test in the real setting before trusting it", "n": 17, "conf": "stated, demonstrated", "body": [{"t": "p", "h": "Define done first, test on real tasks and the real environment, and try to break it. \"It works\" may only be true where it was tried."}, {"t": "q", "h": "\"saying that it works was only true in one specific setting or terminal.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=548s\" target=\"_blank\" rel=\"noopener\">9:08<\/a>"}, {"t": "q", "h": "Also: \"You have to define what done looks like before you even start building.\" <a href=\"https://www.youtube.com/watch?v=3XIGcM7VICc&amp;t=760s\" target=\"_blank\" rel=\"noopener\">12:40<\/a>; \"Before returning the final output, define the acceptance criteria.\" <a href=\"https://www.youtube.com/watch?v=HIRDzMtuWFk&amp;t=485s\" target=\"_blank\" rel=\"noopener\">8:05<\/a>; \"does this answer like a teammate\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=764s\" target=\"_blank\" rel=\"noopener\">12:44<\/a>"}, {"t": "q", "h": "Also: \"fixing just one example doesn't prove the whole agent is reliable\" <a href=\"https://www.youtube.com/watch?v=QDsenEcAJIk&amp;t=306s\" target=\"_blank\" rel=\"noopener\">5:06<\/a>; \"I don't think that just giving Astra seven trading days was enough to really know if this is a viable strategy.\" <a href=\"https://www.youtube.com/watch?v=eg_1NXDcoPk&amp;t=1042s\" target=\"_blank\" rel=\"noopener\">17:22<\/a> (Concept 41)"}, {"t": "check", "h": "<em>Where was this tested? On Charlie's real device and real data?<\/em> (Concepts 16, 41)"}], "concepts": [16, 41, 41], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 9}, {"id": "r18", "kind": "rule", "g": "nate", "t": "Human understanding is the finish line", "n": 18, "conf": "stated", "body": [{"t": "p", "h": "The system should leave Charlie understanding what he built and how his OS is laid out, not just holding output."}, {"t": "q", "h": "\"you can outsource your thinking, but you cannot outsource your understanding.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=608s\" target=\"_blank\" rel=\"noopener\">10:08<\/a> (Nate quoting Karpathy)"}, {"t": "q", "h": "\"I actually understand my own second brain\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1131s\" target=\"_blank\" rel=\"noopener\">18:51<\/a>"}, {"t": "check", "h": "<em>Could Charlie explain this change in his own words?<\/em> (Concept 17)"}], "concepts": [17], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 4}, {"id": "r19", "kind": "rule", "g": "nate", "t": "Keep the router under 200 lines", "n": 19, "conf": "stated", "body": [{"t": "p", "h": "<em>Replaced by Rule 41 (2026-10-09, Charlie's choice on the Decision Desk).<\/em>"}, {"t": "p", "h": "<em>Newer wins:<\/em> the aim is no longer a line count but Rule 41, the smallest context that works (\"minimal doesn't necessarily mean short\"). A router can be longer when the extra lines are things only Charlie can supply; 200 lines stays only as the hard ceiling <code>tools/audit.py<\/code> errors at. Quotes kept below as history."}, {"t": "p", "h": "It is re-read with every message, so every line costs on every turn; past the limit it gets ignored."}, {"t": "q", "h": "\"So keep it under 200 lines.\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=20187s\" target=\"_blank\" rel=\"noopener\">5:36:27<\/a>"}, {"t": "q", "h": "Also: \"if it grows too big, it can start to get messy and feel ignored\" <a href=\"https://www.youtube.com/watch?v=DTCyvo6cC54&amp;t=304s\" target=\"_blank\" rel=\"noopener\">5:04<\/a>"}, {"t": "check", "h": "<em>Use Rule 41's check instead.<\/em> (Concept 18, now part of Concept 39)"}], "concepts": [18], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 4}, {"id": "r20", "kind": "rule", "g": "nate", "t": "Register every new skill or folder in the router, and log it", "n": 20, "conf": "stated", "body": [{"t": "p", "h": "A skill or folder the router doesn't mention is one the agent won't find; the decision to add it goes in the log."}, {"t": "q", "h": "\"It's going to register the skill in claw.md and it's going to log its decisions.\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=5408s\" target=\"_blank\" rel=\"noopener\">1:30:08<\/a>"}, {"t": "q", "h": "Also: \"you're going to just want to make sure that your claused file is getting updated as well\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=1714s\" target=\"_blank\" rel=\"noopener\">28:34<\/a>"}, {"t": "check", "h": "<em>Is the new skill routed and logged with a date?<\/em> (Concept 3)"}], "concepts": [3], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 3}, {"id": "r21", "kind": "rule", "g": "nate", "t": "Skill descriptions are triggers: user's words, no overlap, trigger-tested", "n": 21, "conf": "stated", "body": [{"t": "p", "h": "Write the description in the words Charlie would say, make sure no two skills compete, then test obvious, reworded and unrelated requests."}, {"t": "q", "h": "\"Put the words a real person would use inside the description and make sure two skills aren't competing for the same request.\" <a href=\"https://www.youtube.com/watch?v=HIRDzMtuWFk&amp;t=242s\" target=\"_blank\" rel=\"noopener\">4:02<\/a>"}, {"t": "q", "h": "Also: \"The first one is an obvious request that should trigger it.\" <a href=\"https://www.youtube.com/watch?v=HIRDzMtuWFk&amp;t=273s\" target=\"_blank\" rel=\"noopener\">4:33<\/a>"}, {"t": "check", "h": "<em>Which other skill could fire on this request? Did a reworded request trigger it?<\/em> (Concept 21)"}], "concepts": [21], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 3}, {"id": "r22", "kind": "rule", "g": "nate", "t": "Validate skill and agent front matter", "n": 22, "conf": "stated", "body": [{"t": "p", "h": "A small syntax slip such as an unclosed quote stops a skill or agent firing, silently; check it with a script."}, {"t": "q", "h": "\"You have to close off the quotes if you open them up\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=9462s\" target=\"_blank\" rel=\"noopener\">2:37:42<\/a>"}, {"t": "check", "h": "<em>Does the front matter have a name, a description and a closing <code>---<\/code>?<\/em> (Concept 21)"}], "concepts": [21], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 3}, {"id": "r23", "kind": "rule", "g": "nate", "t": "New skills report only until battle-tested", "n": 23, "conf": "stated", "body": [{"t": "p", "h": "A new skill proposes and asks; it earns permission to act on its own after many good runs."}, {"t": "q", "h": "\"Once we've ran the skill 10, 20, 30 times and we've kind of like battle tested it and we feel more confident in it, then we can maybe make it a little bit more autonomous.\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=6457s\" target=\"_blank\" rel=\"noopener\">1:47:37<\/a>"}, {"t": "check", "h": "<em>How many times has this skill run? Should it still wait for a yes?<\/em> (Concept 22)"}], "concepts": [22], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 3}, {"id": "r24", "kind": "rule", "g": "nate", "t": "Sub-agents for bulky output, read-only by their tools, and not overused", "n": 24, "conf": "stated", "body": [{"t": "p", "h": "Send context-heavy searches to a sub-agent; limit its tools rather than asking nicely; skip it for quick or dependent steps."}, {"t": "q", "h": "\"is this about to dump a pile of stuff into my chat that I'll never read again?\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=9827s\" target=\"_blank\" rel=\"noopener\">2:43:47<\/a>"}, {"t": "q", "h": "Also: \"you can put that so that these sub-agents are explicitly read-only\" <a href=\"https://www.youtube.com/watch?v=e18sdZLwP7o&amp;t=430s\" target=\"_blank\" rel=\"noopener\">7:10<\/a>; \"if you're forcing too many sub agents, you're going to get worse results\" <a href=\"https://www.youtube.com/watch?v=e18sdZLwP7o&amp;t=1497s\" target=\"_blank\" rel=\"noopener\">24:57<\/a>"}, {"t": "check", "h": "<em>Would this output flood the main chat? Is the sub-agent's tool list read-only?<\/em> (Concept 23)"}], "concepts": [23], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 4}, {"id": "r25", "kind": "rule", "g": "nate", "t": "Block risky actions with settings and keys, not prompts", "n": 25, "conf": "stated", "body": [{"t": "p", "h": "A deny list in settings or a least-privilege key physically stops the action; an instruction in a prompt only asks."}, {"t": "q", "h": "\"A prompt is never a permission layer.\" <a href=\"https://www.youtube.com/watch?v=8QQ_INxAhRs&amp;t=1471s\" target=\"_blank\" rel=\"noopener\">24:31<\/a>"}, {"t": "q", "h": "Also: \"Can you help me update the settings file so that you physically cannot do those things?\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=4468s\" target=\"_blank\" rel=\"noopener\">1:14:28<\/a>"}, {"t": "check", "h": "<em>What actually stops this action if the agent ignores the instruction?<\/em> (Concept 24)"}], "concepts": [24], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 4}, {"id": "r26", "kind": "rule", "g": "nate", "t": "Secrets live in `.env`, never in chat or Git", "n": 26, "conf": "stated", "body": [{"t": "p", "h": "Put keys in an <code>.env<\/code> file excluded from pushes, not in the conversation history."}, {"t": "q", "h": "\"It's it's much more secure for you to paste in your API key into the ENV rather than you know giving it in the chat history\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=2510s\" target=\"_blank\" rel=\"noopener\">41:50<\/a>"}, {"t": "q", "h": "Also: \"You don't want to paste it right in here into the chat thread, you want to paste it into the .env file.\" <a href=\"https://www.youtube.com/watch?v=oWCcN6hSFjA&amp;t=155s\" target=\"_blank\" rel=\"noopener\">2:35<\/a>; \"I like to put all my API keys in there so that if I ever need to move them over to cloud code or if I need to move them over to trigger.dev, I already have them in one spot\" <a href=\"https://www.youtube.com/watch?v=FqnNL8fnUWo&amp;t=518s\" target=\"_blank\" rel=\"noopener\">8:38<\/a>"}, {"t": "check", "h": "<em>Is any key in the chat, a committed file or this public repo?<\/em> (Concept 25)"}], "concepts": [25], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 5}, {"id": "r27", "kind": "rule", "g": "nate", "t": "Look at visual output before calling it done", "n": 27, "conf": "demonstrated", "body": [{"t": "p", "h": "For pages and apps, take a screenshot and check it; code that runs can still look broken."}, {"t": "q", "h": "\"we built a plan to add visual validation\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=3817s\" target=\"_blank\" rel=\"noopener\">1:03:37<\/a>"}, {"t": "check", "h": "<em>Has anyone looked at a screenshot of this on phone and desktop?<\/em> (Concept 16)"}], "concepts": [16], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 3}, {"id": "r28", "kind": "rule", "g": "nate", "t": "Save every audit and read the last one first", "n": 28, "conf": "stated", "body": [{"t": "p", "h": "Dated reports in an audits folder let the next audit see what was found and whether it was fixed."}, {"t": "q", "h": "\"look for earlier reports inside of the audit folder\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=614s\" target=\"_blank\" rel=\"noopener\">10:14<\/a>"}, {"t": "check", "h": "<em>Where is the last audit, and were its fixes done?<\/em> (Concept 7)"}], "concepts": [7], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 3}, {"id": "r29", "kind": "rule", "g": "nate", "t": "Hand off and clear before context rots", "n": 29, "conf": "stated", "body": [{"t": "p", "h": "Clear between unrelated tasks; in long sessions write a hand-off (done, files, open decisions, next) and start fresh."}, {"t": "q", "h": "\"here's what we did. Here's the files that were created. Here are open decisions. Here's what's next.\" <a href=\"https://www.youtube.com/watch?v=0WDkwMxj13s&amp;t=1344s\" target=\"_blank\" rel=\"noopener\">22:24<\/a>"}, {"t": "q", "h": "Also: \"Use slashclear between unrelated tasks.\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=19853s\" target=\"_blank\" rel=\"noopener\">5:30:53<\/a>; \"if we get past 250,000 300,000, I'm going to do a session handoff\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=7248s\" target=\"_blank\" rel=\"noopener\">2:00:48<\/a>"}, {"t": "check", "h": "<em>Is this session still on one task? Is the next step written down for a fresh one?<\/em> (Concept 27)"}], "concepts": [27], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 4}, {"id": "r30", "kind": "rule", "g": "nate", "t": "Extract knowledge by interview, not brain dump", "n": 30, "conf": "stated, demonstrated", "body": [{"t": "p", "h": "Have the agent ask one question at a time until it understands, and save the answers; a quick dump leaves gaps."}, {"t": "q", "h": "\"Interview me relentlessly about every aspect of this plan until we reach a shared understanding\" <a href=\"https://www.youtube.com/watch?v=c0kaKxM2pHg&amp;t=92s\" target=\"_blank\" rel=\"noopener\">1:32<\/a>"}, {"t": "q", "h": "Also: \"the bigger problem is getting everything out of your brain into the system\" <a href=\"https://www.youtube.com/watch?v=DTCyvo6cC54&amp;t=1338s\" target=\"_blank\" rel=\"noopener\">22:18<\/a>"}, {"t": "check", "h": "<em>Did this knowledge come from Charlie answering questions, and is it saved?<\/em> (Concept 26)"}], "concepts": [26], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 4}, {"id": "r31", "kind": "rule", "g": "nate", "t": "Context costs money and rots: act at about half the window", "n": 31, "conf": "stated", "body": [{"t": "p", "h": "Every message re-reads the whole chat, so long chats cost more and get worse; check what fills the window and act at about half, not when auto-compact fires."}, {"t": "q", "h": "\"Claude rereads the entire conversation from the beginning, and all of those are tokens that it's charging you for\" <a href=\"https://www.youtube.com/watch?v=49V-5Ock8LU&amp;t=64s\" target=\"_blank\" rel=\"noopener\">1:04<\/a>"}, {"t": "q", "h": "Also: \"somewhere around halfway through your context window, it starts to fall apart.\" <a href=\"https://www.youtube.com/watch?v=eRS3CmvrOvA&amp;t=272s\" target=\"_blank\" rel=\"noopener\">4:32<\/a>"}, {"t": "check", "h": "<em>Is this chat past about half the window, and do we know what is filling it?<\/em> (Concept 29)"}], "concepts": [29], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 4}, {"id": "r32", "kind": "rule", "g": "nate", "t": "Plan, let the AI attack the plan, then build", "n": 32, "conf": "stated", "body": [{"t": "p", "h": "Nate says plan first and have the AI play devil's advocate on the plan before building; save big plans to a file and work phase by phase. Charlie declined plan mode on 2026-10-08, so the 1-2 questions from the router stand in for it."}, {"t": "q", "h": "\"You ask Claude to start challenging you and pushing back and playing devil's advocate before it builds anything or before it approves any plan\" <a href=\"https://www.youtube.com/watch?v=iTY8Q449YNQ&amp;t=156s\" target=\"_blank\" rel=\"noopener\">2:36<\/a>"}, {"t": "q", "h": "Also: \"Have one for discovery where you can have Claude read through PDFs and read through the code base\" <a href=\"https://www.youtube.com/watch?v=_qZvORxGqI0&amp;t=1285s\" target=\"_blank\" rel=\"noopener\">21:25<\/a>"}, {"t": "check", "h": "<em>Did we ask 1-2 questions or have the AI attack the plan before a big build?<\/em> (Concept 30)"}], "concepts": [30], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 4}, {"id": "r33", "kind": "rule", "g": "nate", "t": "A separate checker decides \"done\"; then try to break it", "n": 33, "conf": "stated", "body": [{"t": "p", "h": "The worker doesn't mark its own homework: a different checker looks at it, then you stress test it for edge cases. When output is bad, ask whether it is the model, the tool or our own organisation."}, {"t": "q", "h": "\"Claude doesn't get to declare
