<title>Nate's Brain Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one reading column; section strip shows the A→H flow; each concept card opens to show its rules underneath */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --sunk:#e9edf2; --line:#d5dbe3;
  --fg:#18202b; --muted:#5a6676; --accent:#2a4fd6; --accent-soft:#e3e9fd;
  --confuse:#a86a00; --confuse-soft:#fdf1d8;
  --del:#b4232c; --del-soft:#fbe3e4;
  --keep:#1f7a4d; --keep-soft:#dff3e8;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10141b; --surface:#171c25; --sunk:#1e2530; --line:#2c3542;
  --fg:#e6ebf2; --muted:#9aa6b7; --accent:#8aa6ff; --accent-soft:#1f2a4a;
  --confuse:#f0b54a; --confuse-soft:#3a2c10; --del:#ff7d84; --del-soft:#3d1a1d;
  --keep:#5fd39a; --keep-soft:#143325; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141b; --surface:#171c25; --sunk:#1e2530; --line:#2c3542;
  --fg:#e6ebf2; --muted:#9aa6b7; --accent:#8aa6ff; --accent-soft:#1f2a4a;
  --confuse:#f0b54a; --confuse-soft:#3a2c10; --del:#ff7d84; --del-soft:#3d1a1d;
  --keep:#5fd39a; --keep-soft:#143325; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--f-body);margin:0}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:28px 80px}
h1{font:700 clamp(28px,5vw,40px)/1.1 var(--f-display);margin:0 0 6px;text-wrap:balance;letter-spacing:-.01em}
.lede{color:var(--muted);max-width:62ch;margin:0}
a{color:var(--accent)}
code{font:13px var(--f-mono);background:var(--sunk);padding:1px 5px;border-radius:4px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.stats{display:flex;flex-wrap:wrap;gap:8px 20px;margin:18px 0 10px;font:13px var(--f-mono);color:var(--muted)}
.stats b{color:var(--fg);font-weight:500}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.save{font-size:13px;color:var(--muted);margin-top:8px}

.flow{display:flex;flex-wrap:wrap;gap:6px;margin:22px 0 4px;align-items:center}
.flow .lbl{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.step{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px 4px 4px;font-size:13px}
.step i{font:500 12px var(--f-mono);font-style:normal;background:var(--accent-soft);color:var(--accent);border-radius:999px;width:22px;height:22px;display:grid;place-items:center}
.arrow{color:var(--muted);font-size:12px}

.tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px;margin-top:14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.chip .n{font:12px var(--f-mono);color:var(--muted);margin-left:3px}
#q{flex:1 1 180px;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:7px 10px;font:inherit;font-size:14px}

h2{font:700 20px/1.2 var(--f-display);margin:34px 0 4px;display:flex;gap:10px;align-items:baseline}
h2 .sl{font:500 13px var(--f-mono);color:var(--accent)}
.secnote{color:var(--muted);font-size:13px;margin:0 0 12px}

.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin:8px 0;scroll-margin-top:150px}
.item.rule{background:var(--surface)}
.kids{margin:0 0 4px 22px;border-left:2px solid var(--line);padding-left:12px}
.kids .item{margin:6px 0}
.head{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;width:100%;text-align:left;background:none;border:0;padding:12px 14px}
.id{font:500 12px var(--f-mono);padding:2px 7px;border-radius:5px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;margin-top:2px}
.rule .id{background:var(--sunk);color:var(--fg)}
.ttl{font-weight:600;min-width:0;text-wrap:pretty}
.ttl small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;margin-top:2px}
.flag{font:500 11px var(--f-mono);letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap;margin-top:2px}
.flag.confusing{background:var(--confuse-soft);color:var(--confuse)}
.flag.delete{background:var(--del-soft);color:var(--del)}
.flag.keep{background:var(--keep-soft);color:var(--keep)}
.flag.note{background:var(--sunk);color:var(--muted)}
.item.f-confusing{border-left:4px solid var(--confuse)}
.item.f-delete{border-left:4px solid var(--del)}
.item.f-keep{border-left:4px solid var(--keep)}

.body{padding:0 14px 14px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:10px;padding-top:12px;min-width:0}
.body p{margin:0;max-width:68ch;overflow-wrap:anywhere}
.body blockquote{margin:0;padding:6px 12px;border-left:3px solid var(--accent);background:var(--sunk);border-radius:0 6px 6px 0;font-size:14px;overflow-wrap:anywhere}
.check{background:var(--accent-soft);border-radius:8px;padding:8px 12px;font-size:14px}
.check b{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:2px}
.links{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.links button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:2px 8px;font:12px var(--f-mono);color:var(--fg)}
.gap{color:var(--confuse);font-size:13px}
.conf{font:11px var(--f-mono);color:var(--muted);letter-spacing:.03em}

.review{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.review .row button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 12px;font-size:13px}
.review button[data-k="confusing"][aria-pressed="true"]{background:var(--confuse-soft);border-color:var(--confuse);color:var(--confuse)}
.review button[data-k="delete"][aria-pressed="true"]{background:var(--del-soft);border-color:var(--del);color:var(--del)}
.review button[data-k="keep"][aria-pressed="true"]{background:var(--keep-soft);border-color:var(--keep);color:var(--keep)}
.review textarea{width:100%;min-height:60px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:8px 10px;font:inherit;font-size:14px;resize:vertical}
.review .st{font-size:12px;color:var(--muted)}
.empty{color:var(--muted);padding:30px 0;text-align:center}
.flash{animation:fl 1.2s ease-out}
@keyframes fl{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}
@media (max-width:520px){.kids{margin-left:8px;padding-left:8px}.head{grid-template-columns:auto 1fr}.head .flag{grid-column:2;justify-self:start}}
</style>

<div class="wrap">
  <h1>Nate's Brain Map</h1>
  <p class="lede">The 38 concepts and 40 rules behind the <code>nate-brain</code> agent, laid out in the order the brain teaches them. Open a concept to read it and see the rules it feeds. Mark anything that's confusing or that you'd delete, and add a note saying why.</p>

<script>
const DATA = {"concepts": [{"n": 1, "title": "Four context failure modes: poisoning, bloat, confusion, clash", "sec": "A", "secTitle": "Why an AI OS gives wrong answers", "rules": [1], "body": [{"t": "p", "h": "When an agent is wrong because of its context, it is one of four things. <em>Poisoning<\/em>: a false fact sits in the context and the agent repeats it confidently. <em>Bloat<\/em>: so much is loaded that the agent can't pick out what's relevant (needle in a haystack). <em>Confusion<\/em>: something is irrelevant or missing, so the agent fills the gap itself (classic hallucination). <em>Clash<\/em>: old and new sources, or two sources, disagree, so the agent can't tell which to trust. Poisoning is the easiest to fix (verify: web search, cross-check a live source, or a human in the loop); bloat is harder and is handled by the expertise/situational split (concept 2)."}, {"t": "q", "h": "\"the four failure modes, poisoning, bloat, confusion, and clash.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=94s\" target=\"_blank\" rel=\"noopener\">1:34<\/a>"}, {"t": "q", "h": "\"Poisoning means you have a false fact somewhere in the context.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=125s\" target=\"_blank\" rel=\"noopener\">2:05<\/a>"}, {"t": "q", "h": "\"In March your policy was always refund. In June your policy is now to never refund.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=247s\" target=\"_blank\" rel=\"noopener\">4:07<\/a>"}, {"t": "p", "h": "Also: verification fix <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=156s\" target=\"_blank\" rel=\"noopener\">2:36<\/a>; bloat <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=186s\" target=\"_blank\" rel=\"noopener\">3:06<\/a>; confusion <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=216s\" target=\"_blank\" rel=\"noopener\">3:36<\/a>. Source: AI OS (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/steal-my-exact-ai-os-setup-5-simple-tips--Ek1NBfnnTH0-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "p", "h": "Nate gives no specific fix for clash or confusion in this video. <strong>(inference)<\/strong> Clash is fixed by keeping one current source per fact and marking or retiring old ones; confusion by making sure the missing thing has a route."}]}, {"n": 2, "title": "Expertise context vs situational context", "sec": "A", "secTitle": "Why an AI OS gives wrong answers", "rules": [4], "body": [{"t": "p", "h": "Expertise context is what the agent needs on every run (who you are, goals, what the business does, policies): the rulebook, like a system prompt. Situational context is pulled in just in time for one task (a support ticket from yesterday). His analogy: the principal knows how classrooms run; the teacher knows each student. Keeping situational data always loaded adds bloat, confusion and even clash. In his \"four C's\" framework he maps <em>context<\/em> to expertise and <em>connections<\/em> to situational."}, {"t": "q", "h": "\"I think of context as expertise and I think of connections as situational.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=277s\" target=\"_blank\" rel=\"noopener\">4:37<\/a>"}, {"t": "q", "h": "\"expertise context is the rulebook\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=338s\" target=\"_blank\" rel=\"noopener\">5:38<\/a>"}, {"t": "q", "h": "\"go use that live lookup, pull the data in because you need it\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=368s\" target=\"_blank\" rel=\"noopener\">6:08<\/a>"}, {"t": "p", "h": "Source: AI OS (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/steal-my-exact-ai-os-setup-5-simple-tips--Ek1NBfnnTH0-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "p", "h": "Also: <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=8423s\" target=\"_blank\" rel=\"noopener\">bCl 2:20:23<\/a> \"I said don't read from the wiki unless you actually need it.\"; second brain = the first two C's, <a href=\"https://www.youtube.com/watch?v=yysILVsfLFM&amp;t=124s\" target=\"_blank\" rel=\"noopener\">yys 2:04<\/a>."}]}, {"n": 3, "title": "The root file is a router, not a warehouse", "sec": "B", "secTitle": "Organising the OS", "rules": [5, 20], "body": [{"t": "p", "h": "His main CLAUDE.md says who the agent is in a line or two and is otherwise a routing table: if you need X, go here (wiki path, hot cache, index, memory, tools, skills and agents, decisions, templates, projects). Sub-folders can have their own CLAUDE.md for project-level instructions. Because it is all plain files and folders, other agents (Codex, Hermes) can use the same setup."}, {"t": "q", "h": "\"I treat this almost purely as a router.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=766s\" target=\"_blank\" rel=\"noopener\">12:46<\/a>"}, {"t": "q", "h": "\"my cloudmd is essentially just a master routing file, just a master table of context.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=827s\" target=\"_blank\" rel=\"noopener\">13:47<\/a>"}, {"t": "q", "h": "\"a bunch of files and folders, which means you can plug in Hermes, you can plug in codecs\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=919s\" target=\"_blank\" rel=\"noopener\">15:19<\/a>"}, {"t": "p", "h": "Also: he shows the routing table at <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=797s\" target=\"_blank\" rel=\"noopener\">13:17<\/a>. Source: AI OS (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/steal-my-exact-ai-os-setup-5-simple-tips--Ek1NBfnnTH0-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "p", "h": "<em>Supporting:<\/em> the same idea in <a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/every-level-of-a-claude-second-brain-explained--DTCyvo6cC54-transcript.md\" target=\"_blank\" rel=\"noopener\">Every Level of a Claude Second Brain<\/a>, \"the claw.md is kind of treated as a router\" <a href=\"https://www.youtube.com/watch?v=DTCyvo6cC54&amp;t=274s\" target=\"_blank\" rel=\"noopener\">4:34<\/a>, and in <a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/i-turned-claude-into-the-ultimate-second-brain--8QQ_INxAhRs-transcript.md\" target=\"_blank\" rel=\"noopener\">I Turned Claude Into the Ultimate Second Brain<\/a>, \"I think of my Claude and MD file as my router\" <a href=\"https://www.youtube.com/watch?v=8QQ_INxAhRs&amp;t=309s\" target=\"_blank\" rel=\"noopener\">5:09<\/a>."}, {"t": "p", "h": "Also: \"I go into a routing map and that's the majority of my agents.mmd\" <a href=\"https://www.youtube.com/watch?v=yysILVsfLFM&amp;t=367s\" target=\"_blank\" rel=\"noopener\">yys 6:07<\/a>; new skills get registered in it <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=5408s\" target=\"_blank\" rel=\"noopener\">bCl 1:30:08<\/a>; \"cloudmd is the rules. Memory is, you know, learned facts.\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=7490s\" target=\"_blank\" rel=\"noopener\">jdb 2:04:50<\/a>. Length limit: concept 18."}]}, {"n": 4, "title": "No single right layout; the test is whether you (and the agent) can find things", "sec": "B", "secTitle": "Organising the OS", "rules": [6], "body": [{"t": "p", "h": "Flat or deeply nested doesn't matter. What matters is routing rules good enough that you and the agent can find things. His check: think of something you made and find it in the file explorer without searching or asking Claude. If you can, an agent with routing rules probably can too. The only wrong setup is one that keeps giving wrong answers while you do nothing."}, {"t": "q", "h": "\"routing rules in place so that you and your agents can find it.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1009s\" target=\"_blank\" rel=\"noopener\">16:49<\/a>"}, {"t": "q", "h": "\"see if you could find it without searching, without asking Claude\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1100s\" target=\"_blank\" rel=\"noopener\">18:20<\/a>"}, {"t": "q", "h": "\"the only way that you're doing this wrong is if you're constantly getting wrong answers and you're not doing anything about it.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1100s\" target=\"_blank\" rel=\"noopener\">18:20<\/a>"}, {"t": "p", "h": "Source: AI OS (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/steal-my-exact-ai-os-setup-5-simple-tips--Ek1NBfnnTH0-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "p", "h": "<em>Supporting:<\/em> \"can your agent find it again, and could you find it again\" <a href=\"https://www.youtube.com/watch?v=DTCyvo6cC54&amp;t=122s\" target=\"_blank\" rel=\"noopener\">2:02<\/a> (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/every-level-of-a-claude-second-brain-explained--DTCyvo6cC54-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}]}, {"n": 5, "title": "Segment knowledge that is distinct and growing", "sec": "B", "secTitle": "Organising the OS", "rules": [9], "body": [{"t": "p", "h": "When separate bodies of knowledge keep growing (his YouTube transcripts and his meeting transcripts), split them into their own wikis so the agent knows where to look and searches far fewer files: faster, more accurate and cheaper on tokens. Claude Code itself suggested his split. Clients: keep internal knowledge (dates, price, scope, calls) in the OS, segmented by client; keep client-facing deliverables in a separate repo, while the OS still knows the engagement exists."}, {"t": "q", "h": "\"the more you can segment stuff out, the better.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1221s\" target=\"_blank\" rel=\"noopener\">20:21<\/a>"}, {"t": "q", "h": "\"how can you narrow the actual context that your agent is going to be looking through?\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1251s\" target=\"_blank\" rel=\"noopener\">20:51<\/a>"}, {"t": "q", "h": "\"it still needs to know about this engagement.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1341s\" target=\"_blank\" rel=\"noopener\">22:21<\/a>"}, {"t": "p", "h": "Also: the split Claude suggested <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1039s\" target=\"_blank\" rel=\"noopener\">17:19<\/a>–<a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1070s\" target=\"_blank\" rel=\"noopener\">17:50<\/a>. Source: AI OS (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/steal-my-exact-ai-os-setup-5-simple-tips--Ek1NBfnnTH0-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}]}, {"n": 6, "title": "Cadence: automate data that arrives on a schedule", "sec": "B", "secTitle": "Organising the OS", "rules": [10], "body": [{"t": "p", "h": "If you keep asking the agent to pull the same data, it isn't really just-in-time situational context. Data that lands on a fixed rhythm (his Monday Q&amp;A, Tuesday leadership meeting) should be pulled in by a cron or routine, so it is there even if you forget. Natural language plus an API key is usually enough to set it up."}, {"t": "q", "h": "\"Build automations to update data.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1131s\" target=\"_blank\" rel=\"noopener\">18:51<\/a>"}, {"t": "q", "h": "\"this isn't sort of like a just in time sort of situational context thing\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1161s\" target=\"_blank\" rel=\"noopener\">19:21<\/a>"}, {"t": "p", "h": "Also: the audit's \"durability\" suggestion of weekly crons <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=553s\" target=\"_blank\" rel=\"noopener\">9:13<\/a>. Source: AI OS (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/steal-my-exact-ai-os-setup-5-simple-tips--Ek1NBfnnTH0-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "p", "h": "Also: of much-used skills, \"If they're getting used so often, why not just automate them?\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=8910s\" target=\"_blank\" rel=\"noopener\">bCl 2:28:30<\/a>. Cadence is the fourth C and comes last: concept 19."}]}, {"n": 7, "title": "The OS audit: indexes are claims, check them against reality", "sec": "C", "secTitle": "Keeping it true", "rules": [7, 8, 28], "body": [{"t": "p", "h": "His <code>OS audit<\/code> skill reads the whole project and reports what is weak. It is read-only: it lists findings and fixes, writes a dated report into an <code>audits/<\/code> folder, reads the previous report first, and waits for a yes before fixing anything. Checks include routing integrity (does everything the router points to exist, and is anything misrouted in reverse), index truth (does the index match the disk), freshness, memory, bloat, duplication and organisation. On big projects it fans out one explore sub-agent per check and merges their reports. His demo found the index said 55 folders while the disk had 79, and listed the wrong answers that would cause."}, {"t": "q", "h": "\"It won't actually do anything yet.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=64s\" target=\"_blank\" rel=\"noopener\">1:04<\/a>"}, {"t": "q", "h": "\"Indexes and wiks are claims about what exists and what's current. The audit checks every claim against reality.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=583s\" target=\"_blank\" rel=\"noopener\">9:43<\/a>"}, {"t": "q", "h": "\"Index says 55 folders, but disk has 79.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=492s\" target=\"_blank\" rel=\"noopener\">8:12<\/a>"}, {"t": "p", "h": "Also: fix list marked await approval <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=523s\" target=\"_blank\" rel=\"noopener\">8:43<\/a>; checks <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=614s\" target=\"_blank\" rel=\"noopener\">10:14<\/a>–<a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=706s\" target=\"_blank\" rel=\"noopener\">11:46<\/a>. Before the skill, he did the same thing by asking weekly or monthly in plain chat: \"have AI audit itself.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1009s\" target=\"_blank\" rel=\"noopener\">16:49<\/a>. Source: AI OS (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/steal-my-exact-ai-os-setup-5-simple-tips--Ek1NBfnnTH0-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "p", "h": "Also: reports are saved and the skill should \"look for earlier reports inside of the audit folder\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=614s\" target=\"_blank\" rel=\"noopener\">10:14<\/a>; run it weekly, \"Maybe every single Friday, you run an audit\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=8910s\" target=\"_blank\" rel=\"noopener\">bCl 2:28:30<\/a>."}]}, {"n": 8, "title": "Freshness is a separate check from accuracy", "sec": "C", "secTitle": "Keeping it true", "rules": [8], "body": [{"t": "p", "h": "Data can be correct but stale. The audit grades each data feed as fresh, drifting, frozen, retired or on demand. His demo's knowledge was current only to 29 June, so any later business question would get a confident but wrong answer."}, {"t": "q", "h": "\"Are all the data feeds current?\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=675s\" target=\"_blank\" rel=\"noopener\">11:15<\/a>"}, {"t": "q", "h": "\"fresh, drifting, frozen, retired, or if they're on demand.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=675s\" target=\"_blank\" rel=\"noopener\">11:15<\/a>"}, {"t": "q", "h": "\"would give me a confident June state answer, which would be wrong.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=523s\" target=\"_blank\" rel=\"noopener\">8:43<\/a>"}, {"t": "p", "h": "Source: AI OS (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/steal-my-exact-ai-os-setup-5-simple-tips--Ek1NBfnnTH0-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}]}, {"n": 9, "title": "Backtrack retrieval misses, then fix the route", "sec": "C", "secTitle": "Keeping it true", "rules": [11], "body": [{"t": "p", "h": "When the agent searches for ages, or says it has no access to something you know is there, don't just tell it not to let that happen again. Make it retrace what it did and where it looked, explain why it missed, and then update the routing or reorganise files based on what it found."}, {"t": "q", "h": "\"you searched, and help me figure out why you didn't find that data right away.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1402s\" target=\"_blank\" rel=\"noopener\">23:22<\/a>"}, {"t": "q", "h": "\"Have it update the routing. Have it maybe even move stuff or reorganize stuff based on what it found when it was backtracking.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1402s\" target=\"_blank\" rel=\"noopener\">23:22<\/a>"}, {"t": "p", "h": "Also: \"number five is to backtrack\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1371s\" target=\"_blank\" rel=\"noopener\">22:51<\/a>. Source: AI OS (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/steal-my-exact-ai-os-setup-5-simple-tips--Ek1NBfnnTH0-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "p", "h": "<em>Supporting:<\/em> a 5-minute search for a file he knows the location of means the architecture needs updating, <a href=\"https://www.youtube.com/watch?v=8QQ_INxAhRs&amp;t=339s\" target=\"_blank\" rel=\"noopener\">5:39<\/a> (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/i-turned-claude-into-the-ultimate-second-brain--8QQ_INxAhRs-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "p", "h": "Also: \"every time you correct AI, you feed that correction back into the system\" <a href=\"https://www.youtube.com/watch?v=3XIGcM7VICc&amp;t=397s\" target=\"_blank\" rel=\"noopener\">3XI 6:37<\/a>; fix it where it lasts, \"update the skill in the smallest durable place\" <a href=\"https://www.youtube.com/watch?v=HIRDzMtuWFk&amp;t=365s\" target=\"_blank\" rel=\"noopener\">HIR 6:05<\/a>."}]}, {"n": 10, "title": "Raw evidence vs derived brain", "sec": "D", "secTitle": "Building an expert brain", "rules": [12], "body": [{"t": "p", "h": "Step one gathers everything the expert has said into one raw folder, one sub-folder per source (he used free YouTube caption tools, and a paid X API that cost about a dollar), with one agent per source in parallel and a written record of what was fetched so it can be checked. Raw text alone is too messy to search well, so an LLM compiles it into a wiki (Karpathy's LLM-wiki idea). The raw files are never edited; the wiki is the derived layer on top. Obsidian is only a viewer."}, {"t": "q", "h": "\"I told it to write down what it got, so that you can actually check it.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=214s\" target=\"_blank\" rel=\"noopener\">3:34<\/a>"}, {"t": "q", "h": "\"It's like finding a needle in a haystack.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=214s\" target=\"_blank\" rel=\"noopener\">3:34<\/a>"}, {"t": "q", "h": "\"The raw files don't get touched\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=244s\" target=\"_blank\" rel=\"noopener\">4:04<\/a>"}, {"t": "p", "h": "Also: crawl set-up <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=183s\" target=\"_blank\" rel=\"noopener\">3:03<\/a>; Obsidian as the visual layer <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=274s\" target=\"_blank\" rel=\"noopener\">4:34<\/a>. Source: Karpathy (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/i-built-another-andrej-karpathy-using-claude--bvGptCLDhyo-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "p", "h": "<em>Supporting:<\/em> raw → wiki → index and log, shown step by step in <a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/fable-5-karpathy-s-llm-wiki-is-basically-cheating--hQvwMj7IJe4-transcript.md\" target=\"_blank\" rel=\"noopener\">Karpathy's LLM Wiki Is Basically Cheating<\/a>, <a href=\"https://www.youtube.com/watch?v=hQvwMj7IJe4&amp;t=518s\" target=\"_blank\" rel=\"noopener\">8:38<\/a>."}]}, {"n": 11, "title": "The brain's pages: index, log, source pages, concepts and rules", "sec": "D", "secTitle": "Building an expert brain", "rules": [14], "body": [{"t": "p", "h": "The wiki keeps an index and a log, has one page per thing the expert wrote or said, and topic pages (principles, rules, methods, how he explains, how he debugs). He also mentions a \"hot page\". <strong>(inference)<\/strong> In this repo that maps to <code>index.md<\/code> (current state, what's covered), <code>log.md<\/code> (history), <code>concepts.md<\/code> (ideas) and <code>rules.md<\/code> (operating rules), with the transcripts as the source pages."}, {"t": "q", "h": "\"keeps an index, keeps a log\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=244s\" target=\"_blank\" rel=\"noopener\">4:04<\/a>"}, {"t": "p", "h": "Also: page types <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=274s\" target=\"_blank\" rel=\"noopener\">4:34<\/a>–<a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=304s\" target=\"_blank\" rel=\"noopener\">5:04<\/a>; index, hot page and log updated on ingest <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=578s\" target=\"_blank\" rel=\"noopener\">9:38<\/a>. Source: Karpathy (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/i-built-another-andrej-karpathy-using-claude--bvGptCLDhyo-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "p", "h": "<em>Supporting:<\/em> the index and log let the AI \"incrementally build and maintain this wiki\" <a href=\"https://www.youtube.com/watch?v=hQvwMj7IJe4&amp;t=578s\" target=\"_blank\" rel=\"noopener\">9:38<\/a> (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/fable-5-karpathy-s-llm-wiki-is-basically-cheating--hQvwMj7IJe4-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "p", "h": "Also: on memory files, \"it's an index, not a dump\" <a href=\"https://www.youtube.com/watch?v=LrgfmZkl3nc&amp;t=334s\" target=\"_blank\" rel=\"noopener\">Lrg 5:34<\/a>."}]}, {"n": 12, "title": "Provenance and inference labels", "sec": "D", "secTitle": "Building an expert brain", "rules": [13], "body": [{"t": "p", "h": "Rules are what make the agent think like the expert, not just recall him. Each rule must link to an exact quote and where it came from, so you can click through and check it. If there is no source, the agent must say it is inferring."}, {"t": "q", "h": "\"what makes it think like him instead of just knowing what he said in the past.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=334s\" target=\"_blank\" rel=\"noopener\">5:34<\/a>"}, {"t": "q", "h": "\"every rule has to connect with an exact quote from him and where it came from. Because we don't want Claude to just make things up.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=334s\" target=\"_blank\" rel=\"noopener\">5:34<\/a>"}, {"t": "q", "h": "\"if there is no source, the agent has to say explicitly that it's inferring\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=394s\" target=\"_blank\" rel=\"noopener\">6:34<\/a>"}, {"t": "p", "h": "Source: Karpathy (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/i-built-another-andrej-karpathy-using-claude--bvGptCLDhyo-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}]}, {"n": 13, "title": "Relational ingestion", "sec": "D", "secTitle": "Building an expert brain", "rules": [14], "body": [{"t": "p", "h": "The wiki links pages to each other: every rule links to its sources and every source to the rules it supports, so you query a relationship map, not a pile of notes. Adding one new link via an ingest command writes a source page, updates every page that source touches, and updates the index, hot page and log. In his demo a rule that had one source got a second and was promoted to a real rule. He never edited the wiki by hand."}, {"t": "q", "h": "\"Every rule links back to the source that it came from\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=304s\" target=\"_blank\" rel=\"noopener\">5:04<\/a>"}, {"t": "q", "h": "\"it will update every page that post touches.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=578s\" target=\"_blank\" rel=\"noopener\">9:38<\/a>"}, {"t": "q", "h": "\"a rule that was sitting on the bench with one source behind it got its second source and became a real rule.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=578s\" target=\"_blank\" rel=\"noopener\">9:38<\/a>"}, {"t": "p", "h": "Also: relationships make querying work <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=244s\" target=\"_blank\" rel=\"noopener\">4:04<\/a>. Source: Karpathy (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/i-built-another-andrej-karpathy-using-claude--bvGptCLDhyo-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}]}, {"n": 14, "title": "Specialist agents and skills", "sec": "E", "secTitle": "Turning knowledge into behaviour", "rules": [15], "body": [{"t": "p", "h": "The rules become two files. A sub-agent holds the rules, how it talks and the loop it runs on every task; being a separate Claude with its own context, it doesn't drag your whole conversation along. A skill (a slash command) is the entry point: it sends your question to the agent and grades the answer against a checklist, one line per rule. The same knowledge can then feed your other skills, agents and workflows."}, {"t": "q", "h": "\"it doesn't drag your whole conversation along with it.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=394s\" target=\"_blank\" rel=\"noopener\">6:34<\/a>"}, {"t": "q", "h": "\"grades the answer against a checklist, one line per rule\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=425s\" target=\"_blank\" rel=\"noopener\">7:05<\/a>"}, {"t": "q", "h": "\"I can wire that knowledge into my own skills and my own agents and my own workflows\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=122s\" target=\"_blank\" rel=\"noopener\">2:02<\/a>"}, {"t": "p", "h": "Source: Karpathy (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/i-built-another-andrej-karpathy-using-claude--bvGptCLDhyo-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "p", "h": "<em>Supporting, a challenge:<\/em> in <a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/i-deleted-all-my-claude-skills-and-claude-got-smarter--XNQBCRcwXV4-transcript.md\" target=\"_blank\" rel=\"noopener\">I Deleted All My Claude Skills<\/a> he warns over-specific skills can hold newer models back and suggests \"making versions of them that aren't as specific\" <a href=\"https://www.youtube.com/watch?v=XNQBCRcwXV4&amp;t=341s\" target=\"_blank\" rel=\"noopener\">5:41<\/a>. <strong>(inference)<\/strong> Make skills for repeatable procedures, but keep them short."}, {"t": "p", "h": "Also: skill anatomy and triggering, concept 21; sub-agents in depth, concept 23."}]}, {"n": 15, "title": "Run gates: enforce verification, don't just ask for it", "sec": "E", "secTitle": "Turning knowledge into behaviour", "rules": [16], "body": [{"t": "p", "h": "A hook runs when the agent tries to finish its turn. If it wrote code it never ran, the hook blocks the answer and sends it back. Verification becomes a step the agent can't skip."}, {"t": "q", "h": "\"a little script that runs right when the agent tries to finish its turn.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=455s\" target=\"_blank\" rel=\"noopener\">7:35<\/a>"}, {"t": "q", "h": "\"if it wrote code and it never ran it, the hook will basically block the answer\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=455s\" target=\"_blank\" rel=\"noopener\">7:35<\/a>"}, {"t": "q", "h": "\"baking in like a verification loop.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=455s\" target=\"_blank\" rel=\"noopener\">7:35<\/a>"}, {"t": "p", "h": "Source: Karpathy (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/i-built-another-andrej-karpathy-using-claude--bvGptCLDhyo-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "p", "h": "Also: \"every single skill that I build works in some sort of verification loop\" <a href=\"https://www.youtube.com/watch?v=9KOtMsZ9I28&amp;t=580s\" target=\"_blank\" rel=\"noopener\">9KO 9:40<\/a>."}, {"t": "p", "h": "<em>Supporting:<\/em> \"You verify yourself so that I don't have to verify.\" <a href=\"https://www.youtube.com/watch?v=XNQBCRcwXV4&amp;t=555s\" target=\"_blank\" rel=\"noopener\">9:15<\/a> (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/i-deleted-all-my-claude-skills-and-claude-got-smarter--XNQBCRcwXV4-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}]}, {"n": 16, "title": "Real-world testing", "sec": "E", "secTitle": "Turning knowledge into behaviour", "rules": [17, 27], "body": [{"t": "p", "h": "The last step is testing on real things. Teaching test: it writes down what done means first, builds the smallest version, predicts, runs, shows a broken version, then lists what it ran and which rule drove each move. Review test: \"would the client accept this?\" on a script that had passed Claude's own test; the agent predicted a crash on an emoji in a normal Windows terminal, ran it that way, and it crashed. It then trimmed what wasn't earning its place and proved the trimmed version behaved the same by running both side by side."}, {"t": "q", "h": "\"the last step, of course, is just to test it.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=485s\" target=\"_blank\" rel=\"noopener\">8:05<\/a>"}, {"t": "q", "h": "\"saying that it works was only true in one specific setting or terminal.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=548s\" target=\"_blank\" rel=\"noopener\">9:08<\/a>"}, {"t": "q", "h": "\"we make it test on things that are real.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=608s\" target=\"_blank\" rel=\"noopener\">10:08<\/a>"}, {"t": "p", "h": "Also: the emoji crash <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=517s\" target=\"_blank\" rel=\"noopener\">8:37<\/a>. Source: Karpathy (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/i-built-another-andrej-karpathy-using-claude--bvGptCLDhyo-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "p", "h": "Also: a slides skill that couldn't see its own output got Chrome so it could \"open the page screenshot it look at it\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=3817s\" target=\"_blank\" rel=\"noopener\">bCl 1:03:37<\/a>; \"Before returning the final output, define the acceptance criteria.\" <a href=\"https://www.youtube.com/watch?v=HIRDzMtuWFk&amp;t=485s\" target=\"_blank\" rel=\"noopener\">HIR 8:05<\/a>."}, {"t": "p", "h": "Also: \"But, if Claude has your files and your examples and your workflows and your style guides and the actual success criteria for what good looks like\" <a href=\"https://www.youtube.com/watch?v=brB-hSiV2iU&amp;t=334s\" target=\"_blank\" rel=\"noopener\">brB 5:34<\/a>"}]}, {"n": 17, "title": "Human understanding is the finish line", "sec": "F", "secTitle": "The point of it all", "rules": [18], "body": [{"t": "p", "h": "The brain is not a voice clone or impression; it condenses how an expert thinks so you can talk to it until you understand. You can't be expert in everything, but you must understand what you ship, and your own system: he still finds his own files by hand to make sure he understands his OS. Team-wide AI OS sync is, for him, unsolved and a people and habit problem more than a tech one; mastering your own system first makes that easier."}, {"t": "q", "h": "\"you can outsource your thinking, but you cannot outsource your understanding.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=608s\" target=\"_blank\" rel=\"noopener\">10:08<\/a> (Nate quoting Karpathy)"}, {"t": "q", "h": "\"then I can just talk to it until I understand it.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=122s\" target=\"_blank\" rel=\"noopener\">2:02<\/a>"}, {"t": "q", "h": "\"I actually understand my own second brain\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1131s\" target=\"_blank\" rel=\"noopener\">18:51<\/a>"}, {"t": "q", "h": "\"I don't think it's a tech problem. I think it's a people problem.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1432s\" target=\"_blank\" rel=\"noopener\">23:52<\/a>"}, {"t": "p", "h": "Also: not an impression <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=31s\" target=\"_blank\" rel=\"noopener\">0:31<\/a>; master your own systems first <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1463s\" target=\"_blank\" rel=\"noopener\">24:23<\/a>. Sources: Karpathy (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/i-built-another-andrej-karpathy-using-claude--bvGptCLDhyo-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>), AI OS (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/steal-my-exact-ai-os-setup-5-simple-tips--Ek1NBfnnTH0-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "p", "h": "Also: \"Never accept AI output without asking why\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=397s\" target=\"_blank\" rel=\"noopener\">bCl 6:37<\/a>; \"You can't scale a system if you haven't lived in it yourself.\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=9092s\" target=\"_blank\" rel=\"noopener\">bCl 2:31:32<\/a>."}, {"t": "p", "h": "<em>Supporting:<\/em> for rolling an OS out to a team, \"you have to learn it first\" <a href=\"https://www.youtube.com/watch?v=8QQ_INxAhRs&amp;t=1993s\" target=\"_blank\" rel=\"noopener\">33:13<\/a> (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/i-turned-claude-into-the-ultimate-second-brain--8QQ_INxAhRs-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}]}, {"n": 18, "title": "The router is re-read every message, so keep it under 200 lines", "sec": "G", "secTitle": "From the wider course and newer videos", "rules": [19], "body": [{"t": "p", "h": "CLAUDE.md is loaded as system context at the start of every chat, so every extra line costs on every turn. Edits to it only take effect in a new session."}, {"t": "q", "h": "\"Claude auto reads it at the start of every single chat as system context. So keep it under 200 lines.\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=20187s\" target=\"_blank\" rel=\"noopener\">jdb 5:36:27<\/a>"}, {"t": "q", "h": "\"the edit actually doesn't apply until you restart that session.\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=21315s\" target=\"_blank\" rel=\"noopener\">jdb 5:55:15<\/a>"}, {"t": "p", "h": "Also: keep decisions, not chat history, in it: \"Save decisions, not conversations.\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=20645s\" target=\"_blank\" rel=\"noopener\">jdb 5:44:05<\/a>."}]}, {"n": 19, "title": "The four C's, built in order: context, connections, capabilities, cadence", "sec": "G", "secTitle": "From the wider course and newer videos", "rules": [], "note": "no rule yet; links concepts 2 and 6 (above).", "body": [{"t": "p", "h": "Context is what the AI knows about you; connections are the live data it can reach; capabilities are the skills that make it useful; cadence is when it acts on its own. The first two are the second brain. Each layer needs the one before it."}, {"t": "q", "h": "\"You can't have cadence without connections. You can't have capability without context. And you have to go in this order.\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=734s\" target=\"_blank\" rel=\"noopener\">bCl 12:14<\/a>"}, {"t": "q", "h": "\"each of these layers can't happen without the previous one.\" <a href=\"https://www.youtube.com/watch?v=0WDkwMxj13s&amp;t=489s\" target=\"_blank\" rel=\"noopener\">0WD 8:09<\/a>"}, {"t": "p", "h": "Also: <a href=\"https://www.youtube.com/watch?v=yysILVsfLFM&amp;t=124s\" target=\"_blank\" rel=\"noopener\">yys 2:04<\/a>, <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=15580s\" target=\"_blank\" rel=\"noopener\">jdb 4:19:40<\/a>. Links concept 2 (context/connections) and concept 6 (cadence)."}, {"t": "p", "h": "Also: \"So these four things really come one after the other, context, connections, capabilities, and cadence.\" <a href=\"https://www.youtube.com/watch?v=X-pbJWKmwi0&amp;t=2742s\" target=\"_blank\" rel=\"noopener\">Xpb 45:42<\/a>"}]}, {"n": 20, "title": "Levels of a second brain: start at level 1, move up only when it hurts", "sec": "G", "secTitle": "From the wider course and newer videos", "rules": [], "note": "no rule yet; level 1 is concept 3's router (inference).", "body": [{"t": "p", "h": "Level 1 is a router plus folders. Move to a compiled wiki (level 2) when notes pile up and you forget what's in them; a markdown wiki with good indexes is enough until hundreds of pages. Only keep knowledge that will still matter in a year."}, {"t": "q", "h": "\"If you have 30 plus notes and you keep forgetting what's in them, look at level two.\" <a href=\"https://www.youtube.com/watch?v=DTCyvo6cC54&amp;t=1733s\" target=\"_blank\" rel=\"noopener\">DTC 28:53<\/a>"}, {"t": "q", "h": "\"if you have hundreds of pages with good indexes, you're fine with wiki graph\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=8607s\" target=\"_blank\" rel=\"noopener\">bCl 2:23:27<\/a>"}, {"t": "p", "h": "Also: \"If there's not pain, then why create more?\" <a href=\"https://www.youtube.com/watch?v=DTCyvo6cC54&amp;t=244s\" target=\"_blank\" rel=\"noopener\">DTC 4:04<\/a>; \"in a year, will it be good for me to have this memory in here?\" <a href=\"https://www.youtube.com/watch?v=DTCyvo6cC54&amp;t=1643s\" target=\"_blank\" rel=\"noopener\">DTC 27:23<\/a>."}, {"t": "q", "h": "\"My wiki has links, isn't that a knowledge graph? Not exactly.\" — <a href=\"https://www.youtube.com/watch?v=DTCyvo6cC54&amp;t=761s\" target=\"_blank\" rel=\"noopener\">12:41<\/a>"}, {"t": "p", "h": "Added 2026-10-08: links between wiki pages are level 2, \"it's like a a see also. It's like backlinks\"; level 4 knowledge graphs record <em>how<\/em> things relate, and he plays with them but doesn't use them day to day. So \"fully connected\" at our level means every page links to related pages, not a graph tool."}]}, {"n": 21, "title": "Skills: progressive loading, and the description is the trigger", "sec": "G", "secTitle": "From the wider course and newer videos", "rules": [21, 22], "body": [{"t": "p", "h": "Claude reads only each skill's name and description (front matter, about 100 tokens) to pick one, then the full SKILL.md, then extra files only if needed. So the description must use the words a person would actually say, two skills mustn't compete, and broken front matter (an unclosed quote) stops it firing. Test with an obvious request, a reworded one and an unrelated one. Keep SKILL.md under 500 lines."}, {"t": "q", "h": "\"it would only read the YAML front matter.\" <a href=\"https://www.youtube.com/watch?v=zKBPwDpBfhs&amp;t=730s\" target=\"_blank\" rel=\"noopener\">zKB 12:10<\/a>"}, {"t": "q", "h": "\"a skill that Claude can't find is basically a skill that you don't have.\" <a href=\"https://www.youtube.com/watch?v=HIRDzMtuWFk&amp;t=273s\" target=\"_blank\" rel=\"noopener\">HIR 4:33<\/a>"}, {"t": "p", "h": "Also: <a href=\"https://www.youtube.com/watch?v=zKBPwDpBfhs&amp;t=700s\" target=\"_blank\" rel=\"noopener\">zKB 11:40<\/a>–<a href=\"https://www.youtube.com/watch?v=zKBPwDpBfhs&amp;t=761s\" target=\"_blank\" rel=\"noopener\">12:41<\/a>; <a href=\"https://www.youtube.com/watch?v=HIRDzMtuWFk&amp;t=242s\" target=\"_blank\" rel=\"noopener\">HIR 4:02<\/a>; \"You have to close off the quotes if you open them up\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=9462s\" target=\"_blank\" rel=\"noopener\">jdb 2:37:42<\/a>; \"keep the skill.md under 500 lines\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=4888s\" target=\"_blank\" rel=\"noopener\">bCl 1:21:28<\/a>."}]}, {"n": 22, "title": "Skills start small, keep working code, and earn autonomy", "sec": "G", "secTitle": "From the wider course and newer videos", "rules": [23], "body": [{"t": "p", "h": "A skill can be a short prompt you were tired of retyping. When a script works, save it as a file the skill points to rather than letting Claude rewrite it each run. New skills report and ask; give them more freedom only after many runs."}, {"t": "q", "h": "\"A skill can just be a prompt that you don't want to have to say every single time.\" <a href=\"https://www.youtube.com/watch?v=c0kaKxM2pHg&amp;t=122s\" target=\"_blank\" rel=\"noopener\">c0k 2:02<\/a>"}, {"t": "q", "h": "\"don't leave that code trapped inside the chat\" <a href=\"https://www.youtube.com/watch?v=HIRDzMtuWFk&amp;t=122s\" target=\"_blank\" rel=\"noopener\">HIR 2:02<\/a>"}, {"t": "p", "h": "Also: \"battle tested\" first <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=6457s\" target=\"_blank\" rel=\"noopener\">jdb 1:47:37<\/a>; \"They could literally just be a 50line markdown file.\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=5134s\" target=\"_blank\" rel=\"noopener\">bCl 1:25:34<\/a>; vet third-party skills <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=4735s\" target=\"_blank\" rel=\"noopener\">bCl 1:18:55<\/a>."}]}, {"n": 23, "title": "Sub-agents: for piles of output, read-only by their tools, never forced", "sec": "G", "secTitle": "From the wider course and newer videos", "rules": [24], "body": [{"t": "p", "h": "Use a sub-agent when a job would flood your chat with output you won't re-read (many files, big searches). Make one read-only through its tool list, not by asking. Don't use them for one quick step: too many gives worse results. Shared agents live in the repo."}, {"t": "q", "h": "\"is this about to dump a pile of stuff into my chat that I'll never read again? If that's ever yes, delegate it to a sub agent.\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=9827s\" target=\"_blank\" rel=\"noopener\">jdb 2:43:47<\/a>"}, {"t": "q", "h": "\"if you're forcing too many sub agents, you're going to get worse results\" <a href=\"https://www.youtube.com/watch?v=e18sdZLwP7o&amp;t=1497s\" target=\"_blank\" rel=\"noopener\">e18 24:57<\/a>"}, {"t": "p", "h": "Also: \"explicitly read-only\" via disallowed tools <a href=\"https://www.youtube.com/watch?v=e18sdZLwP7o&amp;t=430s\" target=\"_blank\" rel=\"noopener\">e18 7:10<\/a>; \"so that you don't blow your own context window\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=5012s\" target=\"_blank\" rel=\"noopener\">bCl 1:23:32<\/a>."}]}, {"n": 24, "title": "Permissions are keys and deny lists, not prompts", "sec": "G", "secTitle": "From the wider course and newer videos", "rules": [25], "body": [{"t": "p", "h": "Assume the agent will do anything it is able to. Safety comes from what it physically can't do: scoped API keys that only allow the needed actions, and a settings deny list for risky commands. His 150,000-email accident came from too many tools, not the permission mode."}, {"t": "q", "h": "\"A prompt is never a permission layer. You basically have to have the assumption that if it can, it will.\" <a href=\"https://www.youtube.com/watch?v=8QQ_INxAhRs&amp;t=1471s\" target=\"_blank\" rel=\"noopener\">8QQ 24:31<\/a>"}, {"t": "q", "h": "\"Can you help me update the settings file so that you physically cannot do those things?\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=4468s\" target=\"_blank\" rel=\"noopener\">jdb 1:14:28<\/a>"}, {"t": "p", "h": "Also: \"there's no point in giving the agent that actual tool to be able to do so.\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=4254s\" target=\"_blank\" rel=\"noopener\">jdb 1:10:54<\/a>; per-key permissions <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=2324s\" target=\"_blank\" rel=\"noopener\">bCl 38:44<\/a>."}]}, {"n": 25, "title": "Secrets in .env; your own keys travel, app connectors don't", "sec": "G", "secTitle": "From the wider course and newer videos", "rules": [26], "body": [{"t": "p", "h": "Keys live in a <code>.env<\/code> file kept out of Git and out of chat. Prefer an API key plus a reference .md over app connectors or piles of MCP servers: connectors are lost when you change tool, and loaded MCPs eat tokens."}, {"t": "q", "h": "\"If you rely on these connections, that is not great\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=5844s\" target=\"_blank\" rel=\"noopener\">jdb 1:37:24<\/a>"}, {"t": "q", "h": "\"if you switch off to a different desktop app or a different harness, you lose everything.\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=5844s\" target=\"_blank\" rel=\"noopener\">jdb 1:37:24<\/a>"}, {"t": "p", "h": "Also: \"gets excluded from anytime we do a public push\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=2510s\" target=\"_blank\" rel=\"noopener\">bCl 41:50<\/a>; MCP token cost <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=2385s\" target=\"_blank\" rel=\"noopener\">bCl 39:45<\/a>."}]}, {"n": 26, "title": "Grill me: interview the knowledge out of your head", "sec": "G", "secTitle": "From the wider course and newer videos", "rules": [30], "body": [{"t": "p", "h": "The bottleneck is getting what you know into the system; a quick brain dump is never enough. The grill-me skill asks one question at a time, checkpoints every answer to a doc in <code>brainstorms/<\/code>, flags gaps to chase with others, and can be re-run when things change. Up-front time gets a skill close to right on the first try."}, {"t": "q", "h": "\"It's not ever good enough.\" <a href=\"https://www.youtube.com/watch?v=c0kaKxM2pHg&amp;t=62s\" target=\"_blank\" rel=\"noopener\">c0k 1:02<\/a>"}, {"t": "q", "h": "\"the bigger problem is getting everything out of your brain into the system\" <a href=\"https://www.youtube.com/watch?v=DTCyvo6cC54&amp;t=1338s\" target=\"_blank\" rel=\"noopener\">DTC 22:18<\/a>"}, {"t": "p", "h": "Also: checkpointing to brainstorms <a href=\"https://www.youtube.com/watch?v=c0kaKxM2pHg&amp;t=153s\" target=\"_blank\" rel=\"noopener\">c0k 2:33<\/a>; open flags <a href=\"https://www.youtube.com/watch?v=c0kaKxM2pHg&amp;t=367s\" target=\"_blank\" rel=\"noopener\">c0k 6:07<\/a>; ask until 95% sure <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=19974s\" target=\"_blank\" rel=\"noopener\">jdb 5:32:54<\/a>."}]}, {"n": 27, "title": "Session hygiene: clear between tasks, hand off before it degrades", "sec": "G", "secTitle": "From the wider course and newer videos", "rules": [29], "body": [{"t": "p", "h": "Each message in a long chat costs more than in a fresh one, so start fresh for unrelated tasks. Before clearing (he says around 250-300k tokens, as autocompact comes too late), have the agent write a hand-off: what was done, files made, open decisions, next step."}, {"t": "q", "h": "\"Use slashclear between unrelated tasks.\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=19853s\" target=\"_blank\" rel=\"noopener\">jdb 5:30:53<\/a>"}, {"t": "q", "h": "\"Here are open decisions. Here's what's next.\" <a href=\"https://www.youtube.com/watch?v=0WDkwMxj13s&amp;t=1344s\" target=\"_blank\" rel=\"noopener\">0WD 22:24<\/a>"}, {"t": "p", "h": "Also: \"But the autocompact kicks in way too late.\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=7248s\" target=\"_blank\" rel=\"noopener\">jdb 2:00:48<\/a>."}]}, {"n": 28, "title": "One set of files for every tool (Claude Code and Codex)", "sec": "G", "secTitle": "From the wider course and newer videos", "rules": [], "note": "no rule yet; concept 3 says the same files serve Codex.", "body": [{"t": "p", "h": "Build tool-agnostic. Codex reads AGENTS.md, keeps config and agents in <code>.codex/<\/code> and skills in <code>.agents/<\/code>; skill files are identical between the two, only agent files differ (TOML vs markdown). A CLAUDE.md can simply reference AGENTS.md."}, {"t": "q", "h": "\"you're building things to be tool agnostic\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=124s\" target=\"_blank\" rel=\"noopener\">bCl 2:04<\/a>"}, {"t": "q", "h": "\"the skill files, which are the markdown files with the YAML front matter, are the exact same.\" <a href=\"https://www.youtube.com/watch?v=kB9iMD0EjT8&amp;t=184s\" target=\"_blank\" rel=\"noopener\">kB9 3:04<\/a>"}, {"t": "p", "h": "Also: <a href=\"https://www.youtube.com/watch?v=DTCyvo6cC54&amp;t=1369s\" target=\"_blank\" rel=\"noopener\">DTC 22:49<\/a>; shared skills and agents go in the repo <a href=\"https://www.youtube.com/watch?v=e18sdZLwP7o&amp;t=1497s\" target=\"_blank\" rel=\"noopener\">e18 24:57<\/a>."}]}, {"n": 29, "title": "Context costs money and rots: act at about half the window", "sec": "H", "secTitle": "From the full-channel audit (2026-10-08)", "rules": [31], "body": [{"t": "p", "h": "Every new message makes Claude re-read the whole chat from the start, so long chats cost more and, past roughly half the window, the answers get worse. Look at what is filling the context (run /context in a fresh session, delete unused tools, skills and servers) before blaming the model, convert documents to markdown because it is cheaper for AI, and check your usage allowance. When a path has gone wrong, rewind or restart rather than piling corrections on top of the failed attempt."}, {"t": "q", "h": "\"somewhere around halfway through your context window, it starts to fall apart.\" <a href=\"https://www.youtube.com/watch?v=eRS3CmvrOvA&amp;t=272s\" target=\"_blank\" rel=\"noopener\">eRS 4:32<\/a>"}, {"t": "q", "h": "\"go into a fresh session, do /context, and see what you're sitting at before you even send off anything\" <a href=\"https://www.youtube.com/watch?v=_qZvORxGqI0&amp;t=64s\" target=\"_blank\" rel=\"noopener\">_qZ 1:04<\/a>"}, {"t": "q", "h": "\"Claude rereads the entire conversation from the beginning, and all of those are tokens that it's charging you for\" <a href=\"https://www.youtube.com/watch?v=49V-5Ock8LU&amp;t=64s\" target=\"_blank\" rel=\"noopener\">49V 1:04<\/a>"}]}, {"n": 30, "title": "Plan, let the AI attack the plan, then build", "sec": "H", "secTitle": "From the full-channel audit (2026-10-08)", "rules": [32], "body": [{"t": "p", "h": "Before anything non-trivial, plan first, then ask Claude to push back and play devil's advocate on the plan before it builds. Big plans are saved to a file and worked phase by phase, one session each. Nate teaches plan mode for this; Charlie declined plan mode itself on 2026-10-08, and this repo's 95%-or-ask rule (R14: be 95% sure or ask 1-2 questions) does the same job."}, {"t": "q", "h": "\"You ask Claude to start challenging you and pushing back and playing devil's advocate before it builds anything or before it approves any plan\" <a href=\"https://www.youtube.com/watch?v=iTY8Q449YNQ&amp;t=156s\" target=\"_blank\" rel=\"noopener\">iTY 2:36<\/a>"}, {"t": "q", "h": "\"Have one for discovery where you can have Claude read through PDFs and read through the code base\" <a href=\"https://www.youtube.com/watch?v=_qZvORxGqI0&amp;t=1285s\" target=\"_blank\" rel=\"noopener\">_qZ 21:25<\/a>"}, {"t": "q", "h": "\"So what you always want to do when you're creating an idea is you want to go on plan mode.\" <a href=\"https://www.youtube.com/watch?v=mpALXah_PBg&amp;t=7300s\" target=\"_blank\" rel=\"noopener\">mpA 2:01:40<\/a>"}]}, {"n": 31, "title": "A separate checker decides \"done\"; then try to break it", "sec": "H", "secTitle": "From the full-channel audit (2026-10-08)", "rules": [33], "body": [{"t": "p", "h": "The worker should not mark its own homework: a different model or persona checks the result, and after \"done\" you stress test it for edge cases. When output is bad, first ask whether it is a model, harness or organisation problem. Verification steps also go into the to-do list, not just the end."}, {"t": "q", "h": "\"is this a model problem, is this a harness problem? Or is this an organization problem?\" <a href=\"https://www.youtube.com/watch?v=6LNlCpQPYFc&amp;t=1927s\" target=\"_blank\" rel=\"noopener\">6LN 32:07<\/a>"}, {"t": "q", "h": "\"Claude doesn't get to declare itself done. A different model has to look at it with a different persona\" <a href=\"https://www.youtube.com/watch?v=iTY8Q449YNQ&amp;t=1345s\" target=\"_blank\" rel=\"noopener\">iTY 22:25<\/a>"}, {"t": "q", "h": "\"by the time it tells you it's done, you stress test it more. and you try to find those edge cases\" <a href=\"https://www.youtube.com/watch?v=iTY8Q449YNQ&amp;t=583s\" target=\"_blank\" rel=\"noopener\">iTY 9:43<\/a>"}]}, {"n": 32, "title": "Skills do one job, are built from a real run, and retire when they stop earning", "sec": "H", "secTitle": "From the full-channel audit (2026-10-08)", "rules": [34], "body": [{"t": "p", "h": "Each skill or agent does one specific job. Build it by doing the task together once, then turning that run into a skill, and keep adding a line to a \"don'ts\" list for each real failure. Write instructions specifically, not vaguely. Retire a skill that no longer adds value, which matters once you have around ten."}, {"t": "q", "h": "\"the whole idea is that you want a skill to do one very specific job\" <a href=\"https://www.youtube.com/watch?v=X-pbJWKmwi0&amp;t=3985s\" target=\"_blank\" rel=\"noopener\">Xpb 1:06:25<\/a>"}, {"t": "q", "h": "\"So you want to make sure that your skill is actually adding value and not holding\" <a href=\"https://www.youtube.com/watch?v=6LNlCpQPYFc&amp;t=1469s\" target=\"_blank\" rel=\"noopener\">6LN 24:29<\/a>"}, {"t": "q", "h": "\"The way that I build my skills is I have Claude Code do something with me. I walk it through the steps\" <a href=\"https://www.youtube.com/watch?v=mpALXah_PBg&amp;t=22892s\" target=\"_blank\" rel=\"noopener\">mpA 6:21:32<\/a>"}]}, {"n": 33, "title": "Unattended runs: one-shot, stateless, bounded, tested by hand first, fixed parts in scripts", "sec": "H", "secTitle": "From the full-channel audit (2026-10-08)", "rules": [35], "body": [{"t": "p", "h": "A scheduled or background run must never need to stop and ask, can only see the repo, APIs and environment secrets, and needs a bounded scope with a named deliverable. Test it by hand and prove one live run before switching the schedule on. Put the fixed details in a script, because an agent left to interpret the same message will drift."}, {"t": "q", "h": "\"the agent was just interpreting the message different every time and it just acted differently\" <a href=\"https://www.youtube.com/watch?v=X-pbJWKmwi0&amp;t=10825s\" target=\"_blank\" rel=\"noopener\">Xpb 3:00:25<\/a>"}, {"t": "q", "h": "\"So, bound the scope, name the deliverable, and then all your sub agents can be put on Haiku.\" <a href=\"https://www.youtube.com/watch?v=jZgcWCzxh1I&amp;t=671s\" target=\"_blank\" rel=\"noopener\">jZg 11:11<\/a>"}, {"t": "q", "h": "\"You're not around. So, you probably want to make sure that it doesn't ever have to stop and ask you questions.\" <a href=\"https://www.youtube.com/watch?v=ehg4fhydTgs&amp;t=93s\" target=\"_blank\" rel=\"noopener\">ehg 1:33<\/a>"}]}, {"n": 34, "title": "Permissions in layers: deny plus allow, start strict, helpers inherit, read-only and drafts first", "sec": "H", "secTitle": "From the full-channel audit (2026-10-08)", "rules": [36], "body": [{"t": "p", "h": "Deny the destructive commands and also explicitly allow the safe ones. Start with read-only access and drafts, with a human approving anything outward, and remember that helper agents inherit the main session's permissions. Nate also describes auto mode (a classifier approves safe commands); auto mode is not adopted here, so the deny list stays the safety layer."}, {"t": "q", "h": "\"So, I would always start with like read-only access whenever you can, have the agent only do drafts\" <a href=\"https://www.youtube.com/watch?v=Ktnwygcnd8U&amp;t=640s\" target=\"_blank\" rel=\"noopener\">Ktn 10:40<\/a>"}, {"t": "q", "h": "\"go into your permissions and explicitly allow the commands that you know are safe\" <a href=\"https://www.youtube.com/watch?v=jqoFP9QapXI&amp;t=847s\" target=\"_blank\" rel=\"noopener\">jqo 14:07<\/a>"}, {"t": "q", "h": "\"they inherit the permissions from the main session. So, if you're on bypass permissions, then all of your agents are going to be on bypass permissions\" <a href=\"https://www.youtube.com/watch?v=vDVSGVpB2vc&amp;t=731s\" target=\"_blank\" rel=\"noopener\">vDV 12:11<\/a>"}]}, {"n": 35, "title": "Check before anything goes public: security review, private-data hook, untrusted content, plugin vetting", "sec": "H", "secTitle": "From the full-channel audit (2026-10-08)", "rules": [37], "body": [{"t": "p", "h": "Before publishing, run a security review and use a hook to strip private data, not just a rule. Web pages and transcripts are untrusted content that could trick an agent into sending data out. Vet a plugin against a checklist (network calls, exfiltration, shell injection, secrets) before installing it."}, {"t": "q", "h": "\"that there's a hook that fires to remove any PII, any sensitive data of that client that I don't want living on my GitHub.\" <a href=\"https://www.youtube.com/watch?v=6LNlCpQPYFc&amp;t=1439s\" target=\"_blank\" rel=\"noopener\">6LN 23:59<\/a>"}, {"t": "q", "h": "\"if Claude reads malicious content during a run, then it theoretically could be tricked into sending data to an external server.\" <a href=\"https://www.youtube.com/watch?v=ehg4fhydTgs&amp;t=701s\" target=\"_blank\" rel=\"noopener\">ehg 11:41<\/a>"}, {"t": "q", "h": "\"I basically told it to run a security review and make sure that my API keys aren't exposed and that there's no vulnerabilities\" <a href=\"https://www.youtube.com/watch?v=saggDHHnmtQ&amp;t=1801s\" target=\"_blank\" rel=\"noopener\">sag 30:01<\/a>"}]}, {"n": 36, "title": "File hygiene: scratch apart from deliverables, folder READMEs, project first, start every task in the project", "sec": "H", "secTitle": "From the full-channel audit (2026-10-08)", "rules": [38], "body": [{"t": "p", "h": "Tell the AI where throwaway files go so they stay apart from deliverables, and give every folder a short README saying why it exists. Everything starts in the project and is promoted to global only when earned, and every task starts inside the project, not a plain chat. \"Remember this\" has to end up in a file in the repo, since cloud auto-memory is wiped."}, {"t": "q", "h": "\"so that your agent always understands why does this folder exist and where should it look for different things\" <a href=\"https://www.youtube.com/watch?v=X-pbJWKmwi0&amp;t=5576s\" target=\"_blank\" rel=\"noopener\">Xpb 1:32:56<\/a>"}, {"t": "q", "h": "\"Everything is project until deserves to be promoted to global so that I know at all times what is the running total of everything that's running globally.\" <a href=\"https://www.youtube.com/watch?v=6LNlCpQPYFc&amp;t=1897s\" target=\"_blank\" rel=\"noopener\">6LN 31:37<\/a>"}, {"t": "q", "h": "\"if you want your assistant to remember something permanently, just tell it remember that I always prefer X.\" <a href=\"https://www.youtube.com/watch?v=mpALXah_PBg&amp;t=21188s\" target=\"_blank\" rel=\"noopener\">mpA 5:53:08<\/a>"}]}, {"n": 37, "title": "Operator habits: paste the whole error, make it do its own chores, match model and effort, adopt tools only for real pain, cap parallel sessions, use the OS for everything", "sec": "H", "secTitle": "From the full-channel audit (2026-10-08)", "rules": [39], "body": [{"t": "p", "h": "Small habits that add up: paste the whole error, ask the AI to do the chores it lists for you, and use the cheapest model and effort that does the job. Adopt a new tool only for a real pain point and trial it on real work, run no more than three or four parallel sessions, and use your OS for everything for a week."}, {"t": "q", "h": "\"try to force yourself to do everything from here, from this interface\" <a href=\"https://www.youtube.com/watch?v=X-pbJWKmwi0&amp;t=2712s\" target=\"_blank\" rel=\"noopener\">Xpb 45:12<\/a>"}, {"t": "q", "h": "\"do not automatically run everything at maximum effort or even just high.\" <a href=\"https://www.youtube.com/watch?v=FBVNS1l5Vb8&amp;t=279s\" target=\"_blank\" rel=\"noopener\">FBV 4:39<\/a>"}, {"t": "q", "h": "\"it has some action items, it actually just tells you to do some stuff that it could do itself\" <a href=\"https://www.youtube.com/watch?v=saggDHHnmtQ&amp;t=917s\" target=\"_blank\" rel=\"noopener\">sag 15:17<\/a>"}]}, {"n": 38, "title": "Parts rot at different speeds; score each audit", "sec": "H", "secTitle": "From the full-channel audit (2026-10-08)", "rules": [40], "body": [{"t": "p", "h": "Different parts of an OS go stale at different rates, so review each at its own pace. Score every audit and keep the scores, so you can see the system improving over time."}, {"t": "q", "h": "\"it will store your scores every time so that you can see how you're actually improving your system\" <a href=\"https://www.youtube.com/watch?v=X-pbJWKmwi0&amp;t=3195s\" target=\"_blank\" rel=\"noopener\">Xpb 53:15<\/a>"}, {"t": "q", "h": "\"All of these different parts decay, become obsolete or rot at different rates.\" <a href=\"https://www.youtube.com/watch?v=6LNlCpQPYFc&amp;t=1377s\" target=\"_blank\" rel=\"noopener\">6LN 22:57<\/a>"}]}], "rules": [{"n": 1, "title": "Name the failure mode before fixing", "conf": "stated: the four modes; inference: naming one before any fix", "concepts": [1], "body": [{"t": "p", "h": "A wrong answer is poisoning, bloat, confusion or clash. Each has a different fix, so name it first."}, {"t": "q", "h": "\"the four failure modes, poisoning, bloat, confusion, and clash.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=94s\" target=\"_blank\" rel=\"noopener\">1:34<\/a>"}, {"t": "check", "h": "<em>Which of the four is this: false fact, too much loaded, something missing, or two sources disagreeing?<\/em> (Concept 1)"}]}, {"n": 2, "title": "Fix poisoning with verification, not hope", "conf": "stated", "concepts": [], "body": [{"t": "p", "h": "Cross-check facts against a live source or a search; if the agent isn't sure, put a human in the loop."}, {"t": "q", "h": "\"poisoning is the easiest one to fix because basically it's just a matter of having some verification.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=156s\" target=\"_blank\" rel=\"noopener\">2:36<\/a>"}, {"t": "q", "h": "Also: \"Never accept AI output without asking why\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=397s\" target=\"_blank\" rel=\"noopener\">6:37<\/a>"}, {"t": "check", "h": "<em>Where does this fact get checked before it's used?<\/em>"}]}, {"n": 3, "title": "One current source per fact", "conf": "inference", "concepts": [], "body": [{"t": "p", "h": "Nate describes clash (old and new policies side by side, <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=247s\" target=\"_blank\" rel=\"noopener\">4:07<\/a>) but gives no fix in these videos (none of the 14 added on 2026-10-07 gives one either, so this stays inference). Our rule: when a fact changes, update or retire the old copy rather than adding a second one; history goes in a log, not beside the current state."}, {"t": "check", "h": "<em>Is this fact written anywhere else? Which one wins?<\/em>"}]}, {"n": 4, "title": "Always-loaded is for expertise only", "conf": "stated", "concepts": [2], "body": [{"t": "p", "h": "Load who you are, goals and policies every run. Fetch one-off, situational data just in time."}, {"t": "q", "h": "\"the situational context is things that you need just in time.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=338s\" target=\"_blank\" rel=\"noopener\">5:38<\/a>"}, {"t": "q", "h": "Also: \"I said don't read from the wiki unless you actually need it.\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=8423s\" target=\"_blank\" rel=\"noopener\">2:20:23<\/a>; \"cloudmd is the rules. Memory is, you know, learned facts.\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=7490s\" target=\"_blank\" rel=\"noopener\">2:04:50<\/a>"}, {"t": "check", "h": "<em>Is this needed on every run? If not, route to it instead of loading it.<\/em> (Concept 2)"}]}, {"n": 5, "title": "The root file routes; it doesn't store", "conf": "stated, demonstrated", "concepts": [3], "body": [{"t": "p", "h": "Keep CLAUDE.md / AGENTS.md to a short identity plus a table of where things live."}, {"t": "q", "h": "\"I treat this almost purely as a router.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=766s\" target=\"_blank\" rel=\"noopener\">12:46<\/a>"}, {"t": "q", "h": "Also: \"I go into a routing map and that's the majority of my agents.mmd\" <a href=\"https://www.youtube.com/watch?v=yysILVsfLFM&amp;t=367s\" target=\"_blank\" rel=\"noopener\">6:07<\/a>; \"it's an index, not a dump\" <a href=\"https://www.youtube.com/watch?v=LrgfmZkl3nc&amp;t=334s\" target=\"_blank\" rel=\"noopener\">5:34<\/a>"}, {"t": "p", "h": "Shown on screen at <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=797s\" target=\"_blank\" rel=\"noopener\">13:17<\/a>. <em>Supporting:<\/em> <a href=\"https://www.youtube.com/watch?v=DTCyvo6cC54&amp;t=274s\" target=\"_blank\" rel=\"noopener\">4:34<\/a> (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/every-level-of-a-claude-second-brain-explained--DTCyvo6cC54-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "check", "h": "<em>Could this paragraph be a file plus one routing line?<\/em> (Concept 3)"}]}, {"n": 6, "title": "Judge the layout by whether things can be found, not by copying someone", "conf": "stated", "concepts": [4], "body": [{"t": "p", "h": "Any structure is fine if you can find things by hand without search; the only failure is ignoring repeated wrong answers."}, {"t": "q", "h": "\"see if you could find it without searching, without asking Claude\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1100s\" target=\"_blank\" rel=\"noopener\">18:20<\/a>"}, {"t": "check", "h": "<em>Could Charlie guess this file's path without searching?<\/em> (Concept 4)"}]}, {"n": 7, "title": "Audit read-only, then wait for approval", "conf": "demonstrated", "concepts": [7], "body": [{"t": "p", "h": "The audit reports findings and fixes into a dated file and changes nothing until you say yes. For big projects, one sub-agent per check."}, {"t": "q", "h": "\"It won't actually do anything yet.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=64s\" target=\"_blank\" rel=\"noopener\">1:04<\/a>"}, {"t": "q", "h": "Also: \"Maybe every single Friday, you run an audit\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=8910s\" target=\"_blank\" rel=\"noopener\">2:28:30<\/a>"}, {"t": "p", "h": "Fix list \"await approval\" at <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=523s\" target=\"_blank\" rel=\"noopener\">8:43<\/a>; fan-out at <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=614s\" target=\"_blank\" rel=\"noopener\">10:14<\/a>."}, {"t": "check", "h": "<em>Does this audit only report? Who approves the fixes?<\/em> (Concept 7)"}]}, {"n": 8, "title": "Treat every index and route as a claim to check against the disk", "conf": "stated, demonstrated", "concepts": [7, 8], "body": [{"t": "p", "h": "Check that routes point to things that exist, that nothing is misrouted, that index counts match reality, and that feeds are fresh."}, {"t": "q", "h": "\"Indexes and wiks are claims about what exists and what's current. The audit checks every claim against reality.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=583s\" target=\"_blank\" rel=\"noopener\">9:43<\/a>"}, {"t": "p", "h": "Demo: 55 folders in the index vs 79 on disk, <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=492s\" target=\"_blank\" rel=\"noopener\">8:12<\/a>; freshness grades, <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=675s\" target=\"_blank\" rel=\"noopener\">11:15<\/a>."}, {"t": "check", "h": "<em>Which claims in this index could a script check? Which feeds have a last-updated date?<\/em> (Concepts 7, 8)"}]}, {"n": 9, "title": "Segment knowledge that is distinct and growing", "conf": "stated, demonstrated", "concepts": [5], "body": [{"t": "p", "h": "Split it into its own wiki or folder so the agent searches less.
