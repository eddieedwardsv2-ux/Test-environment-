stead of an agent? Who will rely on it, and what could not be undone if it went wrong?<\/em> (Concepts 42, 43, 20)"}], "concepts": [20, 42, 43], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 7}, {"id": "r43", "kind": "rule", "g": "nate", "t": "Measure before you switch: same prompt, your own work, isolated, cost counted, known-right answers", "n": 43, "conf": "stated, demonstrated", "body": [{"t": "p", "h": "Before changing a model, effort level or prompt for real work, run the same task both ways in separate folders on your own examples and compare quality, time and cost. One result is not proof. For anything automated, keep a small golden set of known-right answers and re-run it after every change."}, {"t": "q", "h": "\"you got to get in there and you got to test it on your own skills and your own prompts and your own processes.\" <a href=\"https://www.youtube.com/watch?v=7eo-11K2e3c&amp;t=1517s\" target=\"_blank\" rel=\"noopener\">25:17<\/a>"}, {"t": "q", "h": "Also: \"I put them in different work trees so they literally can't touch.\" <a href=\"https://www.youtube.com/watch?v=GmLcJVzkxPA&amp;t=62s\" target=\"_blank\" rel=\"noopener\">1:02<\/a>; \"What you're really going to want to do is run evals, meaning you're going to have a golden data set of 100 use cases and 100 correct answers\" <a href=\"https://www.youtube.com/watch?v=ymgH8jS6Wb8&amp;t=763s\" target=\"_blank\" rel=\"noopener\">12:43<\/a>"}, {"t": "check", "h": "<em>Was the change tried on Charlie's real tasks, in isolation, with cost counted and a known-right answer to compare with?<\/em> (Concepts 40, 41)"}], "concepts": [40, 41], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 6}, {"id": "r44", "kind": "rule", "g": "nate", "t": "Prove it in a fixed shape: say what the check won't catch, then VERIFIED / NOT VERIFIED", "n": 44, "conf": "stated", "body": [{"t": "p", "h": "Before building, name the strongest check you actually have and what it would not catch. After building, run it and report two lines: VERIFIED (what was run and what it returned) and NOT VERIFIED (what couldn't be checked, and why). Reading your own code is not a check. On a real task the order is interview, spec (naming files and the decisions Charlie would question), verify, then a skill on the second solve; automate only once that skill is trusted, writing to one place and logging every run."}, {"t": "q", "h": "\"Why the format is mandatory: without a required shape, \"it should work\" slides right in. NOT VERIFIED forces honesty.\" <a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/six-phrases-instagram-source.md\" target=\"_blank\" rel=\"noopener\">six phrases, 4<\/a>"}, {"t": "q", "h": "Also: \"The verifier is \"I reviewed the code.\" That's not a verifier.\" <a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/six-phrases-instagram-source.md\" target=\"_blank\" rel=\"noopener\">six phrases, what breaks<\/a>; \"Let it read broadly and write to exactly one place.\" <a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/six-phrases-instagram-source.md\" target=\"_blank\" rel=\"noopener\">six phrases, 6<\/a>"}, {"t": "check", "h": "<em>Did the report show what was run and what it returned, and say plainly what wasn't checked? Did the plan name files and the calls Charlie might disagree with?<\/em> (Concepts 44, 31)"}], "concepts": [31, 44], "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "d": 3}], "edges": [["c1", "r1", "feeds"], ["c1", "r2", "feeds"], ["c1", "r3", "feeds"], ["c1", "research/nate-herk/steal-my-exact-ai-os-setup-5-simple-tips--Ek1NBfnnTH0-transcript.md", "cites"], ["c10", "r12", "feeds"], ["c10", "research/nate-herk/fable-5-karpathy-s-llm-wiki-is-basically-cheating--hQvwM   selected = id; const n = byId[id], sh = document.getElementById("sheet");
  sh.innerHTML = headHTML(n,true) + `<div class="sh-body">${bodyHTML(n)}${connsHTML(n)}</div>` + markHTML(n);
  sh.hidden = false; draw();
}

/* ---------------- review ---------------- */
let rvSet = "nate", rvTodo = true, rvIdx = 0;
function queue(){
  let q = rvSet==="nate" ? N.filter(n=>n.g==="nate") : rvSet==="loose" ? N.filter(n=>n.d<=1) : N.filter(n=>n.kind==="file" && n.g!=="transcripts" && n.g!=="templates");
  q.sort((a,b)=> (a.kind===b.kind ? (a.n||0)-(b.n||0) : a.kind==="concept"?-1:1) || a.id.localeCompare(b.id));
  if(rvSet==="nate"){ // concept, then the rules it feeds
    const out=[], seen=new Set();
    N.filter(n=>n.kind==="concept").sort((a,b)=>a.n-b.n).forEach(c=>{ out.push(c); seen.add(c.id); c.rules.forEach(r=>{ if(!seen.has("r"+r)){ out.push(byId["r"+r]); seen.add("r"+r);} }); });
    N.filter(n=>n.kind==="rule"&&!seen.has(n.id)).forEach(r=>out.push(r));
    q = out;
  }
  return q;
}
function renderReview(){
  const all = queue(), todo = all.filter(n=>!(flags[docId(n.id)]||{}).kind);
  const q = rvTodo ? todo : all;
  if(rvIdx >= q.length) rvIdx = Math.max(0,q.length-1);
  const cnt = k => all.filter(n=>(flags[docId(n.id)]||{}).kind===k).length;
  const done = all.length - todo.length, pct = x => (x/all.length*100)+"%";
  const n = q[rvIdx];
  document.getElementById("rv").innerHTML = `
    <div class="rv-top">
      <button class="pill" data-set="nate" aria-pressed="${rvSet==="nate"}">Nate's brain · ${N.filter(n=>n.g==="nate").length}</button>
      <button class="pill" data-set="ours" aria-pressed="${rvSet==="ours"}">Our OS files · ${N.filter(n=>n.kind==="file"&&n.g!=="transcripts"&&n.g!=="templates").length}</button>
      <button class="pill" data-set="loose" aria-pressed="${rvSet==="loose"}">Loose ends · ${loose}</button>
      <button class="pill" id="todo" aria-pressed="${rvTodo}">Unreviewed only</button>
    </div>
    <div class="prog"><span>${done} / ${all.length}</span><div class="bar"><span style="width:${pct(cnt("keep"))};background:var(--keep)"></span><span style="width:${pct(cnt("confusing"))};background:var(--confuse)"></span><span style="width:${pct(cnt("delete"))};background:var(--del)"></span></div><span>${cnt("confusing")} ? · ${cnt("delete")} ✕</span></div>
    ${n ? `<article class="card">${headHTML(n,false)}<div class="sh-body">${bodyHTML(n)}${connsHTML(n)}</div>${markHTML(n)}</article>
      <div class="nav"><button id="prev" ${rvIdx?"":"disabled"}>← Back</button><button id="onmap">Show on map</button><button id="next" ${rvIdx<q.length-1?"":"disabled"}>Skip →</button></div>`
      : `<div class="done"><b>All reviewed.</b>Every card in this set has a mark. Tell Claude "read my marks".</div>`}`;
}

/* ---------------- saving ---------------- */
const timers = {};
async function save(id, st){
  const did = docId(id), f = flags[did]||{}, n = byId[id];
  if(!db){ try{ localStorage.setItem("brain-flags", JSON.stringify(flags)); }catch(e){} if(st) st.textContent="Saved in this browser only"; return; }
  try{
    if(!f.kind && !f.note) await db.collection("flags").doc(did).delete();
    else await db.collection("flags").doc(did).set({item:id, kind:f.kind||null, note:f.note||"", title:n.t, updatedAt:new Date().toISOString()});
    if(st) st.textContent="Saved";
  }catch(e){ if(st) st.textContent = e && e.code==="not_granted" ? "Couldn't save: you can only view this page." : "Couldn't save. Try again in a moment."; }
}

/* ---------------- events ---------------- */
function showTab(t){
  document.getElementById("t-map").setAttribute("aria-selected", t==="map");
  document.getElementById("t-rev").setAttribute("aria-selected", t==="rev");
  document.getElementById("map").hidden = t!=="map";
  document.getElementById("review").hidden = t!=="rev";
  if(t==="rev") renderReview(); else { size(); }
}
document.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.id==="t-map") return showTab("map");
  if(b.id==="t-rev") return showTab("rev");
  if(b.id==="close"){ selected=null; document.getElementById("sheet").hidden=true; draw(); return; }
  if(b.id==="lg-t"){ document.getElementById("legend").classList.toggle("min"); renderLegend(); return; }
  if(b.id==="routes"){ routesOnly=!routesOnly; layoutRoutes(); renderLegend(); draw(); return; }
  if(b.id==="loose"){ looseOnly=!looseOnly; renderLegend(); draw(); return; }
  if(b.id==="reset"){ GROUPS.forEach(([g])=>shown[g]=true); looseOnly=false; routesOnly=false; layoutRoutes(); selected=null; document.getElementById("sheet").hidden=true; renderLegend(); fit(); return; }
  if(b.dataset.g){ shown[b.dataset.g]=!shown[b.dataset.g]; renderLegend(); draw(); return; }
  if(b.dataset.go){
    if(!document.getElementById("review").hidden){ showTab("map"); }
    const n = byId[b.dataset.go]; shown[n.g]=true; looseOnly=false; renderLegend(); select(n.id);
    const k = Math.max(transform.k,1.6); d3.select(cv).transition().duration(450).call(zoom.transform, d3.zoomIdentity.translate(W/2-k*n.x, H*0.35-k*n.y).scale(k));
    return;
  }
  if(b.dataset.set){ rvSet=b.dataset.set; rvIdx=0; renderReview(); return; }
  if(b.id==="todo"){ rvTodo=!rvTodo; rvIdx=0; renderReview(); return; }
  if(b.id==="prev"){ rvIdx--; renderReview(); return; }
  if(b.id==="next"){ rvIdx++; renderReview(); return; }
  if(b.id==="onmap"){ const id = document.querySelector("#rv [data-mark]")?.dataset.mark; if(id){ b.dataset.go=id; b.click(); } return; }
  const m = b.closest("[data-mark]");
  if(m && b.dataset.k){
    const id = m.dataset.mark, did = docId(id), f = flags[did] || (flags[did]={});
    f.kind = f.kind===b.dataset.k ? null : b.dataset.k;
    const inReview = !document.getElementById("review").hidden;
    if(inReview){ if(!rvTodo && f.kind) rvIdx++; renderReview(); } else { select(id); }
    renderNums(); draw();
    save(id, document.querySelector("#"+(inReview?"rv":"sheet")+" .st"));
  }
});
document.addEventListener("input", e=>{
  if(e.target.id==="q"){ query=e.target.value.trim().toLowerCase(); draw(); return; }
  if(e.target.id && e.target.id.startsWith("note-")){
    const m = e.target.closest("[data-mark]"), id = m.dataset.mark, did = docId(id), f = flags[did] || (flags[did]={});
    f.note = e.target.value; const st = m.querySelector(".st"); st.textContent="Typing…";
    clearTimeout(timers[did]); timers[did] = setTimeout(()=>save(id, st), 900);
  }
});
document.getElementById("q").addEventListener("keydown", e=>{
  if(e.key==="Enter"){ const m = N.filter(n=>visible(n)&&hit(n)).sort((a,b)=>b.d-a.d)[0]; if(m){ const t=document.createElement("button"); t.dataset.go=m.id; document.body.appendChild(t); t.click(); t.remove(); } }
});
window.addEventListener("resize", size);

/* ---------------- start ---------------- */
renderNums(); renderLegend(); size();
for(let i=0;i<220;i++) sim.tick();
fit(); sim.alpha(0.05).restart();
try{ const s=localStorage.getItem("brain-flags"); if(s){ flags=JSON.parse(s)||{}; renderNums(); draw(); } }catch(e){}
(async()=>{
  try{ db = await window.claude?.use?.("db"); }catch(e){ db=null; }
  if(!db) return;
  db.collection("flags").onSnapshot(snap=>{
    const next = {};
    snap.docs.forEach(d=>{ const v=d.data(); if(v) next[d.id]={kind:v.kind||null, note:v.note||""}; });
    const a = document.activeElement;
    if(a && a.id && a.id.startsWith("note-")){ const did=a.id.slice(5); if(flags[did]) next[did]=flags[did]; }
    flags = next; renderNums(); draw();
    if(!(a && a.id && a.id.startsWith("note-"))){
      if(!document.getElementById("review").hidden) renderReview();
      else if(selected) select(selected);
    }
  });
})();
</script>
