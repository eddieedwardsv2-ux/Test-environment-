<title>Architect (Nate)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-screen star map (Map tab) with a stats corner, a sources legend and a slide-up note sheet;
   Review tab is one card at a time with big thumb buttons. Deliberately dark-only, like a night-sky map. */
:root{
  --bg:#070a12; --panel:#0e1320; --panel2:#151b2b; --line:#232b3e; --fg:#e8ecf5; --muted:#8c97ad; --accent:#8fb3ff;
  --core:#7aa2ff; --nate:#ff7ab6; --transcripts:#f5a524; --creators:#b18cff; --research:#c9b6ff;
  --skills:#3ddc97; --audits:#ff7a7a; --projects:#5ce1e6; --learning:#ffd166; --templates:#7d879b;
  --confuse:#f5b84a; --del:#ff6b74; --keep:#4fd99a;
  --f-ui:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-ui);margin:0;overflow:hidden}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code{font:12.5px var(--f-mono);background:var(--panel2);padding:1px 5px;border-radius:4px}

.app{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--bg);position:relative;z-index:4}
.brand{font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand i{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.tabs{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;padding:5px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
#q{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:7px 11px;font:inherit;font-size:14px}
.main{flex:1;position:relative;min-height:0}

/* map */
#map{position:absolute;inset:0}
#cv{width:100%;height:100%;display:block;touch-action:none}
.hero{position:absolute;left:16px;top:14px;pointer-events:none;max-width:60%}
.hero .eye{font:500 10.5px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hero h1{font-size:clamp(22px,4.4vw,38px);line-height:1.02;margin:6px 0 8px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.hero h1 span{color:var(--muted)}
.nums{display:flex;gap:18px;font:500 18px var(--f-mono)}
.nums small{display:block;font:10px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.legend{position:absolute;left:16px;bottom:16px;background:rgba(14,19,32,.86);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:200px;max-width:calc(100% - 32px)}
.legend h3{margin:0 0 6px;font:500 10.5px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
.legend h3 button{border:0;background:none;color:var(--muted);font:inherit;padding:0}
.src{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:3px 0;font-size:13px;text-align:left}
.src i{width:8px;height:8px;border-radius:50%;flex:none}
.src b{margin-left:auto;font:400 12px var(--f-mono);color:var(--muted)}
.src[aria-pressed="false"]{opacity:.35}
.legend .row2{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:4px 10px;font-size:12px}
.pill[aria-pressed="true"]{border-color:var(--confuse);color:var(--confuse)}
.legend.min .list,.legend.min .row2{display:none}

/* note sheet */
.sheet{position:absolute;right:16px;top:14px;bottom:16px;width:min(400px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5);z-index:3}
.sheet[hidden]{display:none}
.sh-head{padding:14px 14px 10px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.sh-head .t{flex:1;min-width:0}
.tag{display:inline-flex;align-items:center;gap:6px;font:500 11px var(--f-mono);letter-spacing:.05em;color:var(--muted);text-transform:uppercase}
.tag i{width:8px;height:8px;border-radius:50%}
.sh-head h2{margin:4px 0 0;font-size:18px;line-height:1.25;text-wrap:balance;overflow-wrap:anywhere}
.x{border:1px solid var(--line);background:var(--panel2);border-radius:8px;width:32px;height:32px;flex:none}
.sh-body{padding:12px 14px;overflow:auto;display:flex;flex-direction:column;gap:10px;min-height:0}
.sh-body p{margin:0;overflow-wrap:anywhere}
.sh-body blockquote{margin:0;padding:6px 10px;border-left:3px solid var(--nate);background:var(--panel2);border-radius:0 6px 6px 0;font-size:14px;overflow-wrap:anywhere}
.check{background:var(--panel2);border-radius:8px;padding:8px 10px;font-size:14px}
.check b{display:block;font:500 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted);font-size:13px}
.conns h4{margin:4px 0 6px;font:500 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.conns ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.conns button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:5px 6px;border-radius:6px;font-size:13.5px}
.conns button:hover{background:var(--panel2)}
.conns button i{width:7px;height:7px;border-radius:50%;flex:none}
.conns button span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conns button em{margin-left:auto;font:normal 11px var(--f-mono);color:var(--muted)}

.mark{border-top:1px solid var(--line);padding:10px 14px 14px;display:flex;flex-direction:column;gap:8px;background:var(--panel)}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btns button{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:9px 6px;font-weight:700;font-size:14px}
.btns button[data-k="confusing"][aria-pressed="true"]{background:var(--confuse);border-color:var(--confuse);color:#1a1200}
.btns button[data-k="delete"][aria-pressed="true"]{background:var(--del);border-color:var(--del);color:#1f0306}
.btns button[data-k="keep"][aria-pressed="true"]{background:var(--keep);border-color:var(--keep);color:#02160c}
.mark textarea{width:100%;min-height:52px;resize:vertical;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:14px}
.st{font-size:12px;color:var(--muted);min-height:16px}

/* review */
#review{position:absolute;inset:0;overflow:auto;display:flex;justify-content:center}
#review[hidden]{display:none}
.rv{width:100%;max-width:640px;padding:16px 16px 24px;display:flex;flex-direction:column;gap:12px;min-height:100%}
.rv-top{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rv-top .pill[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.prog{display:flex;align-items:center;gap:10px;font:500 13px var(--f-mono);color:var(--muted)}
.prog .bar{flex:1;height:5px;background:var(--panel2);border-radius:3px;overflow:hidden;display:flex}
.prog .bar span{height:100%}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;flex:1;min-height:340px;overflow:hidden}
.card .sh-body{flex:1}
.nav{display:flex;gap:8px}
.nav button{flex:1;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:9px;font-weight:600}
.done{padding:40px 18px;text-align:center;color:var(--muted)}
.done b{display:block;color:var(--fg);font-size:20px;margin-bottom:6px}
.legend .list{max-height:40vh;overflow:auto}

@media (max-width:700px){
  .top{flex-wrap:wrap}
  #q{order:3;flex-basis:100%}
  .hero{max-width:calc(100% - 32px)}
  .hero h1{font-size:24px}
  .nums{font-size:15px;gap:14px}
  .sheet{left:8px;right:8px;width:auto;top:auto;bottom:8px;max-height:72%}
  .legend{bottom:12px;left:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><i></i>Architect (Nate)</div>
    <div class="tabs" role="tablist">
      <button id="t-map" role="tab" aria-selected="true">Map</button>
      <button id="t-rev" role="tab" aria-selected="false">Review</button>
    </div>
    <input id="q" type="search" placeholder="Search notes, skills, concepts, videos…" aria-label="Search">
  </header>
  <div class="main">
    <section id="map">
      <canvas id="cv" aria-label="Map of Nate's ideas, rules and the videos they come from"></canvas>
      <div class="hero">
        <div class="eye">● A living knowledge system</div>
        <h1>Nate's method.<br><span>Every source.</span></h1>
        <div class="nums" id="nums"></div>
      </div>
      <div class="legend" id="legend"></div>
      <aside class="sheet" id="sheet" hidden></aside>
    </section>
    <section id="review" hidden><div class="rv" id="rv"></div></section>
  </div>
</div>

gents/architect.md"}, {"id": "research/nate-herk/brain/index.md", "kind": "file", "g": "creators", "t": "Nate's brain: index", "ex": "The knowledge base behind the architect advisor (.claude/agents/architect.md): a source-grounded guide to AI-OS architecture (routing, context, second-brain organisation, audits, ingestion, verification). Built from Nate Herk's public videos only. It summarises his methods with sources; it is not Nate. This page is the current state. What changed and when is in log.md. File What's in it ------ rules.md 44 operating r…", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/index.md", "cr": "Nate Herk", "d": 14, "hop": 2, "via": ".claude/agents/quartermaster.md"}, {"id": "research/nate-herk/brain/log.md", "kind": "file", "g": "creators", "t": "Nate's brain: log", "ex": "This is history. It records what was added and when; it may be out of date about what the brain holds now. The current state is in index.md. Newest first. Ingested: 21:23-25:27 of \"I asked Claude Code to make me as much money as possible\": parallel helpers on independent pieces, a written finish line, /goal with a separate judge. Charlie pasted the passage and asked if we had it. Why it was missed: the video was mine…", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/log.md", "cr": "Nate Herk", "d": 10, "hop": 3, "via": "research/nate-herk/brain/index.md", "hist": true}, {"id": "research/nate-herk/brain/overlap-review.md", "kind": "file", "g": "creators", "t": "ENATE overlap review (2026-10-09)", "ex": "Read-only review of the 43 concepts and 43 rules, after the smallest-context work (concept 39, Rule 41). Charlie chose \"only fix the clashes\" on the Decision Desk (2026-10-09): Rule 19 and concept 18 are now marked as replaced by Rule 41 and concept 39. The rest of the merge was not done. Each concept (an idea, with quotes) has a matching rule (what to do, with the same quotes). Rules 31-40 repeat concepts 29-38 word…", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/overlap-review.md", "cr": "Nate Herk", "d": 2, "hop": 3, "via": "research/nate-herk/brain/index.md"}, {"id": "research/nate-herk/brain/rules.md", "kind": "file", "g": "creators", "t": "Nate's rules: AI OS architecture", "ex": "What this is: operating rules for building and running an AI OS or expert brain, distilled from Nate Herk transcripts (two primary, the rest supporting) so the architect advisor can check a plan against them. They are rules about systems, not an imitation of Nate. Sources: primary AI OS = Ek1NBfnnTH0 ([transcript][os]); Karpathy = bvGptCLDhyo ([transcript][kb]). Supporting: DTCyvo6cC54, 8QQINxAhRs, hQvwMj7IJe4, XNQBC…", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md", "cr": "Nate Herk", "d": 54, "hop": 2, "via": "exports/chatgpt-instructions.md"}, {"id": "c1", "kind": "concept", "g": "nate", "t": "Four context failure modes: poisoning, bloat, confusion, clash", "n": 1, "sec": "A", "secTitle": "Why an AI OS gives wrong answers", "body": [{"t": "p", "h": "When an agent is wrong because of its context, it is one of four things. <em>Poisoning<\/em>: a false fact sits in the context and the agent repeats it confidently. <em>Bloat<\/em>: so much is loaded that the agent can't pick out what's relevant (needle in a haystack). <em>Confusion<\/em>: something is irrelevant or missing, so the agent fills the gap itself (classic hallucination). <em>Clash<\/em>: old and new sources, or two sources, disagree, so the agent can't tell which to trust. Poisoning is the easiest to fix (verify: web search, cross-check a live source, or a human in the loop); bloat is harder and is handled by the expertise/situational split (concept 2)."}, {"t": "q", "h": "\"the four failure modes, poisoning, bloat, confusion, and clash.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=94s\" target=\"_blank\" rel=\"noopener\">1:34<\/a>"}, {"t": "q", "h": "\"Poisoning means you have a false fact somewhere in the context.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=125s\" target=\"_blank\" rel=\"noopener\">2:05<\/a>"}, {"t": "q", "h": "\"In March your policy was always refund. In June your policy is now to never refund.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=247s\" target=\"_blank\" rel=\"noopener\">4:07<\/a>"}, {"t": "p", "h": "Also: verification fix <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=156s\" target=\"_blank\" rel=\"noopener\">2:36<\/a>; bloat <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=186s\" target=\"_blank\" rel=\"noopener\">3:06<\/a>; confusion <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=216s\" target=\"_blank\" rel=\"noopener\">3:36<\/a>. Source: AI OS (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/steal-my-exact-ai-os-setup-5-simple-tips--Ek1NBfnnTH0-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "p", "h": "Nate gives no specific fix for clash or confusion in this video. <strong>(inference)<\/strong> Clash is fixed by keeping one current source per fact and marking or retiring old ones; confusion by making sure the missing thing has a route."}], "rules": [1, 2, 3], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 5}, {"id": "c2", "kind": "concept", "g": "nate", "t": "Expertise context vs situational context", "n": 2, "sec": "A", "secTitle": "Why an AI OS gives wrong answers", "body": [{"t": "p", "h": "Expertise context is what the agent needs on every run (who you are, goals, what the business does, policies): the rulebook, like a system prompt. Situational context is pulled in just in time for one task (a support ticket from yesterday). His analogy: the principal knows how classrooms run; the teacher knows each student. Keeping situational data always loaded adds bloat, confusion and even clash. In his \"four C's\" framework he maps <em>context<\/em> to expertise and <em>connections<\/em> to situational."}, {"t": "q", "h": "\"I think of context as expertise and I think of connections as situational.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=277s\" target=\"_blank\" rel=\"noopener\">4:37<\/a>"}, {"t": "q", "h": "\"expertise context is the rulebook\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=338s\" target=\"_blank\" rel=\"noopener\">5:38<\/a>"}, {"t": "q", "h": "\"go use that live lookup, pull the data in because you need it\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=368s\" target=\"_blank\" rel=\"noopener\">6:08<\/a>"}, {"t": "p", "h": "Source: AI OS (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/steal-my-exact-ai-os-setup-5-simple-tips--Ek1NBfnnTH0-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "p", "h": "Also: <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=8423s\" target=\"_blank\" rel=\"noopener\">bCl 2:20:23<\/a> \"I said don't read from the wiki unless you actually need it.\"; second brain = the first two C's, <a href=\"https://www.youtube.com/watch?v=yysILVsfLFM&amp;t=124s\" target=\"_blank\" rel=\"noopener\">yys 2:04<\/a>."}], "rules": [4], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 5}, {"id": "c3", "kind": "concept", "g": "nate", "t": "The root file is a router, not a warehouse", "n": 3, "sec": "B", "secTitle": "Organising the OS", "body": [{"t": "p", "h": "His main CLAUDE.md says who the agent is in a line or two and is otherwise a routing table: if you need X, go here (wiki path, hot cache, index, memory, tools, skills and agents, decisions, templates, projects). Sub-folders can have their own CLAUDE.md for project-level instructions. Because it is all plain files and folders, other agents (Codex, Hermes) can use the same setup."}, {"t": "q", "h": "\"I treat this almost purely as a router.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=766s\" target=\"_blank\" rel=\"noopener\">12:46<\/a>"}, {"t": "q", "h": "\"my cloudmd is essentially just a master routing file, just a master table of context.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=827s\" target=\"_blank\" rel=\"noopener\">13:47<\/a>"}, {"t": "q", "h": "\"a bunch of files and folders, which means you can plug in Hermes, you can plug in codecs\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=919s\" target=\"_blank\" rel=\"noopener\">15:19<\/a>"}, {"t": "p", "h": "Also: he shows the routing table at <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=797s\" target=\"_blank\" rel=\"noopener\">13:17<\/a>. Source: AI OS (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/steal-my-exact-ai-os-setup-5-simple-tips--Ek1NBfnnTH0-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "p", "h": "<em>Supporting:<\/em> the same idea in <a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/every-level-of-a-claude-second-brain-explained--DTCyvo6cC54-transcript.md\" target=\"_blank\" rel=\"noopener\">Every Level of a Claude Second Brain<\/a>, \"the claw.md is kind of treated as a router\" <a href=\"https://www.youtube.com/watch?v=DTCyvo6cC54&amp;t=274s\" target=\"_blank\" rel=\"noopener\">4:34<\/a>, and in <a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/i-turned-claude-into-the-ultimate-second-brain--8QQ_INxAhRs-transcript.md\" target=\"_blank\" rel=\"noopener\">I Turned Claude Into the Ultimate Second Brain<\/a>, \"I think of my Claude and MD file as my router\" <a href=\"https://www.youtube.com/watch?v=8QQ_INxAhRs&amp;t=309s\" target=\"_blank\" rel=\"noopener\">5:09<\/a>."}, {"t": "p", "h": "Also: \"I go into a routing map and that's the majority of my agents.mmd\" <a href=\"https://www.youtube.com/watch?v=yysILVsfLFM&amp;t=367s\" target=\"_blank\" rel=\"noopener\">yys 6:07<\/a>; new skills get registered in it <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=5408s\" target=\"_blank\" rel=\"noopener\">bCl 1:30:08<\/a>; \"cloudmd is the rules. Memory is, you know, learned facts.\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=7490s\" target=\"_blank\" rel=\"noopener\">jdb 2:04:50<\/a>. Length: concept 39 (concept 18's 200 lines is only the ceiling)."}], "rules": [5, 20], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 9}, {"id": "c4", "kind": "concept", "g": "nate", "t": "No single right layout; the test is whether you (and the agent) can find things", "n": 4, "sec": "B", "secTitle": "Organising the OS", "body": [{"t": "p", "h": "Flat or deeply nested doesn't matter. What matters is routing rules good enough that you and the agent can find things. His check: think of something you made and find it in the file explorer without searching or asking Claude. If you can, an agent with routing rules probably can too. The only wrong setup is one that keeps giving wrong answers while you do nothing."}, {"t": "q", "h": "\"routing rules in place so that you and your agents can find it.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1009s\" target=\"_blank\" rel=\"noopener\">16:49<\/a>"}, {"t": "q", "h": "\"see if you could find it without searching, without asking Claude\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1100s\" target=\"_blank\" rel=\"noopener\">18:20<\/a>"}, {"t": "q", "h": "\"the only way that you're doing this wrong is if you're constantly getting wrong answers and you're not doing anything about it.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1100s\" target=\"_blank\" rel=\"noopener\">18:20<\/a>"}, {"t": "p", "h": "Source: AI OS (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/steal-my-exact-ai-os-setup-5-simple-tips--Ek1NBfnnTH0-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "p", "h": "<em>Supporting:<\/em> \"can your agent find it again, and could you find it again\" <a href=\"https://www.youtube.com/watch?v=DTCyvo6cC54&amp;t=122s\" target=\"_blank\" rel=\"noopener\">2:02<\/a> (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/every-level-of-a-claude-second-brain-explained--DTCyvo6cC54-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}], "rules": [6], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 4}, {"id": "c5", "kind": "concept", "g": "nate", "t": "Segment knowledge that is distinct and growing", "n": 5, "sec": "B", "secTitle": "Organising the OS", "body": [{"t": "p", "h": "When separate bodies of knowledge keep growing (his YouTube transcripts and his meeting transcripts), split them into their own wikis so the agent knows where to look and searches far fewer files: faster, more accurate and cheaper on tokens. Claude Code itself suggested his split. Clients: keep internal knowledge (dates, price, scope, calls) in the OS, segmented by client; keep client-facing deliverables in a separate repo, while the OS still knows the engagement exists."}, {"t": "q", "h": "\"the more you can segment stuff out, the better.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1221s\" target=\"_blank\" rel=\"noopener\">20:21<\/a>"}, {"t": "q", "h": "\"how can you narrow the actual context that your agent is going to be looking through?\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1251s\" target=\"_blank\" rel=\"noopener\">20:51<\/a>"}, {"t": "q", "h": "\"it still needs to know about this engagement.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1341s\" target=\"_blank\" rel=\"noopener\">22:21<\/a>"}, {"t": "p", "h": "Also: the split Claude suggested <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1039s\" target=\"_blank\" rel=\"noopener\">17:19<\/a>–<a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1070s\" target=\"_blank\" rel=\"noopener\">17:50<\/a>. Source: AI OS (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/steal-my-exact-ai-os-setup-5-simple-tips--Ek1NBfnnTH0-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}], "rules": [9], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 3}, {"id": "c6", "kind": "concept", "g": "nate", "t": "Cadence: automate data that arrives on a schedule", "n": 6, "sec": "B", "secTitle": "Organising the OS", "body": [{"t": "p", "h": "If you keep asking the agent to pull the same data, it isn't really just-in-time situational context. Data that lands on a fixed rhythm (his Monday Q&amp;A, Tuesday leadership meeting) should be pulled in by a cron or routine, so it is there even if you forget. Natural language plus an API key is usually enough to set it up."}, {"t": "q", "h": "\"Build automations to update data.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1131s\" target=\"_blank\" rel=\"noopener\">18:51<\/a>"}, {"t": "q", "h": "\"this isn't sort of like a just in time sort of situational context thing\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1161s\" target=\"_blank\" rel=\"noopener\">19:21<\/a>"}, {"t": "p", "h": "Also: the audit's \"durability\" suggestion of weekly crons <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=553s\" target=\"_blank\" rel=\"noopener\">9:13<\/a>. Source: AI OS (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/steal-my-exact-ai-os-setup-5-simple-tips--Ek1NBfnnTH0-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "p", "h": "Also: of much-used skills, \"If they're getting used so often, why not just automate them?\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=8910s\" target=\"_blank\" rel=\"noopener\">bCl 2:28:30<\/a>. Cadence is the fourth C and comes last: concept 19."}], "rules": [10], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 4}, {"id": "c7", "kind": "concept", "g": "nate", "t": "The OS audit: indexes are claims, check them against reality", "n": 7, "sec": "C", "secTitle": "Keeping it true", "body": [{"t": "p", "h": "His <code>OS audit<\/code> skill reads the whole project and reports what is weak. It is read-only: it lists findings and fixes, writes a dated report into an <code>audits/<\/code> folder, reads the previous report first, and waits for a yes before fixing anything. Checks include routing integrity (does everything the router points to exist, and is anything misrouted in reverse), index truth (does the index match the disk), freshness, memory, bloat, duplication and organisation. On big projects it fans out one explore sub-agent per check and merges their reports. His demo found the index said 55 folders while the disk had 79, and listed the wrong answers that would cause."}, {"t": "q", "h": "\"It won't actually do anything yet.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=64s\" target=\"_blank\" rel=\"noopener\">1:04<\/a>"}, {"t": "q", "h": "\"Indexes and wiks are claims about what exists and what's current. The audit checks every claim against reality.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=583s\" target=\"_blank\" rel=\"noopener\">9:43<\/a>"}, {"t": "q", "h": "\"Index says 55 folders, but disk has 79.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=492s\" target=\"_blank\" rel=\"noopener\">8:12<\/a>"}, {"t": "p", "h": "Also: fix list marked await approval <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=523s\" target=\"_blank\" rel=\"noopener\">8:43<\/a>; checks <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=614s\" target=\"_blank\" rel=\"noopener\">10:14<\/a>–<a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=706s\" target=\"_blank\" rel=\"noopener\">11:46<\/a>. Before the skill, he did the same thing by asking weekly or monthly in plain chat: \"have AI audit itself.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1009s\" target=\"_blank\" rel=\"noopener\">16:49<\/a>. Source: AI OS (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/steal-my-exact-ai-os-setup-5-simple-tips--Ek1NBfnnTH0-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "p", "h": "Also: reports are saved and the skill should \"look for earlier reports inside of the audit folder\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=614s\" target=\"_blank\" rel=\"noopener\">10:14<\/a>; run it weekly, \"Maybe every single Friday, you run an audit\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=8910s\" target=\"_blank\" rel=\"noopener\">bCl 2:28:30<\/a>."}], "rules": [7, 8, 28], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 6}, {"id": "c8", "kind": "concept", "g": "nate", "t": "Freshness is a separate check from accuracy", "n": 8, "sec": "C", "secTitle": "Keeping it true", "body": [{"t": "p", "h": "Data can be correct but stale. The audit grades each data feed as fresh, drifting, frozen, retired or on demand. His demo's knowledge was current only to 29 June, so any later business question would get a confident but wrong answer."}, {"t": "q", "h": "\"Are all the data feeds current?\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=675s\" target=\"_blank\" rel=\"noopener\">11:15<\/a>"}, {"t": "q", "h": "\"fresh, drifting, frozen, retired, or if they're on demand.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=675s\" target=\"_blank\" rel=\"noopener\">11:15<\/a>"}, {"t": "q", "h": "\"would give me a confident June state answer, which would be wrong.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=523s\" target=\"_blank\" rel=\"noopener\">8:43<\/a>"}, {"t": "p", "h": "Source: AI OS (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/steal-my-exact-ai-os-setup-5-simple-tips--Ek1NBfnnTH0-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}], "rules": [8], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 3}, {"id": "c9", "kind": "concept", "g": "nate", "t": "Backtrack retrieval misses, then fix the route", "n": 9, "sec": "C", "secTitle": "Keeping it true", "body": [{"t": "p", "h": "When the agent searches for ages, or says it has no access to something you know is there, don't just tell it not to let that happen again. Make it retrace what it did and where it looked, explain why it missed, and then update the routing or reorganise files based on what it found."}, {"t": "q", "h": "\"you searched, and help me figure out why you didn't find that data right away.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1402s\" target=\"_blank\" rel=\"noopener\">23:22<\/a>"}, {"t": "q", "h": "\"Have it update the routing. Have it maybe even move stuff or reorganize stuff based on what it found when it was backtracking.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1402s\" target=\"_blank\" rel=\"noopener\">23:22<\/a>"}, {"t": "p", "h": "Also: \"number five is to backtrack\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1371s\" target=\"_blank\" rel=\"noopener\">22:51<\/a>. Source: AI OS (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/steal-my-exact-ai-os-setup-5-simple-tips--Ek1NBfnnTH0-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "p", "h": "<em>Supporting:<\/em> a 5-minute search for a file he knows the location of means the architecture needs updating, <a href=\"https://www.youtube.com/watch?v=8QQ_INxAhRs&amp;t=339s\" target=\"_blank\" rel=\"noopener\">5:39<\/a> (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/i-turned-claude-into-the-ultimate-second-brain--8QQ_INxAhRs-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "p", "h": "Also: \"every time you correct AI, you feed that correction back into the system\" <a href=\"https://www.youtube.com/watch?v=3XIGcM7VICc&amp;t=397s\" target=\"_blank\" rel=\"noopener\">3XI 6:37<\/a>; fix it where it lasts, \"update the skill in the smallest durable place\" <a href=\"https://www.youtube.com/watch?v=HIRDzMtuWFk&amp;t=365s\" target=\"_blank\" rel=\"noopener\">HIR 6:05<\/a>."}], "rules": [11], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 6}, {"id": "c10", "kind": "concept", "g": "nate", "t": "Raw evidence vs derived brain", "n": 10, "sec": "D", "secTitle": "Building an expert brain", "body": [{"t": "p", "h": "Step one gathers everything the expert has said into one raw folder, one sub-folder per source (he used free YouTube caption tools, and a paid X API that cost about a dollar), with one agent per source in parallel and a written record of what was fetched so it can be checked. Raw text alone is too messy to search well, so an LLM compiles it into a wiki (Karpathy's LLM-wiki idea). The raw files are never edited; the wiki is the derived layer on top. Obsidian is only a viewer."}, {"t": "q", "h": "\"I told it to write down what it got, so that you can actually check it.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=214s\" target=\"_blank\" rel=\"noopener\">3:34<\/a>"}, {"t": "q", "h": "\"It's like finding a needle in a haystack.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=214s\" target=\"_blank\" rel=\"noopener\">3:34<\/a>"}, {"t": "q", "h": "\"The raw files don't get touched\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=244s\" target=\"_blank\" rel=\"noopener\">4:04<\/a>"}, {"t": "p", "h": "Also: crawl set-up <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=183s\" target=\"_blank\" rel=\"noopener\">3:03<\/a>; Obsidian as the visual layer <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=274s\" target=\"_blank\" rel=\"noopener\">4:34<\/a>. Source: Karpathy (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/i-built-another-andrej-karpathy-using-claude--bvGptCLDhyo-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "p", "h": "<em>Supporting:<\/em> raw → wiki → index and log, shown step by step in <a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/fable-5-karpathy-s-llm-wiki-is-basically-cheating--hQvwMj7IJe4-transcript.md\" target=\"_blank\" rel=\"noopener\">Karpathy's LLM Wiki Is Basically Cheating<\/a>, <a href=\"https://www.youtube.com/watch?v=hQvwMj7IJe4&amp;t=518s\" target=\"_blank\" rel=\"noopener\">8:38<\/a>."}], "rules": [12], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 4}, {"id": "c11", "kind": "concept", "g": "nate", "t": "The brain's pages: index, log, source pages, concepts and rules", "n": 11, "sec": "D", "secTitle": "Building an expert brain", "body": [{"t": "p", "h": "The wiki keeps an index and a log, has one page per thing the expert wrote or said, and topic pages (principles, rules, methods, how he explains, how he debugs). He also mentions a \"hot page\". <strong>(inference)<\/strong> In this repo that maps to <code>index.md<\/code> (current state, what's covered), <code>log.md<\/code> (history), <code>concepts.md<\/code> (ideas) and <code>rules.md<\/code> (operating rules), with the transcripts as the source pages."}, {"t": "q", "h": "\"keeps an index, keeps a log\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=244s\" target=\"_blank\" rel=\"noopener\">4:04<\/a>"}, {"t": "p", "h": "Also: page types <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=274s\" target=\"_blank\" rel=\"noopener\">4:34<\/a>–<a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=304s\" target=\"_blank\" rel=\"noopener\">5:04<\/a>; index, hot page and log updated on ingest <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=578s\" target=\"_blank\" rel=\"noopener\">9:38<\/a>. Source: Karpathy (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/i-built-another-andrej-karpathy-using-claude--bvGptCLDhyo-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "p", "h": "<em>Supporting:<\/em> the index and log let the AI \"incrementally build and maintain this wiki\" <a href=\"https://www.youtube.com/watch?v=hQvwMj7IJe4&amp;t=578s\" target=\"_blank\" rel=\"noopener\">9:38<\/a> (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/fable-5-karpathy-s-llm-wiki-is-basically-cheating--hQvwMj7IJe4-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "p", "h": "Also: on memory files, \"it's an index, not a dump\" <a href=\"https://www.youtube.com/watch?v=LrgfmZkl3nc&amp;t=334s\" target=\"_blank\" rel=\"noopener\">Lrg 5:34<\/a>."}], "rules": [14], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 5}, {"id": "c12", "kind": "concept", "g": "nate", "t": "Provenance and inference labels", "n": 12, "sec": "D", "secTitle": "Building an expert brain", "body": [{"t": "p", "h": "Rules are what make the agent think like the expert, not just recall him. Each rule must link to an exact quote and where it came from, so you can click through and check it. If there is no source, the agent must say it is inferring."}, {"t": "q", "h": "\"what makes it think like him instead of just knowing what he said in the past.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=334s\" target=\"_blank\" rel=\"noopener\">5:34<\/a>"}, {"t": "q", "h": "\"every rule has to connect with an exact quote from him and where it came from. Because we don't want Claude to just make things up.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=334s\" target=\"_blank\" rel=\"noopener\">5:34<\/a>"}, {"t": "q", "h": "\"if there is no source, the agent has to say explicitly that it's inferring\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=394s\" target=\"_blank\" rel=\"noopener\">6:34<\/a>"}, {"t": "p", "h": "Source: Karpathy (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/i-built-another-andrej-karpathy-using-claude--bvGptCLDhyo-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}], "rules": [13], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 3}, {"id": "c13", "kind": "concept", "g": "nate", "t": "Relational ingestion", "n": 13, "sec": "D", "secTitle": "Building an expert brain", "body": [{"t": "p", "h": "The wiki links pages to each other: every rule links to its sources and every source to the rules it supports, so you query a relationship map, not a pile of notes. Adding one new link via an ingest command writes a source page, updates every page that source touches, and updates the index, hot page and log. In his demo a rule that had one source got a second and was promoted to a real rule. He never edited the wiki by hand."}, {"t": "q", "h": "\"Every rule links back to the source that it came from\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=304s\" target=\"_blank\" rel=\"noopener\">5:04<\/a>"}, {"t": "q", "h": "\"it will update every page that post touches.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=578s\" target=\"_blank\" rel=\"noopener\">9:38<\/a>"}, {"t": "q", "h": "\"a rule that was sitting on the bench with one source behind it got its second source and became a real rule.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=578s\" target=\"_blank\" rel=\"noopener\">9:38<\/a>"}, {"t": "p", "h": "Also: relationships make querying work <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=244s\" target=\"_blank\" rel=\"noopener\">4:04<\/a>. Source: Karpathy (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/i-built-another-andrej-karpathy-using-claude--bvGptCLDhyo-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}], "rules": [14], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 3}, {"id": "c14", "kind": "concept", "g": "nate", "t": "Specialist agents and skills", "n": 14, "sec": "E", "secTitle": "Turning knowledge into behaviour", "body": [{"t": "p", "h": "The rules become two files. A sub-agent holds the rules, how it talks and the loop it runs on every task; being a separate Claude with its own context, it doesn't drag your whole conversation along. A skill (a slash command) is the entry point: it sends your question to the agent and grades the answer against a checklist, one line per rule. The same knowledge can then feed your other skills, agents and workflows."}, {"t": "q", "h": "\"it doesn't drag your whole conversation along with it.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=394s\" target=\"_blank\" rel=\"noopener\">6:34<\/a>"}, {"t": "q", "h": "\"grades the answer against a checklist, one line per rule\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=425s\" target=\"_blank\" rel=\"noopener\">7:05<\/a>"}, {"t": "q", "h": "\"I can wire that knowledge into my own skills and my own agents and my own workflows\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=122s\" target=\"_blank\" rel=\"noopener\">2:02<\/a>"}, {"t": "p", "h": "Source: Karpathy (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/i-built-another-andrej-karpathy-using-claude--bvGptCLDhyo-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "p", "h": "<em>Supporting, a challenge:<\/em> in <a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/i-deleted-all-my-claude-skills-and-claude-got-smarter--XNQBCRcwXV4-transcript.md\" target=\"_blank\" rel=\"noopener\">I Deleted All My Claude Skills<\/a> he warns over-specific skills can hold newer models back and suggests \"making versions of them that aren't as specific\" <a href=\"https://www.youtube.com/watch?v=XNQBCRcwXV4&amp;t=341s\" target=\"_blank\" rel=\"noopener\">5:41<\/a>. <strong>(inference)<\/strong> Make skills for repeatable procedures, but keep them short."}, {"t": "p", "h": "Also: skill anatomy and triggering, concept 21; sub-agents in depth, concept 23."}], "rules": [15], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 4}, {"id": "c15", "kind": "concept", "g": "nate", "t": "Run gates: enforce verification, don't just ask for it", "n": 15, "sec": "E", "secTitle": "Turning knowledge into behaviour", "body": [{"t": "p", "h": "A hook runs when the agent tries to finish its turn. If it wrote code it never ran, the hook blocks the answer and sends it back. Verification becomes a step the agent can't skip."}, {"t": "q", "h": "\"a little script that runs right when the agent tries to finish its turn.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=455s\" target=\"_blank\" rel=\"noopener\">7:35<\/a>"}, {"t": "q", "h": "\"if it wrote code and it never ran it, the hook will basically block the answer\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=455s\" target=\"_blank\" rel=\"noopener\">7:35<\/a>"}, {"t": "q", "h": "\"baking in like a verification loop.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=455s\" target=\"_blank\" rel=\"noopener\">7:35<\/a>"}, {"t": "p", "h": "Source: Karpathy (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/i-built-another-andrej-karpathy-using-claude--bvGptCLDhyo-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "p", "h": "Also: \"every single skill that I build works in some sort of verification loop\" <a href=\"https://www.youtube.com/watch?v=9KOtMsZ9I28&amp;t=580s\" target=\"_blank\" rel=\"noopener\">9KO 9:40<\/a>."}, {"t": "p", "h": "<em>Supporting:<\/em> \"You verify yourself so that I don't have to verify.\" <a href=\"https://www.youtube.com/watch?v=XNQBCRcwXV4&amp;t=555s\" target=\"_blank\" rel=\"noopener\">9:15<\/a> (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/i-deleted-all-my-claude-skills-and-claude-got-smarter--XNQBCRcwXV4-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "p", "h": "Also: \"It delivered output one and then it watched it. It realized there was some mistakes and then it came back and it delivered output two.\" <a href=\"https://www.youtube.com/watch?v=7jHXoPGnA4c&amp;t=1113s\" target=\"_blank\" rel=\"noopener\">7jH 18:33<\/a>."}], "rules": [16], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 6}, {"id": "c16", "kind": "concept", "g": "nate", "t": "Real-world testing", "n": 16, "sec": "E", "secTitle": "Turning knowledge into behaviour", "body": [{"t": "p", "h": "The last step is testing on real things. Teaching test: it writes down what done means first, builds the smallest version, predicts, runs, shows a broken version, then lists what it ran and which rule drove each move. Review test: \"would the client accept this?\" on a script that had passed Claude's own test; the agent predicted a crash on an emoji in a normal Windows terminal, ran it that way, and it crashed. It then trimmed what wasn't earning its place and proved the trimmed version behaved the same by running both side by side."}, {"t": "q", "h": "\"the last step, of course, is just to test it.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=485s\" target=\"_blank\" rel=\"noopener\">8:05<\/a>"}, {"t": "q", "h": "\"saying that it works was only true in one specific setting or terminal.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=548s\" target=\"_blank\" rel=\"noopener\">9:08<\/a>"}, {"t": "q", "h": "\"we make it test on things that are real.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=608s\" target=\"_blank\" rel=\"noopener\">10:08<\/a>"}, {"t": "p", "h": "Also: the emoji crash <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=517s\" target=\"_blank\" rel=\"noopener\">8:37<\/a>. Source: Karpathy (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/i-built-another-andrej-karpathy-using-claude--bvGptCLDhyo-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "p", "h": "Also: a slides skill that couldn't see its own output got Chrome so it could \"open the page screenshot it look at it\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=3817s\" target=\"_blank\" rel=\"noopener\">bCl 1:03:37<\/a>; \"Before returning the final output, define the acceptance criteria.\" <a href=\"https://www.youtube.com/watch?v=HIRDzMtuWFk&amp;t=485s\" target=\"_blank\" rel=\"noopener\">HIR 8:05<\/a>."}, {"t": "p", "h": "Also: \"But, if Claude has your files and your examples and your workflows and your style guides and the actual success criteria for what good looks like\" <a href=\"https://www.youtube.com/watch?v=brB-hSiV2iU&amp;t=334s\" target=\"_blank\" rel=\"noopener\">brB 5:34<\/a>"}, {"t": "p", "h": "Also: \"I don't think that just giving Astra seven trading days was enough to really know if this is a viable strategy.\" <a href=\"https://www.youtube.com/watch?v=eg_1NXDcoPk&amp;t=1042s\" target=\"_blank\" rel=\"noopener\">eg_ 17:22<\/a>; a model refusing to act only shows up in the real setting, \"it actually has a restriction in there and it stopped trading for me.\" <a href=\"https://www.youtube.com/watch?v=eg_1NXDcoPk&amp;t=249s\" target=\"_blank\" rel=\"noopener\">eg_ 4:09<\/a>."}], "rules": [17, 27], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 8}, {"id": "c17", "kind": "concept", "g": "nate", "t": "Human understanding is the finish line", "n": 17, "sec": "F", "secTitle": "The point of it all", "body": [{"t": "p", "h": "The brain is not a voice clone or impression; it condenses how an expert thinks so you can talk to it until you understand. You can't be expert in everything, but you must understand what you ship, and your own system: he still finds his own files by hand to make sure he understands his OS. Team-wide AI OS sync is, for him, unsolved and a people and habit problem more than a tech one; mastering your own system first makes that easier."}, {"t": "q", "h": "\"you can outsource your thinking, but you cannot outsource your understanding.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=608s\" target=\"_blank\" rel=\"noopener\">10:08<\/a> (Nate quoting Karpathy)"}, {"t": "q", "h": "\"then I can just talk to it until I understand it.\" <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=122s\" target=\"_blank\" rel=\"noopener\">2:02<\/a>"}, {"t": "q", "h": "\"I actually understand my own second brain\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1131s\" target=\"_blank\" rel=\"noopener\">18:51<\/a>"}, {"t": "q", "h": "\"I don't think it's a tech problem. I think it's a people problem.\" <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1432s\" target=\"_blank\" rel=\"noopener\">23:52<\/a>"}, {"t": "p", "h": "Also: not an impression <a href=\"https://www.youtube.com/watch?v=bvGptCLDhyo&amp;t=31s\" target=\"_blank\" rel=\"noopener\">0:31<\/a>; master your own systems first <a href=\"https://www.youtube.com/watch?v=Ek1NBfnnTH0&amp;t=1463s\" target=\"_blank\" rel=\"noopener\">24:23<\/a>. Sources: Karpathy (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/i-built-another-andrej-karpathy-using-claude--bvGptCLDhyo-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>), AI OS (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/steal-my-exact-ai-os-setup-5-simple-tips--Ek1NBfnnTH0-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}, {"t": "p", "h": "Also: \"Never accept AI output without asking why\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=397s\" target=\"_blank\" rel=\"noopener\">bCl 6:37<\/a>; \"You can't scale a system if you haven't lived in it yourself.\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=9092s\" target=\"_blank\" rel=\"noopener\">bCl 2:31:32<\/a>."}, {"t": "p", "h": "<em>Supporting:<\/em> for rolling an OS out to a team, \"you have to learn it first\" <a href=\"https://www.youtube.com/watch?v=8QQ_INxAhRs&amp;t=1993s\" target=\"_blank\" rel=\"noopener\">33:13<\/a> (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/i-turned-claude-into-the-ultimate-second-brain--8QQ_INxAhRs-transcript.md\" target=\"_blank\" rel=\"noopener\">transcript<\/a>)."}], "rules": [18], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 6}, {"id": "c18", "kind": "concept", "g": "nate", "t": "The router is re-read every message, so keep it under 200 lines", "n": 18, "sec": "G", "secTitle": "From the wider course and newer videos", "body": [{"t": "p", "h": "<em>Replaced by concept 39 (2026-10-09):<\/em> the newer idea is the smallest context that works, not a fixed length; 200 lines is only the hard ceiling. The facts below (re-read every message, edits apply next session) still hold."}, {"t": "p", "h": "CLAUDE.md is loaded as system context at the start of every chat, so every extra line costs on every turn. Edits to it only take effect in a new session."}, {"t": "q", "h": "\"Claude auto reads it at the start of every single chat as system context. So keep it under 200 lines.\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=20187s\" target=\"_blank\" rel=\"noopener\">jdb 5:36:27<\/a>"}, {"t": "q", "h": "\"the edit actually doesn't apply until you restart that session.\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=21315s\" target=\"_blank\" rel=\"noopener\">jdb 5:55:15<\/a>"}, {"t": "p", "h": "Also: keep decisions, not chat history, in it: \"Save decisions, not conversations.\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=20645s\" target=\"_blank\" rel=\"noopener\">jdb 5:44:05<\/a>."}], "rules": [19, 41], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 4}, {"id": "c19", "kind": "concept", "g": "nate", "t": "The four C's, built in order: context, connections, capabilities, cadence", "n": 19, "sec": "G", "secTitle": "From the wider course and newer videos", "body": [{"t": "p", "h": "Context is what the AI knows about you; connections are the live data it can reach; capabilities are the skills that make it useful; cadence is when it acts on its own. The first two are the second brain. Each layer needs the one before it."}, {"t": "q", "h": "\"You can't have cadence without connections. You can't have capability without context. And you have to go in this order.\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=734s\" target=\"_blank\" rel=\"noopener\">bCl 12:14<\/a>"}, {"t": "q", "h": "\"each of these layers can't happen without the previous one.\" <a href=\"https://www.youtube.com/watch?v=0WDkwMxj13s&amp;t=489s\" target=\"_blank\" rel=\"noopener\">0WD 8:09<\/a>"}, {"t": "p", "h": "Also: <a href=\"https://www.youtube.com/watch?v=yysILVsfLFM&amp;t=124s\" target=\"_blank\" rel=\"noopener\">yys 2:04<\/a>, <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=15580s\" target=\"_blank\" rel=\"noopener\">jdb 4:19:40<\/a>. Links concept 2 (context/connections) and concept 6 (cadence)."}, {"t": "p", "h": "Also: \"So these four things really come one after the other, context, connections, capabilities, and cadence.\" <a href=\"https://www.youtube.com/watch?v=X-pbJWKmwi0&amp;t=2742s\" target=\"_blank\" rel=\"noopener\">Xpb 45:42<\/a>"}], "rules": [], "note": "no rule yet; links concepts 2 and 6 (above).", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 6}, {"id": "c20", "kind": "concept", "g": "nate", "t": "Levels of a second brain: start at level 1, move up only when it hurts", "n": 20, "sec": "G", "secTitle": "From the wider course and newer videos", "body": [{"t": "p", "h": "Level 1 is a router plus folders. Move to a compiled wiki (level 2) when notes pile up and you forget what's in them; a markdown wiki with good indexes is enough until hundreds of pages. Only keep knowledge that will still matter in a year."}, {"t": "q", "h": "\"If you have 30 plus notes and you keep forgetting what's in them, look at level two.\" <a href=\"https://www.youtube.com/watch?v=DTCyvo6cC54&amp;t=1733s\" target=\"_blank\" rel=\"noopener\">DTC 28:53<\/a>"}, {"t": "q", "h": "\"if you have hundreds of pages with good indexes, you're fine with wiki graph\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=8607s\" target=\"_blank\" rel=\"noopener\">bCl 2:23:27<\/a>"}, {"t": "p", "h": "Also: \"If there's not pain, then why create more?\" <a href=\"https://www.youtube.com/watch?v=DTCyvo6cC54&amp;t=244s\" target=\"_blank\" rel=\"noopener\">DTC 4:04<\/a>; \"in a year, will it be good for me to have this memory in here?\" <a href=\"https://www.youtube.com/watch?v=DTCyvo6cC54&amp;t=1643s\" target=\"_blank\" rel=\"noopener\">DTC 27:23<\/a>."}, {"t": "q", "h": "\"My wiki has links, isn't that a knowledge graph? Not exactly.\" — <a href=\"https://www.youtube.com/watch?v=DTCyvo6cC54&amp;t=761s\" target=\"_blank\" rel=\"noopener\">12:41<\/a>"}, {"t": "p", "h": "Added 2026-10-08: links between wiki pages are level 2, \"it's like a a see also. It's like backlinks\"; level 4 knowledge graphs record <em>how<\/em> things relate, and he plays with them but doesn't use them day to day. So \"fully connected\" at our level means every page links to related pages, not a graph tool."}], "rules": [42], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 4}, {"id": "c21", "kind": "concept", "g": "nate", "t": "Skills: progressive loading, and the description is the trigger", "n": 21, "sec": "G", "secTitle": "From the wider course and newer videos", "body": [{"t": "p", "h": "Claude reads only each skill's name and description (front matter, about 100 tokens) to pick one, then the full SKILL.md, then extra files only if needed. So the description must use the words a person would actually say, two skills mustn't compete, and broken front matter (an unclosed quote) stops it firing. Test with an obvious request, a reworded one and an unrelated one. Keep SKILL.md under 500 lines."}, {"t": "q", "h": "\"it would only read the YAML front matter.\" <a href=\"https://www.youtube.com/watch?v=zKBPwDpBfhs&amp;t=730s\" target=\"_blank\" rel=\"noopener\">zKB 12:10<\/a>"}, {"t": "q", "h": "\"a skill that Claude can't find is basically a skill that you don't have.\" <a href=\"https://www.youtube.com/watch?v=HIRDzMtuWFk&amp;t=273s\" target=\"_blank\" rel=\"noopener\">HIR 4:33<\/a>"}, {"t": "p", "h": "Also: <a href=\"https://www.youtube.com/watch?v=zKBPwDpBfhs&amp;t=700s\" target=\"_blank\" rel=\"noopener\">zKB 11:40<\/a>–<a href=\"https://www.youtube.com/watch?v=zKBPwDpBfhs&amp;t=761s\" target=\"_blank\" rel=\"noopener\">12:41<\/a>; <a href=\"https://www.youtube.com/watch?v=HIRDzMtuWFk&amp;t=242s\" target=\"_blank\" rel=\"noopener\">HIR 4:02<\/a>; \"You have to close off the quotes if you open them up\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=9462s\" target=\"_blank\" rel=\"noopener\">jdb 2:37:42<\/a>; \"keep the skill.md under 500 lines\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=4888s\" target=\"_blank\" rel=\"noopener\">bCl 1:21:28<\/a>."}], "rules": [21, 22], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 7}, {"id": "c22", "kind": "concept", "g": "nate", "t": "Skills start small, keep working code, and earn autonomy", "n": 22, "sec": "G", "secTitle": "From the wider course and newer videos", "body": [{"t": "p", "h": "A skill can be a short prompt you were tired of retyping. When a script works, save it as a file the skill points to rather than letting Claude rewrite it each run. New skills report and ask; give them more freedom only after many runs."}, {"t": "q", "h": "\"A skill can just be a prompt that you don't want to have to say every single time.\" <a href=\"https://www.youtube.com/watch?v=c0kaKxM2pHg&amp;t=122s\" target=\"_blank\" rel=\"noopener\">c0k 2:02<\/a>"}, {"t": "q", "h": "\"don't leave that code trapped inside the chat\" <a href=\"https://www.youtube.com/watch?v=HIRDzMtuWFk&amp;t=122s\" target=\"_blank\" rel=\"noopener\">HIR 2:02<\/a>"}, {"t": "p", "h": "Also: \"battle tested\" first <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=6457s\" target=\"_blank\" rel=\"noopener\">jdb 1:47:37<\/a>; \"They could literally just be a 50line markdown file.\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=5134s\" target=\"_blank\" rel=\"noopener\">bCl 1:25:34<\/a>; vet third-party skills <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=4735s\" target=\"_blank\" rel=\"noopener\">bCl 1:18:55<\/a>."}], "rules": [23], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 6}, {"id": "c23", "kind": "concept", "g": "nate", "t": "Sub-agents: for piles of output, read-only by their tools, never forced", "n": 23, "sec": "G", "secTitle": "From the wider course and newer videos", "body": [{"t": "p", "h": "Use a sub-agent when a job would flood your chat with output you won't re-read (many files, big searches). Make one read-only through its tool list, not by asking. Don't use them for one quick step: too many gives worse results. Shared agents live in the repo."}, {"t": "q", "h": "\"is this about to dump a pile of stuff into my chat that I'll never read again? If that's ever yes, delegate it to a sub agent.\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=9827s\" target=\"_blank\" rel=\"noopener\">jdb 2:43:47<\/a>"}, {"t": "q", "h": "\"if you're forcing too many sub agents, you're going to get worse results\" <a href=\"https://www.youtube.com/watch?v=e18sdZLwP7o&amp;t=1497s\" target=\"_blank\" rel=\"noopener\">e18 24:57<\/a>"}, {"t": "p", "h": "Also: \"explicitly read-only\" via disallowed tools <a href=\"https://www.youtube.com/watch?v=e18sdZLwP7o&amp;t=430s\" target=\"_blank\" rel=\"noopener\">e18 7:10<\/a>; \"so that you don't blow your own context window\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=5012s\" target=\"_blank\" rel=\"noopener\">bCl 1:23:32<\/a>."}], "rules": [24], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 5}, {"id": "c24", "kind": "concept", "g": "nate", "t": "Permissions are keys and deny lists, not prompts", "n": 24, "sec": "G", "secTitle": "From the wider course and newer videos", "body": [{"t": "p", "h": "Assume the agent will do anything it is able to. Safety comes from what it physically can't do: scoped API keys that only allow the needed actions, and a settings deny list for risky commands. His 150,000-email accident came from too many tools, not the permission mode."}, {"t": "q", "h": "\"A prompt is never a permission layer. You basically have to have the assumption that if it can, it will.\" <a href=\"https://www.youtube.com/watch?v=8QQ_INxAhRs&amp;t=1471s\" target=\"_blank\" rel=\"noopener\">8QQ 24:31<\/a>"}, {"t": "q", "h": "\"Can you help me update the settings file so that you physically cannot do those things?\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=4468s\" target=\"_blank\" rel=\"noopener\">jdb 1:14:28<\/a>"}, {"t": "p", "h": "Also: \"there's no point in giving the agent that actual tool to be able to do so.\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=4254s\" target=\"_blank\" rel=\"noopener\">jdb 1:10:54<\/a>; per-key permissions <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=2324s\" target=\"_blank\" rel=\"noopener\">bCl 38:44<\/a>."}], "rules": [25], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 5}, {"id": "c25", "kind": "concept", "g": "nate", "t": "Secrets in .env; your own keys travel, app connectors don't", "n": 25, "sec": "G", "secTitle": "From the wider course and newer videos", "body": [{"t": "p", "h": "Keys live in a <code>.env<\/code> file kept out of Git and out of chat. Prefer an API key plus a reference .md over app connectors or piles of MCP servers: connectors are lost when you change tool, and loaded MCPs eat tokens."}, {"t": "q", "h": "\"If you rely on these connections, that is not great\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=5844s\" target=\"_blank\" rel=\"noopener\">jdb 1:37:24<\/a>"}, {"t": "q", "h": "\"if you switch off to a different desktop app or a different harness, you lose everything.\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=5844s\" target=\"_blank\" rel=\"noopener\">jdb 1:37:24<\/a>"}, {"t": "p", "h": "Also: \"gets excluded from anytime we do a public push\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=2510s\" target=\"_blank\" rel=\"noopener\">bCl 41:50<\/a>; MCP token cost <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=2385s\" target=\"_blank\" rel=\"noopener\">bCl 39:45<\/a>."}, {"t": "p", "h": "Also: \"You don't want to paste it right in here into the chat thread, you want to paste it into the .env file.\" <a href=\"https://www.youtube.com/watch?v=oWCcN6hSFjA&amp;t=155s\" target=\"_blank\" rel=\"noopener\">oWC 2:35<\/a>; keys in one file move with you, \"I like to put all my API keys in there so that if I ever need to move them over to cloud code or if I need to move them over to trigger.dev, I already have them in one spot\" <a href=\"https://www.youtube.com/watch?v=FqnNL8fnUWo&amp;t=518s\" target=\"_blank\" rel=\"noopener\">Fqn 8:38<\/a>."}], "rules": [26], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 6}, {"id": "c26", "kind": "concept", "g": "nate", "t": "Grill me: interview the knowledge out of your head", "n": 26, "sec": "G", "secTitle": "From the wider course and newer videos", "body": [{"t": "p", "h": "The bottleneck is getting what you know into the system; a quick brain dump is never enough. The grill-me skill asks one question at a time, checkpoints every answer to a doc in <code>brainstorms/<\/code>, flags gaps to chase with others, and can be re-run when things change. Up-front time gets a skill close to right on the first try."}, {"t": "q", "h": "\"It's not ever good enough.\" <a href=\"https://www.youtube.com/watch?v=c0kaKxM2pHg&amp;t=62s\" target=\"_blank\" rel=\"noopener\">c0k 1:02<\/a>"}, {"t": "q", "h": "\"the bigger problem is getting everything out of your brain into the system\" <a href=\"https://www.youtube.com/watch?v=DTCyvo6cC54&amp;t=1338s\" target=\"_blank\" rel=\"noopener\">DTC 22:18<\/a>"}, {"t": "p", "h": "Also: checkpointing to brainstorms <a href=\"https://www.youtube.com/watch?v=c0kaKxM2pHg&amp;t=153s\" target=\"_blank\" rel=\"noopener\">c0k 2:33<\/a>; open flags <a href=\"https://www.youtube.com/watch?v=c0kaKxM2pHg&amp;t=367s\" target=\"_blank\" rel=\"noopener\">c0k 6:07<\/a>; ask until 95% sure <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=19974s\" target=\"_blank\" rel=\"noopener\">jdb 5:32:54<\/a>."}], "rules": [30], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 5}, {"id": "c27", "kind": "concept", "g": "nate", "t": "Session hygiene: clear between tasks, hand off before it degrades", "n": 27, "sec": "G", "secTitle": "From the wider course and newer videos", "body": [{"t": "p", "h": "Each message in a long chat costs more than in a fresh one, so start fresh for unrelated tasks. Before clearing (he says around 250-300k tokens, as autocompact comes too late), have the agent write a hand-off: what was done, files made, open decisions, next step."}, {"t": "q", "h": "\"Use slashclear between unrelated tasks.\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=19853s\" target=\"_blank\" rel=\"noopener\">jdb 5:30:53<\/a>"}, {"t": "q", "h": "\"Here are open decisions. Here's what's next.\" <a href=\"https://www.youtube.com/watch?v=0WDkwMxj13s&amp;t=1344s\" target=\"_blank\" rel=\"noopener\">0WD 22:24<\/a>"}, {"t": "p", "h": "Also: \"But the autocompact kicks in way too late.\" <a href=\"https://www.youtube.com/watch?v=jdbOVepEtUE&amp;t=7248s\" target=\"_blank\" rel=\"noopener\">jdb 2:00:48<\/a>."}], "rules": [29], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 4}, {"id": "c28", "kind": "concept", "g": "nate", "t": "One set of files for every tool (Claude Code and Codex)", "n": 28, "sec": "G", "secTitle": "From the wider course and newer videos", "body": [{"t": "p", "h": "Build tool-agnostic. Codex reads AGENTS.md, keeps config and agents in <code>.codex/<\/code> and skills in <code>.agents/<\/code>; skill files are identical between the two, only agent files differ (TOML vs markdown). A CLAUDE.md can simply reference AGENTS.md."}, {"t": "q", "h": "\"you're building things to be tool agnostic\" <a href=\"https://www.youtube.com/watch?v=bCljOfCH8Ms&amp;t=124s\" target=\"_blank\" rel=\"noopener\">bCl 2:04<\/a>"}, {"t": "q", "h": "\"the skill files, which are the markdown files with the YAML front matter, are the exact same.\" <a href=\"https://www.youtube.com/watch?v=kB9iMD0EjT8&amp;t=184s\" target=\"_blank\" rel=\"noopener\">kB9 3:04<\/a>"}, {"t": "p", "h": "Also: <a href=\"https://www.youtube.com/watch?v=DTCyvo6cC54&amp;t=1369s\" target=\"_blank\" rel=\"noopener\">DTC 22:49<\/a>; shared skills and agents go in the repo <a href=\"https://www.youtube.com/watch?v=e18sdZLwP7o&amp;t=1497s\" target=\"_blank\" rel=\"noopener\">e18 24:57<\/a>."}], "rules": [], "note": "no rule yet; concept 3 says the same files serve Codex.", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 5}, {"id": "c29", "kind": "concept", "g": "nate", "t": "Context costs money and rots: act at about half the window", "n": 29, "sec": "H", "secTitle": "From the full-channel audit (2026-10-08)", "body": [{"t": "p", "h": "Every new message makes Claude re-read the whole chat from the start, so long chats cost more and, past roughly half the window, the answers get worse. Look at what is filling the context (run /context in a fresh session, delete unused tools, skills and servers) before blaming the model, convert documents to markdown because it is cheaper for AI, and check your usage allowance. When a path has gone wrong, rewind or restart rather than piling corrections on top of the failed attempt."}, {"t": "q", "h": "\"somewhere around halfway through your context window, it starts to fall apart.\" <a href=\"https://www.youtube.com/watch?v=eRS3CmvrOvA&amp;t=272s\" target=\"_blank\" rel=\"noopener\">eRS 4:32<\/a>"}, {"t": "q", "h": "\"go into a fresh session, do /context, and see what you're sitting at before you even send off anything\" <a href=\"https://www.youtube.com/watch?v=_qZvORxGqI0&amp;t=64s\" target=\"_blank\" rel=\"noopener\">_qZ 1:04<\/a>"}, {"t": "q", "h": "\"Claude rereads the entire conversation from the beginning, and all of those are tokens that it's charging you for\" <a href=\"https://www.youtube.com/watch?v=49V-5Ock8LU&amp;t=64s\" target=\"_blank\" rel=\"noopener\">49V 1:04<\/a>"}], "rules": [31], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 5}, {"id": "c30", "kind": "concept", "g": "nate", "t": "Plan, let the AI attack the plan, then build", "n": 30, "sec": "H", "secTitle": "From the full-channel audit (2026-10-08)", "body": [{"t": "p", "h": "Before anything non-trivial, plan first, then ask Claude to push back and play devil's advocate on the plan before it builds. Big plans are saved to a file and worked phase by phase, one session each. Nate teaches plan mode for this; Charlie declined plan mode itself on 2026-10-08, and this repo's 95%-or-ask rule (R14: be 95% sure or ask 1-2 questions) does the same job."}, {"t": "q", "h": "\"You ask Claude to start challenging you and pushing back and playing devil's advocate before it builds anything or before it approves any plan\" <a href=\"https://www.youtube.com/watch?v=iTY8Q449YNQ&amp;t=156s\" target=\"_blank\" rel=\"noopener\">iTY 2:36<\/a>"}, {"t": "q", "h": "\"Have one for discovery where you can have Claude read through PDFs and read through the code base\" <a href=\"https://www.youtube.com/watch?v=_qZvORxGqI0&amp;t=1285s\" target=\"_blank\" rel=\"noopener\">_qZ 21:25<\/a>"}, {"t": "q", "h": "\"So what you always want to do when you're creating an idea is you want to go on plan mode.\" <a href=\"https://www.youtube.com/watch?v=mpALXah_PBg&amp;t=7300s\" target=\"_blank\" rel=\"noopener\">mpA 2:01:40<\/a>"}], "rules": [32], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 5}, {"id": "c31", "kind": "concept", "g": "nate", "t": "A separate checker decides \"done\"; then try to break it", "n": 31, "sec": "H", "secTitle": "From the full-channel audit (2026-10-08)", "body": [{"t": "p", "h": "The worker should not mark its own homework: a different model or persona checks the result, and after \"done\" you stress test it for edge cases. When output is bad, first ask whether it is a model, harness or organisation problem. Verification steps also go into the to-do list, not just the end."}, {"t": "q", "h": "\"is this a model problem, is this a harness problem? Or is this an organization problem?\" <a href=\"https://www.youtube.com/watch?v=6LNlCpQPYFc&amp;t=1927s\" target=\"_blank\" rel=\"noopener\">6LN 32:07<\/a>"}, {"t": "q", "h": "\"Claude doesn't get to declare itself done. A different model has to look at it with a different persona\" <a href=\"https://www.youtube.com/watch?v=iTY8Q449YNQ&amp;t=1345s\" target=\"_blank\" rel=\"noopener\">iTY 22:25<\/a>"}, {"t": "q", "h": "\"by the time it tells you it's done, you stress test it more. and you try to find those edge cases\" <a href=\"https://www.youtube.com/watch?v=iTY8Q449YNQ&amp;t=583s\" target=\"_blank\" rel=\"noopener\">iTY 9:43<\/a>"}, {"t": "p", "h": "Also: stress test an automation with many helpers before a customer finds the bugs, \"spin up 50 different sub aents and have all of them test this thing, try to break it\" <a href=\"https://www.youtube.com/watch?v=FqnNL8fnUWo&amp;t=1340s\" target=\"_blank\" rel=\"noopener\">Fqn 22:20<\/a>; an AI judge checked against a human is concept 41."}], "rules": [33, 44], "note": "Rules 33 and 44 (<a href=\"https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/rules.md\" target=\"_blank\" rel=\"noopener\">rules.md<\/a>).", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 6}, {"id": "c32", "kind": "concept", "g": "nate", "t": "Skills do one job, are built from a real run, and retire when they stop earning", "n": 32, "sec": "H", "secTitle": "From the full-channel audit (2026-10-08)", "body": [{"t": "p", "h": "Each skill or agent does one specific job. Build it by doing the task together once, then turning that run into a skill, and keep adding a line to a \"don'ts\" list for each real failure. Write instructions specifically, not vaguely. Retire a skill that no longer adds value, which matters once you have around ten."}, {"t": "q", "h": "\"the whole idea is that you want a skill to do one very specific job\" <a href=\"https://www.youtube.com/watch?v=X-pbJWKmwi0&amp;t=3985s\" target=\"_blank\" rel=\"noopener\">Xpb 1:06:25<\/a>"}, {"t": "q", "h": "\"So you want to make sure that your skill is actually adding value and not holding\" <a href=\"https://www.youtube.com/watch?v=6LNlCpQPYFc&amp;t=1469s\" target=\"_blank\" rel=\"noopener\">6LN 24:29<\/a>"}, {"t": "q", "h": "\"The way that I build my skills is I have Claude Code do something with me. I walk it through the steps\" <a href=\"https://www.youtube.com/watch?v=mpALXah_PBg&amp;t=22892s\" target=\"_blank\" rel=\"noopener\">mpA 6:21:32<\/a>"}, {"t": "p", "h": "Also: reverse-engineer a good example into a skill, \"Analyze this video, which was created by Opus 5.5, and figure out why this is so good.\" <a href=\"https://www.youtube.com/watch?v=7jHXoPGnA4c&amp;t=307s\" target=\"_blank\" rel=\"noopener\">7jH 5:07<\/a>; and keep feeding each run back, \"If you ever find yourself repeating something, just throw it in the skill.\" <a href=\"https://www.youtube.com/watch?v=7jHXoPGnA4c&amp;t=1083s\" target=\"_blank\" rel=\"noopener\">7jH 18:03<\/a>."}], "rules": [34], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 6}, {"id": "c33", "kind": "concept", "g": "nate", "t": "Unattended runs: one-shot, stateless, bounded, tested by hand first, fixed parts in scripts", "n": 33, "sec": "H", "secTitle": "From the full-channel audit (2026-10-08)", "body": [{"t": "p", "h": "A scheduled or background run must never need to stop and ask, can only see the repo, APIs and environment secrets, and needs a bounded scope with a named deliverable. Test it by hand and prove one live run before switching the schedule on. Put the fixed details in a script, because an agent left to interpret the same message will drift."}, {"t": "q", "h": "\"the agent was just interpreting the message different every time and it just acted differently\" <a href=\"https://www.youtube.com/watch?v=X-pbJWKmwi0&amp;t=10825s\" target=\"_blank\" rel=\"noopener\">Xpb 3:00:25<\/a>"}, {"t": "q", "h": "\"So, bound the scope, name the deliverable, and then all your sub agents can be put on Haiku.\" <a href=\"https://www.youtube.com/watch?v=jZgcWCzxh1I&amp;t=671s\" target=\"_blank\" rel=\"noopener\">jZg 11:11<\/a>"}, {"t": "q", "h": "\"You're not around. So, you probably want to make sure that it doesn't ever have to stop and ask you questions.\" <a href=\"https://www.youtube.com/watch?v=ehg4fhydTgs&amp;t=93s\" target=\"_blank\" rel=\"noopener\">ehg 1:33<\/a>"}, {"t": "p", "h": "Also: \"we want to have Codex do as much verification on it as possible.\" <a href=\"https://www.youtube.com/watch?v=FqnNL8fnUWo&amp;t=578s\" target=\"_blank\" rel=\"noopener\">Fqn 9:38<\/a>; wake-ups pass notes, \"every time an agent wakes up, it's going to leave some sort of handoff message\" <a href=\"https://www.youtube.com/watch?v=eg_1NXDcoPk&amp;t=91s\" target=\"_blank\" rel=\"noopener\">eg_ 1:31<\/a>. Deterministic versus agent loop is concept 42."}], "rules": [35], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 7}, {"id": "c34", "kind": "concept", "g": "nate", "t": "Permissions in layers: deny plus allow, start strict, helpers inherit, read-only and drafts first", "n": 34, "sec": "H", "secTitle": "From the full-channel audit (2026-10-08)", "body": [{"t": "p", "h": "Deny the destructive commands and also explicitly allow the safe ones. Start with read-only access and drafts, with a human approving anything outward, and remember that helper agents inherit the main session's permissions. Nate also describes auto mode (a classifier approves safe commands); auto mode is not adopted here, so the deny list stays the safety layer."}, {"t": "q", "h": "\"So, I would always start with like read-only access whenever you can, have the agent only do drafts\" <a href=\"https://www.youtube.com/watch?v=Ktnwygcnd8U&amp;t=640s\" target=\"_blank\" rel=\"noopener\">Ktn 10:40<\/a>"}, {"t": "q", "h": "\"go into your permissions and explicitly allow the commands that you know are safe\" <a href=\"https://www.youtube.com/watch?v=jqoFP9QapXI&amp;t=847s\" target=\"_blank\" rel=\"noopener\">jqo 14:07<\/a>"}, {"t": "q", "h": "\"they inherit the permissions from the main session. So, if you're on bypass permissions, then all of your agents are going to be on bypass permissions\" <a href=\"https://www.youtube.com/watch?v=vDVSGVpB2vc&amp;t=731s\" target=\"_blank\" rel=\"noopener\">vDV 12:11<\/a>"}], "rules": [36], "note": "", "u": "https://github.com/eddieedwardsv2-ux/test-environment-/blob/main/research/nate-herk/brain/concepts.md", "d": 5}, {"id": "c35", "kind": "concept", "g": "nate", "t": "Check before anything goes pu
